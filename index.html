function initTemplates() {
  const btn = $('#btnTpl'), menu = $('#tplMenu');
  if (!btn || !menu) return;
  let timer = null;
  const show = () => {
    clearTimeout(timer);
    if (!menu.hidden) return;
    const list = tplList();
    const byName = new Map();
    list.forEach(tp => { if (!byName.has(tp.name)) byName.set(tp.name, []); byName.get(tp.name).push(tp); });
    const curId = state.ws && state.ws.template ? state.ws.template.id : null;
    const items = Array.from(byName.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([name, vs]) =>
      `<div class="ctx-label">${escapeHtml(name)}</div>` + vs.sort((a, b) => b.version - a.version).map(tp =>
        `<button data-tid="${tp.id}" title="${escapeHtml(tplIncludes(tp) + (tp.note ? '\n' + tp.note : ''))}"><span>${tp.id === curId ? '✓ ' : ''}v${tp.version}${tp.note ? ` <span class="muted small">${escapeHtml(tp.note.slice(0, 24))}</span>` : ''}</span><span class="muted small">${escapeHtml(formatTime(new Date(tp.savedAt)).slice(0, 10))}</span></button>`).join('')).join('');
    menu.innerHTML = (items || `<div class="ctx-label">${escapeHtml(t('tplNone'))}</div>`) +
      `<div class="ctx-sep"></div><button data-tact="save"><span>${escapeHtml(t('tplSaveCurrent'))}</span></button><button data-tact="manage"><span>${escapeHtml(t('tplManage'))}</span></button>`;
    const r = btn.getBoundingClientRect();
    menu.hidden = false;
    menu.style.left = r.left + 'px';
    menu.style.top = (r.bottom + 2) + 'px';
  };
  const hide = () => { clearTimeout(timer); timer = setTimeout(() => { menu.hidden = true; }, 220); };
  // 鼠标：悬停展开；触屏：单击展开 / 收起
  const mouseOnly = (fn) => (e) => { if (e.pointerType === 'mouse') fn(); };
  btn.addEventListener('pointerenter', mouseOnly(show));
  btn.addEventListener('pointerleave', mouseOnly(hide));
  btn.addEventListener('click', () => { if (menu.hidden) show(); else menu.hidden = true; });
  menu.addEventListener('pointerenter', mouseOnly(show));
  menu.addEventListener('pointerleave', mouseOnly(hide));
  document.addEventListener('pointerdown', (e) => { if (!menu.hidden && !e.target.closest('#tplMenu, #btnTpl')) menu.hidden = true; });
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    menu.hidden = true;
    if (b.dataset.tid) applyTemplate(b.dataset.tid);
    else if (b.dataset.tact === 'save') openTplSave();
    else openTplManage();
  });
  $('#tplInput').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const n = importTemplates(await f.text());
      toast(t('tplImported', { n }), 3000);
    } catch (err) {
      alert(t('tplBadFile') + (err && err.message && err.message !== t('tplBadFile') ? '\n' + err.message : ''));
    }
    if ($('#tplDialog').open) openTplManage();
  });
}

// ===== panels.js =====
// ---------------------------------------------------------------------------
// panels.js — 浮动面板：文件夹面板（左下角）、快捷键提示框（右上角）、汇总表
// 面板可拖动标题栏移动、可折叠、可隐藏；位置与开关状态保存在本机。
// ---------------------------------------------------------------------------
const floating = {};

// anchor: 'bl' = 以左下角定位；'tr' = 以右上角定位
function makeFloating(panel, key, anchor, defPos, defaultOpen) {
  const stage = $('#stage');
  const head = $('.fp-head', panel);
  const def = defPos || { a: 12, b: 12 };
  let pos = Object.assign({}, def, prefs.get('pos.' + key, {}));
  const apply = () => {
    if (panel.hidden) return;
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    pos.a = clamp(pos.a, 0, Math.max(0, sw - w));
    pos.b = clamp(pos.b, 0, Math.max(0, sh - h));
    if (anchor === 'bl') {
      panel.style.left = pos.a + 'px'; panel.style.bottom = pos.b + 'px';
      panel.style.right = 'auto'; panel.style.top = 'auto';
    } else {
      panel.style.right = pos.a + 'px'; panel.style.top = pos.b + 'px';
      panel.style.left = 'auto'; panel.style.bottom = 'auto';
    }
  };
  head.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('button, input')) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, oa = pos.a, ob = pos.b;
    head.setPointerCapture(e.pointerId);
    panel.classList.add('moving');
    const move = (ev) => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (anchor === 'bl') { pos.a = oa + dx; pos.b = ob - dy; } else { pos.a = oa - dx; pos.b = ob + dy; }
      apply();
    };
    const up = () => {
      head.removeEventListener('pointermove', move);
      head.removeEventListener('pointerup', up);
      head.removeEventListener('pointercancel', up);
      panel.classList.remove('moving');
      prefs.set('pos.' + key, pos);
    };
    head.addEventListener('pointermove', move);
    head.addEventListener('pointerup', up);
    head.addEventListener('pointercancel', up);
  });
  new ResizeObserver(apply).observe(stage);
  new ResizeObserver(apply).observe(panel);
  const collapseBtn = $('.fp-collapse', panel);
  const setCollapsed = (c) => {
    panel.classList.toggle('collapsed', c);
    collapseBtn.textContent = c ? '▴' : '▾';
    prefs.set('collapsed.' + key, c);
    apply();
  };
  collapseBtn.addEventListener('click', () => setCollapsed(!panel.classList.contains('collapsed')));
  setCollapsed(!!prefs.get('collapsed.' + key, false));
  $('.fp-close', panel).addEventListener('click', () => setPanelOpen(key, false));
  floating[key] = { panel, apply };
  // 手机上各浮动面板默认收起（与电脑分开记住）
  setPanelOpen(key, prefs.get(layoutKey('open.' + key), isMobile() ? false : defaultOpen !== false));
}

function setPanelOpen(key, open) {
  const f = floating[key];
  if (!f) return;
  f.panel.hidden = !open;
  prefs.set(layoutKey('open.' + key), open);
  const btn = $(`[data-cmd="${{ folders: 'toggleFolders', hints: 'toggleHints', ai: 'toggleAi', tools: 'toggleTools' }[key]}"]`);
  if (btn) btn.classList.toggle('active', open);
  if (open) f.apply();
  if (open && key === 'tools') updateToolsPanel();
}
const togglePanel = (key) => setPanelOpen(key, floating[key].panel.hidden);

// ---- 行内改名 --------------------------------------------------------------------
function inlineRename(span, value, onDone) {
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'inline-input';
  inp.value = value;
  inp.maxLength = 60;
  span.replaceWith(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = (ok) => {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    if (ok && v && v !== value) onDone(v);
    else renderFolderTree();
  };
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.isComposing) finish(true);
    else if (e.key === 'Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
  inp.addEventListener('click', (e) => e.stopPropagation());
  inp.addEventListener('dblclick', (e) => e.stopPropagation());
}

function initFolderPanel() {
  const tree = $('#folderTree');
  $('#fpAddFolder').addEventListener('click', () => {
    const f = addFolder();
    const el = $(`.folder[data-id="${f.id}"] .folder-name`);
    if (el) inlineRename(el, f.name, (v) => renameFolder(f.id, v));
  });
  $('#fpAddImages').addEventListener('click', () => openImporter());
  $('#fpSummary').addEventListener('click', openSummary);
  $('#fpExportAll').addEventListener('click', exportAll);
  tree.addEventListener('click', (e) => {
    const folderEl = e.target.closest('.folder');
    const item = e.target.closest('.img-item');
    if (e.target.closest('.done-btn')) { toggleDone(item.dataset.id); return; }
    if (e.target.closest('.img-del')) {
      const en = state.ws.images[item.dataset.id];
      if (confirm(t('confirmDeleteImage', { name: entryName(en), n: markerCount(en) }))) deleteImage(en.id);
      return;
    }
    if (e.target.closest('.folder-rename')) {
      const f = folderById(folderEl.dataset.id);
      inlineRename($('.folder-name', folderEl), f.name, (v) => renameFolder(f.id, v));
      return;
    }
    if (e.target.closest('.folder-del')) {
      const f = folderById(folderEl.dataset.id);
      if (!f.imageIds.length || confirm(t('confirmDeleteFolder', { name: f.name, n: f.imageIds.length }))) deleteFolder(f.id);
      return;
    }
    if (item) { activateImage(item.dataset.id); return; }
    if (folderEl) setActiveFolder(folderEl.dataset.id);
  });
  tree.addEventListener('dblclick', (e) => {
    const nameEl = e.target.closest('.img-name');
    if (nameEl) {
      const en = state.ws.images[nameEl.closest('.img-item').dataset.id];
      inlineRename(nameEl, entryName(en), (v) => renameImage(en.id, v));
      return;
    }
    const fn = e.target.closest('.folder-name');
    if (fn) {
      const f = folderById(fn.closest('.folder').dataset.id);
      inlineRename(fn, f.name, (v) => renameFolder(f.id, v));
    }
  });
  makeFloating($('#folderPanel'), 'folders', 'bl');
}

// ---- 汇总表 -----------------------------------------------------------------------
function openSummary() { openStats('overview'); }

// 数据概览：行 = 图片（按组排列），列 = 实验信息（组默认为文件夹名）+ 各类别 + 合计
function renderSummary() {
  const A = analysisData();
  const cfg = statsCfg();
  const f2 = (v) => (Number.isFinite(v) ? v.toFixed(1) : '—');
  const ms = (vals) => `${f2(mean(vals))} ± ${f2(sd(vals))}`;
  const catHead = A.cats.map(c => `<th><i class="sw" style="background:${c.color}"></i>${escapeHtml(c.name)}</th>`).join('');
  const fieldHead = cfg.fields.map(f => `<th class="field-h">${escapeHtml(f.name)} <button class="icon-btn field-del" data-del="${f.id}" title="${escapeHtml(t('fieldRemove'))}">×</button></th>`).join('');
  const nInfo = 2 + cfg.fields.length;   // 组 + 自定义字段 + 完成（之前另有 文件夹/图片/原文件 3 列）
  const rows = A.rows.map(r => {
    const info = infoOf(r.entry);
    const folderName = r.folder ? r.folder.name : '';
    return `<tr data-entry="${r.entry.id}" class="${r.entry.id === state.activeId ? 'cur ' : ''}go" title="${escapeHtml(t('statsGoTip'))}">
      <td>${escapeHtml(folderName)}</td><td>${escapeHtml(r.name)}</td>
      <td class="muted small">${escapeHtml(r.entry.doc.image.name)}</td>
      <td><input class="info-in" data-key="group" value="${escapeHtml(info.group || '')}" placeholder="${escapeHtml(folderName)}"></td>
      ${cfg.fields.map(f => `<td><input class="info-in" data-key="${f.id}" value="${escapeHtml(info[f.id] || '')}"></td>`).join('')}
      <td>${r.entry.done ? '✓' : ''}</td>
      ${A.cats.map(c => `<td class="num">${r.counts[c.id]}</td>`).join('')}<td class="num"><b>${r.total}</b></td></tr>`;
  }).join('');
  const sums = A.cats.map(c => A.rows.reduce((s, r) => s + r.counts[c.id], 0));
  const grand = sums.reduce((a, b) => a + b, 0);
  const lead = 3 + nInfo;
  const sumRow = `<tr class="sum-row"><td colspan="${lead}"><b>${escapeHtml(t('sumRow'))}</b></td>${sums.map(v => `<td class="num"><b>${v}</b></td>`).join('')}<td class="num"><b>${grand}</b></td></tr>`;
  const statRow = (label, rs) => `<tr class="stat"><td colspan="${lead}">${escapeHtml(label)} <span class="muted">(n=${rs.length})</span></td>
      ${A.cats.map(c => `<td class="num">${ms(valuesOf(rs, c.id))}</td>`).join('')}<td class="num">${ms(valuesOf(rs, 'total'))}</td></tr>`;
  const overview = `<div class="stats-overview">${escapeHtml(t('statsOverview', { n: A.rows.length, f: A.groups.length, done: A.rows.filter(r => r.entry.done).length }))}
    <span class="stats-total">${escapeHtml(t('total'))} <b>${grand}</b></span>
    ${A.cats.map((c, i) => `<span class="chip"><i style="background:${c.color}"></i>${escapeHtml(c.name)} <b>${sums[i]}</b>${grand ? ` <span class="muted">${(sums[i] / grand * 100).toFixed(1)}%</span>` : ''}</span>`).join('')}
    <span class="spacer"></span><button id="addField" class="small">＋ ${escapeHtml(t('addField'))}</button></div>`;
  $('#summaryBody').innerHTML = overview + `
    <table class="summary">
      <thead><tr><th>${escapeHtml(t('folder'))}</th><th>${escapeHtml(t('image'))}</th><th>${escapeHtml(t('originalFile'))}</th><th>${escapeHtml(t('groupLbl'))}</th>${fieldHead}<th>${escapeHtml(t('done'))}</th>${catHead}<th>${escapeHtml(t('totalShort'))}</th></tr></thead>
      <tbody>${rows}${sumRow}</tbody>
      <tbody class="stats">
        <tr><td colspan="${lead + 1 + A.cats.length}" class="muted small">${escapeHtml(t('meanSdNote'))}</td></tr>
        ${A.groups.length > 1 ? A.groups.map(g => statRow(g.name, g.rows)).join('') : ''}
        ${statRow(t('allImages'), A.rows)}
      </tbody>
    </table>${roiSummaryHtml()}`;
  $('#addField').addEventListener('click', addInfoField);
}

function roiSummaryHtml() {
  const rows = roiSummaryRows();
  if (!rows) return '';
  const [head, ...body] = rows;
  const keep = head.map((h, i) => i).filter(i => !['area_px2', 'area_unit'].includes(head[i]));
  return `<h3 class="sum-sub">${escapeHtml(t('roiTitle'))}</h3><table class="summary"><thead><tr>${keep.map(i => `<th>${escapeHtml(head[i])}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r => `<tr>${keep.map(i => `<td${typeof r[i] === 'number' ? ' class="num"' : ''}>${escapeHtml(head[i] === 'area' && r[i] !== '' ? r[i] + ' ' + r[head.indexOf('area_unit')] : r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

// ---- 右键对象菜单 -----------------------------------------------------------------
function describeObject(o) {
  if (o.type === 'marker') {
    const c = findCat(o.cat);
    return (c ? c.name : '?') + (o.src === 'ai' ? ' · AI' + (o.conf !== undefined ? ` ${Math.round(o.conf * 100)}%` : '') : '');
  }
  if (o.type === 'image') return t('objImage');
  if (o.type === 'roi') return `${o.name} · ${roiStats(o).total}`;
  if (o.type === 'measure') return `${t('toolMeasure')} · ${fmtLen(measureLen(o))}`;
  if (o.type === 'inset') return t('objInset') + ` ×${Math.round(insetMag(o) * 10) / 10}`;
  if (isShapeObj(o)) return t('shp_' + ({ ellipse: 'ellipse', triangle: 'triangle' }[shapeKind(o)] || 'rect'));

}

// ===== ai.js =====
// ---------------------------------------------------------------------------
// ai.js — AI 辅助计数：计数对象预设、计算引擎、计数与核查
//
// 引擎：
//   local  内置暗点/亮点检测（detect.js），本地运行，不上传图片
//   claude / openai / gemini / doubao  云端视觉大模型（需要 API key；图片会上传到该服务）
//   custom 自定义 HTTP 接口（例如本机运行的、自己训练的模型），协议见 docs/AI_INTERFACE.md
//
// 结果作为普通标记加入（来源 src:'ai'，带置信度 conf），整批为一条撤回记录，可以再手动增删。
// 每次运行的参数记录在图片的 meta.aiRuns 中，便于复现。
// ---------------------------------------------------------------------------
const AI_ENGINES = {
  local: { cloud: false },
  claude: { cloud: true, model: 'claude-opus-5-5', url: 'https://api.anthropic.com/v1/messages' },
  openai: { cloud: true, model: '', url: 'https://api.openai.com/v1/chat/completions' },
  gemini: { cloud: true, model: '', url: 'https://generativelanguage.googleapis.com/v1beta/models' },
  doubao: { cloud: true, model: '', url: 'https://ark.cn-beijing.volces.com/api/v3/chat/completions' },
  custom: { cloud: false, model: '', url: 'http://localhost:8765/detect' }
};
const AI_TILE = 1536;          // 云端模型每块图的最大边长（像素，原始分辨率不缩放）
const AI_TILE_OVERLAP = 96;    // 相邻分块重叠，避免边界上的目标被切开
const AI_MAX_RUNS_KEPT = 50;

const ai = {
  busy: false,
  abort: null,
  sessionKeys: {},             // 未勾选“记住”时，密钥只保存在本次打开的页面内存中
  profiles: null,
  profileId: null
};

function defaultAiProfiles() {
  return [
    { id: 'p-egg', name: '', nameKey: 'aiProfEgg', desc: 'Mosquito eggs: small dark-brown to black elongated ovals (about 0.5 mm long) on a light background such as filter paper. Eggs often touch or overlap in clumps; count every individual egg.', polarity: 'dark', singleSize: 0, minSize: 0, maxSize: 0, sensitivity: 50, split: true, catSingle: '', catOverlap: '' },
    { id: 'p-dark', name: '', nameKey: 'aiProfDark', desc: 'Dark, roughly round cells or particles on a lighter background. Count each individual object; touching objects count separately.', polarity: 'dark', singleSize: 0, minSize: 0, maxSize: 0, sensitivity: 50, split: true, catSingle: '', catOverlap: '' },
    { id: 'p-bright', name: '', nameKey: 'aiProfBright', desc: 'Bright spots (for example fluorescent nuclei or puncta) on a dark background. Count each individual spot.', polarity: 'light', singleSize: 0, minSize: 0, maxSize: 0, sensitivity: 50, split: true, catSingle: '', catOverlap: '' }
  ];
}

function loadAiProfiles() {
  ai.profiles = prefs.get('ai.profiles', null) || defaultAiProfiles();
  // v1.2.0 早期版本把内置预设名称按当时语言存下来：恢复为随语言变化
  const defs = { 'p-egg': 'aiProfEgg', 'p-dark': 'aiProfDark', 'p-bright': 'aiProfBright' };
  ai.profiles.forEach(p => { if (defs[p.id] && !p.nameKey) { p.nameKey = defs[p.id]; if (Object.values(I18N).some(L => L[defs[p.id]] === p.name)) p.name = ''; } });
  ai.profileId = prefs.get('ai.profileId', ai.profiles[0].id);
  if (!ai.profiles.find(p => p.id === ai.profileId)) ai.profileId = ai.profiles[0].id;
}
const saveAiProfiles = () => { prefs.set('ai.profiles', ai.profiles); prefs.set('ai.profileId', ai.profileId); };
const currentProfile = () => ai.profiles.find(p => p.id === ai.profileId) || ai.profiles[0];
// 内置预设的名称随界面语言变化；用户改过名后使用用户的名称
const profileName = (p) => p.name || (p.nameKey ? t(p.nameKey) : '—');

function aiEngineConfig(engine) {
  const saved = prefs.get('ai.cfg.' + engine, {});
  const def = AI_ENGINES[engine] || {};
  return {
    model: saved.model !== undefined && saved.model !== '' ? saved.model : def.model || '',
    url: saved.url || def.url || '',
    key: saved.key || ai.sessionKeys[engine] || '',
    remember: !!saved.key
  };
}

// 类别：预设里按名称保存（类别 id 只在单个项目内有效）
function categoryByName(name) {
  const cats = state.ws ? state.ws.categories : [];
  return cats.find(c => c.name === name) || cats.find(c => c.id === state.currentCat) || cats[0] || null;
}

// ---- 运行 -----------------------------------------------------------------------
function aiScopeRegion() {
  return $('#aiScope').value === 'selection' && state.region && state.region.length >= 3 ? state.region : null;
}

async function aiRun(task) {
  if (ai.busy) return;
  if (!state.doc || !state.img) { toast(t('noImagesYet')); return; }
  const engine = $('#aiEngine').value;
  const prof = currentProfile();
  const region = aiScopeRegion();
  if ($('#aiScope').value === 'selection' && !region) { aiStatus(t('aiNoRegion'), 'warn'); return; }
  const cfg = aiEngineConfig(engine);
  if (AI_ENGINES[engine].cloud) {
    if (!cfg.key) { aiStatus(t('aiNeedKey'), 'warn'); $('#aiKey').focus(); return; }
    if (!cfg.model) { aiStatus(t('aiNeedModel'), 'warn'); $('#aiModel').focus(); return; }
    if (!prefs.get('ai.consent.' + engine, false)) {
      if (!confirm(t('aiConsent', { name: $('#aiEngine').selectedOptions[0].textContent }))) return;
      prefs.set('ai.consent.' + engine, true);
    }
  }
  ai.busy = true;
  ai.abort = new AbortController();
  updateAiButtons();
  const entry = state.entry;
  const t0 = performance.now();
  try {
    aiStatus(t('aiWorking'), 'busy');
    let result;
    if (engine === 'local') result = await runLocalEngine(task, prof, region);
    else result = await runRemoteEngine(engine, cfg, task, prof, region);
    if (state.entry !== entry) return;   // 期间切换了图片：丢弃结果
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (task === 'count') applyCountResult(result, engine, cfg, prof, region, secs);
    else applyVerifyResult(result, engine, cfg, prof, region, secs);
  } catch (err) {
    if (err && err.name === 'AbortError') aiStatus(t('aiStopped'), 'warn');
    else { console.error(err); aiStatus(friendlyAiError(err), 'error'); }
  } finally {
    ai.busy = false;
    ai.abort = null;
    updateAiButtons();
  }
}

function friendlyAiError(err) {
  const msg = err && err.message ? err.message : String(err);
  if (err instanceof TypeError && /fetch|network|load failed/i.test(msg)) return t('aiNetworkError');
  return t('aiError', { msg });
}

function detectOptions(prof, region) {
  return {
    polarity: prof.polarity, sensitivity: prof.sensitivity, singleSize: +prof.singleSize || 0,
    minSize: +prof.minSize || 0, maxSize: +prof.maxSize || 0, split: prof.split, region
  };
}

async function runLocalEngine(task, prof, region) {
  await new Promise(r => setTimeout(r, 30));  // 先让“计算中”提示显示出来
  const { width, height } = state.doc.image;
  const res = detectSpots(state.img, width, height, detectOptions(prof, region));
  return { points: res.points, stats: res.stats, notes: '' };
}

// 云端 / 自定义接口：分块发送原始分辨率图片，结果映射回原图坐标并去重
async function runRemoteEngine(engine, cfg, task, prof, region) {
  const { width, height } = state.doc.image;
  const bb = regionBBox(region, width, height);
  const tileSize = engine === 'custom' ? 4096 : AI_TILE;
  const tiles = makeTiles(bb, tileSize, AI_TILE_OVERLAP);
  const targetCats = targetCategoryIds(prof);
  const existing = state.doc.objects.filter(o => o.type === 'marker' && targetCats.has(o.cat));
  const all = [], missedAll = [], fpIds = new Set();
  const notes = [];
  for (let i = 0; i < tiles.length; i++) {
    const tl = tiles[i];
    aiStatus(t('aiTileProgress', { i: i + 1, n: tiles.length }), 'busy');
    const img = await tileImage(tl, engine === 'custom' ? 'image/png' : 'image/jpeg');
    const local = existing.filter(m => m.x >= tl.x && m.y >= tl.y && m.x < tl.x + tl.w && m.y < tl.y + tl.h);
    const req = { task, prof, tile: tl, img, points: local.map(m => ({ x: round2(m.x - tl.x), y: round2(m.y - tl.y) })), full: { width, height } };
    const out = engine === 'custom' ? await callCustom(cfg, req) : parseAiJson(await callCloud(engine, cfg, req));
    if (out.notes) notes.push(String(out.notes).slice(0, 300));
    (out.points || []).forEach(p => {
      if (!isFinite(p.x) || !isFinite(p.y) || p.x < 0 || p.y < 0 || p.x > tl.w || p.y > tl.h) return;
      all.push({ x: tl.x + p.x, y: tl.y + p.y, conf: isFinite(p.confidence) ? clamp(+p.confidence, 0, 1) : (isFinite(p.conf) ? +p.conf : 0.5), overlap: !!p.overlap });
    });
    (out.missed || []).forEach(p => { if (isFinite(p.x) && isFinite(p.y)) missedAll.push({ x: tl.x + p.x, y: tl.y + p.y, conf: +p.confidence || 0.5 }); });
    (out.false_positives || []).forEach(idx => { if (local[idx]) fpIds.add(local[idx].id); });
  }
  const r = Math.max(4, (+prof.singleSize || 12) * 0.5);
  let points = dedupePoints(all, r);
  if (region) points = points.filter(p => pointInPolygon(p.x, p.y, region));
  const missed = dedupePoints(missedAll, r).filter(p => !region || pointInPolygon(p.x, p.y, region));
  return { points, missed, falsePositive: Array.from(fpIds), notes: notes.join(' | '), tiles: tiles.length };
}

// 分块：每块不超过 size；最后一块与边缘对齐（不会出现很窄的碎块）；相邻块重叠 overlap
function makeTiles(bb, size, overlap) {
  const starts = (o, len) => {
    if (len <= size) return [o];
    const out = [];
    for (let p = o; p + size < o + len; p += size - overlap) out.push(p);
    out.push(o + len - size);
    return Array.from(new Set(out));
  };
  const tiles = [];
  for (const y of starts(bb.y, bb.h)) {
    for (const x of starts(bb.x, bb.w)) tiles.push({ x, y, w: Math.min(size, bb.w), h: Math.min(size, bb.h) });
  }
  return tiles;
}

async function tileImage(tl, mime) {
  const c = document.createElement('canvas');
  c.width = tl.w; c.height = tl.h;
  c.getContext('2d').drawImage(state.img, tl.x, tl.y, tl.w, tl.h, 0, 0, tl.w, tl.h);
  const blob = await canvasToBlob(c, mime);
  const u8 = new Uint8Array(await blob.arrayBuffer());
  return { mime, data: bytesToBase64(u8), width: tl.w, height: tl.h };
}

function dedupePoints(pts, r) {
  const out = [];
  const r2 = r * r;
  pts.slice().sort((a, b) => b.conf - a.conf).forEach(p => {
    if (!out.some(q => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 < r2)) out.push(p);
  });
  return out;
}

function targetCategoryIds(prof) {
  return new Set([categoryByName(prof.catSingle), categoryByName(prof.catOverlap)].filter(Boolean).map(c => c.id));
}

// ---- 提示词与云端调用 -------------------------------------------------------------
function aiPrompt(req) {
  const p = req.prof;
  const size = +p.singleSize > 0 ? `A single object is roughly ${Math.round(+p.singleSize)} pixels across in this image. ` : '';
  const head = `You are assisting a scientist with manual object counting.\nTarget: ${profileName(p)}.\nDescription: ${p.desc}\n` +
    `The image is a ${req.tile.w}×${req.tile.h}-pixel crop of a larger image. ${size}` +
    `Use pixel coordinates in this crop: origin at the top-left corner, x to the right, y downward.\n`;
  if (req.task === 'verify') {
    return head + `A person has already marked these points (index: x,y):\n` +
      (req.points.length ? req.points.map((q, i) => `${i}: ${q.x},${q.y}`).join('\n') : '(none)') +
      `\nCheck the marks against the image. Report target objects that have no mark nearby ("missed") and marks that are not on a target object ("false_positives", by index).\n` +
      `Reply with JSON only, no other text: {"missed":[{"x":0,"y":0,"confidence":0.0}],"false_positives":[0],"notes":"short remark"}`;
  }
  return head + `Find every individual target object. When objects touch or overlap, return one point per individual object (centre of each object) and set "overlap": true for them.\n` +
    `Reply with JSON only, no other text: {"points":[{"x":0,"y":0,"confidence":0.0,"overlap":false}],"notes":"short remark"}`;
}

async function callCloud(engine, cfg, req) {
  const prompt = aiPrompt(req);
  const dataUrl = `data:${req.img.mime};base64,${req.img.data}`;
  const signal = ai.abort.signal;
  let res, body;
  if (engine === 'claude') {
    // 浏览器直接调用 Anthropic Messages API（需 anthropic-dangerous-direct-browser-access 头）。
    // 开启服务端回退：若请求被安全分类器拒绝，服务端自动改用其它模型继续。
    res = await fetch(cfg.url, {
      method: 'POST', signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': cfg.key,
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: cfg.model,
        max_tokens: 16000,
        output_config: { effort: 'high' },
        fallbacks: 'default',
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type: 'base64', media_type: req.img.mime, data: req.img.data } },
          { type: 'text', text: prompt }
        ] }]
      })
    });
    body = await readJson(res);
    if (body.stop_reason === 'refusal') throw new Error(t('aiRefused'));
    return (body.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  }
  if (engine === 'gemini') {
    res = await fetch(`${cfg.url.replace(/\/$/, '')}/${encodeURIComponent(cfg.model)}:generateContent`, {
      method: 'POST', signal,
      headers: { 'content-type': 'application/json', 'x-goog-api-key': cfg.key },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ inline_data: { mime_type: req.img.mime, data: req.img.data } }, { text: prompt }] }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    });
    body = await readJson(res);
    const parts = (((body.candidates || [])[0] || {}).content || {}).parts || [];
    return parts.map(p => p.text || '').join('\n');
  }
  // OpenAI 与豆包（火山方舟）使用相同的 chat/completions 格式
  res = await fetch(cfg.url, {
    method: 'POST', signal,
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.key },
    body: JSON.stringify({
      model: cfg.model,
      messages: [{ role: 'user', content: [{ type: 'text', text: prompt }, { type: 'image_url', image_url: { url: dataUrl } }] }]
    })
  });
  body = await readJson(res);
  return (((body.choices || [])[0] || {}).message || {}).content || '';
}

async function readJson(res) {
  const text = await res.text();
  let body = null;
  try { body = JSON.parse(text); } catch (e) { /* 非 JSON */ }
  if (!res.ok) {
    const m = body && (body.error && (body.error.message || body.error) || body.message);
    throw new Error(`HTTP ${res.status}${m ? ' — ' + (typeof m === 'string' ? m : JSON.stringify(m)) : ''}`);
  }
  if (!body) throw new Error('invalid JSON response');
  return body;
}

// 从模型回复中提取 JSON（容忍 ```json 代码块与前后说明文字）
function parseAiJson(text) {
  const s = String(text || '').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error(t('aiBadReply'));
  try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { throw new Error(t('aiBadReply')); }
}

// 自定义接口：协议 counting-tool-ai/1（见 docs/AI_INTERFACE.md）
async function callCustom(cfg, req) {
  const headers = { 'content-type': 'application/json' };
  if (cfg.key) headers.authorization = 'Bearer ' + cfg.key;
  const res = await fetch(cfg.url, {
    method: 'POST', signal: ai.abort.signal, headers,
    body: JSON.stringify({
      protocol: 'counting-tool-ai/1',
      task: req.task,
      image: req.img,
      offset: { x: req.tile.x, y: req.tile.y },
      full_size: req.full,
      target: {
        name: profileName(req.prof), description: req.prof.desc, polarity: req.prof.polarity,
        single_size: +req.prof.singleSize || 0, min_size: +req.prof.minSize || 0, max_size: +req.prof.maxSize || 0,
        sensitivity: req.prof.sensitivity, split_overlaps: !!req.prof.split
      },
      points: req.points
    })
  });
  return readJson(res);
}

// ---- 应用结果 -------------------------------------------------------------------
function recordAiRun(info) {
  const meta = state.doc.meta;
  meta.aiRuns = (meta.aiRuns || []).concat([Object.assign({ time: new Date().toISOString() }, info)]).slice(-AI_MAX_RUNS_KEPT);
}

function applyCountResult(result, engine, cfg, prof, region, secs) {
  const catS = categoryByName(prof.catSingle), catO = categoryByName(prof.catOverlap) || catS;
  const objs = result.points.map(p => ({
    type: 'marker', x: round2(p.x), y: round2(p.y), cat: (p.overlap ? catO : catS).id,
    src: 'ai', conf: round3(p.conf), engine
  }));
  const cmds = [];
  if ($('#aiReplace').checked) {
    const old = [];
    state.doc.objects.forEach((o, i) => {
      if (o.type === 'marker' && o.src === 'ai' && (!region || pointInPolygon(o.x, o.y, region))) old.push({ obj: clone(o), index: i });
    });
    if (old.length) cmds.push({ k: 'remove', items: old });
  }
  if (objs.length) {
    let index = state.doc.objects.length - (cmds[0] ? cmds[0].items.length : 0);
    cmds.push({ k: 'add', items: objs.map(o => ({ obj: Object.assign(o, { id: newId('o') }), index: index++ })) });
  }
  if (cmds.length) execute(cmds.length === 1 ? Object.assign(cmds[0], { label: 'ai' }) : { k: 'batch', label: 'ai', cmds });
  const nO = result.points.filter(p => p.overlap).length;
  recordAiRun({ task: 'count', engine, model: AI_ENGINES[engine].cloud || engine === 'custom' ? cfg.model || cfg.url : 'builtin', profile: clone(prof), region, found: objs.length, stats: result.stats || null, notes: result.notes || '' });
  aiStatus(t('aiCountDone', { n: objs.length, single: objs.length - nO, overlap: nO, secs }) +
    (result.stats ? ' ' + t('aiLocalStats', { d: result.stats.singleDiameter, thr: result.stats.threshold }) : '') +
    (result.notes ? '\n' + result.notes : ''), 'ok');
  state.aiSuggest = null;
  updateAiSuggestBox();
}

function applyVerifyResult(result, engine, cfg, prof, region, secs) {
  let missed = result.missed || [], falsePositive = result.falsePositive || [];
  if (engine === 'local') {
    const targetCats = targetCategoryIds(prof);
    const marks = state.doc.objects.filter(o => o.type === 'marker' && targetCats.has(o.cat) && (!region || pointInPolygon(o.x, o.y, region)));
    const r = Math.max(4, (result.stats ? result.stats.singleDiameter : 10) * 0.8);
    const cmp = compareWithMarkers(result.points, marks, r);
    missed = cmp.missed;
    falsePositive = cmp.falsePositive;
  }
  state.aiSuggest = { entryId: state.activeId, missed, falsePositive, radius: Math.max(4, (+prof.singleSize || (result.stats && result.stats.singleDiameter) || 10) * 0.7) };
  recordAiRun({ task: 'verify', engine, model: AI_ENGINES[engine].cloud || engine === 'custom' ? cfg.model || cfg.url : 'builtin', profile: clone(prof), region, missed: missed.length, falsePositive: falsePositive.length, notes: result.notes || '' });
  aiStatus(t('aiVerifyDone', { m: missed.length, f: falsePositive.length, secs }) + (result.notes ? '\n' + result.notes : ''), 'ok');
  updateAiSuggestBox();
  requestRender();
}

function updateAiSuggestBox() {
  const box = $('#aiSuggestBox');
  const sug = state.aiSuggest;
  const show = !!(sug && sug.entryId === state.activeId && (sug.missed.length || sug.falsePositive.length));
  box.hidden = !show;
  if (show) $('#aiSuggestText').textContent = t('aiSuggestText', { m: sug.missed.length, f: sug.falsePositive.length });
}

function acceptMissed() {
  const sug = state.aiSuggest;
  if (!sug || !sug.missed.length) return;
  const cat = categoryByName(currentProfile().catSingle);
  addObjects(sug.missed.map(p => ({ type: 'marker', x: round2(p.x), y: round2(p.y), cat: cat.id, src: 'ai', conf: round3(p.conf || 0.5), engine: 'verify' })), 'ai');
  sug.missed = [];
  updateAiSuggestBox();
  requestRender();
}

function removeFalsePositives() {
  const sug = state.aiSuggest;
  if (!sug || !sug.falsePositive.length) return;
  removeObjects(sug.falsePositive.slice());
  sug.falsePositive = [];
  updateAiSuggestBox();
  requestRender();
}

function selectFalsePositives() {
  const sug = state.aiSuggest;
  if (!sug || !sug.falsePositive.length) return;
  setTool('select');
  setSelection(sug.falsePositive.slice(), null);
}

async function aiCalibrate() {
  if (!state.doc || !state.img) return;
  const prof = currentProfile();
  const region = aiScopeRegion();
  const cats = targetCategoryIds(prof);
  const pts = state.doc.objects.filter(o => o.type === 'marker' && o.src !== 'ai' && cats.has(o.cat) && (!region || pointInPolygon(o.x, o.y, region)));
  if (pts.length < 3) { aiStatus(t('aiCalibNeed'), 'warn'); return; }
  aiStatus(t('aiWorking'), 'busy');
  await new Promise(r => setTimeout(r, 30));
  const r = calibrateSingleSize(state.img, state.doc.image.width, state.doc.image.height, pts, detectOptions(prof, region));
  if (!r) { aiStatus(t('aiCalibFail'), 'warn'); return; }
  prof.singleSize = Math.round(r.diameter * 10) / 10;
  saveAiProfiles();
  fillProfileForm();
  aiStatus(t('aiCalibDone', { d: prof.singleSize, n: r.used }), 'ok');
}

function updateAiButtons() {

function fillEngineForm() {

  $('#aiKeyRow').hidden = engine === 'local';

  const key = $('#aiKey').value.trim();
  const remember = $('#aiRemember').checked;

}

function initAiPanel() {
  loadAiProfiles();
  fillProfileSelect();
  fillProfileForm();
  $('#aiEngine').value = prefs.get('ai.engine', 'local');
  fillEngineForm();
  $('#aiProfile').addEventListener('change', (e) => { ai.profileId = e.target.value; saveAiProfiles(); fillProfileForm(); });
  $('#aiProfNew').addEventListener('click', () => {
    const base = clone(currentProfile());
    base.id = 'p-' + Date.now().toString(36);
    base.name = t('aiNewProfileName', { n: ai.profiles.length + 1 });
    delete base.nameKey;
    ai.profiles.push(base);
    ai.profileId = base.id;
    saveAiProfiles(); fillProfileSelect(); fillProfileForm();
    $('#aiProfEdit').open = true;
    $('#ap_name').focus(); $('#ap_name').select();
  });
  $('#aiProfDel').addEventListener('click', () => {
    if (ai.profiles.length <= 1) return;
    if (!confirm(t('aiDeleteProfile', { name: profileName(currentProfile()) }))) return;
    ai.profiles = ai.profiles.filter(p => p.id !== ai.profileId);
    ai.profileId = ai.profiles[0].id;
    saveAiProfiles(); fillProfileSelect(); fillProfileForm();
  });
  const bind = (id, key, conv) => $('#ap_' + id).addEventListener(id === 'split' ? 'change' : 'input', (e) => {
    const p = currentProfile();
    p[key] = conv(e.target);
    if (key === 'name') fillProfileSelect();
    if (key === 'sensitivity') $('#ap_sensVal').textContent = p.sensitivity;
    saveAiProfiles();
  });
  bind('name', 'name', el => el.value || '—');
  bind('desc', 'desc', el => el.value);
  bind('singleSize', 'singleSize', el => Math.max(0, +el.value || 0));
  bind('minSize', 'minSize', el => Math.max(0, +el.value || 0));
  bind('maxSize', 'maxSize', el => Math.max(0, +el.value || 0));
  bind('sensitivity', 'sensitivity', el => +el.value);
  bind('split', 'split', el => el.checked);
  $('#ap_polarity').addEventListener('change', (e) => { currentProfile().polarity = e.target.value; saveAiProfiles(); });
  ['catSingle', 'catOverlap'].forEach(k => $('#ap_' + k).addEventListener('change', (e) => { currentProfile()[k] = e.target.value; saveAiProfiles(); }));
  $('#aiEngine').addEventListener('change', (e) => { prefs.set('ai.engine', e.target.value); fillEngineForm(); });
  ['aiKey', 'aiModel', 'aiUrl'].forEach(id => $('#' + id).addEventListener('change', saveEngineForm));
  $('#aiRemember').addEventListener('change', saveEngineForm);
  $('#aiRun').addEventListener('click', () => aiRun('count'));
  $('#aiVerify').addEventListener('click', () => aiRun('verify'));
  $('#aiStop').addEventListener('click', () => { if (ai.abort) ai.abort.abort(); });
  $('#aiCalib').addEventListener('click', aiCalibrate);
  $('#aiAddMissed').addEventListener('click', acceptMissed);
  $('#aiDelFP').addEventListener('click', removeFalsePositives);
  $('#aiSelFP').addEventListener('click', selectFalsePositives);
  $('#aiClearSug').addEventListener('click', () => { state.aiSuggest = null; updateAiSuggestBox(); requestRender(); });
  $('#aiShowMarks').checked = state.showAiMarks;
  $('#aiShowMarks').addEventListener('change', (e) => { state.showAiMarks = e.target.checked; prefs.set('showAiMarks', state.showAiMarks); requestRender(); });
  $('#aiSelectAll').addEventListener('click', () => {
    if (!state.doc) return;
    setTool('select');
    setSelection(state.doc.objects.filter(o => o.type === 'marker' && o.src === 'ai').map(o => o.id), null);
  });
  // 选择编辑框内按键不触发全局快捷键
  $$('#aiPanel input, #aiPanel textarea').forEach(el => el.addEventListener('keydown', (e) => { if (!(e.ctrlKey || e.metaKey)) e.stopPropagation(); }));
  updateAiButtons();
  makeFloating($('#aiPanel'), 'ai', 'tr', { a: 296, b: 12 }, false);
}

}

  $$('[data-tbox]', box).forEach(inp => inp.addEventListener('change', () => {

  }));
  $('#btnTextAuto').addEventListener('click', () => {

  $$('[data-msize]', box).forEach(inp => inp.addEventListener('change', () => applyMarkerSizeInput(inp.dataset.msize, +inp.value)));
  $('#btnResetMarker').addEventListener('click', () => {

  // 图层与锁定

const selectedObjs = () => (state.doc ? state.selection.map(findObj).filter(Boolean) : []);

// 当前样式编辑的目标：单个选中的（非标记）对象，或当前工具的默认样式
function styleTarget() {
  if (!state.doc) return null;
  const objs = selectedObjs();
  if (objs.length === 1 && objs[0].type !== 'marker') {
    const o = objs[0];
    return { kind: isShapeObj(o) ? 'shape' : o.type, obj: o, style: o.style || (o.style = {}) };
  }
  if (objs.length) return null;
  if (state.toolStyles[state.tool]) return { kind: state.tool, style: state.toolStyles[state.tool] };
  return null;
}

// 选背景色 / 边框色时，如果当前没有背景 / 边框，则自动打开
function bgOn() { const tg = styleTarget(); const b = tg ? tg.style.background || 'none' : 'none'; return b === 'none' ? { background: 'fill' } : b === 'frame' ? { background: 'fillframe' } : {}; }
function frameOn() { const tg = styleTarget(); const b = tg ? tg.style.background || 'none' : 'none'; return b === 'none' ? { background: 'frame' } : b === 'fill' ? { background: 'fillframe' } : {}; }

function setStyleProp(prop, value, isLive) { setStyleProps({ [prop]: value }, isLive); }

function setStyleProps(props, isLive) {
  const tg = styleTarget();
  if (!tg || !tg.style) return;
  if (tg.obj) {
    const key = 'obj:' + tg.obj.id + ':' + Object.keys(props).join(',');
    if (isLive) {
      liveBegin(key, { style: tg.obj.style });
      tg.obj.style = Object.assign({}, tg.obj.style, props);
      requestRender();
      updateWidthPreview();
      return;
    }
    const before = liveEnd(key) || { style: clone(tg.obj.style) };
    const after = { style: Object.assign(clone(before.style), props) };
    // 旧版方框/椭圆：改填充时转为新的填充格式
    if (('fillColor' in props || 'fillOpacity' in props) && !('fillColor' in before.style)) {
      const old = shapeFill(before.style);
      if (!('fillColor' in props)) after.style.fillColor = old ? old.color : tg.obj.style.color;
      if (!('fillOpacity' in props)) after.style.fillOpacity = old ? old.alpha : 0.3;
    }
    modifyObject(tg.obj.id, after, before);
  } else {
    Object.assign(tg.style, props);
    prefs.set('toolStyles', state.toolStyles);
    updatePanel();
    requestRender();
  }
}

function applyGeomInput(key, v) {
  const objs = selectedObjs();
  if (objs.length !== 1 || !isFinite(v)) return;
  const o = objs[0];
  if (!isShapeObj(o) && o.type !== 'text' && o.type !== 'image' && !(o.type === 'roi' && o.kind !== 'poly')) return;
  const after = {};
  if (key === 'rot') after.rot = (v % 360) * Math.PI / 180;
  else if (key === 'w' || key === 'h') {
    if (v < 1) return;
    // 改宽高时保持中心不动
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
    const nw = key === 'w' ? v : o.w, nh = key === 'h' ? v : o.h;
    Object.assign(after, { w: nw, h: nh, x: cx - nw / 2, y: cy - nh / 2 });
  } else after[key] = v;
  modifyObject(o.id, after);
}

function applyMarkerSizeInput(key, v) {
  if (!(v > 0)) return;
  const mods = selectedObjs().filter(o => o.type === 'marker').map(o => {
    const cat = findCat(o.cat);
    const base = cat ? cat.size : 10;
    const after = { mw: o.mw ?? base, mh: o.mh ?? base };
    after[key] = v;
    return { id: o.id, before: { mw: o.mw ?? null, mh: o.mh ?? null }, after };
  });
  modifyObjects(mods, 'resize');
}

// 把选中的标记改归到某个类别（一条撤回记录）
function setSelectedMarkersCategory(catId) {
  const mods = state.selection.map(findObj).filter(o => o && o.type === 'marker' && o.cat !== catId)
    .map(o => ({ id: o.id, after: { cat: catId } }));
  modifyObjects(mods, 'recat');
}

function setNum(sel, v) {
  const el = $(sel);
  if (el && document.activeElement !== el) el.value = v;
}

function updatePanel() {
  updateCategoryEditor();
  const tg = styleTarget();
  const objs = selectedObjs();
  const markersSel = objs.filter(o => o.type === 'marker');
  const single = objs.length === 1 ? objs[0] : null;
  const box = $('#styleEditor');
  const kinds = new Set();
  if (tg) {
    const k = tg.kind;
    if (k === 'shape') {
      ['stroke', 'width', 'dash', 'fill'].forEach(x => kinds.add(x));
      const kind = tg.obj ? shapeKind(tg.obj) : (SHAPE_PRESETS[state.shapePreset] || {}).kind;
      if (kind !== 'ellipse') kinds.add('corner');
    } else if (k === 'arrow') ['stroke', 'width', 'dash', 'head'].forEach(x => kinds.add(x));
    else if (k === 'text') ['stroke', 'font', 'textbg'].forEach(x => kinds.add(x));
    else if (k === 'image') ['stroke', 'imgprops'].forEach(x => kinds.add(x));
    else if (k === 'inset') ['stroke', 'width', 'dash', 'insetprops'].forEach(x => kinds.add(x));
    else if (k === 'measure') ['stroke', 'width'].forEach(x => kinds.add(x));
    else if (k === 'roi') kinds.add('stroke');
  }
  if (single && (isShapeObj(single) || single.type === 'image' || (single.type === 'roi' && single.kind !== 'poly'))) kinds.add('geom-box');
  if (single && single.type === 'roi') kinds.add('roiinfo');
  if (single && single.type === 'measure') kinds.add('measureinfo');
  if (single && single.type === 'inset') kinds.add('insetmag');
  if (markersSel.length) { kinds.add('marker-sel'); kinds.add('geom-marker'); }
  if (objs.length) { kinds.add('selected'); kinds.add('layer'); }
  $$('.field', box).forEach(f => { f.hidden = !f.dataset.for.split(' ').some(k => kinds.has(k)); });
  $('#styleSection').hidden = kinds.size === 0;
  const toolName = t('tool' + state.tool[0].toUpperCase() + state.tool.slice(1));
  $('#styleTitle').textContent = objs.length > 1 ? t('selectedN', { n: objs.length, m: markersSel.length })
    : single ? t('selectedObject') : (toolName + ' · ' + t('styleOf'));

  if (markersSel.length) {
    const same = markersSel.every(o => o.cat === markersSel[0].cat);
    $('#selCat').innerHTML = (same ? '' : `<option value="" selected disabled>—</option>`) +
      state.doc.categories.map(c => `<option value="${c.id}"${same && c.id === markersSel[0].cat ? ' selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
    const m = markersSel[0], cat = findCat(m.cat), base = cat ? cat.size : 10;
    setNum('[data-msize="mw"]', Math.round((m.mw ?? base) * 10) / 10);

  }

    setNum('#insetMagNum', mag);
    $$('#insetMagSeg button').forEach(b => b.classList.toggle('active', Math.abs(+b.dataset.mag - mag) < 1e-6));
    $('#insetInfo').textContent = t('insetInfo', { w: Math.round(single.sw), h: Math.round(single.sh), part: t(view.insetPart === 'src' ? 'insetPartSrc' : 'insetPartBox') });
  }
  if (single && single.type === 'roi') {
    setNum('#roiName', single.name || '');
    const st = roiStats(single);
    const cats = state.doc.categories.filter(c => st.counts[c.id]);
    const dens = densityText(st.total, st.area);
    $('#roiStats').innerHTML = `<div>${escapeHtml(t('roiInside'))} <b>${st.total}</b> · ${escapeHtml(t('roiOutside'))} ${st.outside}</div>` +
      cats.map(c => `<div><i class="sw" style="background:${c.color}"></i>${escapeHtml(c.name)}: ${st.counts[c.id]}</div>`).join('') +
      `<div>${escapeHtml(t('area'))}: ${escapeHtml(fmtArea(st.area))}</div>` + (dens ? `<div>${escapeHtml(t('density'))}: ${escapeHtml(dens)}</div>` : '');
  }
  if (single && single.type === 'measure') $('#measureVal').textContent = fmtLen(measureLen(single));
  if (single && (isShapeObj(single) || single.type === 'image' || (single.type === 'roi' && single.kind !== 'poly'))) {
    const r1 = (v) => Math.round(v * 10) / 10;
    setNum('[data-geom="x"]', r1(single.x)); setNum('[data-geom="y"]', r1(single.y));
    setNum('[data-geom="w"]', r1(single.w)); setNum('[data-geom="h"]', r1(single.h));
    setNum('[data-geom="rot"]', Math.round((single.rot || 0) * 180 / Math.PI));
  }
  if (objs.length) {
    const locked = objs.every(o => o.locked);
    $('#btnLock').textContent = locked ? '🔓 ' + t('unlock') : '🔒 ' + t('lock');
    $('#btnLock').classList.toggle('active', locked);
    $('#lockedNote').hidden = !locked;
    const nonMarker = objs.some(o => o.type !== 'marker');

    $('#btnToBack').disabled = !nonMarker;
  }
  if (!tg || !tg.style) return;
  const s = tg.style;
  const markActive = (sel, attr, val) => $$(sel).forEach(b => b.classList.toggle('active', String(b.dataset[attr]).toLowerCase() === String(val).toLowerCase()));
  markActive('[data-stcolor]', 'stcolor', s.color);
  const cc = $('[data-stcolor-custom]');
  cc.value = s.color;
  const custom = !PRESET_COLORS.includes(String(s.color).toLowerCase());
  cc.parentElement.classList.toggle('active', custom);
  cc.parentElement.style.background = custom ? s.color : '';
  if (kinds.has('fill')) {
    const fill = shapeFill(s);
    markActive('[data-fill]', 'fill', fill ? fill.color : 'none');
    const fc = $('[data-fill-custom]');
    const fcustom = fill && !PRESET_COLORS.includes(String(fill.color).toLowerCase());
    if (fill) fc.value = fill.color;
    fc.parentElement.classList.toggle('active', !!fcustom);

  }
  if (s.width !== undefined && kinds.has('width')) {

    updateWidthPreview();

  if (kinds.has('corner')) {
    const round = s.radius > 0;
    $$('#cornerSeg button').forEach(b => b.classList.toggle('active', (b.dataset.corner === 'round') === round));
    $('#radiusLabel').hidden = !round;
    $('#stRadius').hidden = !round;
    if (round) { setNum('#stRadius', s.radius); $('#stRadiusVal').textContent = s.radius; }
  }
  if (kinds.has('imgprops')) {
    const op = Math.round((s.opacity === undefined ? 1 : s.opacity) * 100);
    setNum('#stImgOp', op);
    $('#stImgOpVal').textContent = op + '%';

  }
  if (kinds.has('insetprops')) {

    $('#insetLabel').checked = s.label !== false;
  }
  if (s.fontSize !== undefined) { setNum('#stFont', s.fontSize); setNum('#stFontNum', s.fontSize); $('#stFontVal').textContent = s.fontSize; }
  if (kinds.has('font')) {
    $$('#textToggles button').forEach(b => b.classList.toggle('active', !!s[b.dataset.tog]));

    $$('[data-tbox]').forEach(inp => { inp.disabled = !o; setNum(`[data-tbox="${inp.dataset.tbox}"]`, o && o[inp.dataset.tbox] > 0 ? Math.round(o[inp.dataset.tbox]) : ''); });
    $('#btnTextAuto').disabled = !(o && o.w > 0);

    setNum('#stBgOp', bgOp); $('#stBgOpVal').textContent = bgOp + '%';
    setNum('#stBdW', s.borderWidth || '');
    $$('[data-tbgc]').forEach(b => b.classList.toggle('active', (b.dataset.tbgc || null) === (s.bgColor || null)));
    $$('[data-tbdc]').forEach(b => b.classList.toggle('active', (b.dataset.tbdc || null) === (s.borderColor || null)));
    $$('[data-seg="align"] button').forEach(b => b.classList.toggle('active', b.dataset.v === (s.align || 'left')));

  }
  $$('[data-seg]', box).forEach(seg => {
    const v = s[seg.dataset.seg];
    $$('button', seg).forEach(b => b.classList.toggle('active', b.dataset.v === v));

// 线宽预览：按当前颜色、线型，以屏幕上的实际粗细绘制
function updateWidthPreview() {
  const c = $('#widthPreview');
  const tg = styleTarget();
  if (!c || !tg || tg.style.width === undefined) return;
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth || 200, H = 26;
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const onScreen = state.doc ? tg.style.width * unitOf(state.doc) * state.view.scale : tg.style.width;
  const lw = clamp(onScreen, 0.5, 22);
  ctx.strokeStyle = tg.style.color;
  ctx.lineWidth = lw;
  applyDash(ctx, tg.style.dash, lw);
  ctx.beginPath();
  ctx.moveTo(10, H / 2);
  ctx.lineTo(W - 10, H / 2);
  ctx.stroke();
}

// ---- 图形 / 线条 工具的弹出菜单（悬停即展开） ---------------------------------------
function presetIconSvg(key) {
  const st = 'fill="none" stroke="currentColor" stroke-width="1.8"';
  const dash = 'stroke-dasharray="3 2"';
  switch (key) {
    case 'roi_rect': return `<svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="5" width="18" height="14" ${st} ${dash}/></svg>`;
    case 'roi_ellipse': return `<svg viewBox="0 0 24 24" width="22" height="22"><ellipse cx="12" cy="12" rx="9.5" ry="7" ${st} ${dash}/></svg>`;
    case 'roi_poly': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7 11 3l9 5-2 11-11 2z" ${st} ${dash} stroke-linejoin="round"/></svg>`;
    case 'ms_distance': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 12h18M3 8v8M21 8v8M8 12v-2M13 12v-2M18 12v-2" ${st}/></svg>`;
    case 'ms_calibrate': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 18h18M3 15v6M21 15v6" ${st}/><path d="M7 11h10M12 3v8" ${st}/><circle cx="12" cy="6" r="2.5" ${st}/></svg>`;
  }
  const id = key.replace(/^(shp|ln)_/, '');
  switch (id) {
    case 'circle': return `<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8.5" ${st}/></svg>`;
    case 'ellipse': return `<svg viewBox="0 0 24 24" width="22" height="22"><ellipse cx="12" cy="12" rx="10" ry="6.5" ${st}/></svg>`;
    case 'square': return `<svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="4" width="16" height="16" ${st}/></svg>`;
    case 'rect': return `<svg viewBox="0 0 24 24" width="22" height="22"><rect x="2.5" y="6" width="19" height="12" ${st}/></svg>`;
    case 'roundSquare': return `<svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="4" width="16" height="16" rx="4.5" ${st}/></svg>`;
    case 'roundRect': return `<svg viewBox="0 0 24 24" width="22" height="22"><rect x="2.5" y="6" width="19" height="12" rx="4" ${st}/></svg>`;
    case 'triangle': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3.5 21 20H3z" ${st} stroke-linejoin="miter"/></svg>`;
    case 'roundTriangle': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M10.3 5.3a2 2 0 0 1 3.4 0l7 12a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3z" ${st}/></svg>`;
    case 'arrow': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20 19 5" ${st}/><path d="M12 4h8v8z" fill="currentColor"/></svg>`;
    case 'doubleArrow': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 18 18 6" ${st}/><path d="M13 3h8v8zM3 13v8h8z" fill="currentColor"/></svg>`;
    case 'line': return `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20 20 4" ${st} stroke-linecap="round"/></svg>`;
  }
  return '';
}

const flyout = { timer: null, open: null };

function initFlyouts() {
  const defs = [
    { tool: 'shape', fly: '#shapeFly', items: Object.keys(SHAPE_PRESETS), attr: 'shape-preset', key: 'shp_', choose: setShapePreset },
    { tool: 'arrow', fly: '#lineFly', items: Object.keys(LINE_PRESETS), attr: 'line-preset', key: 'ln_', choose: setLinePreset },
    { tool: 'roi', fly: '#roiFly', items: Object.keys(ROI_PRESETS), attr: 'roi-preset', key: 'roi_', choose: setRoiPreset },
    { tool: 'measure', fly: '#measureFly', items: Object.keys(MEASURE_PRESETS), attr: 'measure-preset', key: 'ms_', choose: setMeasurePreset }
  ];
  const camel = (s) => s.replace(/-(\w)/g, (_, c) => c.toUpperCase());
  for (const d of defs) {
    const fly = $(d.fly);
    fly.innerHTML = `<div class="fly-grid">${d.items.map(id =>
      `<button data-${d.attr}="${id}">${presetIconSvg(d.key + id)}<span data-i18n="${d.key}${id}"></span></button>`).join('')}</div>` +
      (d.tool === 'shape' ? `<div class="fly-hint" data-i18n="shapeFlyHint"></div>` : '') +
      (d.tool === 'roi' ? `<div class="fly-hint" data-i18n="roiFlyHint"></div>` : '') +
      (d.tool === 'measure' ? `<div class="fly-hint" data-i18n="measureFlyHint"></div>` : '');
    const btn = $(`[data-tool="${d.tool}"]`);
    const show = () => { clearTimeout(flyout.timer); openFlyout(btn, fly); };
    const hide = () => { clearTimeout(flyout.timer); flyout.timer = setTimeout(() => closeFlyouts(), 220); };
    btn.addEventListener('mouseenter', show);
    btn.addEventListener('mouseleave', hide);
    btn.addEventListener('click', show);       // 触控板 / 触摸屏：单击展开
    fly.addEventListener('mouseenter', show);
    fly.addEventListener('mouseleave', hide);
    fly.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      d.choose(b.dataset[camel(d.attr)]);
      closeFlyouts();
    });
  }
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.flyout, .has-flyout')) closeFlyouts(); });
  updateToolIcons();
}

function openFlyout(btn, fly) {
  if (flyout.open && flyout.open !== fly) flyout.open.hidden = true;
  const r = btn.getBoundingClientRect();
  fly.hidden = false;
  fly.style.left = (r.right + 6) + 'px';
  fly.style.top = clamp(r.top - 6, 8, window.innerHeight - fly.offsetHeight - 8) + 'px';
  flyout.open = fly;
  $$('button', fly).forEach(b => b.classList.toggle('active',
    b.dataset.shapePreset === state.shapePreset || b.dataset.linePreset === state.linePreset ||
    b.dataset.roiPreset === state.roiPreset || b.dataset.measurePreset === state.measurePreset));
}

function closeFlyouts() {
  $$('.flyout').forEach(f => { f.hidden = true; });
  flyout.open = null;
}

// 工具按钮图标显示上次选择的形状
function updateToolIcons() {
  const s = $('[data-tool="shape"] .tool-icon');
  if (s) s.innerHTML = presetIconSvg('shp_' + state.shapePreset);
  const l = $('[data-tool="arrow"] .tool-icon');
  if (l) l.innerHTML = presetIconSvg('ln_' + state.linePreset);
  const r = $('[data-tool="roi"] .tool-icon');
  if (r) r.innerHTML = presetIconSvg('roi_' + state.roiPreset);
  const m = $('[data-tool="measure"] .tool-icon');
  if (m) m.innerHTML = presetIconSvg('ms_' + state.measurePreset);
}

function svgIcon(name) {
  const fill = name === 'marker' ? 'currentColor' : 'none';
  return `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="${fill}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[name]}"/></svg>`;
}

function initUI() {
  buildCategoryEditor();
  buildStyleEditor();
  initFlyouts();
  initImageMenu();
  initToolsPanel();
  $$('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', svgIcon(el.dataset.icon)));

  const commands = {
    newProject,
    open: openFileDialog,
    exportAll,
    summary: openSummary,
    toggleFolders: () => togglePanel('folders'),
    toggleHints: () => togglePanel('hints'),
    toggleSidePanel: () => setSidePanel(!sidePanelOpen()),
    toggleAi: () => togglePanel('ai'),
    toggleTools: () => togglePanel('tools'),
    toggleLoupe: () => toggleLoupe(),
    toggleGrid: () => toggleGrid(),
    save: () => saveProject(false),
    saveAs: () => saveProject(true),
    exportPng, exportCsv,
    undo, redo,
    zoomIn: () => zoomAt(1.25), zoomOut: () => zoomAt(0.8),
    fit: fitView, actual: actualSize,
    toggleMarks: () => toggleAnnotations(),
    toggleNumbers: () => { state.showNumbers = !state.showNumbers; prefs.set('showNumbers', state.showNumbers); updateToggles(); requestRender(); },
    settings: openSettings,
    help: openHelp,
  };
  const ls = $('#langSelect');
  ls.value = LANG;
  ls.addEventListener('change', () => { setLanguage(ls.value); ls.blur(); });
  $$('[data-cmd]').forEach(btn => btn.addEventListener('click', () => {
    const f = commands[btn.dataset.cmd];
    if (f) f();
    btn.blur();
  }));
  $$('[data-tool]').forEach(btn => btn.addEventListener('click', () => { setTool(btn.dataset.tool); btn.blur(); }));

  const op = $('#opacity');
  op.value = Math.round(state.opacity * 100);
  op.addEventListener('input', () => { state.opacity = op.value / 100; requestRender(); });
  op.addEventListener('change', () => prefs.set('opacity', state.opacity));

  $('#fileInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    e.target.value = '';
    openFiles(files, null);
  });

  // 拖放文件
  const stage = $('#stage');
  window.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('dragging'); });
  window.addEventListener('dragleave', (e) => { if (e.target === document.documentElement || !e.relatedTarget) stage.classList.remove('dragging'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('dragging');
    const files = e.dataTransfer ? Array.from(e.dataTransfer.files) : [];
    if (files.length && $('#importDialog').open) { importerAdd(files); return; }   // 导入窗口打开时：加入待导入列表
    if (files.length) openFiles(files, null);
  });

  $('#countPopup').addEventListener('pointerdown', (e) => e.stopPropagation());
  document.addEventListener('pointerdown', (e) => {
    if (isCountPopupOpen() && !e.target.closest('#countPopup') && e.target !== view.canvas) hideCountPopup();
    if (!e.target.closest('#ctxMenu') && e.target !== view.canvas) hideContextMenu();
  });

  initSettingsDialog();
  initSummaryDialog();
  initFolderPanel();
  initHintBox();
  initAiPanel();
  $('#addCat').addEventListener('click', () => { if (state.doc) { addCategory(); setTool('marker'); } });
  $('#delCat').addEventListener('click', deleteCurrentCategory);
}

// 类别本身（名称/颜色/形状/大小/顺序）或当前类别改变时才重建列表与图标；
// 仅加点/删点时只更新数字，使每次点击的界面开销降到最低。
let lastCatSig = null;
const catSignature = () => (state.doc ? JSON.stringify([state.doc.categories, state.currentCat, LANG]) : '');

function onDocChanged() {
  const sig = catSignature();
  const catsChanged = sig !== lastCatSig;
  if (catsChanged) {
    lastCatSig = sig;
    if (state.doc) {
      prefs.set('lastCategories', state.doc.categories.map(c => ({ name: c.name, color: c.color, shape: c.shape, size: c.size })));
    }
    updateCategoryList();
    refreshAiPanel();
  } else {
    updateCategoryCounts();
  }
  $('#dropHint').hidden = !!state.doc;
  updateActiveImageCount();
  updatePanel();
  updateSelectionStatus();
  updateStatus();
  updateToggles();
  updateToolsPanel();
  updateCellBar();
  if ($('#summaryDialog').open) renderStats();   // 数据统计实时更新
  if (isCountPopupOpen()) renderCountPopup();
  requestRender();
}

function updateCategoryCounts() {
  if (!state.doc) return;
  const counts = countsByCategory();
  $$('#catList .cat-item').forEach(li => {
    const el = $('.cat-count', li);
    const v = String(counts[li.dataset.id] || 0);
    if (el.textContent !== v) el.textContent = v;
  });
}

function updateToolUI() {
  $$('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === state.tool));
  updateToolIcons();
}

function updateToggles() {
  $('#btnMarks').classList.toggle('active', state.showAnnotations);
  $('#btnNumbers').classList.toggle('active', state.showNumbers);
  $('#btnLoupe').classList.toggle('active', !!state.loupe.on);

}

function toggleAnnotations(force) {
  state.showAnnotations = force === undefined ? !state.showAnnotations : force;
  updateToggles();
  toast(state.showAnnotations ? t('marksShown') : t('marksHidden'));
  requestRender();
}

function updateZoomLabel() {
  const z = Math.round(state.view.scale * 1000) / 10;
  $('#zoomLabel').textContent = (z >= 10 ? Math.round(z) : z) + '%';
}

function updateCoords(p) {
  const el = $('#stCoords');
  const { width, height } = state.doc.image;
  el.textContent = (p.x >= 0 && p.y >= 0 && p.x <= width && p.y <= height) ? `x ${Math.round(p.x)}, y ${Math.round(p.y)}` : '';
}

let lastChips = '';
function updateStatus() {
  const doc = state.doc;
  const dirty = isDirty();
  $('#btnUndo').disabled = !state.history.undo.length;
  $('#btnRedo').disabled = !state.history.redo.length;
  ['btnSave', 'btnSaveAs', 'btnExportPng', 'btnExportCsv'].forEach(id => { $('#' + id).disabled = !doc; });
  if (typeof updateMobCatBtn === 'function') updateMobCatBtn();
  const tp = state.ws && state.ws.template;
  const stTpl = $('#stTpl');
  if (stTpl) { stTpl.hidden = !tp; stTpl.textContent = tp ? t('tplStatus', { name: `${tp.name} v${tp.version}` }) : ''; }
  const projTitle = state.fileName || (state.ws && state.ws.folders.length ? projectFileName() : t('appName'));
  if (!doc) {
    $('#stTotal').textContent = '';
    $('#stCats').innerHTML = '';
    $('#stImage').textContent = t('noImage');
    $('#stSaved').textContent = dirty ? t('unsaved') + ' *' : '';
    document.title = (dirty ? '* ' : '') + projTitle + ' — ' + t('appName') + ' v' + APP_VERSION;
    return;
  }
  const counts = countsByCategory();
  const total = markers().length;
  $('#stTotal').innerHTML = `${escapeHtml(t('total'))}: <b id="totalCount">${total}</b>`;
  const chips = doc.categories.map(c =>
    `<span class="chip${c.id === state.currentCat ? ' cur' : ''}" data-cat="${c.id}"><i style="background:${c.color}"></i>${escapeHtml(c.name)}: <b>${counts[c.id] || 0}</b></span>`).join('');
  if (chips !== lastChips) { lastChips = chips; $('#stCats').innerHTML = chips; }
  $('#stImage').innerHTML = `<b>${escapeHtml(entryName(state.entry))}</b> <span class="muted">${escapeHtml(doc.image.name)} · ${doc.image.width}×${doc.image.height}</span>`;
  const sc = scaleOf(doc);
  if (sc) $('#stImage').insertAdjacentHTML('beforeend', ` <span class="scale-badge">${escapeHtml(fmtNum(sc.px))} ${escapeHtml(sc.unit)}/px</span>`);
  if (adjActive(doc)) $('#stImage').insertAdjacentHTML('beforeend', ` <span class="ops-badge">${escapeHtml(t('adjustedBadge'))}</span>`);
  const opsNote = opsSummary(doc.image);
  if (opsNote) $('#stImage').insertAdjacentHTML('beforeend', ` <span class="ops-badge" title="${escapeHtml(opsNote)}">${escapeHtml(t('edited'))}</span>`);
  $('#stImage').title = t('originalFile') + '：' + doc.image.name + (opsNote ? '\n' + opsNote : '');
  $('#stSaved').textContent = dirty ? t('unsaved') + ' *' : t('saved');
  $('#stSaved').classList.toggle('dirty', dirty);
  document.title = (dirty ? '* ' : '') + entryName(state.entry) + ' · ' + projTitle + ' — ' + t('appName') + ' v' + APP_VERSION;
}

// ---- 类别列表 -------------------------------------------------------------------
function drawIcon(canvas, shape, color, size) {
  const dpr = window.devicePixelRatio || 1;
  const s = canvas.clientWidth || 22;
  canvas.width = s * dpr;
  canvas.height = s * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, s, s);
  drawMarker(ctx, s / 2, s / 2, size || s * 0.72, shape, color);
}

function updateCategoryList() {
  const ul = $('#catList');
  if (!state.doc) { ul.innerHTML = ''; return; }
  const counts = countsByCategory();
  ul.innerHTML = state.doc.categories.map((c, i) => `
    <li class="cat-item${c.id === state.currentCat ? ' active' : ''}" data-id="${c.id}">
      <span class="cat-key">${i < 9 ? i + 1 : ''}</span>
      <canvas class="cat-icon"></canvas>
      <span class="cat-name" title="${escapeHtml(t('renameTip'))}">${escapeHtml(c.name)}</span>
      <span class="cat-count">${counts[c.id] || 0}</span>
      <button class="cat-rename icon-btn" title="${escapeHtml(t('rename'))}">✎</button>
    </li>`).join('');
  $$('.cat-item', ul).forEach(li => {
    const cat = findCat(li.dataset.id);
    drawIcon($('.cat-icon', li), cat.shape, cat.color);
    li.addEventListener('click', (e) => { if (!e.target.closest('input')) selectCategory(cat.id); });
    $('.cat-name', li).addEventListener('dblclick', () => startRename(li, cat));
    $('.cat-rename', li).addEventListener('click', (e) => { e.stopPropagation(); startRename(li, cat); });
  });
}

function selectCategory(id) {
  state.currentCat = id;
  if (state.tool !== 'marker') setTool('marker');
  // 只切换高亮，不重建列表（重建会使双击改名落在已被替换的元素上）
  $$('.cat-item').forEach(li => li.classList.toggle('active', li.dataset.id === id));
  updatePanel();
  if (typeof updateMobCatBtn === 'function') updateMobCatBtn();
}

function startRename(li, cat) {
  const span = $('.cat-name', li);
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'cat-name-input';
  inp.value = cat.name;
  inp.maxLength = 60;
  span.replaceWith(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = (ok) => {
    if (done) return;
    done = true;
    const name = inp.value.trim();
    if (ok && name && name !== cat.name) modifyCategory(cat.id, { name });
    else updateCategoryList();
  };
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.isComposing) finish(true);
    else if (e.key === 'Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
  inp.addEventListener('click', (e) => e.stopPropagation());
}

function deleteCurrentCategory() {
  const doc = state.doc;
  if (!doc) return;
  if (doc.categories.length <= 1) { toast(t('lastCategory')); return; }
  const cat = findCat(state.currentCat);
  if (!cat) return;
  const elsewhere = markersOfCategoryElsewhere(cat.id);
  if (elsewhere > 0) { alert(t('catUsedElsewhereDelete', { name: cat.name, n: elsewhere })); return; }
  const n = countsByCategory()[cat.id] || 0;
  if (n > 0 && !confirm(t('confirmDeleteCat', { name: cat.name, n }))) return;
  removeCategory(cat.id);
}

// ---- 即时预览 + 提交为一条撤回记录（用于滑块与取色器） ---------------------------
const live = { key: null, before: null };
function liveBegin(key, before) {
  if (live.key !== key) { live.key = key; live.before = clone(before); }
}
function liveEnd(key) {
  const b = live.key === key ? live.before : null;
  live.key = null;
  live.before = null;
  return b;
}

// ---- 类别编辑器 -----------------------------------------------------------------
function swatchesHtml(name) {
  return PRESET_COLORS.map(c => `<button class="swatch" data-${name}="${c}" style="background:${c}" title="${c}"></button>`).join('') +
    `<label class="swatch custom" data-i18n-title="custom"><input type="color" data-${name}-custom></label>`;
}

function buildCategoryEditor() {
  const box = $('#catEditor');
  box.innerHTML = `
    <div class="field"><div class="label" data-i18n="color"></div><div class="swatches">${swatchesHtml('catcolor')}</div></div>
    <div class="field"><div class="label" data-i18n="shape"></div><div class="shapes">
      ${SHAPES.map(s => `<button class="shape-btn" data-shape="${s}"><canvas></canvas></button>`).join('')}
    </div></div>
    <div class="field"><div class="label"><span data-i18n="size"></span> <span id="catSizeVal"></span></div>
      <input type="range" id="catSize" min="2" max="60" step="1"></div>`;
  $$('[data-catcolor]', box).forEach(b => b.addEventListener('click', () => {
    if (state.doc) modifyCategory(state.currentCat, { color: b.dataset.catcolor });
  }));
  const cc = $('[data-catcolor-custom]', box);
  cc.addEventListener('input', () => {
    const cat = findCat(state.currentCat);
    if (!cat) return;
    liveBegin('catcolor', { color: cat.color });
    cat.color = cc.value;
    requestRender();
  });
  cc.addEventListener('change', () => {
    const cat = findCat(state.currentCat);
    if (!cat) return;
    const before = liveEnd('catcolor') || { color: cat.color };
    modifyCategory(cat.id, { color: cc.value }, before);
  });
  $$('[data-shape]', box).forEach(b => b.addEventListener('click', () => {
    if (state.doc) modifyCategory(state.currentCat, { shape: b.dataset.shape });
  }));
  const sz = $('#catSize');
  sz.addEventListener('input', () => {
    const cat = findCat(state.currentCat);
    if (!cat) return;
    liveBegin('catsize', { size: cat.size });
    cat.size = Number(sz.value);
    $('#catSizeVal').textContent = sz.value;
    requestRender();
  });
  sz.addEventListener('change', () => {
    const cat = findCat(state.currentCat);
    if (!cat) return;
    const before = liveEnd('catsize') || { size: cat.size };
    modifyCategory(cat.id, { size: Number(sz.value) }, before);
  });
}

let editorKey = null;
function updateCategoryEditor() {
  const cat = state.doc && findCat(state.currentCat);
  $('#catSection').classList.toggle('disabled', !cat);
  if (!cat) return;
  $$('[data-catcolor]').forEach(b => b.classList.toggle('active', b.dataset.catcolor.toLowerCase() === cat.color.toLowerCase()));
  const cc = $('[data-catcolor-custom]');
  cc.value = cat.color;
  cc.parentElement.classList.toggle('active', !PRESET_COLORS.includes(cat.color.toLowerCase()));
  cc.parentElement.style.background = PRESET_COLORS.includes(cat.color.toLowerCase()) ? '' : cat.color;
  const key = [cat.id, cat.color, cat.shape, cat.size, LANG].join('|');
  if (key === editorKey) return;
  editorKey = key;
  $$('[data-shape]').forEach(b => {
    b.classList.toggle('active', b.dataset.shape === cat.shape);
    b.title = t('shapeNames')[b.dataset.shape];
    drawIcon($('canvas', b), b.dataset.shape, cat.color);
  });
  $('#catSize').value = cat.size;
  $('#catSizeVal').textContent = cat.size;
}

// ---- 计数弹窗 -------------------------------------------------------------------
let popupPos = null;
const isCountPopupOpen = () => !$('#countPopup').hidden;

function showCountPopup(clientX, clientY) {
  popupPos = { x: clientX, y: clientY };
  renderCountPopup();
}

function countRows() {
  const counts = countsByCategory();
  const total = markers().length;
  return {
    total,
    rows: state.doc.categories.map(c => ({ cat: c, n: counts[c.id] || 0, pct: total ? (counts[c.id] || 0) / total * 100 : 0 }))
  };
}

function renderCountPopup() {
  const el = $('#countPopup');
  if (!state.doc || !popupPos) return;
  const { total, rows } = countRows();
  el.innerHTML = `
    <div class="pop-title">${escapeHtml(t('countTitle'))}</div>
    <div class="pop-total">${escapeHtml(t('total'))}：<b id="popTotal">${total}</b></div>
    <table>
      <thead><tr><th></th><th>${escapeHtml(t('category'))}</th><th>${escapeHtml(t('count'))}</th><th>${escapeHtml(t('percent'))}</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><canvas class="pop-icon" data-id="${r.cat.id}"></canvas></td><td>${escapeHtml(r.cat.name)}</td>
        <td class="num">${r.n}</td><td class="num">${r.pct.toFixed(1)}%</td></tr>`).join('')}</tbody>
    </table>
    ${roiPopupHtml()}
    <div class="pop-actions"><button id="popCopy">${escapeHtml(t('copy'))}</button><button id="popClose">${escapeHtml(t('close'))}</button></div>`;
  el.hidden = false;
  $$('.pop-icon', el).forEach(c => { const cat = findCat(c.dataset.id); drawIcon(c, cat.shape, cat.color); });
  $('#popCopy').addEventListener('click', copyCounts);
  $('#popClose').addEventListener('click', hideCountPopup);
  // 定位：尽量放在光标旁，并保持在窗口内
  const w = el.offsetWidth, h = el.offsetHeight;
  const x = clamp(popupPos.x + 12, 8, window.innerWidth - w - 8);
  const y = clamp(popupPos.y + 12, 8, window.innerHeight - h - 8);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

// 计数弹窗中的 ROI 统计
function roiPopupHtml() {
  const rois = roisOf();
  if (!rois.length) return '';
  return `<div class="pop-sub">${escapeHtml(t('roiTitle'))}</div><table><tbody>${rois.map(o => {
    const st = roiStats(o);
    const dens = densityText(st.total, st.area);
    return `<tr><td><i class="sw" style="background:${(o.style && o.style.color) || '#ffeb3b'}"></i>${escapeHtml(o.name)}</td><td class="num"><b>${st.total}</b></td>
      <td class="num small">${escapeHtml(fmtArea(st.area))}</td><td class="num small">${escapeHtml(dens)}</td></tr>`;
  }).join('')}</tbody></table>`;
}

function hideCountPopup() {
  const el = $('#countPopup');
  if (el) el.hidden = true;
  popupPos = null;
}

function countsText() {
  const { total, rows } = countRows();
  const lines = [[t('category'), t('count'), t('percent')].join('\t')];
  rows.forEach(r => lines.push([r.cat.name, r.n, r.pct.toFixed(1) + '%'].join('\t')));
  lines.push([t('total'), total, '100%'].join('\t'));
  for (const o of roisOf()) {
    const st = roiStats(o);
    lines.push([o.name, st.total, fmtArea(st.area), densityText(st.total, st.area)].join('\t'));
  }
  lines.push(['image', state.doc.image.name].join('\t'));
  return lines.join('\n');
}

async function copyCounts() {
  const text = countsText();
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (err) { /* 忽略 */ }
    ta.remove();
  }
  toast(t('copied'));
}

// ---- 提示条 / 忙碌指示 -----------------------------------------------------------
let toastTimer = null;
function toast(msg, ms) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2200);
}

function showBusy(on) {
  document.body.classList.toggle('busy', !!on);
}

  const dlg = $('#settingsDialog');

  fillProfileForm();
  fillEngineForm();
  updateCategoryList();
  updatePanel();
  updateStatus();
  if (isCountPopupOpen()) renderCountPopup();
}
