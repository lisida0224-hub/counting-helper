    const x = i % W, y = (i - x) / W;
    let c2 = comps.get(r);
    if (!c2) { c2 = { id: r, area: 0, sx: 0, sy: 0, sxx: 0, syy: 0, sxy: 0, sig: 0, x0: x, x1: x, y0: y, y1: y }; comps.set(r, c2); }
    c2.area++; c2.sx += x; c2.sy += y; c2.sxx += x * x; c2.syy += y * y; c2.sxy += x * y; c2.sig += signal[i];
    if (x < c2.x0) c2.x0 = x; if (x > c2.x1) c2.x1 = x; if (y < c2.y0) c2.y0 = y; if (y > c2.y1) c2.y1 = y;
  }
  return { W, H, s, bb, labels, comps, T, otsu };
}

function quantile(hist, n, q) {
  const target = q * n;
  let acc = 0;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= target) return v; }
  return 255;
}

function otsuThreshold(hist, n) {
  if (!n) return 0;
  let sum = 0;
  for (let v = 0; v < 256; v++) sum += v * hist[v];
  let sumB = 0, wB = 0, best = 0, bestT = 0;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = n - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best) { best = between; bestT = t; }
  }
  return bestT;
}

const areaOfDiameter = (d) => Math.PI * (d / 2) * (d / 2);

// 单个目标面积（工作分辨率像素²）：给定直径，或取斑块面积的稳健中位数
function estimateSingleArea(seg, opt) {
  if (opt.singleSize > 0) return areaOfDiameter(opt.singleSize * seg.s);
  const areas = [];
  seg.comps.forEach(c => { if (c.area >= 6) areas.push(c.area); });
  if (!areas.length) return 20;
  areas.sort((a, b) => a - b);
  const lower = areas.slice(0, Math.max(1, Math.ceil(areas.length * 0.7)));   // 去掉最大的 30%（多为重叠团块）
  return lower[Math.floor(lower.length / 2)];
}

// k-means：在一个斑块内放置 k 个点（初始点沿主轴均匀分布）
function splitComponent(seg, c, k) {
  const { W, labels } = seg;
  const xs = [], ys = [];
  for (let y = c.y0; y <= c.y1; y++) for (let x = c.x0; x <= c.x1; x++) if (labels[y * W + x] === c.id) { xs.push(x); ys.push(y); }
  const n = xs.length;
  const mx = c.sx / c.area, my = c.sy / c.area;
  const cxx = c.sxx / c.area - mx * mx, cyy = c.syy / c.area - my * my, cxy = c.sxy / c.area - mx * my;
  const ang = 0.5 * Math.atan2(2 * cxy, cxx - cyy);
  const ux = Math.cos(ang), uy = Math.sin(ang);
  let pmin = Infinity, pmax = -Infinity;
  for (let i = 0; i < n; i++) { const p = (xs[i] - mx) * ux + (ys[i] - my) * uy; if (p < pmin) pmin = p; if (p > pmax) pmax = p; }
  const centers = [];
  for (let j = 0; j < k; j++) { const p = pmin + (j + 0.5) * (pmax - pmin) / k; centers.push({ x: mx + p * ux, y: my + p * uy }); }
  const assign = new Int32Array(n);
  for (let iter = 0; iter < 12; iter++) {
    const sum = centers.map(() => ({ x: 0, y: 0, n: 0 }));
    for (let i = 0; i < n; i++) {
      let best = 0, bd = Infinity;
      for (let j = 0; j < k; j++) { const d = (xs[i] - centers[j].x) ** 2 + (ys[i] - centers[j].y) ** 2; if (d < bd) { bd = d; best = j; } }
      assign[i] = best; sum[best].x += xs[i]; sum[best].y += ys[i]; sum[best].n++;
    }
    centers.forEach((cc, j) => { if (sum[j].n) { cc.x = sum[j].x / sum[j].n; cc.y = sum[j].y / sum[j].n; } });
  }
  return centers;
}

// 主函数：检测目标点。opt: {polarity, sensitivity, singleSize, minSize, maxSize, split, region}
function detectSpots(bmp, imgW, imgH, opt) {
  const seg = segmentSpots(bmp, imgW, imgH, opt);
  const A1 = estimateSingleArea(seg, opt);
  const minArea = opt.minSize > 0 ? areaOfDiameter(opt.minSize * seg.s) : Math.max(4, A1 * 0.25);
  const maxArea = opt.maxSize > 0 ? areaOfDiameter(opt.maxSize * seg.s) : A1 * 40;
  const points = [];
  let singles = 0, clusters = 0, dropped = 0;
  const toImage = (x, y) => ({ x: seg.bb.x + (x + 0.5) / seg.s, y: seg.bb.y + (y + 0.5) / seg.s });
  seg.comps.forEach(c => {
    if (c.area < minArea || c.area > maxArea) { dropped++; return; }
    const ratio = c.area / A1;
    const k = opt.split !== false && ratio >= 1.5 ? Math.max(2, Math.round(ratio)) : 1;
    const contrast = clamp((c.sig / c.area) / (seg.T * 2), 0, 1);
    const sizeFit = 1 - clamp(Math.abs(ratio / k - 1), 0, 1);
    let conf = 0.3 + 0.7 * (0.5 * contrast + 0.5 * sizeFit);
    if (k === 1) {
      singles++;
      points.push(Object.assign(toImage(c.sx / c.area, c.sy / c.area), { conf: round3(conf), overlap: false }));
    } else {
      clusters++;
      conf *= 0.85;
      splitComponent(seg, c, k).forEach(p => points.push(Object.assign(toImage(p.x, p.y), { conf: round3(conf), overlap: true, group: c.id })));
    }
  });
  const inRegion = opt.region && opt.region.length >= 3 ? points.filter(p => pointInPolygon(p.x, p.y, opt.region)) : points;
  return {
    points: inRegion,
    stats: {
      singles, clusters, dropped, objects: inRegion.length,
      singleDiameter: round3(2 * Math.sqrt(A1 / Math.PI) / seg.s),
      threshold: seg.T, scale: round3(seg.s)
    }
  };
}
const round3 = (v) => Math.round(v * 1000) / 1000;

// 用已标记的点校准“单个目标大小”：找到每个标记所在的斑块，取面积中位数（只用单独斑块中的标记）
function calibrateSingleSize(bmp, imgW, imgH, markerPts, opt) {
  if (!markerPts.length) return null;
  const seg = segmentSpots(bmp, imgW, imgH, Object.assign({}, opt, { singleSize: 0 }));
  const perComp = new Map();
  markerPts.forEach(p => {
    const x = Math.round((p.x - seg.bb.x) * seg.s - 0.5), y = Math.round((p.y - seg.bb.y) * seg.s - 0.5);
    let id = 0;
    for (let r = 0; r <= 3 && !id; r++) {
      for (let dy = -r; dy <= r && !id; dy++) for (let dx = -r; dx <= r && !id; dx++) {
        const X = x + dx, Y = y + dy;
        if (X >= 0 && Y >= 0 && X < seg.W && Y < seg.H) id = seg.labels[Y * seg.W + X];
      }
    }
    if (id) perComp.set(id, (perComp.get(id) || 0) + 1);
  });
  const areas = [];
  perComp.forEach((n, id) => { if (n === 1) areas.push(seg.comps.get(id).area); });
  if (!areas.length) return null;
  areas.sort((a, b) => a - b);
  const A = areas[Math.floor(areas.length / 2)];
  return { diameter: round3(2 * Math.sqrt(A / Math.PI) / seg.s), used: areas.length, markers: markerPts.length };
}

// 与已有标记比对：漏数 = 检测到但附近没有标记；可能误标 = 标记附近没有检测到目标
function compareWithMarkers(detected, markerObjs, radius) {
  const used = new Set();
  const missed = [];
  const r2 = radius * radius;
  const pts = detected.slice().sort((a, b) => b.conf - a.conf);
  for (const d of pts) {
    let best = null, bd = r2;
    for (const m of markerObjs) {
      if (used.has(m.id)) continue;
      const dd = (m.x - d.x) ** 2 + (m.y - d.y) ** 2;
      if (dd <= bd) { bd = dd; best = m; }
    }
    if (best) used.add(best.id); else missed.push({ x: d.x, y: d.y, conf: d.conf });
  }
  const falsePositive = markerObjs.filter(m => !used.has(m.id)).map(m => m.id);
  return { missed, falsePositive, matched: used.size };
}

// ===== workspace.js =====
// ---------------------------------------------------------------------------
// workspace.js — 文件夹与图片管理
//
// 图片自动命名：文件夹名-两位编号（A-01、A-02…，超过 99 自动三位）。
// 编号一经分配不再复用（删除 A-03 后新图为 A-04），保证可追踪。
// 同一时间只有当前图片保持解码状态，其它图片只保留压缩文件（Blob），节省内存。
// ---------------------------------------------------------------------------
let activationToken = 0;

const padNo = (no) => String(no).padStart(2, '0');
const folderById = (id) => state.ws && state.ws.folders.find(f => f.id === id);

function entryName(e) {
  if (e.customName) return e.customName;
  const f = folderById(e.folderId);
  return `${f ? f.name : '?'}-${padNo(e.no)}`;
}

function orderedEntries() {
  const ws = state.ws;
  if (!ws) return [];
  const out = [];
  for (const f of ws.folders) for (const id of f.imageIds) if (ws.images[id]) out.push(ws.images[id]);
  return out;
}

function ensureWorkspace() {
  if (!state.ws) {
    state.ws = newWorkspace(prefs.get('lastCategories', null));
    state.currentCat = state.ws.categories[0].id;
  }
  return state.ws;
}

// A, B, … Z, AA, AB …
function letterName(i) {
  let s = '';
  i++;
  while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

function nextFolderName() {
  const used = new Set(state.ws.folders.map(f => f.name));
  for (let i = 0; ; i++) { const n = letterName(i); if (!used.has(n)) return n; }
}

function addFolder(name) {
  const ws = ensureWorkspace();
  const f = { id: 'f' + ws.nextFolderId++, name: (name || '').trim() || nextFolderName(), nextNo: 1, imageIds: [] };
  ws.folders.push(f);
  ws.activeFolderId = f.id;
  markStructChanged();
  onWorkspaceChanged();
  return f;
}

function activeFolder() {
  const ws = state.ws;
  if (!ws) return null;
  return folderById(ws.activeFolderId) || ws.folders[ws.folders.length - 1] || null;
}

function setActiveFolder(id) {
  if (!state.ws || !folderById(id)) return;
  state.ws.activeFolderId = id;
  onWorkspaceChanged();
}

function renameFolder(id, name) {
  const f = folderById(id);
  name = String(name || '').trim();
  if (!f || !name || name === f.name) return;
  f.name = name;
  markStructChanged();
  onWorkspaceChanged();
  onDocChanged();
}

function renameImage(id, name) {
  const e = state.ws && state.ws.images[id];
  if (!e) return;
  name = String(name || '').trim();
  const custom = name && name !== `${folderById(e.folderId).name}-${padNo(e.no)}` ? name : null;
  if (custom === (e.customName || null)) return;
  e.customName = custom;
  markStructChanged();
  onWorkspaceChanged();
  onDocChanged();
}

function toggleDone(id) {
  const e = state.ws && state.ws.images[id];
  if (!e) return;
  e.done = !e.done;
  markStructChanged();
  onWorkspaceChanged();
}

function createEntry(folder, { blob, image, doc, history, view, done, customName }) {
  const ws = state.ws;
  const id = 'i' + ws.nextImageId++;
  const e = {
    id, folderId: folder.id, no: folder.nextNo++, customName: customName || null, done: !!done,
    doc: doc || newDocument(image),
    history: history || { undo: [], redo: [], nextId: 1 },
    savedStateId: 0, view: view || null, blob, file: null
  };
  e.doc.categories = ws.categories;
  if (!doc) applyTplDefaults(e.doc);   // 模板中的网格 / 比例尺
  ws.images[id] = e;
  folder.imageIds.push(id);
  return e;
}

async function decodeBlob(blob) {
  if (typeof createImageBitmap === 'function') {
    try { return await createImageBitmap(blob); } catch (e) { /* 退回到 <img> 解码 */ }
  }
  const url = URL.createObjectURL(blob);
  try { return await loadImageElement(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
}

function closeBitmap(b) {
  if (b && typeof b.close === 'function') b.close();
}

function releaseCurrentImage() {
  releasePyramid();
  if (state.img !== state.origImg) closeBitmap(state.img);
  closeBitmap(state.origImg);
  state.img = null;
  state.origImg = null;
  view.crop = null;
}

async function activateImage(id) {
  const ws = state.ws;
  const e = ws && ws.images[id];
  if (!e) return;
  if (id === state.activeId && state.img) return;
  commitTextEditor();
  const token = ++activationToken;
  showBusy(true);
  let bmp;
  try { bmp = await decodeBlob(e.blob); } finally { showBusy(false); }
  if (token !== activationToken) { closeBitmap(bmp); return; }
  releaseCurrentImage();
  state.activeId = id;
  ws.activeFolderId = e.folderId;
  state.origImg = bmp;
  state.img = composeImage(bmp, e.doc.image);   // 应用裁剪/旋转/翻转
  state.selection = [];
  state.region = null;
  state.aiSuggest = null;
  view.draft = null;
  state.cellMode = null;
  updateCellBar();
  hideCountPopup();
  if (!findCat(state.currentCat)) state.currentCat = ws.categories[0] ? ws.categories[0].id : null;
  buildPyramid(state.img);
  if (!e.view) fitView();
  else { view.baseKey = ''; requestRender(); updateZoomLabel(); }
  if (state.tool === 'crop') initCropRect();
  onWorkspaceChanged();
  onDocChanged();
}

function navigateImage(delta) {
  const list = orderedEntries();
  if (!list.length) return;
  const i = list.findIndex(e => e.id === state.activeId);
  const next = list[clamp((i < 0 ? 0 : i + delta), 0, list.length - 1)];
  if (next && next.id !== state.activeId) activateImage(next.id);
}

function deleteImage(id) {
  const ws = state.ws;
  const e = ws && ws.images[id];
  if (!e) return;
  const list = orderedEntries();
  const idx = list.findIndex(x => x.id === id);
  const f = folderById(e.folderId);
  if (f) f.imageIds = f.imageIds.filter(x => x !== id);
  delete ws.images[id];
  markStructChanged();
  if (state.activeId === id) {
    releaseCurrentImage();
    state.activeId = null;
    const rest = orderedEntries();
    const next = rest[Math.min(idx, rest.length - 1)];
    if (next) activateImage(next.id);
  }
  onWorkspaceChanged();
  onDocChanged();
}

function deleteFolder(id) {
  const ws = state.ws;
  const f = folderById(id);
  if (!f) return;
  const ids = f.imageIds.slice();
  ws.folders = ws.folders.filter(x => x.id !== id);
  ids.forEach(i => delete ws.images[i]);
  if (ws.activeFolderId === id) ws.activeFolderId = ws.folders.length ? ws.folders[ws.folders.length - 1].id : null;
  markStructChanged();
  if (ids.includes(state.activeId)) {
    releaseCurrentImage();
    state.activeId = null;
    const first = orderedEntries()[0];
    if (first) activateImage(first.id);
  }
  onWorkspaceChanged();
  onDocChanged();
}

// 打开项目/新建项目时整体替换工作区
async function replaceWorkspace(ws, activeId) {
  releaseCurrentImage();
  clearAssetCache();
  state.ws = ws;
  state.activeId = null;
  state.selectedId = null;
  state.currentCat = ws && ws.categories[0] ? ws.categories[0].id : null;
  view.draft = null;
  resetAutosaveTracking();
  hideCountPopup();
  if (ws) {
    const target = (activeId && ws.images[activeId]) ? activeId : (orderedEntries()[0] || {}).id;
    if (target) await activateImage(target);
  }
  onWorkspaceChanged();
  onDocChanged();
}

// 在 fn 执行期间把“当前图片”临时切换为 entry（用于批量导出、汇总），不触发界面更新
function withEntry(entry, fn) {
  const prev = state.activeId;
  state.activeId = entry.id;
  try { return fn(); } finally { state.activeId = prev; }
}

function markerCount(e) {
  let n = 0;
  for (const o of e.doc.objects) if (o.type === 'marker') n++;
  return n;
}

// ---- 汇总统计 -------------------------------------------------------------------
function mean(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN; }
// 样本标准差（n−1）
function sd(a) {
  if (a.length < 2) return NaN;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1));
}

function computeSummary() {
  const ws = state.ws;
  const cats = ws ? ws.categories : [];
  const rows = orderedEntries().map(e => {
    const counts = {};
    cats.forEach(c => { counts[c.id] = 0; });
    for (const o of e.doc.objects) if (o.type === 'marker' && counts[o.cat] !== undefined) counts[o.cat]++;
    const total = cats.reduce((s, c) => s + counts[c.id], 0);
    return { entry: e, folder: folderById(e.folderId), name: entryName(e), counts, total };
  });
  const stat = (subset) => {
    const r = { n: subset.length, mean: {}, sd: {} };
    cats.forEach(c => { const v = subset.map(x => x.counts[c.id]); r.mean[c.id] = mean(v); r.sd[c.id] = sd(v); });
    const tv = subset.map(x => x.total);
    r.mean.total = mean(tv);
    r.sd.total = sd(tv);
    r.sum = subset.reduce((s, x) => s + x.total, 0);
    return r;
  };
  const groups = (ws ? ws.folders : []).map(f => ({ folder: f, stats: stat(rows.filter(r => r.folder === f)) }));
  return { cats, rows, groups, overall: stat(rows) };
}

// ===== tools.js =====
// ---------------------------------------------------------------------------
// tools.js — 指针（鼠标/触控板/触摸）与键盘交互
//
// 触控板手势由操作系统转换为标准鼠标事件：单指轻点 = 左键，双指轻点 = 右键
// (contextmenu)，双指滑动 = 滚轮，双指捏合 = Ctrl+滚轮。因此这里只需处理标准
// Pointer Events / contextmenu / wheel 事件即可兼容鼠标、触控板与触摸屏。
// ---------------------------------------------------------------------------
const CLICK_SLOP = 4;          // 画图类工具：移动超过此像素数即开始拖动绘制
// 文字工具 / 触摸屏标记：只有明显拖动（> 24 像素）才算平移，其余都算单击。
const TAP_MAX_MOVE = 24;
const LONG_PRESS_MS = 550;     // 触摸屏长按 = 显示计数

const input = {
  gesture: null,               // 当前进行中的指针操作
  pointer: { x: 0, y: 0, over: false }, // 最近一次指针位置（空格键加点用）
  clip: null,                  // Ctrl+C 复制的对象（数组）
  moveMode: null,              // 右键菜单“移动”：对象跟随指针，单击放下
  ctrlHeld: false,             // 按住 Ctrl（macOS 为 ⌘）：快速选中/拖动
  touches: new Map(),          // 触摸点（用于双指缩放）
  pinch: null
};

const TOOL_KEYS = { m: 'marker', a: 'arrow', r: 'shape', t: 'text', v: 'select', l: 'lasso', p: 'pan', c: 'crop', x: 'inset', o: 'roi', k: 'measure' };

// 图形工具：选择形状预设（圆形/椭圆/正方形/矩形/圆角…/三角形…）
function setShapePreset(id) {
  const pr = SHAPE_PRESETS[id];
  if (!pr) return;
  state.shapePreset = id;
  const st = state.toolStyles.shape;
  if (pr.round) st.radius = st.radius > 0 ? st.radius : (st.lastRound || DEFAULT_RADIUS);
  else { if (st.radius > 0) st.lastRound = st.radius; st.radius = 0; }
  prefs.set('shapePreset', id);
  prefs.set('toolStyles', state.toolStyles);
  setTool('shape');
}

// 线条工具：箭头 / 双向箭头 / 直线
function setLinePreset(id) {
  if (!LINE_PRESETS[id]) return;
  state.linePreset = id;
  state.toolStyles.arrow.head = LINE_PRESETS[id];
  prefs.set('linePreset', id);
  prefs.set('toolStyles', state.toolStyles);
  setTool('arrow');
}

function setTool(tool) {
  commitTextEditor();
  cancelMoveMode();
  const prev = state.tool;
  state.tool = tool;
  // 裁剪模式：进入时裁剪框 = 整张图；离开时取消
  if (tool === 'crop' && prev !== 'crop') { cropPrevTool = prev; if (state.doc) initCropRect(); }
  if (tool !== 'crop') view.crop = null;
  if (tool !== 'roi' && polyDraw.pts) polyCancel();
  updateCropBar();
  if (tool !== 'select' && tool !== 'lasso') clearSelection(true);
  setHover(null, null);
  updateToolUI();
  updatePanel();
  updateCursor();
  renderHints();
  requestRender();
}

function updateCursor() {
  const c = view.canvas;
  if (!c) return;
  if (input.moveMode || state.gridMove || state.plateMode === 'move') c.style.cursor = 'move';
  else if (state.plateMode === 'pick') c.style.cursor = 'pointer';
  else if (input.hoverCursor) c.style.cursor = input.hoverCursor;
  else if (state.tool === 'pan') c.style.cursor = input.gesture && input.gesture.mode === 'pan' ? 'grabbing' : 'grab';
  else if (state.tool === 'select') c.style.cursor = 'default';
  else if (state.tool === 'text') c.style.cursor = 'text';
  else c.style.cursor = 'crosshair';
}

function initInput(canvas) {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerCancel);
  canvas.addEventListener('contextmenu', onContextMenu);
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('dblclick', onDoubleClick);
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  canvas.addEventListener('pointerenter', (e) => { input.pointer = { x: e.clientX, y: e.clientY, over: true }; });
  canvas.addEventListener('pointerleave', () => { input.pointer.over = false; setHover(null, null); requestRender(); });
  window.addEventListener('keyup', (e) => { if (e.key === 'Control' || e.key === 'Meta') setCtrlHeld(false); });
  window.addEventListener('blur', () => setCtrlHeld(false));
  document.addEventListener('paste', onPaste);
}

// ---- 选择 -----------------------------------------------------------------------
function setSelection(ids, region) {
  state.selection = Array.from(new Set(ids)).filter(id => findObj(id));
  view.insetPart = 'box';
  state.region = region === undefined ? state.region : region;
  updatePanel();
  updateSelectionStatus();
  refreshAiPanel();
  requestRender();
}

function clearSelection(silent) {
  state.selection = [];
  state.region = null;
  if (!silent) { updatePanel(); updateSelectionStatus(); refreshAiPanel(); requestRender(); }
}

// 对象的代表点：标记 = 中心；其它 = 包围盒中心
function anchorOf(o, opts) {
  if (o.type === 'marker') return { x: o.x, y: o.y };
  const b = objectBounds(o, opts);
  return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
}

function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function selectInPolygon(poly, additive) {
  const opts = drawOptions();
  const ids = state.doc.objects.filter(o => { if (o.locked) return false; const a = anchorOf(o, opts); return pointInPolygon(a.x, a.y, poly); }).map(o => o.id);
  setSelection(additive ? state.selection.concat(ids) : ids, poly);
}

const rectPoly = (a, b) => [{ x: a.x, y: a.y }, { x: b.x, y: a.y }, { x: b.x, y: b.y }, { x: a.x, y: b.y }];

// ---- 右键菜单“移动”：对象跟随指针，左键单击放下，Esc / 右键取消 ----------------------
function startMoveMode(ids) {
  const objs = ids.map(findObj).filter(Boolean);
  if (!objs.length) return;
  const origin = screenToImage(input.pointer.x, input.pointer.y);
  input.moveMode = { ids: objs.map(o => o.id), origin, before: objs.map(o => clone(positionOf(o))) };
  toast(t('moveModeHint'), 4000);
  updateCursor();
}

function updateMoveMode(p) {
  const m = input.moveMode;
  const dx = p.x - m.origin.x, dy = p.y - m.origin.y;
  m.ids.forEach((id, i) => {
    const o = findObj(id);
    if (o) Object.assign(o, translated(Object.assign(clone(o), m.before[i]), dx, dy));
  });
  requestRender();
}

function commitMoveMode() {
  const m = input.moveMode;
  input.moveMode = null;
  const mods = m.ids.map((id, i) => {
    const o = findObj(id);
    if (!o) return null;
    const after = positionOf(o);
    Object.assign(o, m.before[i]);
    return { id, after, before: m.before[i] };
  }).filter(Boolean);
  modifyObjects(mods, 'move');
  updateCursor();
}

function cancelMoveMode() {
  const m = input.moveMode;
  if (!m) return;
  input.moveMode = null;
  m.ids.forEach((id, i) => { const o = findObj(id); if (o) Object.assign(o, m.before[i]); });
  updateCursor();
  requestRender();
}

// ---- 悬停与 Ctrl 快速选择 ----------------------------------------------------------
function setHover(id, cursor) {
  if (view.hoverId !== id) { view.hoverId = id; requestRender(); }
  if (input.hoverCursor !== cursor) { input.hoverCursor = cursor; updateCursor(); }
}

function setCtrlHeld(on) {
  if (input.ctrlHeld === on) return;
  input.ctrlHeld = on;
  if (!on) setHover(null, null);
  else if (input.pointer.over) updateHover(input.pointer.x, input.pointer.y, true);
  updateCursor();
  requestRender();
}

const selectLike = (quick) => quick || state.tool === 'select' || state.tool === 'lasso';

// 选择类操作时：悬停在手柄上显示调整光标，在对象上高亮并显示移动光标
function updateHover(clientX, clientY, quick) {
  if (state.doc && state.tool === 'crop' && view.crop) {
    const p = screenToImage(clientX, clientY);
    const h = hitHandle(frameHandles(cropFrame(), state.view.scale), p.x, p.y, state.view.scale);
    const c = normalizedCrop();
    const inside = p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h;
    setHover(null, h ? h.cursor : inside ? 'move' : 'crosshair');
    return;
  }
  if (!state.doc || !selectLike(quick)) { setHover(null, null); return; }
  const p = screenToImage(clientX, clientY);
  const fr = currentFrame();
  const h = fr && hitHandle(fr.handles, p.x, p.y, state.view.scale);
  if (h) { setHover(null, h.cursor); return; }
  const hit = hitTest(p.x, p.y);
  const part = hit && hit.type === 'inset' ? insetPartAt(hit, p.x, p.y, 5 / state.view.scale) : null;
  if (part !== input.hoverPart) { input.hoverPart = part; requestRender(); }
  setHover(hit ? hit.id : null, hit ? (hit.locked ? 'not-allowed' : 'move') : null);
}

function liveSizeLabel(objs, f) {
  const o = objs[0];
  const fmt = (v) => (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10);
  if (f.kind === 'line') return fmtLen(Math.hypot(o.x2 - o.x1, o.y2 - o.y1));
  if (o.type === 'roi') { const b = roiBounds(o); return `${fmtLen(b.w)} × ${fmtLen(b.h)} · ${fmtArea(roiArea(o))}`; }
  if (f.kind === 'marker') { const d = markerDims(o, findCat(o.cat), drawOptions()); return `${fmt(d.w)} × ${fmt(d.h)} px`; }
  if (f.kind === 'box') return `${scaleOf(state.doc) ? fmtLen(o.w) + ' × ' + fmtLen(o.h) : `${fmt(o.w)} × ${fmt(o.h)} px`}${o.rot ? ` · ${Math.round(o.rot * 180 / Math.PI)}°` : ''}`;
  if (f.kind === 'inset') return `${fmt(o.sw)} × ${fmt(o.sh)} px → ×${Math.round(insetMag(o) * 10) / 10}`;
  if (f.kind === 'text') return `${fmt(o.style.fontSize)}`;
  const nf = frameOf(objs, drawOptions());
  return `${fmt(nf.w)} × ${fmt(nf.h)} px`;
}

// ---- 指针事件 -------------------------------------------------------------------
function onPointerDown(e) {
  if (!state.doc) return;
  if (e.pointerType === 'touch') {
    input.touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (input.touches.size === 2) { startPinch(); return; }
    if (input.touches.size > 2) return;
  }
  if (e.button === 2) return;               // 右键交给 contextmenu 处理
  // 手机：右侧面板是覆盖在图片上的抽屉，点图片 = 先收起抽屉（不加点）
  if (document.body.classList.contains('mobile') && sidePanelOpen()) { setSidePanel(false); return; }
  hideContextMenu();
  if (input.moveMode) { if (e.button === 0) commitMoveMode(); return; }
  if (isCountPopupOpen()) { hideCountPopup(); return; }   // 点击任意处关闭计数面板，不额外添加标记
  if (commitTextEditor()) return;           // 点击别处 = 完成文字输入

  const p = screenToImage(e.clientX, e.clientY);
  // 移动网格：拖动平移整个网格
  // 平板分区：移动 / 改半径 / 旋转，或点选扇区
  if (platePointerDown(e, p)) { updateCursor(); return; }
  if (state.gridMove && e.button === 0 && gridOn(state.doc)) {
    const gr = gridOf(state.doc);
    input.gesture = { id: e.pointerId, type: e.pointerType, button: 0, t0: performance.now(), startX: e.clientX, startY: e.clientY,
      start: p, last: p, moved: false, mode: 'gridMove', gridBefore: clone(state.doc.grid), ox0: +gr.ox || 0, oy0: +gr.oy || 0 };
    try { view.canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    updateCursor();
    return;
  }
  // 逐格计数：单击哪一格，哪一格就成为当前格
  if (state.cellMode && e.button === 0) {
    const cell = cellOf(state.doc, p.x, p.y);
    if (cell) setCurrentCell(cell.c, cell.r, false);
  }
  const g = {
    id: e.pointerId, type: e.pointerType, button: e.button, t0: performance.now(),
    startX: e.clientX, startY: e.clientY, start: p, last: p,
    moved: false, mode: null, shift: e.shiftKey
  };
  const panRequested = e.button === 1 || state.tool === 'pan';
  const quick = (e.ctrlKey || e.metaKey) && e.button === 0 && e.pointerType !== 'touch';
  const fr = !panRequested && selectLike(quick) ? currentFrame() : null;
  const handle = fr && hitHandle(fr.handles, p.x, p.y, state.view.scale);
  if (panRequested) g.mode = 'pan';
  else if (state.tool === 'crop') {
    // 裁剪：拖手柄调整、框内拖动移动、框外拖动重新画
    if (!view.crop) initCropRect();
    const f = cropFrame();
    const h = hitHandle(frameHandles(f, state.view.scale), p.x, p.y, state.view.scale);
    const c = normalizedCrop();
    g.cropStart = c;
    if (h) { g.mode = 'cropHandle'; g.handle = h; g.frame = f; }
    else if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) g.mode = 'cropMove';
    else g.mode = 'cropNew';
  }
  else if (handle) {
    // 拖动引导框的手柄：缩放 / 拉伸 / 旋转 / 移动端点
    g.mode = 'handle';
    g.handle = handle;
    g.frame = fr.f;
    g.objs = fr.objs;
    g.snaps = fr.objs.map(o => clone(o));
  }
  else if (state.tool === 'marker' && !quick && e.pointerType !== 'touch') {
    // 鼠标/触控板：按下的瞬间就加点（或 Shift 删除），按住期间的移动一律忽略。
    // 这样“一指移动光标、另一指按下”时即使光标还在动，也不会丢点。
    if (state.selection.length) clearSelection();
    if (e.shiftKey) deleteNearestMarker(p); else addMarkerAt(p);
    g.mode = 'done';
  } else if (state.tool === 'roi' && state.roiPreset === 'poly' && !quick) {
    // 多边形计数区域：逐点单击，单击起点 / 双击 / Enter 闭合
    polyAddPoint(p);
    g.mode = 'done';
  } else if (state.tool === 'select' || quick) {
    const hit = hitTest(p.x, p.y);
    if (hit && e.shiftKey) {
      // Shift+单击：加入/移出选择
      const sel = state.selection.includes(hit.id) ? state.selection.filter(id => id !== hit.id) : state.selection.concat(hit.id);
      setSelection(sel);
      g.mode = 'done';
    } else if (hit && hit.locked) {
      setSelection([hit.id], null);   // 锁定的对象只能选中，不能拖动
      g.mode = 'done';
    } else if (hit) {
      if (!state.selection.includes(hit.id)) setSelection([hit.id], null);
      if (hit.type === 'inset') {
        // 局部放大插图：点在放大框上 → 编辑放大框；点在源区域上 → 编辑源区域
        view.insetPart = insetPartAt(hit, p.x, p.y, 5 / state.view.scale) || 'box';
        if (state.selection.length === 1) g.part = view.insetPart;
      }
      g.mode = 'move';
      g.objs = state.selection.map(findObj).filter(Boolean);
      g.before = g.objs.map(o => clone(positionOf(o)));
    } else {
      g.mode = 'rubber';
    }
  } else if (state.tool === 'lasso') {
    g.mode = 'lasso';
    view.lassoPts = [p];
  } else if (state.tool === 'text') {
    const hit = hitTest(p.x, p.y, o => o.type === 'text');
    g.mode = 'text';
    g.hitText = hit;
  } else {
    g.mode = state.tool; // marker（触摸屏）/ arrow / rect / ellipse
  }
  input.gesture = g;
  try { view.canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  if (e.pointerType === 'touch') {
    g.longPress = setTimeout(() => {
      if (input.gesture === g && !g.moved) {
        g.cancelled = true;
        view.draft = null;
        onContextMenu({ preventDefault() {}, clientX: e.clientX, clientY: e.clientY });
      }
    }, LONG_PRESS_MS);
  }
  updateCursor();
}

let coordsPending = null;
function onPointerMove(e) {
  input.pointer = { x: e.clientX, y: e.clientY, over: true };
  if (state.doc) {
    // 坐标显示合并到下一帧更新，避免每次指针移动都改动页面
    if (!coordsPending) requestAnimationFrame(() => { if (state.doc && coordsPending) updateCoords(coordsPending); coordsPending = null; });
    coordsPending = screenToImage(e.clientX, e.clientY);
  }
  if (input.moveMode && state.doc) { updateMoveMode(screenToImage(e.clientX, e.clientY)); return; }
  if (!input.gesture && e.pointerType !== 'touch') updateHover(e.clientX, e.clientY, e.ctrlKey || e.metaKey);
  if (!input.gesture && state.doc) {
    if (polyDraw.pts) polyPreview(screenToImage(e.clientX, e.clientY));
    if (state.loupe.on || gridOn(state.doc)) requestRender();   // 放大镜跟随光标；网格高亮光标所在格
  }
  if (e.pointerType === 'touch' && input.touches.has(e.pointerId)) {
    input.touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (input.pinch) { updatePinch(); return; }
  }
  const g = input.gesture;
  if (!g || g.id !== e.pointerId || g.cancelled || g.mode === 'done') return;
  const p = screenToImage(e.clientX, e.clientY);
  const dist = Math.hypot(e.clientX - g.startX, e.clientY - g.startY);
  const tapLike = g.mode === 'marker' || g.mode === 'text';
  if (!g.moved && dist > (tapLike ? TAP_MAX_MOVE : CLICK_SLOP)) {
    g.moved = true;
    if (g.longPress) clearTimeout(g.longPress);
    // 鼠标在文字工具下拖动 = 拖出固定大小的文字框；触摸屏标记/文字工具下拖动 = 平移画面
    if (g.mode === 'text' && g.type !== 'touch' && !g.hitText) g.mode = 'textBox';
    else if (tapLike) g.mode = 'pan';
    updateCursor();
  }
  if (!g.moved) return;
  const shift = e.shiftKey;
  switch (g.mode) {
    case 'textBox': {
      const x = Math.min(g.start.x, p.x), y = Math.min(g.start.y, p.y);
      view.draft = { type: 'text', x, y, w: Math.abs(p.x - g.start.x), h: Math.abs(p.y - g.start.y), text: '',
        style: Object.assign({}, state.toolStyles.text, { background: 'frame', borderColor: '#00e5ff', autoFit: false }) };
      requestRender();
      return;
    }
    case 'plateEdit':
      g.shift = e.shiftKey;
      platePointerMove(g, p);
      return;
    case 'gridMove': {
      const gr = gridOf(state.doc), { width, height } = state.doc.image, sz = Math.max(2, gr.size);
      state.doc.grid.ox = clamp(g.ox0 + p.x - g.start.x, -sz + 1, width - 1);
      state.doc.grid.oy = clamp(g.oy0 + p.y - g.start.y, -sz + 1, height - 1);
      updateCellBar();
      requestRender();
      return;
    }
    case 'pan':
      state.view.tx += (p.x - g.last.x) * state.view.scale;
      state.view.ty += (p.y - g.last.y) * state.view.scale;
      // 平移后图片坐标系移动，重新计算当前点
      g.last = screenToImage(e.clientX, e.clientY);
      requestRender();
      return;
    case 'move': {
      const dx = p.x - g.start.x, dy = p.y - g.start.y;
      g.objs.forEach((o, i) => Object.assign(o, translated(Object.assign(clone(o), g.before[i]), dx, dy, g.part)));
      requestRender();
      break;
    }
    case 'cropHandle':
      dragCropHandle(g, p, shift);
      updateCropBar();
      requestRender();
      break;
    case 'cropMove': {
      const { width, height } = state.doc.image;
      const s0 = g.cropStart;
      view.crop = { x: clamp(s0.x + p.x - g.start.x, 0, width - s0.w), y: clamp(s0.y + p.y - g.start.y, 0, height - s0.h), w: s0.w, h: s0.h };
      updateCropBar();
      requestRender();
      break;
    }
    case 'cropNew': {
      const { width, height } = state.doc.image;
      const a = { x: clamp(g.start.x, 0, width), y: clamp(g.start.y, 0, height) };
      const b = { x: clamp(p.x, 0, width), y: clamp(p.y, 0, height) };
      view.crop = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) };
      updateCropBar();
      requestRender();
      break;
    }
    case 'roi': {
      let w = p.x - g.start.x, h = p.y - g.start.y;
      if (shift) { const m = Math.max(Math.abs(w), Math.abs(h)); w = Math.sign(w || 1) * m; h = Math.sign(h || 1) * m; }
      view.draft = {
        type: 'roi', kind: state.roiPreset === 'ellipse' ? 'ellipse' : 'rect', rot: 0, name: nextRoiName(),
        x: Math.min(g.start.x, g.start.x + w), y: Math.min(g.start.y, g.start.y + h), w: Math.abs(w), h: Math.abs(h),
        style: { color: nextRoiColor() }
      };
      requestRender();
      break;
    }
    case 'measure': {
      let ex = p.x, ey = p.y;
      if (shift) ({ x: ex, y: ey } = snapAngle(g.start, p));
      view.draft = { type: 'measure', x1: g.start.x, y1: g.start.y, x2: ex, y2: ey,
        style: state.measurePreset === 'calibrate' ? { color: '#00e5ff', width: 2 } : clone(state.toolStyles.measure) };
      requestRender();
      break;
    }
    case 'inset': {
      // 拖出要放大的源区域；Shift = 正方形
      let w = p.x - g.start.x, h = p.y - g.start.y;
      if (shift) { const m = Math.max(Math.abs(w), Math.abs(h)); w = Math.sign(w || 1) * m; h = Math.sign(h || 1) * m; }
      view.selRect = rectPoly(g.start, { x: g.start.x + w, y: g.start.y + h });
      requestRender();
      break;
    }
    case 'handle': {
      const opts = drawOptions();
      g.objs.forEach((o, i) => Object.assign(o, clone(g.snaps[i])));
      applyHandleDrag(g.objs, g.snaps, g.frame, g.handle, p, opts, { shift: shift });
      view.liveLabel = { text: liveSizeLabel(g.objs, g.frame), x: e.clientX, y: e.clientY };
      requestRender();
      break;
    }
    case 'shape': {
      const pr = SHAPE_PRESETS[state.shapePreset] || SHAPE_PRESETS.rect;
      let w = p.x - g.start.x, h = p.y - g.start.y;
      if (pr.lock !== shift) {   // 正方形/圆形默认等比；Shift 反转
        const m = Math.max(Math.abs(w), Math.abs(h));
        w = Math.sign(w || 1) * m;
        h = Math.sign(h || 1) * (pr.kind === 'triangle' ? m * 0.866 : m);
      }
      view.draft = {
        type: 'shape', kind: pr.kind, rot: 0,
        x: Math.min(g.start.x, g.start.x + w), y: Math.min(g.start.y, g.start.y + h), w: Math.abs(w), h: Math.abs(h),
        style: clone(state.toolStyles.shape)
      };
      requestRender();
      break;
    }
    case 'rubber':
      view.selRect = rectPoly(g.start, p);
      requestRender();
      break;
    case 'lasso': {
      const last = view.lassoPts[view.lassoPts.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) * state.view.scale > 2) view.lassoPts.push(p);
      requestRender();
      break;
    }
    case 'arrow': {
      let ex = p.x, ey = p.y;
      if (shift) ({ x: ex, y: ey } = snapAngle(g.start, p));
      view.draft = { type: 'arrow', x1: g.start.x, y1: g.start.y, x2: ex, y2: ey, style: clone(state.toolStyles.arrow) };
      requestRender();
      break;
    }
    case 'rect': case 'ellipse': {
      let w = p.x - g.start.x, h = p.y - g.start.y;
      if (shift) { const m = Math.max(Math.abs(w), Math.abs(h)); w = Math.sign(w || 1) * m; h = Math.sign(h || 1) * m; }
      view.draft = {
        type: g.mode, x: Math.min(g.start.x, g.start.x + w), y: Math.min(g.start.y, g.start.y + h),
        w: Math.abs(w), h: Math.abs(h), style: clone(state.toolStyles[g.mode])
      };
      requestRender();
      break;
    }
  }
  g.last = p;
}

function onPointerUp(e) {
  if (e.pointerType === 'touch') {
    input.touches.delete(e.pointerId);
    if (input.pinch) { if (input.touches.size < 2) input.pinch = null; return; }
  }
  const g = input.gesture;
  if (!g || g.id !== e.pointerId) return;
  input.gesture = null;
  if (g.longPress) clearTimeout(g.longPress);
  try { view.canvas.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  updateCursor();
  if (g.cancelled) { view.draft = null; view.selRect = null; view.lassoPts = null; requestRender(); return; }
  const p = g.start;
  const minScreen = 3 / state.view.scale;

  switch (g.mode) {
    case 'plateEdit':
      platePointerUp(g);
      break;
    case 'gridMove':
      if (g.moved) {
        const after = clone(state.doc.grid);
        after.ox = Math.round(after.ox * 100) / 100; after.oy = Math.round(after.oy * 100) / 100;
        state.doc.grid = clone(g.gridBefore);
        setDocProp('grid', after, g.gridBefore);
      }
      break;
    case 'marker':   // 触摸屏
      if (!g.moved) {
        if (e.shiftKey || g.shift) deleteNearestMarker(p);
        else addMarkerAt(p);
      }
      break;
    case 'text':
      if (!g.moved) {
        if (g.hitText) openTextEditor(g.hitText);
        else openTextEditor(null, p);
      }
      break;
    case 'textBox': {
      const d = view.draft;
      view.draft = null;
      const min = 12 / state.view.scale;
      if (d && d.w >= min) openTextEditor(null, { x: d.x, y: d.y }, { w: round2(d.w), h: d.h >= min ? round2(d.h) : 0 });
      else openTextEditor(null, p);
      break;
    }
    case 'handle': {
      view.liveLabel = null;
      if (g.moved) {
        const mods = g.objs.map((o, i) => {
          const { before, after } = diffProps(g.snaps[i], o);
          Object.assign(o, clone(g.snaps[i]));
          return { id: o.id, before, after };
        });
        modifyObjects(mods, 'transform');
      }
      break;
    }
    case 'cropHandle': case 'cropMove': case 'cropNew': {
      const c = normalizedCrop();
      if (!c || c.w < 2 || c.h < 2) view.crop = g.cropStart;
      updateCropBar();
      break;
    }
    case 'roi': {
      const d = view.draft;
      view.draft = null;
      if (g.moved && d && d.w > minScreen && d.h > minScreen) {
        const id = addObject({ type: 'roi', kind: d.kind, x: d.x, y: d.y, w: d.w, h: d.h, rot: 0, name: d.name, style: d.style });
        setTool('select');
        setSelection([id], null);
      }
      break;
    }
    case 'measure': {
      const d = view.draft;
      view.draft = null;
      if (g.moved && d && measureLen(d) > minScreen) {
        if (state.measurePreset === 'calibrate') openCalibration(measureLen(d));
        else addObject({ type: 'measure', x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2, style: d.style });
      }
      break;
    }
    case 'inset': {
      const poly = view.selRect;
      view.selRect = null;
      if (g.moved && poly) {
        const { width, height } = state.doc.image;
        const x0 = clamp(Math.min(poly[0].x, poly[2].x), 0, width), x1 = clamp(Math.max(poly[0].x, poly[2].x), 0, width);
        const y0 = clamp(Math.min(poly[0].y, poly[2].y), 0, height), y1 = clamp(Math.max(poly[0].y, poly[2].y), 0, height);
        if (x1 - x0 > minScreen && y1 - y0 > minScreen) createInset({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
      }
      break;
    }
    case 'shape': {
      const d = view.draft;
      view.draft = null;
      if (g.moved && d && d.w > minScreen && d.h > minScreen) {
        const id = addObject({ type: 'shape', kind: d.kind, x: d.x, y: d.y, w: d.w, h: d.h, rot: 0, style: d.style });
        if (e.ctrlKey || e.metaKey) setSelection([id], null);
      }
      break;
    }
    case 'move':
      if (g.moved) {
        const mods = g.objs.map((o, i) => {
          const after = positionOf(o);
          Object.assign(o, g.before[i]);           // 先还原，再通过命令执行（进入撤回栈）
          return { id: o.id, after, before: g.before[i] };
        });
        modifyObjects(mods, 'move');
      }
      break;
    case 'rubber': {
      const poly = view.selRect;
      view.selRect = null;
      if (g.moved && poly) selectInPolygon(poly, g.shift);
      else if (!g.shift) clearSelection();
      break;
    }
    case 'lasso': {
      const pts = view.lassoPts || [];
      view.lassoPts = null;
      if (g.moved && pts.length >= 3) selectInPolygon(pts, g.shift);
      else if (!g.shift) clearSelection();
      break;
    }
    case 'arrow': {
      const d = view.draft;
      view.draft = null;
      if (g.moved && d && Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > minScreen) {
        addObject({ type: 'arrow', x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2, style: d.style });
      }
      break;
    }
    case 'rect': case 'ellipse': {
      const d = view.draft;
      view.draft = null;
      if (g.moved && d && d.w > minScreen && d.h > minScreen) {
        addObject({ type: d.type, x: d.x, y: d.y, w: d.w, h: d.h, style: d.style });
      }
      break;
    }
  }
  requestRender();
}

function onPointerCancel(e) {
  input.touches.delete(e.pointerId);
  if (input.touches.size < 2) input.pinch = null;
  const g = input.gesture;
  if (g && g.id === e.pointerId) {
    if (g.longPress) clearTimeout(g.longPress);
    if (g.mode === 'move' && g.moved) g.objs.forEach((o, i) => Object.assign(o, g.before[i]));
    if (g.mode === 'handle') g.objs.forEach((o, i) => Object.assign(o, clone(g.snaps[i])));
    if (g.cropStart) { view.crop = g.cropStart; updateCropBar(); }
    view.liveLabel = null;
    input.gesture = null;
    view.draft = null;
    view.selRect = null;
    view.lassoPts = null;
    requestRender();
  }
}

function snapAngle(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  const step = Math.PI / 12; // 15°
  const ang = Math.round(Math.atan2(dy, dx) / step) * step;
  return { x: a.x + len * Math.cos(ang), y: a.y + len * Math.sin(ang) };
}

// ---- 触摸屏双指缩放 ---------------------------------------------------------------
function startPinch() {
  const g = input.gesture;
  if (g) {
    if (g.longPress) clearTimeout(g.longPress);
    if (g.mode === 'move' && g.moved) g.objs.forEach((o, i) => Object.assign(o, g.before[i]));
    input.gesture = null;
    view.draft = null;
  }
  const [a, b] = Array.from(input.touches.values());
  input.pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}
function updatePinch() {
  const [a, b] = Array.from(input.touches.values());
  if (!a || !b) return;
  const dist = Math.hypot(a.x - b.x, a.y - b.y);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const r = view.rect;
  state.view.tx += mx - input.pinch.mx;
  state.view.ty += my - input.pinch.my;
  if (input.pinch.dist > 0) zoomAt(dist / input.pinch.dist, mx - r.left, my - r.top);
  input.pinch = { dist, mx, my };
  requestRender();
}

// ---- 右键 / 滚轮 / 双击 -----------------------------------------------------------
// 右键 / 双指轻点：点在对象上 → 对象菜单（复制 / 删除 / 移动 / 改类别）；
// 点在选区内 → 选区菜单；点在空白处 → 计数结果
function onContextMenu(e) {
  e.preventDefault();
  if (!state.doc) return;
  if (input.moveMode) { cancelMoveMode(); return; }
  if (input.gesture && input.gesture.moved) return;
  commitTextEditor();
  hideCountPopup();
  const p = screenToImage(e.clientX, e.clientY);
  const hit = hitTest(p.x, p.y);
  if (hit) {
    if (!state.selection.includes(hit.id)) setSelection([hit.id], null);
    showContextMenu(e.clientX, e.clientY);
    return;
  }
  if (state.selection.length > 1 && state.region && pointInPolygon(p.x, p.y, state.region)) {
    showContextMenu(e.clientX, e.clientY);
    return;
  }
  showCountPopup(e.clientX, e.clientY);
}

function onWheel(e) {
  e.preventDefault();
  if (!state.doc) return;
  const r = view.rect;
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? view.cssH : 1;
  if (e.altKey && state.loupe.on) { cycleLoupe(e.deltaY < 0 ? 1 : -1); return; }   // Alt+滚轮：放大镜倍数
  if (e.ctrlKey || e.metaKey) {
    // 触控板双指捏合在浏览器中表现为 Ctrl+滚轮
    const d = clamp(e.deltaY * k, -30, 30);
    zoomAt(Math.exp(-d * 0.01), e.clientX - r.left, e.clientY - r.top);
  } else {
    let dx = e.deltaX * k, dy = e.deltaY * k;
    if (e.shiftKey && !dx) { dx = dy; dy = 0; }
    state.view.tx -= dx;
    state.view.ty -= dy;
    requestRender();
  }
}

function onDoubleClick(e) {
  if (state.doc && state.tool === 'crop') { applyCrop(); return; }   // 双击 = 应用裁剪
  if (polyDraw.pts) { polyFinish(); return; }                         // 双击 = 闭合多边形区域
  if (!state.doc || state.tool !== 'select') return;
  const p = screenToImage(e.clientX, e.clientY);
  const hit = hitTest(p.x, p.y, o => o.type === 'text');
  if (hit) openTextEditor(hit);
}

// ---- 标记操作 -------------------------------------------------------------------
// 点在覆盖物上：放大框内 → 换算到源区域中的对应位置；插入的图片上 → 不加点（会被遮住）
function resolveMarkPoint(p) {
  const objs = state.doc.objects;
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (o.type === 'inset' && p.x >= o.x && p.x <= o.x + o.w && p.y >= o.y && p.y <= o.y + o.h) {
      return { x: o.sx + (p.x - o.x) * o.sw / o.w, y: o.sy + (p.y - o.y) * o.sh / o.h, k: o.sw / o.w };
    }
    if (o.type === 'image' && hitImageObj(o, p.x, p.y, 0)) return null;
  }
  return p;
}

function addMarkerAt(p0) {
  const p = resolveMarkPoint(p0);
  if (!p) { toast(t('coveredByImage')); return; }
  delete p.k;
  const { width, height } = state.doc.image;
  if (p.x < 0 || p.y < 0 || p.x > width || p.y > height) return; // 只能标在图片范围内
  if (!state.showAnnotations) toggleAnnotations(true);
  if (!findCat(state.currentCat)) state.currentCat = state.doc.categories[0].id;
  addObject({ type: 'marker', x: round2(p.x), y: round2(p.y), cat: state.currentCat });
}
const round2 = (v) => Math.round(v * 100) / 100;

function deleteNearestMarker(p0) {
  const p = resolveMarkPoint(p0);
  if (!p) return;
  const opts = drawOptions();
  let best = null, bestD = Infinity;
  for (const o of state.doc.objects) {
    if (o.type !== 'marker') continue;
    const d = Math.hypot(o.x - p.x, o.y - p.y);
    if (d < bestD) { bestD = d; best = o; }
  }
  if (!best) return;
  const cat = findCat(best.cat);
  // 仅删除光标附近（标记半径 + 20 屏幕像素以内）的标记，避免误删远处的点
  const limit = (cat ? opts.markerD(cat) / 2 : 0) + 20 / state.view.scale * (p.k || 1);
  if (bestD <= limit) {
    removeObjects([best.id]);
    toast(t('deletedNearest'));
  }
}

function deleteSelected() {
  if (state.selection.length) {
    removeObjects(state.selection.slice());
    clearSelection();
  }
}

// ---- 文字编辑框 ------------------------------------------------------------------
// 编辑时在文字框上方显示格式栏：字号、字体、粗体/斜体/下划线/删除线、对齐、颜色、背景。
// Enter 换行；Ctrl+Enter（或单击别处）完成；Esc 取消。
// 快捷键（与 Word 相同）：Ctrl+B/I/U，Ctrl+Shift+> / <（字号），Ctrl+L/E/R/J（左/中/右/两端对齐）。
const textEdit = { el: null, obj: null, pos: null, box: null, style: null, active: false };
const TEXT_SIZES = [8, 10, 12, 14, 16, 18, 20, 24, 28, 32, 36, 48, 60, 72, 96, 120, 160, 200];

function openTextEditor(obj, pos, box) {
  const ta = textEdit.el;
  textEdit.obj = obj;
  textEdit.pos = obj ? { x: obj.x, y: obj.y } : pos;
  textEdit.box = obj ? (obj.w > 0 ? { w: obj.w, h: obj.h || 0 } : null) : (box || null);
  textEdit.style = clone(obj ? obj.style : state.toolStyles.text);
  textEdit.active = true;
  view.hiddenId = obj ? obj.id : null;
  ta.value = obj ? obj.text : '';
  ta.hidden = false;
  styleTextarea();
  showTextToolbar();
  requestRender();
  ta.focus();
  setTimeout(() => { if (textEdit.active) ta.focus(); }, 0);
}

// 按当前样式设置编辑框外观（与画在图上的文字一致）
function styleTextarea() {
  const ta = textEdit.el;
  const s = textEdit.style;
  const unit = unitOf(state.doc);
  const sc = state.view.scale;
  const probe = { text: ta.value || ' ', style: s, w: textEdit.box ? textEdit.box.w : 0, h: textEdit.box ? textEdit.box.h : 0 };
  const L = textLayout(probe, unit);
  const fs = L.fs * sc;
  const stage = ta.parentElement.getBoundingClientRect();
  const c = imageToClient(textEdit.pos.x, textEdit.pos.y);
  ta.style.left = (c.x - stage.left) + 'px';
  ta.style.top = (c.y - stage.top) + 'px';
  ta.style.fontSize = Math.max(fs, 6) + 'px';
  ta.style.fontFamily = TEXT_FAMILIES[s.fontFamily] || FONT_FAMILY;
  ta.style.fontWeight = s.bold ? 'bold' : 'normal';
  ta.style.fontStyle = s.italic ? 'italic' : 'normal';
  ta.style.textDecoration = [s.underline ? 'underline' : '', s.strike ? 'line-through' : ''].filter(Boolean).join(' ') || 'none';
  ta.style.textAlign = s.align || 'left';
  ta.style.textAlignLast = s.align === 'justify' ? 'left' : '';
  ta.style.lineHeight = String(textLineH(s));
  ta.style.padding = (L.pad * sc) + 'px';
  ta.style.color = s.color;
  const bg = s.background || 'none';
  ta.style.background = (bg === 'fill' || bg === 'fillframe') && s.bgColor ? s.bgColor
    : luminance(s.color) > 0.35 ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.75)';
  if (textEdit.box) {
    ta.style.whiteSpace = 'pre-wrap';
    ta.style.width = (textEdit.box.w * sc) + 'px';
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight, (textEdit.box.h || 0) * sc) + 'px';
  } else {
    ta.style.whiteSpace = 'pre';
    autoSizeTextarea();
  }
  positionTextToolbar();
}

function autoSizeTextarea() {
  const ta = textEdit.el;
  if (textEdit.box) { styleTextareaHeight(); return; }
  ta.style.height = 'auto';
  ta.style.width = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  ta.style.width = Math.max(ta.scrollWidth + 4, 120) + 'px';
  positionTextToolbar();
}
function styleTextareaHeight() {
  const ta = textEdit.el;
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, (textEdit.box.h || 0) * state.view.scale) + 'px';
}

// ---- 编辑时的格式栏 ----
function showTextToolbar() {
  const bar = $('#textToolbar');
  if (!bar) return;
  const s = textEdit.style;
  const al = s.align || 'left';
  const bg = s.background || 'none';
  bar.innerHTML = `
    <button data-tt="size-" title="${escapeHtml(t('ttSmaller'))} (Ctrl+Shift+<)">A−</button>
    <input data-tt="size" type="number" min="2" max="1000" step="1" value="${+s.fontSize}" list="ttSizes" title="${escapeHtml(t('fontSize'))}">
    <datalist id="ttSizes">${TEXT_SIZES.map(v => `<option value="${v}">`).join('')}</datalist>
    <button data-tt="size+" title="${escapeHtml(t('ttLarger'))} (Ctrl+Shift+>)">A+</button>
    <select data-tt="family" title="${escapeHtml(t('ttFamily'))}">${['sans', 'serif', 'mono'].map(f => `<option value="${f}"${(s.fontFamily || 'sans') === f ? ' selected' : ''}>${escapeHtml(t('ttFam_' + f))}</option>`).join('')}</select>
    <span class="tt-sep"></span>
    <button data-tt="bold" class="${s.bold ? 'active' : ''}" title="${escapeHtml(t('ttBold'))} (Ctrl+B)"><b>B</b></button>
    <button data-tt="italic" class="${s.italic ? 'active' : ''}" title="${escapeHtml(t('ttItalic'))} (Ctrl+I)"><i>I</i></button>
    <button data-tt="underline" class="${s.underline ? 'active' : ''}" title="${escapeHtml(t('ttUnderline'))} (Ctrl+U)"><u>U</u></button>
    <button data-tt="strike" class="${s.strike ? 'active' : ''}" title="${escapeHtml(t('ttStrike'))}"><s>S</s></button>
    <span class="tt-sep"></span>
    ${['left', 'center', 'right', 'justify'].map(a => `<button data-tt="align" data-v="${a}" class="${al === a ? 'active' : ''}" title="${escapeHtml(t('ttAlign_' + a))}">${ALIGN_ICONS[a]}</button>`).join('')}
    <span class="tt-sep"></span>
    <label class="tt-color" title="${escapeHtml(t('strokeColor'))}">A<input data-tt="color" type="color" value="${toHexColor(s.color)}"><i style="background:${s.color}"></i></label>
    <select data-tt="bg" title="${escapeHtml(t('textBg'))}">${['none', 'fill', 'frame', 'fillframe'].map(v => `<option value="${v}"${bg === v ? ' selected' : ''}>${escapeHtml(t(v === 'none' ? 'bgNone' : v === 'fill' ? 'bgFill' : v === 'frame' ? 'bgFrame' : 'bgFillFrame'))}</option>`).join('')}</select>
    <button data-tt="done" class="primary" title="Ctrl+Enter">✓ ${escapeHtml(t('ttDone'))}</button>
    <span class="tt-hint muted small">${escapeHtml(t('ttDoneHint'))}</span>`;
  bar.hidden = false;
  positionTextToolbar();
}

const ALIGN_ICONS = {
  left: '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 3h12M2 6.5h8M2 10h12M2 13.5h8" stroke="currentColor" stroke-width="1.6"/></svg>',
  center: '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 3h12M4 6.5h8M2 10h12M4 13.5h8" stroke="currentColor" stroke-width="1.6"/></svg>',
  right: '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 3h12M6 6.5h8M2 10h12M6 13.5h8" stroke="currentColor" stroke-width="1.6"/></svg>',
  justify: '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 3h12M2 6.5h12M2 10h12M2 13.5h12" stroke="currentColor" stroke-width="1.6"/></svg>'
};
function toHexColor(c) {
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  measureCtx.fillStyle = '#000'; measureCtx.fillStyle = c;
  const v = measureCtx.fillStyle;
  return /^#[0-9a-f]{6}$/i.test(v) ? v : '#ffffff';
}

function positionTextToolbar() {
  const bar = $('#textToolbar');
  if (!bar || bar.hidden || !textEdit.active) return;
  const ta = textEdit.el;
  const stage = ta.parentElement.getBoundingClientRect();
  const top = ta.offsetTop - bar.offsetHeight - 6;
  bar.style.left = clamp(ta.offsetLeft, 4, Math.max(4, stage.width - bar.offsetWidth - 4)) + 'px';
  bar.style.top = (top < 4 ? ta.offsetTop + ta.offsetHeight + 6 : top) + 'px';
}

function hideTextToolbar() { const bar = $('#textToolbar'); if (bar) bar.hidden = true; }

function setTextEditStyle(patch) {
  Object.assign(textEdit.style, patch);
  styleTextarea();
  showTextToolbar();
  textEdit.el.focus();
}
function stepFontSize(dir) {
  const cur = +textEdit.style.fontSize || 28;
  const next = dir > 0 ? TEXT_SIZES.find(v => v > cur) || Math.round(cur * 1.25) : [...TEXT_SIZES].reverse().find(v => v < cur) || Math.max(2, Math.round(cur * 0.8));
  setTextEditStyle({ fontSize: next, autoFit: false });
}

// 完成文字编辑。返回 true 表示此前确有编辑框处于打开状态。
function commitTextEditor(cancel) {
  if (!textEdit.active) return false;
  textEdit.active = false;
  const ta = textEdit.el;
  const text = ta.value.replace(/\s+$/, '');
  ta.hidden = true;
  hideTextToolbar();
  view.hiddenId = null;
  if (!cancel && state.doc) {
    if (textEdit.obj) {
      if (!text) removeObjects([textEdit.obj.id]);
      else {
        const after = { text };
        if (JSON.stringify(textEdit.style) !== JSON.stringify(textEdit.obj.style)) after.style = clone(textEdit.style);
        modifyObject(textEdit.obj.id, after);
      }
    } else if (text) {
      const o = { type: 'text', x: round2(textEdit.pos.x), y: round2(textEdit.pos.y), text, style: clone(textEdit.style) };
      if (textEdit.box) { o.w = textEdit.box.w; if (textEdit.box.h) o.h = textEdit.box.h; }
      addObject(o);
      // 新文字框的格式作为文字工具的默认样式
      Object.assign(state.toolStyles.text, clone(textEdit.style));
      prefs.set('toolStyles', state.toolStyles);
    }
  }
  textEdit.obj = null;
  requestRender();
  return true;
}

function initTextEditor(ta) {
  textEdit.el = ta;
  ta.addEventListener('input', autoSizeTextarea);
  ta.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (e.key === 'Enter' && mod && !e.isComposing) { e.preventDefault(); commitTextEditor(); }
    else if (e.key === 'Escape') { e.preventDefault(); commitTextEditor(true); }
    else if (mod && !e.shiftKey && ['b', 'i', 'u'].includes(k)) { e.preventDefault(); const p = { b: 'bold', i: 'italic', u: 'underline' }[k]; setTextEditStyle({ [p]: !textEdit.style[p] }); }
    else if (mod && !e.shiftKey && ['l', 'e', 'r', 'j'].includes(k)) { e.preventDefault(); setTextEditStyle({ align: { l: 'left', e: 'center', r: 'right', j: 'justify' }[k] }); }
    else if (mod && e.shiftKey && (e.key === '>' || e.key === '.' || e.key === '<' || e.key === ',')) { e.preventDefault(); stepFontSize(e.key === '>' || e.key === '.' ? 1 : -1); }
    if (!(mod && ['s', 'o'].includes(k))) e.stopPropagation();   // Ctrl+S / Ctrl+O 仍交给全局快捷键
  });
  // 焦点移到格式栏时不结束编辑
  ta.addEventListener('blur', (e) => {
    const bar = $('#textToolbar');
    if (bar && e.relatedTarget && bar.contains(e.relatedTarget)) return;
    setTimeout(() => {
      if (!textEdit.active) return;
      const a = document.activeElement;
      if (bar && a && bar.contains(a)) return;
      if (a !== ta) commitTextEditor();
    }, 0);
  });
  const bar = $('#textToolbar');
  if (!bar) return;
  bar.addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); });   // 按钮不抢焦点
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tt]');
    if (!b) return;
    const k = b.dataset.tt;
    if (k === 'done') { commitTextEditor(); return; }
    if (k === 'size+') stepFontSize(1);
    else if (k === 'size-') stepFontSize(-1);
    else if (k === 'align') setTextEditStyle({ align: b.dataset.v });
    else setTextEditStyle({ [k]: !textEdit.style[k] });
  });
  bar.addEventListener('change', (e) => {
    const el = e.target, k = el.dataset.tt;
    if (k === 'size') { const v = +el.value; if (v > 0) setTextEditStyle({ fontSize: v, autoFit: false }); }
    else if (k === 'family') setTextEditStyle({ fontFamily: el.value });
    else if (k === 'color') setTextEditStyle({ color: el.value });
    else if (k === 'bg') setTextEditStyle({ background: el.value });
  });
  bar.addEventListener('input', (e) => { if (e.target.dataset.tt === 'color') { textEdit.style.color = e.target.value; styleTextarea(); } });
  bar.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); e.target.dispatchEvent(new Event('change', { bubbles: true })); ta.focus(); }
    if (e.key === 'Escape') { e.preventDefault(); ta.focus(); }
  });
  // 离开格式栏（且不是回到编辑框）时结束编辑
  bar.addEventListener('focusout', (e) => {
    setTimeout(() => {
      if (!textEdit.active) return;
      const a = document.activeElement;
      if (a === ta || bar.contains(a)) return;
      commitTextEditor();
    }, 0);
  });
}

// ---- 键盘 -----------------------------------------------------------------------
function isTypingTarget(el) {
  return el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['range', 'checkbox', 'color', 'button', 'radio'].includes(el.type)) || el.isContentEditable);
}

function onKeyDown(e) {
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if ((e.key === 'Control' || e.key === 'Meta') && !isTypingTarget(e.target)) { setCtrlHeld(true); return; }
  if (mod && key === 's') { e.preventDefault(); saveProject(e.shiftKey); return; }
  if (mod && key === 'o') { e.preventDefault(); openFileDialog(); return; }
  if (e.key === 'F1') { e.preventDefault(); openHelp(); return; }
  if (isTypingTarget(e.target)) return;
  if (document.querySelector('dialog[open]')) return;

  if (!mod && onCellModeKey(e, key)) return;
  if (!mod && polyDraw.pts) {
    if (key === 'enter') { e.preventDefault(); polyFinish(); return; }
    if (key === 'escape') { polyCancel(); return; }
    if (key === 'backspace') { e.preventDefault(); polyUndoPoint(); return; }
  }
  if (mod) {
    if (key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (key === 'y') { e.preventDefault(); redo(); }
    else if (key === 'e') { e.preventDefault(); exportPng(); }
    else if (key === '0') { e.preventDefault(); fitView(); }
    else if (key === 'c') { e.preventDefault(); copySelection(); }
    else if (key === 'v' && e.shiftKey) {
      // Ctrl+Shift+V：剪贴板中的图片插入到当前图片中（而不是作为新图片）
      input.pasteInsert = true;
      setTimeout(() => { input.pasteInsert = false; }, 1000);
    }
    else if (key === 'a') { e.preventDefault(); if (state.doc) { if (state.tool !== 'select') setTool('select'); setSelection(state.doc.objects.map(o => o.id), null); } }
    // Ctrl+V 不拦截：由 paste 事件处理（可读取剪贴板中的图片）
    return;
  }
  if (e.altKey) return;
  if (key === ' ') {
    e.preventDefault();
    if (!e.repeat) spaceMark(e.shiftKey);
    return;
  }
  if (key === 'pageup') { e.preventDefault(); navigateImage(-1); return; }
  if (key === 'pagedown') { e.preventDefault(); navigateImage(1); return; }
  if (state.tool === 'crop' && key === 'enter') { e.preventDefault(); applyCrop(); return; }
  if (state.tool === 'crop' && key === 'escape' && !input.gesture) { cancelCrop(); return; }
  if (key === '[' && state.doc) { rotateImage(-90); return; }
  if (key === ']' && state.doc) { rotateImage(90); return; }
  if (key === 'escape' && state.plateMode) { setPlateMode(state.plateMode); return; }   // 先退出平板分区的移动 / 选扇区
  if (key === 'escape') {
    hideCountPopup();
    hideContextMenu();
    if (input.moveMode) { cancelMoveMode(); return; }
    if (input.gesture) onPointerCancel({ pointerId: input.gesture.id });
    clearSelection();
    return;
  }
  if (key === 'delete' || key === 'backspace') { e.preventDefault(); deleteSelected(); return; }
  if (e.key === '?') { e.preventDefault(); togglePanel('hints'); return; }
  if (key === 'f') { togglePanel('folders'); return; }
  if (e.key === '\\') { setSidePanel(!sidePanelOpen()); return; }
  if (key === 'i') { togglePanel('ai'); return; }
  if (key === 'h') { toggleAnnotations(); return; }
  if (key === '+' || key === '=') { zoomAt(1.25); return; }
  if (key === '-' || key === '_') { zoomAt(0.8); return; }
  if (key === 'e') { setShapePreset('ellipse'); return; }
  if (key === 'z') { toggleLoupe(); return; }
  if (key === 'g') { toggleGrid(); return; }
  if (key === 'b') { togglePanel('tools'); return; }
  if (TOOL_KEYS[key]) { setTool(TOOL_KEYS[key]); return; }
  if (/^[1-9]$/.test(key) && state.doc) {
    const cat = state.doc.categories[Number(key) - 1];
    if (cat) selectCategory(cat.id);
  }
}

function onKeyUp() { /* 保留：目前无按键松开逻辑 */ }

// 空格：在光标处加点（Shift+空格：删除光标附近最近的点）。
// 触控板上只需一根手指移动光标、另一只手按空格，避免系统对双指手势的等待。
function spaceMark(shift) {
  if (!state.doc) return;
  if (state.tool !== 'marker') { toast(t('spaceNeedsMarker')); return; }
  if (!input.pointer.over) { toast(t('spaceNeedsPointer')); return; }
  commitTextEditor();
  hideCountPopup();
  const p = screenToImage(input.pointer.x, input.pointer.y);
  if (shift) deleteNearestMarker(p); else addMarkerAt(p);
}

// Ctrl+C：有选中对象时复制这些对象；否则复制当前图片的计数结果
function copySelection() {
  if (!state.doc) return;
  const objs = state.selection.map(findObj).filter(Boolean);
  if (objs.length) {
    input.clip = clone(objs);
    toast(t('objectsCopied', { n: objs.length }));
  } else {
    copyCounts();
  }
}

// Ctrl+V：剪贴板里有图片（如截图）→ 作为新图片加入当前文件夹；否则粘贴复制的对象
function onPaste(e) {
  if (isTypingTarget(e.target) || document.querySelector('dialog[open]')) return;
  const files = e.clipboardData ? Array.from(e.clipboardData.files || []).filter(f => /^image\//.test(f.type)) : [];
  if (files.length) {
    e.preventDefault();
    if (input.pasteInsert && state.doc) { input.pasteInsert = false; insertImageFiles(files); return; }
    const named = files.map((f, i) => (f.name && f.name !== 'image.png') ? f
      : new File([f], `clipboard_${formatTime(new Date()).replace(/[: ]/g, '-')}${files.length > 1 ? '_' + (i + 1) : ''}.png`, { type: f.type }));
    addImageFiles(named);
    return;
  }
  if (!input.clip || !state.doc) return;
  e.preventDefault();
  pasteClip();
}

function pasteClip() {
  if (!input.clip || !state.doc) return;
  const d = 20 / state.view.scale;
  const objs = input.clip.map(c => {
    const o = clone(c);
    if (o.type === 'marker' && !findCat(o.cat)) o.cat = state.currentCat;
    Object.assign(o, translated(o, d, d));
    delete o.id;
    return o;
  });
  const ids = addObjects(objs, 'paste');
  input.clip = objs;   // 连续粘贴时依次错开
  if (state.tool !== 'select') setTool('select');
  setSelection(ids, null);
}

// ===== storage.js =====
// ---------------------------------------------------------------------------
// storage.js — 打开 / 保存 / 导出 / 自动备份
//
// 项目文件 xxx.mark.zip：project.json（文件夹、类别、标注、每张图的撤回历史）
//                       + images/（原始图片文件，TIFF 为解码后的 PNG）。
// 可以用任何解压软件打开查看。v1.0 的单图 .mark.json 仍可打开。
// ---------------------------------------------------------------------------
const OPEN_TYPES = [{
  description: 'Images / Projects',
  accept: {
    'image/*': ['.png', '.jpg', '.jpeg', '.bmp', '.gif', '.webp', '.tif', '.tiff'],
    'application/zip': ['.zip'],
    'application/json': ['.json']
  }
}];
const AUTOSAVE_MS = 30000;
const MIME_EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/bmp': 'bmp', 'image/webp': 'webp' };
let busySaving = false;

async function openFileDialog() {
  if (window.showOpenFilePicker) {
    try {
      const handles = await window.showOpenFilePicker({ types: OPEN_TYPES, multiple: true });
      const files = await Promise.all(handles.map(h => h.getFile()));
      await openFiles(files, handles);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      // 其它错误 → 使用传统文件选择框
    }
  }
  $('#fileInput').click();
}

// 打开若干文件：项目文件（.zip / .json）替换当前项目；图片加入当前文件夹
async function openFiles(files, handles) {
  files = Array.from(files || []).filter(Boolean);
  if (!files.length) return;
  const projects = [], images = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const head = new Uint8Array(await f.slice(0, 16).arrayBuffer());
    const handle = handles && handles[i] && handles[i].kind === 'file' ? handles[i] : null;
    if (isZip(head) || (/\.json$/i.test(f.name) && !sniffImageMime(head)) || (head[0] === 0x7b && !sniffImageMime(head))) {
      projects.push({ file: f, handle });
    } else {
      images.push(f);
    }
  }
  if (projects.length) {
    if (isDirty() && !confirm(t('confirmDiscard'))) return;
    commitTextEditor(true);
    showBusy(true);
    try {
      await openProject(projects[0].file, projects[0].handle);
    } catch (err) {
      console.error(err);
      alert(t('openFailed', { msg: err && err.message ? err.message : String(err) }));
      return;
    } finally {
      showBusy(false);
    }
  }
  if (images.length) await addImageFiles(images);
}

// 兼容旧接口
const openFile = (file, handle) => openFiles([file], [handle]);

// 读取一张图片文件 → { blob, image }
async function readImageFile(name, buf) {
  const u8 = new Uint8Array(buf);
  const mime = sniffImageMime(u8);
  if (!mime) throw new Error(t('unsupportedFile'));
  const sha256 = await sha256Hex(buf);
  let blob, note = null, outMime = mime;
  if (mime === 'image/tiff') {
    let dec;
    try { dec = await decodeTiff(buf); }
    catch (e) { throw new Error(e instanceof TiffError ? t('tiffUnsupported', { what: e.message }) : e.message); }
    const c = document.createElement('canvas');
    c.width = dec.width;
    c.height = dec.height;
    c.getContext('2d').putImageData(new ImageData(dec.rgba, dec.width, dec.height), 0, 0);
    blob = await new Promise(res => c.toBlob(res, 'image/png'));
    outMime = 'image/png';
    note = { sourceFormat: 'tiff', bitsPerSample: dec.bits, pages: dec.pages, displayStretched: dec.stretched };
    const msgs = [];
    if (dec.pages > 1) msgs.push(t('tiffPages', { n: dec.pages }));
    if (dec.stretched) msgs.push(t('tiffStretched', { bits: dec.bits }));
    if (msgs.length) setTimeout(() => toast(name + '：' + msgs.join('；'), 6000), 300);
  } else {
    blob = new Blob([u8], { type: mime });
  }
  const bmp = await decodeBlob(blob);
  const width = bmp.naturalWidth || bmp.width, height = bmp.naturalHeight || bmp.height;
  closeBitmap(bmp);
  return { blob, image: { name, width, height, mime: outMime, fileSize: buf.byteLength, sha256, sourceNote: note } };
}

// 把图片加入当前文件夹（没有文件夹时自动新建 A）。
// 按传入的顺序（即用户选择的顺序）逐张读取、编号；读取是依次进行的，不会因为快慢打乱顺序
async function addImageFiles(files, opts) {
  files = Array.from(files);
  if (opts && opts.sortByName) files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
  ensureWorkspace();
  let folder = activeFolder();
  if (!folder) {
    folder = addFolder();
    toast(t('folderCreated', { name: folder.name }), 4000);
  }
  showBusy(true);
  let first = null;
  const failed = [];
  try {
    for (const f of files) {
      try {
        const { blob, image } = await readImageFile(f.name, await f.arrayBuffer());
        const e = createEntry(folder, { blob, image });
        if (!first) first = e;
      } catch (err) {
        failed.push(f.name + '：' + (err && err.message ? err.message : err));
      }
    }
  } finally {
    showBusy(false);
  }
  if (first) {
    markStructChanged();
    await activateImage(first.id);
  }
  onWorkspaceChanged();
  if (failed.length) alert(t('openFailed', { msg: '\n' + failed.join('\n') }));
}

async function openProject(file, handle) {
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  if (isZip(u8)) {
    await loadWorkspaceZip(buf);
    state.fileHandle = handle || null;
    state.fileName = file.name;
  } else {
    await loadLegacyProject(JSON.parse(new TextDecoder().decode(u8)));
    state.fileHandle = null;
    state.fileName = null;
  }
  onWorkspaceChanged();
}

// 防御：保证 id 计数器不与已有数据冲突
function normalizeEntryData(doc, history) {
  const maxObj = Math.max(0, ...doc.objects.map(o => parseInt(String(o.id).slice(1), 10) || 0));
  doc.nextId = Math.max(doc.nextId || 1, maxObj + 1);
  const h = history && Array.isArray(history.undo)
    ? { undo: history.undo, redo: history.redo || [], nextId: history.nextId || 1 }
    : { undo: [], redo: [], nextId: 1 };
  const maxCmd = Math.max(0, ...h.undo.map(c => c.id || 0), ...h.redo.map(c => c.id || 0));
  h.nextId = Math.max(h.nextId, maxCmd + 1);
  return h;
}

// 由 project.json 数据与图片 Blob 重建工作区；getAssetBlob(assetMeta) 返回插入图片的数据
function buildWorkspace(meta, getBlob, getAssetBlob) {
  if (!meta || meta.format !== WS_FORMAT_ID) throw new Error(t('notProject'));
  if (meta.formatVersion > WS_FORMAT_VERSION) toast(t('newerVersion', { v: meta.formatVersion }), 6000);
  const ws = {
    categories: meta.categories || [], nextCatId: meta.nextCatId || 1,
    folders: meta.folders || [], nextFolderId: meta.nextFolderId || 1,
    images: {}, nextImageId: meta.nextImageId || 1,
    activeFolderId: meta.activeFolderId || null,
    assets: {}, nextAssetId: meta.nextAssetId || 1,
    stats: meta.stats || null,
    template: meta.template || null,
    tplDefaults: meta.tplDefaults || null,
    structVersion: 0, savedStructVersion: 0
  };
  localizeCatNames(ws.categories);   // 默认类别名随当前界面语言
  for (const am of meta.assets || []) {
    const blob = getAssetBlob ? getAssetBlob(am) : null;
    if (!blob) { console.warn('missing asset', am.id); continue; }
    ws.assets[am.id] = { id: am.id, name: am.name, mime: am.mime, width: am.width, height: am.height, sha256: am.sha256, blob };
  }
  const maxAsset = Math.max(0, ...Object.keys(ws.assets).map(id => parseInt(id.slice(1), 10) || 0));
  ws.nextAssetId = Math.max(ws.nextAssetId, maxAsset + 1);
  const maxCat = Math.max(0, ...ws.categories.map(c => parseInt(String(c.id).slice(1), 10) || 0));
  ws.nextCatId = Math.max(ws.nextCatId, maxCat + 1);
  for (const se of meta.images || []) {
    const blob = getBlob(se);
    if (!blob) throw new Error('missing image ' + se.file);
    const doc = se.doc;
    const history = normalizeEntryData(doc, se.history);
    doc.categories = ws.categories;
    const e = {
      id: se.id, folderId: se.folderId, no: se.no, customName: se.customName || null, done: !!se.done,
      doc, history, savedStateId: 0, view: se.view || null, blob, file: se.file
    };
    e.savedStateId = entryStateId(e);
    ws.images[e.id] = e;
  }
  // 文件夹中只保留确实存在的图片
  ws.folders.forEach(f => { f.imageIds = (f.imageIds || []).filter(id => ws.images[id]); });
  const maxImg = Math.max(0, ...Object.keys(ws.images).map(id => parseInt(id.slice(1), 10) || 0));
  ws.nextImageId = Math.max(ws.nextImageId, maxImg + 1);
  return ws;
}

async function loadWorkspaceZip(buf) {
  const files = await readZip(buf);
  const pj = files.get('project.json');
  if (!pj) throw new Error(t('notProject'));
  const meta = JSON.parse(new TextDecoder().decode(pj));
  const ws = buildWorkspace(meta, se => {
    const bytes = files.get(se.file);
    return bytes ? new Blob([bytes], { type: se.doc.image.mime }) : null;
  }, am => {
    const bytes = files.get(am.file);
    return bytes ? new Blob([bytes], { type: am.mime }) : null;
  });
  await replaceWorkspace(ws, meta.activeId);
}

// v1.0 单图项目（.mark.json，图片以 dataURL 内嵌）
async function loadLegacyProject(data) {
  if (!data || data.format !== FORMAT_ID || !data.document || !data.document.image) throw new Error(t('notProject'));
  const doc = data.document;
  const m = /^data:([^;,]+);base64,(.*)$/.exec(doc.image.dataURL || '');
  if (!m) throw new Error(t('notProject'));
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ws = newWorkspace();
  ws.categories = doc.categories;
  ws.nextCatId = Math.max(1, ...doc.categories.map(c => (parseInt(String(c.id).slice(1), 10) || 0) + 1));
  delete doc.image.dataURL;
  const prevWs = state.ws;
  state.ws = ws; // createEntry 需要
  const folder = { id: 'f' + ws.nextFolderId++, name: letterName(0), nextNo: 1, imageIds: [] };
  ws.folders.push(folder);
  ws.activeFolderId = folder.id;
  const history = normalizeEntryData(doc, data.history);
  const e = createEntry(folder, { blob: new Blob([bytes], { type: m[1] }), doc, history });
  e.savedStateId = entryStateId(e);
  state.ws = prevWs;
  await replaceWorkspace(ws, e.id);
}

function safeFileName(s) {
  return String(s).replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').trim() || 'image';
}

function projectFileName() {
  const names = state.ws ? state.ws.folders.map(f => f.name) : [];
  return safeFileName(names.join('_').slice(0, 60) || 'project') + '.mark.zip';
}

async function buildProjectZip() {
  const enc = new TextEncoder();
  const entries = orderedEntries();
  const files = [];
  for (const e of entries) {
    e.file = `images/${safeFileName(entryName(e))}_${e.id}.${MIME_EXT[e.doc.image.mime] || 'img'}`;
    files.push({ name: e.file, data: new Uint8Array(await e.blob.arrayBuffer()) });
  }
  // 插入的图片（全工作区共享）
  for (const a of Object.values(state.ws.assets || {})) {
    files.push({ name: assetFileName(a), data: new Uint8Array(await a.blob.arrayBuffer()) });
  }
  files.unshift({ name: 'project.json', data: enc.encode(JSON.stringify(serializeWorkspace())) });
  return makeZip(files);
}

async function saveProject(saveAs) {
  if (!state.ws || !orderedEntries().length || busySaving) return;
  commitTextEditor();
  busySaving = true;
  showBusy(true);
  try {
    const now = new Date().toISOString();
    for (const e of orderedEntries()) {
      if (isEntryDirty(e)) {
        e.doc.meta.modifiedAt = now;
        if (state.settings.operator) e.doc.meta.operator = state.settings.operator;
      }
    }
    const blob = await buildProjectZip();
    let result = null;
    if (state.fileHandle && !saveAs) {
      try {
        await writeToHandle(state.fileHandle, blob);
        result = { name: state.fileHandle.name, handle: state.fileHandle };
      } catch (e) { result = null; }
    }
    if (!result) {
      const suggested = (!saveAs && state.fileName) || projectFileName();
      result = await saveBlobAs(blob, suggested, { description: 'Counting project', accept: { 'application/zip': ['.zip'] } });
    }
    if (!result) return;
    state.fileHandle = result.handle;
    state.fileName = result.name;
    // 注意：保存不清空撤回/重做栈
    for (const e of orderedEntries()) e.savedStateId = entryStateId(e);
    state.ws.savedStructVersion = state.ws.structVersion;
    await clearBackup();
    onWorkspaceChanged();
    updateStatus();
    toast(t('savedToast', { name: result.name }));
  } finally {
    busySaving = false;
    showBusy(false);
  }
}

async function newProject() {
  if (isDirty() && !confirm(t('confirmDiscard'))) return;
  commitTextEditor(true);
  await clearBackup();
  state.fileHandle = null;
  state.fileName = null;
  await replaceWorkspace(null);
}
