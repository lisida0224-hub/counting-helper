  ctx.imageSmoothingEnabled = screenMag < 3;   // 放大 3 倍以上显示真实像素（不插值）
  ctx.imageSmoothingQuality = 'high';
  if (img) {
    // 源区域可能超出图片边缘：只取图内部分
    const { width, height } = state.doc.image;
    const x0 = clamp(o.sx, 0, width), y0 = clamp(o.sy, 0, height), x1 = clamp(o.sx + o.sw, 0, width), y1 = clamp(o.sy + o.sh, 0, height);
    const k = (img.width || width) / width;   // 拖动调整滑块时可能是缩小图
    if (x1 > x0 && y1 > y0) ctx.drawImage(img, x0 * k, y0 * k, (x1 - x0) * k, (y1 - y0) * k, o.x + (x0 - o.sx) * mag, o.y + (y0 - o.sy) * mag, (x1 - x0) * mag, (y1 - y0) * mag);
  }
  if (opts.annotations !== false) {
    ctx.translate(o.x, o.y);
    ctx.scale(mag, o.h / Math.max(o.sh, 1e-9));
    ctx.translate(-o.sx, -o.sy);
    const inner = Object.assign({}, opts, { cull: { x0: o.sx, y0: o.sy, x1: o.sx + o.sw, y1: o.sy + o.sh } });
    drawAll(ctx, state.doc.objects.filter(q => q.type !== 'inset'), inner, view.hiddenId);
  }
  ctx.restore();
  // 4. 放大框边框与倍数
  applyDash(ctx, s.dash, lw);
  ctx.strokeRect(o.x, o.y, o.w, o.h);
  if (s.label !== false) {
    const fs = Math.max(Math.min(o.w, o.h) * 0.09, 10 * opts.unit);
    const text = '×' + (Math.round(mag * 10) / 10);
    ctx.font = `bold ${fs}px ${FONT_FAMILY}`;
    ctx.textBaseline = 'top';
    const tw = ctx.measureText(text).width;
    const pad = fs * 0.25;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(o.x + o.w - tw - 3 * pad, o.y + pad, tw + 2 * pad, fs + pad);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, o.x + o.w - tw - 2 * pad, o.y + pad * 1.4);
  }
  ctx.restore();
}

function insetBounds(o, opts) {
  const pad = o.style.width * opts.unit / 2;
  const x0 = Math.min(o.sx, o.x) - pad, y0 = Math.min(o.sy, o.y) - pad;
  const x1 = Math.max(o.sx + o.sw, o.x + o.w) + pad, y1 = Math.max(o.sy + o.sh, o.y + o.h) + pad;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// 命中检测：返回 'box' | 'src' | null
function insetPartAt(o, x, y, tol) {
  const inR = (r, m) => x >= r.x - m && x <= r.x + r.w + m && y >= r.y - m && y <= r.y + r.h + m;
  if (inR(insetBoxRect(o), tol)) return 'box';
  if (inR(insetSrcRect(o), tol)) return 'src';
  return null;
}

// 引导框：放大框或源区域（view.insetPart）
function insetFrame(o) {
  const part = view.insetPart === 'src' ? 'src' : 'box';
  const r = part === 'src' ? insetSrcRect(o) : insetBoxRect(o);
  return { kind: 'inset', part, obj: o, cx: r.x + r.w / 2, cy: r.y + r.h / 2, w: r.w, h: r.h, rot: 0, corners: true, edges: true, rotate: false };
}

// 调整一个部分的大小时，另一部分按倍数同步（倍数不变，不变形）
function applyInsetResize(o, s0, part, ncx, ncy, nw, nh) {
  const mag = s0.w / s0.sw;
  if (part === 'src') {
    const bw = nw * mag, bh = nh * mag;
    const bcx = s0.x + s0.w / 2, bcy = s0.y + s0.h / 2;
    Object.assign(o, { sx: ncx - nw / 2, sy: ncy - nh / 2, sw: nw, sh: nh, x: bcx - bw / 2, y: bcy - bh / 2, w: bw, h: bh });
  } else {
    const sw = nw / mag, sh = nh / mag;
    const scx = s0.sx + s0.sw / 2, scy = s0.sy + s0.sh / 2;
    Object.assign(o, { x: ncx - nw / 2, y: ncy - nh / 2, w: nw, h: nh, sx: scx - sw / 2, sy: scy - sh / 2, sw, sh });
  }
}

// 改倍数：源区域不动，放大框保持中心
function setInsetMag(mag) {
  const o = selectedObjs()[0];
  if (!o || o.type !== 'inset' || !(mag >= 1)) return;
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  const w = o.sw * mag, h = o.sh * mag;
  modifyObject(o.id, { x: cx - w / 2, y: cy - h / 2, w, h });
}

  const btn = $('#btnImageMenu');
  const menu = $('#imageMenu');
  const items = [
    ['crop', 'imCrop', 'C', () => startCrop()],
    ['rotL', 'imRotL', '[', () => rotateImage(-90)],
    ['rotR', 'imRotR', ']', () => rotateImage(90)],
    ['rot180', 'imRot180', '', () => rotateImage(180)],
    ['flipH', 'imFlipH', '', () => flipImage('h')],
    ['flipV', 'imFlipV', '', () => flipImage('v')],
    null,
    ['insert', 'imInsert', 'Ctrl+Shift+V', () => insertImageDialog()],
    ['inset', 'imInset', 'X', () => setTool('inset')],
    null,
    ['exportProcessed', 'imExportProcessed', '', () => exportProcessedImage()]
  ];
  const render = () => {
    menu.innerHTML = items.map(it => it ? `<button data-im="${it[0]}">${imIconSvg(it[0])}<span>${escapeHtml(t(it[1]))}</span>${it[2] ? `<kbd>${escapeHtml(it[2])}</kbd>` : ''}</button>`
      : '<div class="ctx-sep"></div>').join('') + `<div class="im-info muted small" id="imInfo"></div>`;
  };
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const it = items.find(x => x && x[0] === b.dataset.im);
    closeImageMenu();
    if (it && state.doc) it[3]();
    else if (!state.doc) toast(t('noImagesYet'));
  });
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!menu.hidden) { closeImageMenu(); return; }
    render();
    const info = state.doc ? opsSummary(state.doc.image) : '';
    $('#imInfo').textContent = info;
    $('#imInfo').hidden = !info;
    const r = btn.getBoundingClientRect();
    menu.hidden = false;
    menu.style.left = clamp(r.left, 8, window.innerWidth - menu.offsetWidth - 8) + 'px';

    btn.blur();
  });
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#imageMenu, #btnImageMenu')) closeImageMenu(); });
  $('#insertInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    e.target.value = '';

  $('#cropApply').addEventListener('click', applyCrop);
  $('#cropCancel').addEventListener('click', cancelCrop);
  $('#cropReset').addEventListener('click', () => { initCropRect(); requestRender(); });
}

function closeImageMenu() { const m = $('#imageMenu'); if (m) m.hidden = true; }

function imIconSvg(id) {
  const st = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const P = {
    crop: 'M6 2v16h16 M2 6h16v16',

    flipV: 'M3 12h18 M6 9 18 3v6z M6 15l12 6v-6z',

// 导出处理后（裁剪/旋转/翻转）的图片，不含标注
async function exportProcessedImage() {
  if (!state.doc || !state.img) return;
  const adjust = askApplyAdjust([state.entry]);
  showBusy(true);
  try {
    const { width, height } = state.doc.image;
    const c = document.createElement('canvas');
    c.width = width; c.height = height;
    c.getContext('2d').drawImage(adjust ? applyAdjustToCanvas(state.img, adjOf(state.doc)) : state.img, 0, 0);
    const blob = await canvasToBlob(c);
    const name = safeFileName(entryName(state.entry)) + '_processed.png';
    const r = await saveBlobAs(blob, name, { description: 'PNG image', accept: { 'image/png': ['.png'] } });
    if (r) toast(t('exportedToast', { name: r.name }));
  } finally {
    showBusy(false);
  }
}

// ===== measure.js =====
// ---------------------------------------------------------------------------
// measure.js — v1.4：比例尺标定与测量（S11）、计数区域 ROI（S10）
//
// doc.scale = { px: 每像素的长度, unit: 'nm'|'µm'|'mm'|'cm', bar: {show, pos, color, len} }
// 测距线：{type:'measure', x1,y1,x2,y2, style:{color,width}}
// 计数区域：{type:'roi', kind:'rect'|'ellipse'|'poly', name, x,y,w,h,rot | pts:[{x,y}], style:{color}}
//   标记中心在区域内（含边界）即算区域内。
// ---------------------------------------------------------------------------
const SCALE_UNITS = ['nm', 'µm', 'mm', 'cm'];
const UNIT_MM = { nm: 1e-6, 'µm': 1e-3, mm: 1, cm: 10 };
const ROI_PRESETS = { rect: 'rect', ellipse: 'ellipse', poly: 'poly' };
const MEASURE_PRESETS = { distance: 'distance', calibrate: 'calibrate' };
const ROI_COLORS = ['#ffeb3b', '#00e5ff', '#ff4081', '#76ff03', '#ff9100', '#ffffff'];

// ---- 单位与格式 ----------------------------------------------------------------------
const scaleOf = (doc) => (doc && doc.scale && doc.scale.px > 0 ? doc.scale : null);

function niceNumber(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / e;
  return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * e;
}

function fmtNum(v) {
  if (!Number.isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1000) return String(Math.round(v));
  if (a >= 100) return v.toFixed(1).replace(/\.0$/, '');
  if (a >= 1) return String(+v.toFixed(2));
  if (a === 0) return '0';
  return String(+v.toPrecision(3));
}

function fmtLen(px, doc) {
  const s = scaleOf(doc || state.doc);
  return s ? `${fmtNum(px * s.px)} ${s.unit}` : `${fmtNum(px)} px`;
}
function fmtArea(px2, doc) {
  const s = scaleOf(doc || state.doc);
  return s ? `${fmtNum(px2 * s.px * s.px)} ${s.unit}²` : `${fmtNum(px2)} px²`;
}
// 面积换算为 mm²（未标定时为 null）
function areaMm2(px2, doc) {
  const s = scaleOf(doc || state.doc);
  if (!s) return null;
  const k = s.px * UNIT_MM[s.unit];
  return px2 * k * k;
}
function densityText(n, px2, doc) {
  const a = areaMm2(px2, doc);
  return a ? `${fmtNum(n / a)} /mm²` : '';
}

// ---- 比例尺（画在图上，显示与导出一致） ----------------------------------------------
function scaleBarSpec(doc) {
  const s = scaleOf(doc);
  if (!s || !s.bar || !s.bar.show) return null;
  const len = s.bar.len > 0 ? s.bar.len : niceNumber(doc.image.width * 0.2 * s.px);
  return { len, px: len / s.px, s };
}

function drawScaleBar(ctx, opts) {
  const doc = state.doc;
  const sp = scaleBarSpec(doc);
  if (!sp) return;
  const { width, height } = doc.image;
  const u = opts.unit;
  const m = Math.min(width, height) * 0.04;
  const th = Math.max(u * 5, 2), fs = Math.max(u * 16, 10);
  const pos = sp.s.bar.pos || 'br';
  const color = sp.s.bar.color || '#ffffff';
  const x0 = pos[1] === 'r' ? width - m - sp.px : m;
  const y0 = pos[0] === 'b' ? height - m - th : m + fs * 1.35;
  const text = `${fmtNum(sp.len)} ${sp.s.unit}`;
  ctx.save();
  ctx.setLineDash([]);
  ctx.fillStyle = color;
  ctx.strokeStyle = contrastColor(color);
  ctx.lineWidth = Math.max(th * 0.25, u * 0.8);
  ctx.strokeRect(x0, y0, sp.px, th);
  ctx.fillRect(x0, y0, sp.px, th);
  ctx.font = `bold ${fs}px ${FONT_FAMILY}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.lineJoin = 'round';
  ctx.lineWidth = fs * 0.18;
  ctx.strokeText(text, x0 + sp.px / 2, y0 - fs * 0.2);
  ctx.fillText(text, x0 + sp.px / 2, y0 - fs * 0.2);
  ctx.restore();
}

// ---- 比例尺面板（图像工具面板的“比例尺”页） -------------------------------------------
const defaultBar = () => ({ show: true, pos: 'br', color: '#ffffff', len: null });

function setScale(patch) {
  if (!state.doc) return;
  const s = scaleOf(state.doc) ? clone(state.doc.scale) : { px: 0, unit: 'µm', bar: defaultBar() };
  const next = Object.assign(s, patch);
  if (patch.bar) next.bar = Object.assign({}, s.bar || defaultBar(), patch.bar);
  setDocProp('scale', next.px > 0 ? next : null);
}

function initScaleControls() {
  $('#scPx').addEventListener('change', (e) => {
    const v = +e.target.value;
    if (!(v > 0)) { if (e.target.value === '') setDocProp('scale', null); return; }
    setScale({ px: v, unit: $('#scUnit').value });
  });
  $('#scUnit').addEventListener('change', (e) => {
    const s = scaleOf(state.doc);
    if (!s) return;
    // 换单位时保持实际大小不变
    setScale({ px: +(s.px * UNIT_MM[s.unit] / UNIT_MM[e.target.value]).toPrecision(12), unit: e.target.value });
  });
  $('#scCalib').addEventListener('click', () => setMeasurePreset('calibrate'));
  $('#scBar').addEventListener('change', (e) => { if (scaleOf(state.doc)) setScale({ bar: { show: e.target.checked } }); });
  $('#scPos').addEventListener('change', (e) => { if (scaleOf(state.doc)) setScale({ bar: { pos: e.target.value } }); });
  $('#scLen').addEventListener('change', (e) => { if (scaleOf(state.doc)) setScale({ bar: { len: +e.target.value > 0 ? +e.target.value : null } }); });
  $$('[data-sc]').forEach(b => b.addEventListener('click', () => { if (scaleOf(state.doc)) setScale({ bar: { color: b.dataset.sc } }); }));
  $('#scSync').addEventListener('click', () => { const n = syncDocPropToFolder('scale'); toast(t('syncedN', { n })); });
  $('#scClear').addEventListener('click', () => setDocProp('scale', null));
  // 标定对话框
  $('#calOk').addEventListener('click', (e) => { e.preventDefault(); finishCalibration(); });
  $('#calCancel').addEventListener('click', (e) => { e.preventDefault(); $('#calibDialog').close(); });
  $('#calLen').addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); finishCalibration(); } });
}

function updateScaleControls() {
  const doc = state.doc;
  const s = scaleOf(doc);
  const set = (sel, v) => { const el = $(sel); if (el && document.activeElement !== el) el.value = v; };
  $('#scInfo').innerHTML = s
    ? `${escapeHtml(t('scaleIs'))} <b>${fmtNum(s.px)} ${escapeHtml(s.unit)}/px</b><br><span class="muted">${escapeHtml(t('scaleImgSize', { w: fmtLen(doc.image.width), h: fmtLen(doc.image.height) }))}</span>`
    : `<span class="muted">${escapeHtml(t('scaleNone'))}</span>`;
  set('#scPx', s ? +s.px.toPrecision(6) : '');
  set('#scUnit', s ? s.unit : 'µm');
  const bar = s ? Object.assign(defaultBar(), s.bar || {}) : defaultBar();
  $('#scBar').checked = !!(s && bar.show);
  set('#scPos', bar.pos);
  set('#scLen', bar.len > 0 ? bar.len : '');
  const sp = s ? scaleBarSpec(Object.assign({}, doc, { scale: Object.assign({}, s, { bar: Object.assign({}, bar, { show: true }) }) })) : null;
  $('#scLen').placeholder = sp ? `${t('auto')} ${fmtNum(sp.len)}` : t('auto');
  $('#scLenUnit').textContent = s ? s.unit : '';
  $$('[data-sc]').forEach(b => b.classList.toggle('active', b.dataset.sc === bar.color));
  ['#scBar', '#scPos', '#scLen', '#scSync', '#scClear'].forEach(sel => { $(sel).disabled = !s; });
}

// ---- 标定 ---------------------------------------------------------------------------
let calibPending = null;   // 画出的标定线长度（像素）

function openCalibration(lenPx) {
  if (!(lenPx > 0)) return;
  calibPending = lenPx;
  const s = scaleOf(state.doc);
  $('#calPxLen').textContent = `${fmtNum(lenPx)} px`;
  $('#calLen').value = s ? +(lenPx * s.px).toPrecision(4) : '';
  $('#calUnit').value = s ? s.unit : 'µm';
  $('#calSync').checked = false;
  $('#calibDialog').showModal();
  setTimeout(() => { $('#calLen').focus(); $('#calLen').select(); }, 0);
}

function finishCalibration() {
  const v = +$('#calLen').value;
  if (!(v > 0) || !calibPending) { $('#calLen').focus(); return; }
  const unit = $('#calUnit').value;
  const s = scaleOf(state.doc);
  setDocProp('scale', { px: v / calibPending, unit, bar: s && s.bar ? s.bar : defaultBar() });
  const n = $('#calSync').checked ? syncDocPropToFolder('scale') : 0;
  $('#calibDialog').close();
  calibPending = null;
  toast(t('calibrated', { v: fmtNum(state.doc.scale.px), unit }) + (n ? ' ' + t('syncedN', { n }) : ''), 4000);
}

// ---- 测距线 -------------------------------------------------------------------------
const measureLen = (o) => Math.hypot(o.x2 - o.x1, o.y2 - o.y1);

function measureLabelBox(o, opts) {
  const fs = Math.max(13 * opts.unit, 9 / (opts.forExport ? 1 : state.view.scale));
  measureCtx.font = `bold ${fs}px ${FONT_FAMILY}`;
  const text = fmtLen(measureLen(o));
  const w = measureCtx.measureText(text).width + fs * 0.6, h = fs * 1.35;
  const mx = (o.x1 + o.x2) / 2, my = (o.y1 + o.y2) / 2;
  return { text, fs, x: mx - w / 2, y: my - h - fs * 0.3, w, h };
}

function drawMeasure(ctx, o, opts) {
  const s = o.style;
  const lw = s.width * opts.unit;
  const len = measureLen(o);
  ctx.save();
  ctx.setLineDash([]);
  ctx.lineCap = 'butt';
  const line = () => {
    ctx.beginPath();
    ctx.moveTo(o.x1, o.y1); ctx.lineTo(o.x2, o.y2);
    if (len > 0) {
      // 两端短竖线
      const nx = -(o.y2 - o.y1) / len, ny = (o.x2 - o.x1) / len, k = Math.max(lw * 4, 4 * opts.unit);
      ctx.moveTo(o.x1 - nx * k, o.y1 - ny * k); ctx.lineTo(o.x1 + nx * k, o.y1 + ny * k);
      ctx.moveTo(o.x2 - nx * k, o.y2 - ny * k); ctx.lineTo(o.x2 + nx * k, o.y2 + ny * k);
    }
  };
  line();
  ctx.strokeStyle = contrastColor(s.color);
  ctx.lineWidth = lw + Math.max(lw * 0.6, opts.unit);
  ctx.stroke();
  line();
  ctx.strokeStyle = s.color;
  ctx.lineWidth = lw;
  ctx.stroke();
  const L = measureLabelBox(o, opts);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(L.x, L.y, L.w, L.h);
  ctx.font = `bold ${L.fs}px ${FONT_FAMILY}`;
  ctx.fillStyle = s.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(L.text, L.x + L.w / 2, L.y + L.h / 2);
  ctx.restore();
}

function measureBounds(o, opts) {
  const L = measureLabelBox(o, opts);
  const pad = Math.max(o.style.width * opts.unit * 4, 4 * opts.unit);
  const x0 = Math.min(o.x1, o.x2, L.x) - pad, y0 = Math.min(o.y1, o.y2, L.y) - pad;
  const x1 = Math.max(o.x1, o.x2, L.x + L.w) + pad, y1 = Math.max(o.y1, o.y2, L.y + L.h) + pad;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function hitMeasure(o, x, y, tol, opts) {
  if (distToSegment(x, y, o.x1, o.y1, o.x2, o.y2) <= o.style.width * opts.unit / 2 + tol) return true;
  const L = measureLabelBox(o, opts);
  return x >= L.x && x <= L.x + L.w && y >= L.y && y <= L.y + L.h;
}

function setMeasurePreset(id) {
  if (!MEASURE_PRESETS[id]) return;
  state.measurePreset = id;
  prefs.set('measurePreset', id);
  setTool('measure');
  if (id === 'calibrate') toast(t('calibDrawHint'), 5000);
}

// ---- 计数区域 ROI -------------------------------------------------------------------
function setRoiPreset(id) {
  if (!ROI_PRESETS[id]) return;
  state.roiPreset = id;
  prefs.set('roiPreset', id);
  setTool('roi');
}

function nextRoiName() {
  // 编号取“已有 ROI-n 的最大值”与“区域个数”中较大者，改过名也不会重名
  let n = 0;
  for (const o of state.doc.objects) if (o.type === 'roi') { n++; const m = /^ROI-(\d+)$/.exec(o.name || ''); if (m) n = Math.max(n, +m[1]); }
  const names = new Set(roisOf().map(o => o.name));
  while (names.has('ROI-' + (n + 1))) n++;
  return 'ROI-' + (n + 1);
}
function nextRoiColor() {
  const k = state.doc.objects.filter(o => o.type === 'roi').length;
  return ROI_COLORS[k % ROI_COLORS.length];
}

function roiContains(o, x, y) {
  if (o.kind === 'poly') return pointInPolygon(x, y, o.pts);
  const p = toLocal(o, x, y);
  const a = o.w / 2, b = o.h / 2;
  if (o.kind === 'ellipse') return (p.x / Math.max(a, 1e-9)) ** 2 + (p.y / Math.max(b, 1e-9)) ** 2 <= 1 + 1e-12;
  return Math.abs(p.x) <= a + 1e-9 && Math.abs(p.y) <= b + 1e-9;
}

function roiArea(o) {
  if (o.kind === 'poly') {
    let s = 0;
    const P = o.pts;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) s += (P[j].x + P[i].x) * (P[j].y - P[i].y);
    return Math.abs(s) / 2;
  }
  return o.kind === 'ellipse' ? Math.PI * o.w * o.h / 4 : o.w * o.h;
}

// 区域内各类别的数量
function roiStats(o, doc) {
  const d = doc || state.doc;
  const counts = {};
  let total = 0;
  for (const m of d.objects) {
    if (m.type !== 'marker' || !roiContains(o, m.x, m.y)) continue;
    counts[m.cat] = (counts[m.cat] || 0) + 1;
    total++;
  }
  const area = roiArea(o);
  return { counts, total, area, outside: d.objects.filter(m => m.type === 'marker').length - total };
}

const roisOf = (doc) => (doc || state.doc).objects.filter(o => o.type === 'roi');

function polyBBox(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function roiPath(ctx, o) {
  ctx.beginPath();
  if (o.kind === 'poly') {
    o.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    if (!o.open) ctx.closePath();
    return;
  }
  ctx.save();
  ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
  if (o.rot) ctx.rotate(o.rot);
  if (o.kind === 'ellipse') ctx.ellipse(0, 0, Math.max(o.w / 2, 0.01), Math.max(o.h / 2, 0.01), 0, 0, Math.PI * 2);
  else ctx.rect(-o.w / 2, -o.h / 2, o.w, o.h);
  ctx.restore();
}

function roiLabel(o, opts) {
  const b = roiBounds(o);
  const fs = Math.max(13 * opts.unit, 9 / (opts.forExport ? 1 : state.view.scale));
  let text = o.name || 'ROI';
  if (!o.open) {
    const st = roiStats(o);
    text += `: ${st.total}`;
    const extra = [fmtArea(st.area), densityText(st.total, st.area)].filter(Boolean).join(' · ');
    if (extra) text += ` · ${extra}`;
  }
  measureCtx.font = `bold ${fs}px ${FONT_FAMILY}`;
  const w = measureCtx.measureText(text).width + fs * 0.6, h = fs * 1.35;
  return { text, fs, x: b.x, y: b.y - h - fs * 0.15, w, h };
}

function drawRoi(ctx, o, opts) {
  const color = (o.style && o.style.color) || '#ffeb3b';
  const lw = Math.max(2 * opts.unit, (opts.forExport ? 1 : 1.5 / state.view.scale));
  ctx.save();
  roiPath(ctx, o);
  if (!o.open) { ctx.fillStyle = hexToRgba(color, 0.06); ctx.fill(); }
  ctx.lineJoin = 'round';
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = lw * 1.8;
  ctx.stroke();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.setLineDash([lw * 4, lw * 2.5]);
  ctx.stroke();
  ctx.setLineDash([]);
  if (o.open && o.pts.length) {
    // 正在画的多边形：起点画小圆，提示可单击闭合
    const p = o.pts[0], r = 5 / state.view.scale;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }
  const L = roiLabel(o, opts);
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(L.x, L.y, L.w, L.h);
  ctx.font = `bold ${L.fs}px ${FONT_FAMILY}`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(L.text, L.x + L.fs * 0.3, L.y + L.h / 2);
  ctx.restore();
}

function roiBounds(o) {
  if (o.kind === 'poly') return polyBBox(o.pts);
  const a = o.w / 2, b = o.h / 2, rot = o.rot || 0;
  const ex = Math.abs(a * Math.cos(rot)) + Math.abs(b * Math.sin(rot));
  const ey = Math.abs(a * Math.sin(rot)) + Math.abs(b * Math.cos(rot));
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  return { x: cx - ex, y: cy - ey, w: 2 * ex, h: 2 * ey };
}

// 只有边线和标签可点中（区域内部留给标记与框选）
function hitRoi(o, x, y, tol, opts) {
  const L = roiLabel(o, opts);
  if (x >= L.x && x <= L.x + L.w && y >= L.y && y <= L.y + L.h) return true;
  const m = tol + 2 * opts.unit;
  if (o.kind === 'poly') {
    const P = o.pts;
    for (let i = 0; i < P.length; i++) { const q = P[i], r = P[(i + 1) % P.length]; if (distToSegment(x, y, q.x, q.y, r.x, r.y) <= m) return true; }
    return false;
  }
  const p = toLocal(o, x, y);
  const a = o.w / 2, b = o.h / 2;
  if (o.kind === 'ellipse') {
    const r = Math.hypot(p.x / Math.max(a, 0.01), p.y / Math.max(b, 0.01));
    return Math.abs(r - 1) * Math.min(a, b) <= m;
  }
  const inOuter = Math.abs(p.x) <= a + m && Math.abs(p.y) <= b + m;
  const inInner = Math.abs(p.x) < a - m && Math.abs(p.y) < b - m;
  return inOuter && !inInner;
}

function roiFrame(o) {
  const b = polyBBox(o.pts);
  return { kind: 'poly', cx: b.x + b.w / 2, cy: b.y + b.h / 2, w: b.w, h: b.h, rot: 0, corners: true, edges: true, rotate: false };
}

// 从选区（框选 / 套索）创建计数区域
function regionToRoi() {
  const poly = state.region;
  if (!poly || poly.length < 3 || !state.doc) return;
  const pts = poly.map(p => ({ x: p.x, y: p.y }));
  const id = addObject({ type: 'roi', kind: 'poly', pts, name: nextRoiName(), style: { color: nextRoiColor() } });
  setTool('select');
  setSelection([id], null);
}

// 多边形 ROI 的绘制状态
const polyDraw = { pts: null };
function polyAddPoint(p) {
  if (!polyDraw.pts) polyDraw.pts = [];
  const P = polyDraw.pts;
  // 单击起点附近 = 闭合
  if (P.length >= 3 && Math.hypot(p.x - P[0].x, p.y - P[0].y) * state.view.scale <= 8) { polyFinish(); return; }
  P.push({ x: p.x, y: p.y });
  polyPreview(p);
}
function polyPreview(cursor) {
  const P = polyDraw.pts;
  if (!P) return;
  view.draft = { type: 'roi', kind: 'poly', open: true, name: '', pts: cursor ? P.concat([cursor]) : P.slice(), style: { color: nextRoiColor() } };
  requestRender();
}
function polyFinish() {
  // 双击会产生两个重复的点：去掉与前一点几乎重合的点
  const P = (polyDraw.pts || []).filter((p, i, a) => i === 0 || Math.hypot(p.x - a[i - 1].x, p.y - a[i - 1].y) * state.view.scale > 2);
  polyDraw.pts = null;
  view.draft = null;
  if (!P || P.length < 3) { requestRender(); return; }
  const id = addObject({ type: 'roi', kind: 'poly', pts: P, name: nextRoiName(), style: { color: nextRoiColor() } });
  setTool('select');
  setSelection([id], null);
}
function polyCancel() {
  polyDraw.pts = null;
  view.draft = null;
  requestRender();
}
function polyUndoPoint() {
  if (!polyDraw.pts) return;
  polyDraw.pts.pop();
  if (!polyDraw.pts.length) polyCancel(); else polyPreview(null);
}

// 计数弹窗与汇总中的 ROI 统计
function roiSummaryRows() {
  const ws = state.ws;
  const cats = ws ? ws.categories : [];
  const rows = [['folder', 'image', 'roi', 'shape', ...cats.map(c => c.name), 'total', 'outside', 'area_px2', 'area', 'area_unit', 'density_per_mm2']];
  for (const e of orderedEntries()) {
    const f = folderById(e.folderId);
    for (const o of roisOf(e.doc)) {
      const st = roiStats(o, e.doc);
      const s = scaleOf(e.doc);
      const mm2 = areaMm2(st.area, e.doc);
      rows.push([f ? f.name : '', entryName(e), o.name, o.kind, ...cats.map(c => st.counts[c.id] || 0), st.total, st.outside,
        st.area.toFixed(1), s ? +(st.area * s.px * s.px).toPrecision(6) : '', s ? s.unit + '²' : '', mm2 ? +(st.total / mm2).toPrecision(6) : '']);
    }
  }
  return rows.length > 1 ? rows : null;
}

// 标记所在的 ROI 名称（CSV）
function roiNamesAt(doc, x, y) {
  return roisOf(doc).filter(o => roiContains(o, x, y)).map(o => o.name).join(';');
}

// ===== imgtools.js =====
// ---------------------------------------------------------------------------
// imgtools.js — v1.4 图像工具：图像调整（S8）、放大镜（S9）、网格与逐格计数（S12）、
//               “图像工具”浮动面板（调整 / 网格 / 比例尺 三个标签页）
//
// 每张图片的设置保存在 doc 上，修改通过撤回命令 {k:'docset', key, before, after}：
//   doc.adjust = {black, white, gamma, brightness, contrast, channel, invert}
//   doc.grid   = {on, size(px), color, opacity, labels, export}
//   doc.scale  = {px(每像素的长度), unit, bar:{show, pos, color}}（见 measure.js）
// 图像调整只改变显示：用 256 级查找表处理显示用的位图，原图数据不变。
// ---------------------------------------------------------------------------
const ADJ0 = { black: 0, white: 255, gamma: 1, brightness: 0, contrast: 0, channel: 'rgb', invert: false };
const GRID0 = { on: false, size: 100, color: '#00e5ff', opacity: 0.7, labels: true, export: false, counts: true, autoZoom: false };
const ADJ_LIVE_MAX = 1600;     // 拖动滑块时只处理不超过此边长的缩小图，保证流畅

// ---- 通用：doc 上的设置（可撤回） ------------------------------------------------------
function applyDocset(cmd, forward, doc) {
  const d = doc || state.doc;
  const v = forward ? cmd.after : cmd.before;
  if (v == null) delete d[cmd.key]; else d[cmd.key] = clone(v);
  if (d === state.doc) onDocsetChanged(cmd.key);
}

function onDocsetChanged(key) {
  if (key === 'adjust') invalidateAdjust();
  view.baseKey = '';
  if (typeof updateToolsPanel === 'function') updateToolsPanel();
  updateCellBar();
  requestRender();
}

// 修改当前图片的设置（一步撤回）。before 省略时取当前值
function setDocProp(key, value, before) {
  const b = before !== undefined ? before : (state.doc[key] === undefined ? null : clone(state.doc[key]));
  const a = value == null ? null : clone(value);
  if (JSON.stringify(a) === JSON.stringify(b)) return;
  execute({ k: 'docset', key, before: b, after: a });
}

// 把命令记入某张（可能不是当前的）图片自己的撤回历史
function executeOnEntry(e, cmd) {
  if (e.id === state.activeId) { execute(cmd); return; }
  cmd.id = e.history.nextId++;
  cmd.time = Date.now();
  applyDocset(cmd, true, e.doc);
  e.history.undo.push(cmd);
  e.history.redo = [];
}

// 把当前图片的某项设置应用到同一文件夹的其它图片（每张图各记一步撤回）
function syncDocPropToFolder(key) {
  const e0 = state.entry;
  if (!e0) return 0;
  const f = folderById(e0.folderId);
  let n = 0;
  for (const id of f ? f.imageIds : []) {
    const e = state.ws.images[id];
    if (!e || e === e0) continue;
    const before = e.doc[key] === undefined ? null : clone(e.doc[key]);
    const after = state.doc[key] === undefined ? null : clone(state.doc[key]);
    if (JSON.stringify(before) === JSON.stringify(after)) continue;
    executeOnEntry(e, { k: 'docset', key, before, after });
    n++;
  }
  onWorkspaceChanged();
  updateStatus();
  return n;
}

// ---- S8 图像调整 -------------------------------------------------------------------
const adjOf = (doc) => Object.assign({}, ADJ0, (doc && doc.adjust) || {});
const isAdjIdentity = (a) => a.black === 0 && a.white === 255 && a.gamma === 1 && !a.brightness && !a.contrast && a.channel === 'rgb' && !a.invert;
const adjActive = (doc) => !!(doc && doc.adjust) && !isAdjIdentity(adjOf(doc));

// 查找表：色阶（黑点/白点/γ）→ 亮度/对比度 → 反相
function buildLut(a) {
  const lut = new Uint8Array(256);
  const span = Math.max(1, a.white - a.black);
  const c = a.contrast || 0;
  const k = c >= 0 ? 1 / Math.max(0.01, 1 - c / 100 * 0.99) : 1 + c / 100;
  for (let v = 0; v < 256; v++) {
    let x = clamp((v - a.black) / span, 0, 1);
    x = Math.pow(x, 1 / (a.gamma || 1));
    x = (x - 0.5) * k + 0.5 + (a.brightness || 0) / 100;
    x = clamp(x, 0, 1);
    if (a.invert) x = 1 - x;
    lut[v] = Math.round(x * 255);
  }
  return lut;
}

// 对位图应用调整，返回新的 canvas（不修改原位图）
function applyAdjustToCanvas(src, a) {
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, w, h);
  adjustPixels(im.data, a, buildLut(a));
  g.putImageData(im, 0, 0);
  return c;
}

function adjustPixels(d, a, lut) {
  const ch = a.channel;
  if (ch === 'rgb') {
    for (let i = 0; i < d.length; i += 4) { d[i] = lut[d[i]]; d[i + 1] = lut[d[i + 1]]; d[i + 2] = lut[d[i + 2]]; }
  } else {
    const off = ch === 'r' ? 0 : ch === 'g' ? 1 : ch === 'b' ? 2 : -1;
    for (let i = 0; i < d.length; i += 4) {
      const v = off >= 0 ? d[i + off] : Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
      const o = lut[v];
      d[i] = o; d[i + 1] = o; d[i + 2] = o;
    }
  }
}

// 大图（> 3 百万像素）在后台分条处理，避免界面卡顿；处理完成前先显示较小一级
const ADJ_ASYNC_PIXELS = 3e6;
let adjJob = null;
function startAdjustJob(idx, src, sig) {
  if (adjJob && adjJob.sig === sig && adjJob.idx === idx) return;
  const a = adjOf(state.doc), lut = buildLut(a);
  const w = src.width, h = src.height;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  const job = adjJob = { sig, idx, y: 0 };
  const rows = Math.max(16, Math.floor(1e6 / w));
  const step = () => {
    if (adjJob !== job || adjCache.sig !== sig) return;     // 参数又变了：放弃
    const hh = Math.min(rows, h - job.y);
    g.drawImage(src, 0, job.y, w, hh, 0, job.y, w, hh);
    const im = g.getImageData(0, job.y, w, hh);
    adjustPixels(im.data, a, lut);
    g.putImageData(im, 0, job.y);
    job.y += hh;
    if (job.y < h) { setTimeout(step, 0); return; }
    adjJob = null;
    adjCache.levels[idx] = c;
    view.baseKey = '';
    requestRender();
  };
  setTimeout(step, 0);
}

const adjCache = { sig: '', version: -1, levels: [] };
let adjLive = false;      // 正在拖动滑块
let adjBypass = false;    // 按住“对比原图”
function invalidateAdjust() { adjCache.sig = ''; adjCache.levels = []; view.baseKey = ''; }
const adjSig = () => (state.doc && !adjBypass && adjActive(state.doc) ? JSON.stringify(adjOf(state.doc)) + (adjLive ? ':live' : '') : '');

function adjLevels() { return view.pyramid || (state.img ? [state.img] : []); }
// allowAsync：大图在后台处理，返回 null 表示尚未完成
function adjLevel(idx, allowAsync) {
  const sig = JSON.stringify(adjOf(state.doc));
  if (adjCache.sig !== sig || adjCache.version !== view.imageVersion) { adjCache.sig = sig; adjCache.version = view.imageVersion; adjCache.levels = []; }
  const levels = adjLevels();
  idx = clamp(idx, 0, levels.length - 1);
  if (!adjCache.levels[idx]) {
    const src = levels[idx];
    if (allowAsync && src.width * src.height > ADJ_ASYNC_PIXELS) { startAdjustJob(idx, src, sig); return null; }
    adjCache.levels[idx] = applyAdjustToCanvas(src, adjOf(state.doc));
  }
  return adjCache.levels[idx];
}
// 取第 idx 级；未完成时用已完成的较小一级（或立即处理一个小的级别）代替
function adjLevelOrFallback(idx) {
  const got = adjLevel(idx, true);
  if (got) return got;
  const levels = adjLevels();
  for (let j = idx + 1; j < levels.length; j++) if (adjCache.levels[j]) return adjCache.levels[j];
  return adjLevel(liveIndex(idx + 1));
}
function liveIndex(idx) {
  const levels = adjLevels();
  let j = Math.max(0, idx);
  while (j < levels.length - 1 && Math.max(levels[j].width, levels[j].height) > ADJ_LIVE_MAX) j++;
  return j;
}

// 底图绘制用的位图（已调整）
function displayLevel(scale) {
  const raw = pickImageLevel(scale);
  if (!adjSig()) return raw;
  const levels = adjLevels();
  let idx = Math.max(0, levels.indexOf(raw));
  if (adjLive) idx = Math.max(idx, liveIndex(0));
  return adjLevelOrFallback(idx);
}

// 放大镜 / 局部放大插图使用的全图（已调整；拖动时为缩小图）
function displayFullImage() {
  if (!adjSig()) return state.img;
  return adjLive ? adjLevel(liveIndex(0)) : adjLevelOrFallback(0);
}

// 直方图（基于最小一级缩小图）：{r,g,b,l} 各 256 级
const histCache = { version: -1, h: null };
function imageHistogram() {
  if (histCache.version === view.imageVersion && histCache.h) return histCache.h;
  const levels = adjLevels();
  if (!levels.length) return null;
  const src = levels[levels.length - 1];
  const w = src.width, h = src.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(src, 0, 0);
  const d = g.getImageData(0, 0, w, h).data;
  const H = { r: new Float64Array(256), g: new Float64Array(256), b: new Float64Array(256), l: new Float64Array(256), n: w * h };
  for (let i = 0; i < d.length; i += 4) {
    H.r[d[i]]++; H.g[d[i + 1]]++; H.b[d[i + 2]]++;
    H.l[Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])]++;
  }
  histCache.version = view.imageVersion;
  histCache.h = H;
  return H;
}
const histOf = (H, ch) => (ch === 'r' ? H.r : ch === 'g' ? H.g : ch === 'b' ? H.b : H.l);

// 自动对比度：按 0.5% – 99.5% 分位数设黑点/白点
function autoContrast() {
  const H = imageHistogram();
  if (!H || !state.doc) return;
  const a = adjOf(state.doc);
  const h = histOf(H, a.channel);
  const n = h.reduce((s, v) => s + v, 0);
  let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += h[v]; if (acc >= n * 0.005) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += h[v]; if (acc >= n * 0.005) { hi = v; break; } }
  if (hi - lo < 2) { lo = 0; hi = 255; }
  setAdjust(Object.assign(a, { black: lo, white: hi, gamma: 1 }));
}

// 修改调整参数；isLive = 拖动中（不记撤回，结束时合并为一步）
let adjLiveBefore;
function setAdjust(a, isLive) {
  if (!state.doc) return;
  const next = isAdjIdentity(a) ? null : a;
  if (isLive) {
    if (adjLiveBefore === undefined) adjLiveBefore = state.doc.adjust ? clone(state.doc.adjust) : null;
    adjLive = true;
    if (next) state.doc.adjust = clone(next); else delete state.doc.adjust;
    view.baseKey = '';
    updateToolsPanel();
    requestRender();
    return;
  }
  const before = adjLiveBefore !== undefined ? adjLiveBefore : undefined;
  adjLiveBefore = undefined;
  adjLive = false;
  if (before !== undefined) { if (before) state.doc.adjust = clone(before); else delete state.doc.adjust; }
  setDocProp('adjust', next, before);
  invalidateAdjust();
  updateToolsPanel();
  requestRender();
}

// 导出前询问是否应用图像调整。返回 true / false
function askApplyAdjust(entries) {
  if (!entries.some(e => adjActive(e.doc))) return false;
  return confirm(t('exportApplyAdjust'));
}

// ---- S9 放大镜 --------------------------------------------------------------------
const LOUPE_R = 80;
const LOUPE_MAGS = [2, 4, 8];

function toggleLoupe(force) {
  state.loupe.on = force === undefined ? !state.loupe.on : force;
  prefs.set('loupe', state.loupe);
  toast(state.loupe.on ? t('loupeOn', { m: state.loupe.mag }) : t('loupeOff'));
  updateToggles();
  requestRender();
}

function cycleLoupe(dir) {
  const i = LOUPE_MAGS.indexOf(state.loupe.mag);
  state.loupe.mag = LOUPE_MAGS[clamp((i < 0 ? 1 : i) + dir, 0, LOUPE_MAGS.length - 1)];
  prefs.set('loupe', state.loupe);
  requestRender();
}

function drawLoupe() {
  if (!state.loupe.on || !state.doc || !input.pointer.over || input.gesture) return;
  const { ctx, dpr } = view;
  const r = view.rect;
  const px = input.pointer.x - r.left, py = input.pointer.y - r.top;
  const ip = screenToImage(input.pointer.x, input.pointer.y);
  const R = LOUPE_R, off = R + 24;
  // 放在光标左上方，避免挡住光标处；靠边时换到另一侧
  let cx = px - off, cy = py - off;
  if (cx - R < 0) cx = px + off;
  if (cy - R < 0) cy = py + off;
  const s = state.view.scale * state.loupe.mag;
  const img = displayFullImage();
  const { width, height } = state.doc.image;
  const k = (img.width || width) / width;
  const half = R / s;
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.save();
  ctx.clip();
  ctx.fillStyle = view.stageBg;
  ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.translate(-ip.x, -ip.y);
  ctx.imageSmoothingEnabled = s * dpr < 4;   // 4 倍以上显示真实像素
  const x0 = clamp(ip.x - half - 1, 0, width), y0 = clamp(ip.y - half - 1, 0, height);
  const x1 = clamp(ip.x + half + 1, 0, width), y1 = clamp(ip.y + half + 1, 0, height);
  if (x1 > x0 && y1 > y0) ctx.drawImage(img, x0 * k, y0 * k, (x1 - x0) * k, (y1 - y0) * k, x0, y0, x1 - x0, y1 - y0);
  if (state.showAnnotations) {
    const opts = drawOptions();
    opts.cull = { x0: ip.x - half, y0: ip.y - half, x1: ip.x + half, y1: ip.y + half };
    ctx.globalAlpha = state.opacity;
    drawAll(ctx, state.doc.objects, opts, view.hiddenId);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // 十字准线、边框、倍数
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy); ctx.lineTo(cx - 3, cy); ctx.moveTo(cx + 3, cy); ctx.lineTo(cx + 10, cy);
  ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy - 3); ctx.moveTo(cx, cy + 3); ctx.lineTo(cx, cy + 10);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.arc(cx, cy, R + 1.5, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `bold 11px ${FONT_FAMILY}`;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(cx - 14, cy + R - 20, 28, 15);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('×' + state.loupe.mag, cx, cy + R - 12.5);
  ctx.restore();
}

// ---- S12 网格 -----------------------------------------------------------------------
const gridOf = (doc) => Object.assign({}, GRID0, (doc && doc.grid) || {});
const gridOn = (doc) => !!(doc && doc.grid && doc.grid.on);

// 网格原点 (ox, oy) 可拖动；ncols / nrows > 0 时只画指定数量的格（例如计数板的 4×4 / 5×5 区域）
function gridDims(doc) {
  const g = gridOf(doc);
  const { width, height } = doc.image;
  const size = Math.max(2, g.size);
  const ox = +g.ox || 0, oy = +g.oy || 0;
  const fitC = Math.max(1, Math.ceil((width - ox) / size - 1e-9)), fitR = Math.max(1, Math.ceil((height - oy) / size - 1e-9));
  const cols = g.ncols > 0 ? Math.min(g.ncols, fitC) : fitC, rows = g.nrows > 0 ? Math.min(g.nrows, fitR) : fitR;
  return { g, size, ox, oy, cols, rows };
}

// 第 c 列、第 r 行的格在图片上的范围（裁到图片内）
function cellBox(doc, c, r) {
  const { size, ox, oy } = gridDims(doc);
  const { width, height } = doc.image;
  const x0 = Math.max(0, ox + c * size), y0 = Math.max(0, oy + r * size);
  return { x0, y0, x1: Math.min(width, ox + (c + 1) * size), y1: Math.min(height, oy + (r + 1) * size) };
}

// 列用字母、行用数字：A1、B1…（与电子表格相同）
const cellName = (c, r) => letterName(c) + (r + 1);

// 格的归属：“计上不计下、计左不计右”——压在上边/左边线上的点属于本格
function cellOf(doc, x, y) {
  const { size, ox, oy, cols, rows } = gridDims(doc);
  const c = Math.floor((x - ox) / size), r = Math.floor((y - oy) / size);
  if (c < 0 || r < 0 || c >= cols || r >= rows) return null;
  return { c, r };
}

function toggleGrid() {
  if (!state.doc) return;
  const g = gridOf(state.doc);
  if (!state.doc.grid && !g.on) g.size = defaultGridSize();
  g.on = !g.on;
  setDocProp('grid', g);
  toast(g.on ? t('gridOn') : t('gridOff'));
  if (!g.on) exitCellMode();
}

// 默认间距：约 8 列
function defaultGridSize() {
  const { width } = state.doc.image;
  const s = scaleOf(state.doc);
  if (s) {
    const len = niceNumber(width * s.px / 8);
    return len / s.px;
  }
  return Math.max(10, Math.round(width / 8 / 10) * 10);
}

function drawGrid(ctx, opts, forExport) {
  const doc = state.doc;
  if (!gridOn(doc)) return;
  const { g, size, ox, oy, cols, rows } = gridDims(doc);
  const { width, height } = doc.image;
  const px = forExport ? opts.unit : 1 / state.view.scale;
  const gx0 = Math.max(0, ox), gy0 = Math.max(0, oy), gx1 = Math.min(width, ox + cols * size), gy1 = Math.min(height, oy + rows * size);
  ctx.save();
  ctx.globalAlpha = g.opacity;
  ctx.strokeStyle = g.color;
  ctx.lineWidth = (forExport ? 1.5 : 1) * px;
  ctx.beginPath();
  for (let c = 0; c <= cols; c++) { const x = clamp(ox + c * size, 0, width); ctx.moveTo(x, gy0); ctx.lineTo(x, gy1); }
  for (let r = 0; r <= rows; r++) { const y = clamp(oy + r * size, 0, height); ctx.moveTo(gx0, y); ctx.lineTo(gx1, y); }
  ctx.stroke();
  // 格号（屏幕上格子太小时不显示）
  const cellScreen = forExport ? Infinity : size * state.view.scale;
  if (g.labels && cellScreen > 28) {
    const fs = forExport ? Math.max(size * 0.12, 8 * opts.unit) : Math.min(13, cellScreen * 0.16) * px;
    ctx.font = `${fs}px ${FONT_FAMILY}`;
    ctx.textBaseline = 'top';
    ctx.fillStyle = g.color;
    ctx.globalAlpha = Math.min(1, g.opacity + 0.2);
    const vr = forExport ? null : visibleRect();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const b = cellBox(doc, c, r);
        if (vr && (b.y1 < vr.y0 || b.y0 > vr.y1 || b.x1 < vr.x0 || b.x0 > vr.x1)) continue;
        ctx.fillText(cellName(c, r), b.x0 + fs * 0.3, b.y0 + fs * 0.25);
      }
    }
  }
  ctx.restore();
}

// 计数规则提示：上边、左边 = 绿色实线（压线计数）；下边、右边 = 红色虚线（压线不计）
function drawCellRule(ctx, c, r, px, dimOthers) {
  const doc = state.doc;
  const { width, height } = doc.image;
  const { x0, y0, x1, y1 } = cellBox(doc, c, r);
  ctx.save();
  if (dimOthers) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.rect(0, 0, width, height);
    ctx.rect(x1, y0, x0 - x1, y1 - y0);
    ctx.fill('evenodd');
  }
  ctx.lineWidth = 3 * px;
  ctx.strokeStyle = '#39d353';
  ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.stroke();
  ctx.strokeStyle = '#ff5252';
  ctx.setLineDash([7 * px, 5 * px]);
  ctx.beginPath(); ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); ctx.lineTo(x0, y1); ctx.stroke();
  ctx.restore();
}

// 当前格：其它格轻微调暗，当前格发亮，并标出计数规则；未选当前格时提示光标所在格
function drawGridOverlay(ctx, px) {
  const doc = state.doc;
  if (!gridOn(doc)) return;
  const cur = state.cellMode && state.cellMode.cur;
  if (cur) {
    const { width, height } = doc.image;
    const { x0, y0, x1, y1 } = cellBox(doc, cur.c, cur.r);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.rect(0, 0, width, height);
    ctx.rect(x1, y0, x0 - x1, y1 - y0);
    ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(0,229,255,0.45)';
    ctx.lineWidth = 9 * px;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.restore();
    drawCellRule(ctx, cur.c, cur.r, px, false);
    return;
  }
  if (!input.pointer.over || input.gesture || state.gridMove) return;
  const p = screenToImage(input.pointer.x, input.pointer.y);
  const cell = cellOf(doc, p.x, p.y);
  if (cell) drawCellRule(ctx, cell.c, cell.r, px, false);
}

// 每格右下角显示本格合计及各类别数量（格子在屏幕上太小时只显示合计或不显示）
function drawCellCounts(ctx, opts, forExport) {
  const doc = state.doc;
  const g = gridOf(doc);
  if (!gridOn(doc) || g.counts === false) return;
  const { size, cols, rows } = gridDims(doc);
  const k = forExport ? Math.max(opts.unit, 0.5) : 1 / state.view.scale;   // 1 个“屏幕像素”对应的图片像素
  const cellScreen = size / k;
  if (cellScreen < 22) return;
  const cc = cellCounts(doc);
  const cats = doc.categories;
  const fs = clamp(cellScreen * 0.2, 10, 20);
  const fs2 = fs * 0.78;
  const vr = forExport ? null : visibleRect();
  const cur = state.cellMode && state.cellMode.cur;
  const ds = doneSet(doc);
  ctx.save();
  ctx.textBaseline = 'middle';
  const outside = (b) => vr && (b.y1 < vr.y0 || b.y0 > vr.y1 || b.x1 < vr.x0 || b.x0 > vr.x1);
  // 逐格计数时：选定（空格）的格右上角打 ✓，未选定的格加淡斜线，看过但未选定的格右上角画空心圆
  const seen = state.cellMode && state.cellMode.seen;
  if (state.cellMode && !forExport) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1.5 * k;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const b = cellBox(doc, c, r);
      if (ds.has(cellKey(c, r)) || outside(b)) continue;
      const { x0, y0, x1, y1 } = b;
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
      ctx.beginPath();
      const step = 14 * k;
      for (let d = -(y1 - y0); d < x1 - x0; d += step) { ctx.moveTo(x0 + d, y1); ctx.lineTo(x0 + d + (y1 - y0), y0); }
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const b = cellBox(doc, c, r);
      if (outside(b) || b.x1 <= b.x0 || b.y1 <= b.y0) continue;
      const n = cc.total[r][c];
      const { x1, y1 } = b;
      const cw = (x1 - b.x0) / k;
      // 合计
      ctx.font = `bold ${fs}px ${FONT_FAMILY}`;
      const tt = String(n);
      const tw = ctx.measureText(tt).width;
      // 各类别（有空间时）
      const parts = [];
      if (n && cellScreen >= 70) {
        ctx.font = `${fs2}px ${FONT_FAMILY}`;
        for (const cat of cats) {
          const m = cc.byCat[cat.id] ? cc.byCat[cat.id][r][c] : 0;
          if (m) parts.push({ color: cat.color, text: String(m), w: ctx.measureText(String(m)).width });
        }
      }
      const pad = 4, dot = fs2 * 0.6, gap = 6;
      let w = tw + 2 * pad;
      let pw = parts.reduce((s, p) => s + dot + 3 + p.w + gap, 0);
      if (parts.length < 2) pw = 0;   // 只有一个类别时，合计已说明一切
      if (w + pw > cw * 0.92) pw = 0;
      w += pw;
      const h = fs + 6;
      // 图片坐标中的位置（右下角，留一点边距）
      ctx.save();
      ctx.translate(x1 - 3 * k, y1 - 3 * k);
      ctx.scale(k, k);
      const isCur = cur && cur.c === c && cur.r === r;
      ctx.globalAlpha = n ? 0.92 : 0.55;
      ctx.fillStyle = isCur ? 'rgba(0,120,140,0.9)' : 'rgba(0,0,0,0.6)';
      ctx.fillRect(-w, -h, w, h);
      let x = -w + pad;
      if (pw) {
        ctx.font = `${fs2}px ${FONT_FAMILY}`;
        for (const p of parts) {
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(x + dot / 2, -h / 2, dot / 2, 0, Math.PI * 2); ctx.fill();
          x += dot + 3;
          ctx.fillStyle = '#e8e8e8';
          ctx.fillText(p.text, x, -h / 2);
          x += p.w + gap;
        }
      }
      ctx.font = `bold ${fs}px ${FONT_FAMILY}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(tt, x, -h / 2);
      ctx.restore();
      if (!ds.has(cellKey(c, r)) && seen && seen.has(cellKey(c, r)) && !forExport) {
        // 看过（未选定）：右上角空心圆
        ctx.save();
        ctx.translate(x1 - 3 * k, b.y0 + 3 * k);
        ctx.scale(k, k);
        const d = fs + 4;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(-d / 2, d / 2, d / 2 - 1, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      if (ds.has(cellKey(c, r))) {
        // 右上角 ✓
        ctx.save();
        ctx.translate(x1 - 3 * k, b.y0 + 3 * k);
        ctx.scale(k, k);
        const d = fs + 4;
        ctx.fillStyle = 'rgba(46,160,67,0.92)';
        ctx.beginPath(); ctx.arc(-d / 2, d / 2, d / 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(-d * 0.75, d * 0.52); ctx.lineTo(-d * 0.55, d * 0.72); ctx.lineTo(-d * 0.22, d * 0.3); ctx.stroke();
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

// 每格的标记数（按类别与合计）
function cellCounts(doc) {
  const { cols, rows } = gridDims(doc);
  const total = Array.from({ length: rows }, () => new Array(cols).fill(0));
  const byCat = {};
  for (const o of doc.objects) {
    if (o.type !== 'marker') continue;
    const cell = cellOf(doc, o.x, o.y);
    if (!cell) continue;
    total[cell.r][cell.c]++;
    if (!byCat[o.cat]) byCat[o.cat] = Array.from({ length: rows }, () => new Array(cols).fill(0));
    byCat[o.cat][cell.r][cell.c]++;
  }
  return { cols, rows, total, byCat };
}

// ---- 选定的格（逐格计数时：单击设为当前格，再按空格选定 / 取消；“看过”不等于选定） ----------
// doc.grid.done = ['c,r', …]；没有任何选定时视为全部格都计入（统计、浓度换算用）
const cellKey = (c, r) => c + ',' + r;
const doneSet = (doc) => new Set((doc && doc.grid && doc.grid.done) || []);
function cellIncluded(doc, c, r) {
  const s = doneSet(doc);
  return !s.size || s.has(cellKey(c, r));
}
function setCellDone(c, r, on) {
  const doc = state.doc;
  if (!doc || !doc.grid) return;
  const s = doneSet(doc);
  const k = cellKey(c, r);
  if (on === s.has(k)) return;
  if (on) s.add(k); else s.delete(k);
  doc.grid.done = Array.from(s);
  markStructChanged();      // 进度标记不进撤回记录，但要保存
  updateStatus();
}
function toggleCurrentDone() {
  const cur = state.cellMode && state.cellMode.cur;
  if (!cur) return;
  setCellDone(cur.c, cur.r, !doneSet(state.doc).has(cellKey(cur.c, cur.r)));
  updateCellBar();
  requestRender();
}

// ---- 逐格计数模式 -------------------------------------------------------------------
// 开始时保持当前视图；单击任意格 = 设为当前格；上一格/下一格只在需要时平移（可选自动放大）
function startCellMode() {
  if (!state.doc) return;
  if (!gridOn(state.doc)) { const g = gridOf(state.doc); g.on = true; if (!state.doc.grid) g.size = defaultGridSize(); setDocProp('grid', g); }
  state.cellMode = { cur: null, seen: new Set() };
  // 开始后：关闭“图像工具”面板（避免挡住图片），光标换成“选择”（单击只选格，不加点）
  if (typeof setPanelOpen === 'function') setPanelOpen('tools', false);
  if (state.tool !== 'select') setTool('select');
  updateCellBar();
  updateToolsPanel();
  requestRender();
  toast(t('cellModeHint'), 5000);
}

function exitCellMode() {
  if (!state.cellMode) return;
  state.cellMode = null;
  setGridMove(false);
  updateCellBar();
  updateToolsPanel();
  requestRender();
}

function setCurrentCell(c, r, reveal) {
  const m = state.cellMode;
  if (!m) return;
  m.cur = { c, r };
  if (m.seen) m.seen.add(cellKey(c, r));
  if (reveal) { if (gridOf(state.doc).autoZoom) zoomToCell(); else panToCell(); }
  updateCellBar();
  requestRender();
}

function moveCell(dc, dr) {
  const m = state.cellMode;
  if (!m) return;
  const { cols, rows } = gridDims(state.doc);
  if (!m.cur) { setCurrentCell(dc < 0 ? cols - 1 : 0, dc < 0 ? rows - 1 : 0, true); return; }
  let { c, r } = m.cur;
  if (dr === 0) {
    // 左右：按行顺序前进/后退（行末自动换行）
    let i = r * cols + c + dc;
    if (i >= cols * rows) { toast(t('cellLast')); i = cols * rows - 1; openCellTable(); }
    i = clamp(i, 0, cols * rows - 1);
    r = Math.floor(i / cols); c = i % cols;
  } else {
    r = clamp(r + dr, 0, rows - 1);
  }
  setCurrentCell(c, r, true);
}

function cellRect(c, r) {
  const b = cellBox(state.doc, c, r);
  return { x: b.x0, y: b.y0, w: b.x1 - b.x0, h: b.y1 - b.y0 };
}

// ---- 移动网格：开启后在图上拖动 = 平移整个网格（一步撤回） ----------------------------------
function setGridMove(on) {
  on = !!on && !!state.doc && gridOn(state.doc);
  if (!!state.gridMove === on) return;
  state.gridMove = on;
  if (on && state.plateMode) { state.plateMode = null; updatePlateControls(); }
  $$('#cellMoveGrid, #grMove').forEach(b => b.classList.toggle('active', on));
  updateGuides();
  if (typeof updateCursor === 'function') updateCursor();
  requestRender();
}
function resetGridPosition() {
  if (!state.doc || !state.doc.grid) return;
  setDocProp('grid', Object.assign(gridOf(state.doc), { ox: 0, oy: 0 }));
}

function zoomToCell() {
  const cur = state.cellMode && state.cellMode.cur;
  if (!cur || !state.doc) return;
  const { x, y, w, h } = cellRect(cur.c, cur.r);
  const v = state.view;
  v.scale = clamp(Math.min(view.cssW / (w * 1.3), view.cssH / (h * 1.3)), 0.01, 64);
  v.tx = view.cssW / 2 - (x + w / 2) * v.scale;
  v.ty = view.cssH / 2 - (y + h / 2) * v.scale;
  requestRender();
  updateZoomLabel();
}

// 当前格不在视野内时平移过去（不改变缩放；格子比视野大时才缩小到能看全）
function panToCell() {
  const cur = state.cellMode && state.cellMode.cur;
  if (!cur || !state.doc) return;
  const { x, y, w, h } = cellRect(cur.c, cur.r);
  const v = state.view, m = 24;
  if (w * v.scale > view.cssW - 2 * m || h * v.scale > view.cssH - 2 * m) {
    v.scale = clamp(Math.min((view.cssW - 2 * m) / w, (view.cssH - 2 * m) / h), 0.01, 64);
    updateZoomLabel();
  }
  const sx0 = v.tx + x * v.scale, sy0 = v.ty + y * v.scale, sx1 = sx0 + w * v.scale, sy1 = sy0 + h * v.scale;
  if (sx0 >= -1 && sy0 >= -1 && sx1 <= view.cssW + 1 && sy1 <= view.cssH + 1) { requestRender(); return; }   // 已完整可见：不动
  v.tx = view.cssW / 2 - (x + w / 2) * v.scale;
  v.ty = view.cssH / 2 - (y + h / 2) * v.scale;
  requestRender();
}

function updateCellBar() {
  const bar = $('#cellBar');
  if (!bar) return;
  const m = state.cellMode;
  bar.hidden = !m || !state.doc;
  if (bar.hidden) return;
  const { cols, rows } = gridDims(state.doc);
  const ds = doneSet(state.doc);
  $('#cellProgress').textContent = t('cellProgressSel', { n: ds.size, m: cols * rows, k: m.seen ? m.seen.size : 0 });
  $('#cellDone').hidden = !m.cur;
  if (!m.cur) { $('#cellInfo').innerHTML = escapeHtml(t('cellPick')); return; }
  const isDone = ds.has(cellKey(m.cur.c, m.cur.r));
  $('#cellDone').textContent = isDone ? '✓ ' + t('cellDoneYes') : t('cellDoneNo');
  $('#cellDone').classList.toggle('active', isDone);
  const { c, r } = m.cur;
  if (c >= cols || r >= rows) { m.cur = null; updateCellBar(); return; }
  const cc = cellCounts(state.doc);
  const cats = state.doc.categories.filter(cat => cc.byCat[cat.id] && cc.byCat[cat.id][r][c]);
  $('#cellInfo').innerHTML = `${escapeHtml(t('cellCurrent'))} <b>${cellName(c, r)}</b>（${r * cols + c + 1}/${cols * rows}）· ${escapeHtml(t('cellThis'))} <b id="cellCount">${cc.total[r][c]}</b>` +
    cats.map(cat => ` <span class="cell-chip"><i style="background:${cat.color}"></i>${escapeHtml(cat.name)} <b>${cc.byCat[cat.id][r][c]}</b></span>`).join('');
}

function onCellModeKey(e, key) {
  if (!state.cellMode) return false;
  if (key === 'enter' || key === 'arrowright') { e.preventDefault(); moveCell(1, 0); return true; }
  if (key === 'arrowleft') { e.preventDefault(); moveCell(-1, 0); return true; }
  if (key === 'arrowdown') { e.preventDefault(); moveCell(0, 1); return true; }
  if (key === 'arrowup') { e.preventDefault(); moveCell(0, -1); return true; }
  if (key === ' ') {
    // 空格 = 选定 / 取消选定当前格（只有选定的格用于统计）
    e.preventDefault();
    if (e.repeat) return true;
    if (!state.cellMode.cur) { toast(t('cellPickFirst')); return true; }
    toggleCurrentDone();
    return true;
  }
  if (key === 'escape') { if (state.gridMove) setGridMove(false); else exitCellMode(); return true; }
  return false;
}

// 每格计数表
function cellTableRows(doc, catId) {
  const cc = cellCounts(doc);
  const M = catId ? (cc.byCat[catId] || Array.from({ length: cc.rows }, () => new Array(cc.cols).fill(0))) : cc.total;
  // 有“已计数”标记时只统计这些格
  const flat = [];
  M.forEach((row, r) => row.forEach((v, c) => { if (cellIncluded(doc, c, r)) flat.push(v); }));
  const n = flat.length, sum = flat.reduce((s, v) => s + v, 0);
  const m = n ? sum / n : NaN, s = sd(flat);
  return { cc, M, n, sum, mean: m, sd: s, cv: m ? s / m * 100 : NaN, disp: poissonDispersion(flat), min: n ? Math.min(...flat) : NaN, max: n ? Math.max(...flat) : NaN };
}

function openCellTable() {
  if (!state.doc) return;
  const dlg = $('#cellDialog');
  const sel = $('#cellCat');
  sel.innerHTML = `<option value="">${escapeHtml(t('allCategories'))}</option>` +
    state.doc.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  renderCellTable();
  if (!dlg.open) dlg.showModal();
}

function renderCellTable() {
  const T = cellTableRows(state.doc, $('#cellCat').value || null);
  const f1 = (v) => (Number.isFinite(v) ? v.toFixed(2) : '—');
  const { width, height } = state.doc.image;
  const { size, ox, oy, cols, rows } = gridDims(state.doc);
  const partial = ox < 0 || oy < 0 || ox + cols * size > width + 1e-6 || oy + rows * size > height + 1e-6;
  const s = scaleOf(state.doc);
  const cellArea = s ? fmtArea(size * size) : `${Math.round(size)}×${Math.round(size)} px`;
  $('#cellBody').innerHTML = `
    <div class="muted small">${escapeHtml(t('cellTableNote', { size: s ? fmtLen(size) : Math.round(size) + ' px', area: cellArea }))}${partial ? ' ' + escapeHtml(t('cellPartial')) : ''}</div>
    <table class="summary cells"><thead><tr><th></th>${T.M[0].map((_, c) => `<th>${letterName(c)}</th>`).join('')}<th>Σ</th></tr></thead>
    <tbody>${T.M.map((row, r) => `<tr><th>${r + 1}</th>${row.map((v, c) => `<td class="num${state.cellMode && state.cellMode.cur && state.cellMode.cur.c === c && state.cellMode.cur.r === r ? ' cur' : ''}${doneSet(state.doc).has(cellKey(c, r)) ? ' done' : ''}">${v}</td>`).join('')}<td class="num"><b>${row.reduce((a, b) => a + b, 0)}</b></td></tr>`).join('')}</tbody></table>
    <div class="cell-stats">${escapeHtml(t('cellStats', { n: T.n, sum: T.sum, mean: f1(T.mean), sd: f1(T.sd), cv: Number.isFinite(T.cv) ? T.cv.toFixed(1) : '—' }))}${doneSet(state.doc).size ? ' ' + escapeHtml(t('cellOnlyDone')) : ' ' + escapeHtml(t('cellNoneSelected'))}</div>
    <div class="cell-stats">${escapeHtml(t('cellRange', { min: Number.isFinite(T.min) ? T.min : '—', max: Number.isFinite(T.max) ? T.max : '—' }))}</div>
    ${Number.isFinite(T.disp.p) ? `<div class="cell-stats"><b>${escapeHtml(t('cellDispTitle'))}</b> ${escapeHtml(t('cellDisp', { D: T.disp.D.toFixed(2), chi2: T.disp.chi2.toFixed(2), df: T.disp.df, p: T.disp.p < 0.0001 ? '<0.0001' : T.disp.p.toFixed(4) }))}
      <div class="muted small">${escapeHtml(t(T.disp.p >= 0.05 ? 'cellDispOk' : T.disp.D > 1 ? 'cellDispClump' : 'cellDispRegular'))}</div></div>` : ''}`;

function cellTableCsvRows() {
  const T = cellTableRows(state.doc, $('#cellCat').value || null);
  const rows = [['row', ...T.M[0].map((_, c) => letterName(c)), 'sum']];
  T.M.forEach((row, r) => rows.push([r + 1, ...row, row.reduce((a, b) => a + b, 0)]));
  rows.push([]);
  rows.push(['cells', T.n], ['total', T.sum], ['mean', T.mean], ['sd (n-1)', T.sd], ['cv %', T.cv], ['min', T.min], ['max', T.max],
    ['dispersion index s2/mean', T.disp.D], ['chi2 (Poisson)', T.disp.chi2], ['df', T.disp.df], ['p (two-sided)', T.disp.p]);
  return rows;
}

// 色阶条：拖动黑点 / γ / 白点
function initLevelsBar() {
  const bar = $('#lvBar');
  bar.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('[data-lv]');
    if (!h || !state.doc) return;
    e.preventDefault();
    bar.setPointerCapture(e.pointerId);
    const which = h.dataset.lv;
    const rect = bar.getBoundingClientRect();
    const move = (ev) => {
      const v = clamp((ev.clientX - rect.left) / rect.width * 255, 0, 255);
      const a = adjOf(state.doc);
      if (which === 'black') a.black = Math.round(clamp(v, 0, a.white - 2));
      else if (which === 'white') a.white = Math.round(clamp(v, a.black + 2, 255));
      else {
        const m = clamp((v - a.black) / Math.max(1, a.white - a.black), 0.02, 0.98);
        a.gamma = Math.round(Math.log(m) / Math.log(0.5) * 100) / 100;   // 中点灰 0.5 落在此处
      }
      setAdjust(a, true);
    };
    const up = (ev) => {
      bar.removeEventListener('pointermove', move);
      bar.removeEventListener('pointerup', up);
      bar.removeEventListener('pointercancel', up);
      move(ev);
      setAdjust(adjOf(state.doc));
    };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
    bar.addEventListener('pointercancel', up);
  });
}

function drawHistogram() {
  const c = $('#histCanvas');
  if (!c || !state.doc || !state.img) return;
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth || 240, H = 72;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const hist = imageHistogram();
  if (!hist) return;
  const a = adjOf(state.doc);
  const series = a.channel === 'rgb' ? [['r', 'rgba(229,57,53,0.45)'], ['g', 'rgba(67,160,71,0.45)'], ['b', 'rgba(30,136,229,0.45)'], ['l', 'rgba(230,230,230,0.7)']]
    : [[a.channel === 'gray' ? 'l' : a.channel, 'rgba(230,230,230,0.8)']];
  // 纵轴用平方根，暗部的小峰也能看见
  let max = 1;
  for (const [k] of series) for (let v = 0; v < 256; v++) max = Math.max(max, Math.sqrt(histOf(hist, k)[v]));
  for (const [k, col] of series) {
    const h = histOf(hist, k);
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(0, H);
    for (let v = 0; v < 256; v++) g.lineTo(v / 255 * W, H - Math.sqrt(h[v]) / max * (H - 2));
    g.lineTo(W, H);
    g.closePath();
    g.fill();
  }
  // 黑点 / 白点之外加暗色
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.fillRect(0, 0, a.black / 255 * W, H);
  g.fillRect(a.white / 255 * W, 0, W - a.white / 255 * W, H);
}

// ===== platediv.js =====
// ---------------------------------------------------------------------------
// platediv.js — 平板分区（琼脂平板等分计数）
//
// doc.plate = { on, cx, cy, r, n, rot, color, opacity, labels, export, done:[扇区序号] }
//   圆心 (cx, cy)、半径 r（图片像素）；n 等份（1/2 横、1/2 竖、1/4 十字、1/8 米字、1/16 或自定 N）；rot 旋转角（度）
//   扇区从分割线起按顺时针编号 1..n；圆外的标记不计入任何扇区。
// 只数部分扇区时，全板估计（比率估计）：N̂ = Σ已数扇区计数 ÷ Σ已数扇区面积占比；扇区等分时即 Σc × n / k。
//   没有选定任何扇区时视为全部扇区都计入（N̂ = 圆内总数）。
// 修改通过 setDocProp('plate', …)（docset，可撤回）。
// ---------------------------------------------------------------------------
const PLATE0 = { on: false, cx: 0, cy: 0, r: 0, n: 4, rot: 0, color: '#ffeb3b', opacity: 0.9, labels: true, export: false, done: [] };
const PLATE_PRESETS = [
  { key: 'h2', n: 2, rot: 0 },     // 横线切成上下两半
  { key: 'v2', n: 2, rot: 90 },    // 竖线切成左右两半
  { key: 'q4', n: 4, rot: 0 },     // 十字
  { key: 'o8', n: 8, rot: 0 },     // 米字
  { key: 's16', n: 16, rot: 0 }
];
const plateOf = (doc) => Object.assign({}, PLATE0, (doc && doc.plate) || {});
const plateOn = (doc) => !!(doc && doc.plate && doc.plate.on && doc.plate.r > 0);

// 默认圆：图片中心，半径 = 短边的 47%
function defaultPlateCircle(doc) {
  const { width, height } = doc.image;
  return { cx: width / 2, cy: height / 2, r: Math.min(width, height) * 0.47 };
}

// 点所在的扇区（0 起），圆外返回 -1
function plateSectorOf(p, x, y) {
  const dx = x - p.cx, dy = y - p.cy;
  if (dx * dx + dy * dy > p.r * p.r) return -1;
  let a = Math.atan2(dy, dx) - p.rot * Math.PI / 180;
  a = ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  return Math.min(p.n - 1, Math.floor(a / (2 * Math.PI / p.n)));
}

// 每个扇区的计数（按类别与合计）、选定情况与全板估计
function plateStats(doc) {
  const p = plateOf(doc);
  const n = Math.max(1, Math.round(p.n));
  const total = new Array(n).fill(0), byCat = {};
  let outside = 0;
  for (const o of doc.objects) {
    if (o.type !== 'marker') continue;
    const s = plateSectorOf(p, o.x, o.y);
    if (s < 0) { outside++; continue; }
    total[s]++;
    if (!byCat[o.cat]) byCat[o.cat] = new Array(n).fill(0);
    byCat[o.cat][s]++;
  }
  const done = new Set((p.done || []).filter(i => i >= 0 && i < n));
  const incl = (i) => !done.size || done.has(i);
  const used = total.map((v, i) => i).filter(incl);
  const frac = 1 / n;
  const sumC = used.reduce((s, i) => s + total[i], 0);
  const sumF = used.length * frac;
  const vals = used.map(i => total[i]);
  const estOf = (arr) => (sumF > 0 ? used.reduce((s, i) => s + arr[i], 0) / sumF : NaN);
  const estByCat = {};
  for (const id of Object.keys(byCat)) estByCat[id] = estOf(byCat[id]);
  return { p, n, total, byCat, outside, done, incl, used, frac, sumC, sumF, estimate: estOf(total), estByCat,
    mean: mean(vals), sd: vals.length > 1 ? sd(vals) : NaN, disp: poissonDispersion(vals) };
}

// ---- 绘制 -----------------------------------------------------------------------
function drawPlate(ctx, opts, forExport) {
  const doc = state.doc;
  if (!plateOn(doc)) return;
  const S = plateStats(doc);
  const p = S.p;
  const k = forExport ? Math.max(opts.unit, 0.5) : 1 / state.view.scale;   // 1 个屏幕像素对应的图片像素
  const rot = p.rot * Math.PI / 180, step = 2 * Math.PI / S.n;
  ctx.save();
  // 已选定的扇区：淡绿色；有选定时未选定的扇区：淡灰
  if (S.done.size && !forExport) {
    for (let i = 0; i < S.n; i++) {
      ctx.beginPath();
      ctx.moveTo(p.cx, p.cy);
      ctx.arc(p.cx, p.cy, p.r, rot + i * step, rot + (i + 1) * step);
      ctx.closePath();
      ctx.fillStyle = S.done.has(i) ? 'rgba(46,160,67,0.18)' : 'rgba(0,0,0,0.22)';
      ctx.fill();
    }
  }
  ctx.globalAlpha = p.opacity;
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2 * k;
  ctx.beginPath();
  ctx.arc(p.cx, p.cy, p.r, 0, Math.PI * 2);
  for (let i = 0; i < S.n; i++) {
    if (S.n === 1) break;
    const a = rot + i * step;
    ctx.moveTo(p.cx, p.cy);
    ctx.lineTo(p.cx + p.r * Math.cos(a), p.cy + p.r * Math.sin(a));
  }
  ctx.stroke();
  // 扇区编号与计数（放在扇区中线 0.62 r 处）
  if (p.labels) {
    const fs = clamp(p.r / k * 0.07, 11, 22);
    for (let i = 0; i < S.n; i++) {
      const a = rot + (i + 0.5) * step, rr = S.n === 1 ? 0 : p.r * (S.n >= 16 ? 0.72 : 0.62);
      const x = p.cx + rr * Math.cos(a), y = p.cy + rr * Math.sin(a);
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(k, k);
      ctx.globalAlpha = 1;
      ctx.font = `bold ${fs}px ${FONT_FAMILY}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const txt = `${i + 1}: ${S.total[i]}${S.done.has(i) ? ' ✓' : ''}`;
      const w = ctx.measureText(txt).width + 8, h = fs + 6;
      ctx.fillStyle = S.done.has(i) ? 'rgba(46,160,67,0.92)' : 'rgba(0,0,0,0.6)';
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.fillStyle = '#fff';
      ctx.fillText(txt, 0, 1);
      ctx.restore();
    }
  }
  // 编辑（移动）时的手柄：圆心、半径、旋转
  if (!forExport && state.plateMode === 'move') {
    const hs = plateHandles(p);
    ctx.globalAlpha = 1;
    for (const h of hs) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, 7 * k, 0, Math.PI * 2);
      ctx.fillStyle = h.id === 'rot' ? '#ffb300' : '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2 * k;
      ctx.strokeStyle = '#0095b3';
      ctx.stroke();
    }
  }
  ctx.restore();
}

// 手柄：圆心（移动）、右下 45° 处的半径手柄、第一条分割线外侧的旋转手柄
function plateHandles(p) {
  const rot = p.rot * Math.PI / 180, k = 1 / state.view.scale;
  return [
    { id: 'move', x: p.cx, y: p.cy },
    { id: 'radius', x: p.cx + p.r * Math.cos(Math.PI / 4 + rot / 2), y: p.cy + p.r * Math.sin(Math.PI / 4 + rot / 2) },
    { id: 'rot', x: p.cx + (p.r + 22 * k) * Math.cos(rot), y: p.cy + (p.r + 22 * k) * Math.sin(rot) }
  ];
}

// ---- 指针：移动 / 改半径 / 旋转；选扇区 ------------------------------------------------
// 返回 true 表示已处理（tools.js 的 onPointerDown 先调用）
function platePointerDown(e, p0) {
  const doc = state.doc;
  if (!plateOn(doc) || !state.plateMode || e.button !== 0) return false;
  const p = plateOf(doc);
  if (state.plateMode === 'pick') {
    const s = plateSectorOf(p, p0.x, p0.y);
    if (s >= 0) togglePlateSector(s);
    return true;
  }
  const tol = 14 / state.view.scale;
  const hit = plateHandles(p).find(h => Math.hypot(h.x - p0.x, h.y - p0.y) <= tol);
  const d = Math.hypot(p0.x - p.cx, p0.y - p.cy);
  const mode = hit ? hit.id : Math.abs(d - p.r) <= tol ? 'radius' : d < p.r ? 'move' : null;
  if (!mode) return false;
  input.gesture = { id: e.pointerId, type: e.pointerType, button: 0, t0: performance.now(), startX: e.clientX, startY: e.clientY,
    start: p0, last: p0, moved: false, mode: 'plateEdit', plateWhat: mode, plateBefore: clone(doc.plate), p0: p };
  try { view.canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  return true;
}

function platePointerMove(g, q) {
  const doc = state.doc, p = g.p0, pl = doc.plate;
  if (g.plateWhat === 'move') { pl.cx = p.cx + q.x - g.start.x; pl.cy = p.cy + q.y - g.start.y; }
  else if (g.plateWhat === 'radius') pl.r = Math.max(10, Math.hypot(q.x - p.cx, q.y - p.cy));
  else if (g.plateWhat === 'rot') {
    let a = Math.atan2(q.y - p.cy, q.x - p.cx) * 180 / Math.PI;
    if (g.shift) a = Math.round(a / 15) * 15;
    pl.rot = Math.round(((a % 360) + 360) % 360 * 10) / 10;
  }
  updatePlateControls();
  requestRender();
}

function platePointerUp(g) {
  if (!g.moved) return;
  const after = clone(state.doc.plate);
  for (const k of ['cx', 'cy', 'r']) after[k] = Math.round(after[k] * 100) / 100;
  state.doc.plate = clone(g.plateBefore);
  setDocProp('plate', after, g.plateBefore);
}

function setPlateMode(mode) {
  if (mode && !plateOn(state.doc)) mode = null;
  state.plateMode = state.plateMode === mode ? null : mode;
  if (state.plateMode && state.gridMove) setGridMove(false);
  if (state.plateMode === 'pick' && state.tool !== 'select') setTool('select');
  if (typeof updateCursor === 'function') updateCursor();
  updatePlateControls();
  updateGuides();
  requestRender();
}

function togglePlateSector(i) {
  const p = plateOf(state.doc);
  const s = new Set(p.done || []);
  if (s.has(i)) s.delete(i); else s.add(i);
  setDocProp('plate', Object.assign(p, { done: Array.from(s).sort((a, b) => a - b) }));
}

function setPlate(patch) {
  const doc = state.doc;
  if (!doc) return;
  const p = plateOf(doc);
  if (!(p.r > 0)) Object.assign(p, defaultPlateCircle(doc));
  const next = Object.assign(p, patch);
  if ('n' in patch) next.done = [];   // 份数改变后原来的选定不再对应
  setDocProp('plate', next);
}

function initPlateControls() {
  $('#plOn').addEventListener('change', (e) => { setPlate({ on: e.target.checked }); if (!e.target.checked) { state.plateMode = null; updatePlateControls(); } });
  $$('[data-plpre]').forEach(b => b.addEventListener('click', () => {
    const pr = PLATE_PRESETS.find(x => x.key === b.dataset.plpre);
    setPlate({ on: true, n: pr.n, rot: pr.rot });
  }));
  $('#plN').addEventListener('change', (e) => { const v = Math.round(+e.target.value); if (v >= 1 && v <= 64) setPlate({ on: true, n: v }); });
  $('#plRot').addEventListener('change', (e) => { const v = +e.target.value; if (Number.isFinite(v)) setPlate({ rot: ((v % 360) + 360) % 360 }); });

  $('#plPick').addEventListener('click', () => setPlateMode('pick'));

function updatePlateControls() {
  const doc = state.doc;
  if (!doc || !$('#plOn')) return;
  const p = plateOf(doc);
  const set = (sel, v) => { const el = $(sel); if (el && document.activeElement !== el) el.value = v; };

  $$('[data-plpre]').forEach(b => { const pr = PLATE_PRESETS.find(x => x.key === b.dataset.plpre); b.classList.toggle('active', plateOn(doc) && p.n === pr.n && Math.round(p.rot) === pr.rot); });
  const box = $('#plStats');

  box.innerHTML = `<table class="summary pl-table"><thead><tr><th>${escapeHtml(t('plateSector'))}</th><th>${escapeHtml(t('plateUse'))}</th><th>${escapeHtml(t('totalShort'))}</th></tr></thead><tbody>

    <div class="btn-row"><button class="small" data-plall="all">${escapeHtml(t('plateAll'))}</button><button class="small" data-plall="none">${escapeHtml(t('plateNone'))}</button></div>
    <div class="pl-est">${escapeHtml(t('plateEstLine', { k: S.used.length, n: S.n, c: S.sumC }))}<br><b>${escapeHtml(t('plateEstimate'))}: ${Number.isFinite(S.estimate) ? +S.estimate.toFixed(1) : '—'}</b></div>
    <div class="muted small">${escapeHtml(t('plateMeanSd', { m: f2(S.mean), s: f2(S.sd) }))}${Number.isFinite(S.disp.p) ? ` · ${escapeHtml(t('cellDisp', { D: S.disp.D.toFixed(2), chi2: S.disp.chi2.toFixed(2), df: S.disp.df, p: S.disp.p < 0.0001 ? '<0.0001' : S.disp.p.toFixed(4) }))}` : ''}${S.outside ? ` · ${escapeHtml(t('plateOutside', { n: S.outside }))}` : ''}</div>`;
}

function openToolsTab(tab) {

function guideAction(k) {
  const doc = state.doc;
  if (!doc) return;
  if (k === 'grid') toggleGrid();
  else if (k === 'gridMove') setGridMove(!state.gridMove);
  else if (k === 'plate') { const on = !plateOn(doc); setPlate({ on }); if (!on && state.plateMode) setPlateMode(null); }

}

// 按钮高亮 + 菜单内容 + 移动提示条
function updateGuides() {

  const btn = $('#btnGrid');
  if (btn) btn.classList.toggle('active', !!doc && (gridOn(doc) || plateOn(doc)));
  const menu = $('#guideMenu');
  if (menu && !menu.hidden) menu.innerHTML = guideMenuHtml();
  const bar = $('#guideBar');
  if (!bar) return;
  const mode = state.gridMove ? 'grid' : state.plateMode === 'move' ? 'plateMove' : state.plateMode === 'pick' ? 'platePick' : null;
  bar.hidden = !mode || !doc;
  if (!bar.hidden) {
    $('.gb-text', bar).textContent = t({ grid: 'gdBarGrid', plateMove: 'gdBarPlate', platePick: 'gdBarPick' }[mode]);
    $('.gb-done', bar).textContent = t('gdDone');
  }
}

function initGuides() {
  const btn = $('#btnGrid'), menu = $('#guideMenu');
  let timer = null;
  const place = () => {
    const r = btn.getBoundingClientRect();
    const w = menu.offsetWidth || 300;
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    const below = r.bottom + 2, h = menu.offsetHeight;
    menu.style.top = (below + h > innerHeight - 8 && r.top - h - 2 > 8 ? r.top - h - 2 : below) + 'px';
  };
  const show = () => {
    clearTimeout(timer);
    if (!menu.hidden) return;
    menu.innerHTML = guideMenuHtml();
    menu.hidden = false;
    place();
  };
  const hide = () => { clearTimeout(timer); timer = setTimeout(() => { menu.hidden = true; }, 260); };
  const mouseOnly = (fn) => (e) => { if (e.pointerType === 'mouse') fn(); };
  btn.addEventListener('pointerenter', mouseOnly(show));
  btn.addEventListener('pointerleave', mouseOnly(hide));
  menu.addEventListener('pointerenter', mouseOnly(show));
  menu.addEventListener('pointerleave', mouseOnly(hide));
  // 单击按钮：展开菜单（不再直接开关网格）；触屏再点一次收起。鼠标悬停时已经展开，点击不收起
  let lastPointer = 'mouse';
  btn.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType; });
  btn.addEventListener('click', (e) => {
    e.stopImmediatePropagation();
    if (menu.hidden) show(); else if (lastPointer !== 'mouse') menu.hidden = true;
  }, true);
  document.addEventListener('pointerdown', (e) => { if (!menu.hidden && !e.target.closest('#guideMenu, #btnGrid')) menu.hidden = true; });
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-gd]');
    if (!b || b.disabled) return;
    const k = b.dataset.gd;
    guideAction(k);
    // 进入移动 / 点选模式或打开设置面板后收起菜单，方便直接在图上拖动
    if (['gridMove', 'plateMove', 'platePick', 'gridMore', 'plateMore'].includes(k)) menu.hidden = true;
    else place();
  });
  $('#guideBar .gb-done').addEventListener('click', () => {
    if (state.gridMove) setGridMove(false);
    if (state.plateMode) setPlateMode(null);
    updateGuides();
  });
}

// ===== detect.js =====
// ---------------------------------------------------------------------------
// detect.js — 内置“暗点/亮点”检测算法（本地运行，不上传图片，无需训练）
//
// 步骤：
// 1. 背景估计：把图像分成小格，取每格亮度的高分位数（深色目标）或低分位数（亮色目标）
//    作为背景，双线性插值成背景图 —— 可抵消光照不均。
// 2. 信号 = 背景 − 亮度（深色目标）；Otsu 自动阈值 × 灵敏度系数 → 二值图。
// 3. 8 邻域连通域标记，统计每个斑块的面积、质心、协方差。
// 4. 单个目标面积：用户给定直径，或自动取斑块面积分布的稳健中位数。
// 5. 重叠拆分：斑块面积 ≈ k × 单个面积时估计为 k 个目标，在斑块内用 k-means 放 k 个点。
// 输出坐标为原图像素坐标。
// ---------------------------------------------------------------------------
const DETECT_MAX_PIXELS = 8e6;    // 分析分辨率上限（更大的图会按比例缩小分析，结果映射回原图）

function regionBBox(region, W, H) {
  if (!region || region.length < 3) return { x: 0, y: 0, w: W, h: H };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  region.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
  x0 = clamp(Math.floor(x0), 0, W); y0 = clamp(Math.floor(y0), 0, H);
  x1 = clamp(Math.ceil(x1), 0, W); y1 = clamp(Math.ceil(y1), 0, H);
  return { x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0) };
}

// 分割：返回连通域及其统计量（工作分辨率坐标）
function segmentSpots(bmp, imgW, imgH, opt) {
  const bb = regionBBox(opt.region, imgW, imgH);
  let s = Math.min(1, Math.sqrt(DETECT_MAX_PIXELS / (bb.w * bb.h)));
  if (opt.singleSize > 0) s = Math.max(s, Math.min(1, 8 / opt.singleSize)); // 保证单个目标至少约 8 像素宽
  const W = Math.max(1, Math.round(bb.w * s)), H = Math.max(1, Math.round(bb.h * s));
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(bmp, bb.x, bb.y, bb.w, bb.h, 0, 0, W, H);
  const rgba = cx.getImageData(0, 0, W, H).data;
  const N = W * H;

  // 区域掩膜（套索/框选）：用画布填充多边形，比逐像素判断快
  let mask = null;
  if (opt.region && opt.region.length >= 3) {
    const mc = document.createElement('canvas');
    mc.width = W; mc.height = H;
    const m = mc.getContext('2d', { willReadFrequently: true });
    m.fillStyle = '#fff';
    m.beginPath();
    opt.region.forEach((p, i) => { const X = (p.x - bb.x) * s, Y = (p.y - bb.y) * s; if (i) m.lineTo(X, Y); else m.moveTo(X, Y); });
    m.closePath();
    m.fill();
    const md = m.getImageData(0, 0, W, H).data;
    mask = new Uint8Array(N);
    for (let i = 0; i < N; i++) mask[i] = md[i * 4 + 3] > 127 ? 1 : 0;
  }

  const gray = new Uint8Array(N);
  for (let i = 0; i < N; i++) gray[i] = (rgba[i * 4] * 77 + rgba[i * 4 + 1] * 150 + rgba[i * 4 + 2] * 29) >> 8;

  // 1. 背景（分格分位数 + 双线性插值）
  const dark = opt.polarity !== 'light';
  const C = Math.max(16, Math.round(opt.singleSize > 0 ? opt.singleSize * s * 4 : 48));
  const gw = Math.ceil(W / C), gh = Math.ceil(H / C);
  const cell = new Float32Array(gw * gh);
  const q = dark ? 0.8 : 0.2;
  const hist = new Uint32Array(256);
  const globalHist = new Uint32Array(256);
  for (let gy = 0; gy < gh; gy++) {
    for (let gx = 0; gx < gw; gx++) {
      hist.fill(0);
      let n = 0;
      const xe = Math.min(W, (gx + 1) * C), ye = Math.min(H, (gy + 1) * C);
      for (let y = gy * C; y < ye; y++) {
        for (let x = gx * C, i = y * W + x; x < xe; x++, i++) {
          if (mask && !mask[i]) continue;
          hist[gray[i]]++; globalHist[gray[i]]++; n++;
        }
      }
      cell[gy * gw + gx] = n ? quantile(hist, n, q) : -1;
    }
  }
  const gTotal = globalHist.reduce((a, b) => a + b, 0);
  const gq = gTotal ? quantile(globalHist, gTotal, q) : 128;
  for (let i = 0; i < cell.length; i++) if (cell[i] < 0) cell[i] = gq;

  const signal = new Uint8Array(N);
  const sh = new Uint32Array(256);
  let sn = 0;
  for (let y = 0; y < H; y++) {
    const fy = clamp((y + 0.5) / C - 0.5, 0, gh - 1);
    const y0 = Math.floor(fy), y1 = Math.min(gh - 1, y0 + 1), wy = fy - y0;
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (mask && !mask[i]) continue;
      const fx = clamp((x + 0.5) / C - 0.5, 0, gw - 1);
      const x0 = Math.floor(fx), x1 = Math.min(gw - 1, x0 + 1), wx = fx - x0;
      const bg = (cell[y0 * gw + x0] * (1 - wx) + cell[y0 * gw + x1] * wx) * (1 - wy) +
                 (cell[y1 * gw + x0] * (1 - wx) + cell[y1 * gw + x1] * wx) * wy;
      const v = clamp(Math.round(dark ? bg - gray[i] : gray[i] - bg), 0, 255);
      signal[i] = v; sh[v]++; sn++;
    }
  }

  // 2. 阈值：Otsu × 灵敏度系数（灵敏度 50 → ×1；100 → ×0.5；0 → ×1.5）
  const otsu = otsuThreshold(sh, sn);
  const factor = 1.5 - clamp(opt.sensitivity === undefined ? 50 : opt.sensitivity, 0, 100) / 100;
  const T = Math.max(10, Math.round(otsu * factor));

  // 3. 连通域（8 邻域，两遍扫描 + 并查集）
  const labels = new Int32Array(N);
  let parent = new Int32Array(1024);
  let next = 1;
  const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) { if (a < b) parent[b] = a; else parent[a] = b; } return Math.min(a, b); };
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (signal[i] < T) continue;
      let l = 0;
      const nb = [x > 0 ? labels[i - 1] : 0, y > 0 ? labels[i - W] : 0,
        y > 0 && x > 0 ? labels[i - W - 1] : 0, y > 0 && x < W - 1 ? labels[i - W + 1] : 0];
      for (const v of nb) { if (v) l = l ? union(l, v) : find(v); }
      if (!l) {
        if (next >= parent.length) { const np = new Int32Array(parent.length * 2); np.set(parent); parent = np; }
        parent[next] = next; l = next++;
      }
      labels[i] = l;
    }
  }
  const comps = new Map();
  for (let i = 0; i < N; i++) {
    if (!labels[i]) continue;
    const r = find(labels[i]);
    labels[i] = r;
