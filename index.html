    if (n && nm !== c.name) { c.name = nm; changed = true; }
  }
  return changed;
}

function newWorkspace(categories) {
  const cats = clone(categories && categories.length ? categories : defaultCategories());
  localizeCatNames(cats);
  let n = 1;
  cats.forEach(c => { c.id = 'c' + n++; });
  return {
    categories: cats, nextCatId: n,
    folders: [], nextFolderId: 1,
    images: {}, nextImageId: 1,
    assets: {}, nextAssetId: 1,
    activeFolderId: null,
    structVersion: 0, savedStructVersion: 0
  };
}

function newDocument(image) {
  return {
    image,                       // {name(原文件名), width, height, mime, sha256, fileSize, sourceNote}
    categories: state.ws.categories,   // 运行时指向共享类别（保存时不重复写入）
    objects: [],
    nextId: 1,
    meta: { operator: state.settings.operator || '', createdAt: new Date().toISOString(), modifiedAt: null }
  };
}

// 以原图尺寸为准：裁剪/旋转后标记大小不变
const unitOf = (doc) => (doc.image.orig ? Math.max(doc.image.orig.width, doc.image.orig.height) : Math.max(doc.image.width, doc.image.height)) / 1000;
const newId = (prefix) => prefix + (state.doc.nextId++);
const findObj = (id) => state.doc.objects.find(o => o.id === id);
const findCat = (id) => state.doc.categories.find(c => c.id === id);
const markers = () => state.doc ? state.doc.objects.filter(o => o.type === 'marker') : [];

function countsByCategory() {
  const counts = {};
  if (!state.doc) return counts;
  state.doc.categories.forEach(c => { counts[c.id] = 0; });
  for (const o of state.doc.objects) if (o.type === 'marker') counts[o.cat] = (counts[o.cat] || 0) + 1;
  return counts;
}

// ---- 命令执行 ----------------------------------------------------------------
function insertObjects(items) {
  const objs = state.doc.objects;
  items.slice().sort((a, b) => a.index - b.index).forEach(it => objs.splice(Math.min(it.index, objs.length), 0, clone(it.obj)));
}
function removeObjectsById(ids) {
  const set = new Set(ids);
  state.doc.objects = state.doc.objects.filter(o => !set.has(o.id));
}
// 类别数组为全工作区共享，只能原地修改
function removeCategoryById(id) {
  const cats = state.ws.categories;
  const i = cats.findIndex(c => c.id === id);
  if (i >= 0) cats.splice(i, 1);
}

function applyCommand(cmd, forward) {
  const doc = state.doc;
  switch (cmd.k) {
    case 'add':
      if (forward) insertObjects(cmd.items); else removeObjectsById(cmd.items.map(i => i.obj.id));
      break;
    case 'remove':
      if (forward) removeObjectsById(cmd.items.map(i => i.obj.id)); else insertObjects(cmd.items);
      break;
    case 'mod': {
      const o = findObj(cmd.oid);
      if (o) Object.assign(o, clone(forward ? cmd.after : cmd.before));
      break;
    }
    case 'catAdd':
      if (forward) doc.categories.splice(cmd.index, 0, clone(cmd.cat));
      else removeCategoryById(cmd.cat.id);
      break;
    case 'catMod': {
      const c = findCat(cmd.cid);
      if (c) Object.assign(c, clone(forward ? cmd.after : cmd.before));
      break;
    }
    case 'catRemove':
      if (forward) {
        removeObjectsById(cmd.markers.map(m => m.obj.id));
        removeCategoryById(cmd.cat.id);
      } else {
        doc.categories.splice(cmd.index, 0, clone(cmd.cat));
        insertObjects(cmd.markers);
      }
      break;
    case 'order':
      applyOrder(forward ? cmd.after : cmd.before);
      break;
    case 'img':
      // 裁剪 / 旋转 / 翻转（imgedit.js）
      applyImageCommand(cmd, forward);
      break;
    case 'docset':
      // 图像调整 / 比例尺 / 网格（imgtools.js）
      applyDocset(cmd, forward);
      break;
    case 'batch':
      // 多个命令作为一步执行/撤回（多选移动、批量改类别、AI 结果等）
      if (forward) cmd.cmds.forEach(c => applyCommand(c, true));
      else cmd.cmds.slice().reverse().forEach(c => applyCommand(c, false));
      break;
  }
  // 保证当前类别/选中对象仍然存在
  if (!findCat(state.currentCat)) state.currentCat = doc.categories[0] ? doc.categories[0].id : null;
  if (state.selection.length) state.selection = state.selection.filter(id => findObj(id));
}

function execute(cmd) {
  if (!state.doc) return;
  cmd.id = state.history.nextId++;
  cmd.time = Date.now();
  applyCommand(cmd, true);
  state.history.undo.push(cmd);
  state.history.redo = [];
  onDocChanged();
}

// 其它图片仍在使用的类别不能被删除（否则那些图片里会出现无类别的标记）
function markersOfCategoryElsewhere(catId) {
  let n = 0;
  for (const e of Object.values(state.ws.images)) {
    if (e.id === state.activeId) continue;
    for (const o of e.doc.objects) if (o.type === 'marker' && o.cat === catId) n++;
  }
  return n;
}

// 检查撤回/重做某条命令是否会破坏其它图片的数据
function blockedReason(cmd, forward) {
  if (cmd.k === 'batch') {
    for (const c of cmd.cmds) { const r = blockedReason(c, forward); if (r) return r; }
    return null;
  }
  const deletesCat = (cmd.k === 'catAdd' && !forward) || (cmd.k === 'catRemove' && forward);
  if (deletesCat && markersOfCategoryElsewhere(cmd.cat.id) > 0) return t('catUsedElsewhere', { name: cmd.cat.name });
  const addsItems = (cmd.k === 'add' && forward) || (cmd.k === 'remove' && !forward);
  if (addsItems && cmd.items.some(it => it.obj.type === 'marker' && !findCat(it.obj.cat))) return t('catMissing');
  return null;
}

function undo() {
  const u = state.history.undo;
  const cmd = u[u.length - 1];
  if (!cmd) { toast(t('nothingToUndo')); return false; }
  const why = blockedReason(cmd, false);
  if (why) { toast(why, 4000); return false; }
  u.pop();
  applyCommand(cmd, false);
  state.history.redo.push(cmd);
  onDocChanged();
  return true;
}

function redo() {
  const r = state.history.redo;
  const cmd = r[r.length - 1];
  if (!cmd) { toast(t('nothingToRedo')); return false; }
  const why = blockedReason(cmd, true);
  if (why) { toast(why, 4000); return false; }
  r.pop();
  applyCommand(cmd, true);
  state.history.undo.push(cmd);
  onDocChanged();
  return true;
}

const entryStateId = (e) => {
  const u = e.history.undo;
  return u.length ? u[u.length - 1].id : 0;
};
const currentStateId = () => (state.entry ? entryStateId(state.entry) : 0);
const isEntryDirty = (e) => entryStateId(e) !== e.savedStateId;
const isDirty = () => !!state.ws && (state.ws.structVersion !== state.ws.savedStructVersion ||
  Object.values(state.ws.images).some(isEntryDirty));
// 文件夹/图片的增删改名等结构变化
function markStructChanged() {
  if (state.ws) state.ws.structVersion++;
}

// ---- 便捷操作 ----------------------------------------------------------------
function addObject(obj) {
  obj.id = newId('o');
  execute({ k: 'add', items: [{ obj: clone(obj), index: state.doc.objects.length }] });
  return obj.id;
}

function removeObjects(ids) {
  const items = [];
  state.doc.objects.forEach((o, i) => { if (ids.includes(o.id)) items.push({ obj: clone(o), index: i }); });
  if (items.length) execute({ k: 'remove', items });
}

function modifyObject(id, after, before) {
  const o = findObj(id);
  if (!o) return;
  if (!before) {
    before = {};
    for (const key of Object.keys(after)) before[key] = o[key] === undefined ? null : clone(o[key]);   // 原来没有的属性记为 null，撤回时能清除
  }
  if (JSON.stringify(before) === JSON.stringify(after)) return;
  execute({ k: 'mod', oid: id, before: clone(before), after: clone(after) });
}

// 把若干修改合并为一条撤回记录。mods: [{id, after, before?}]
function modifyObjects(mods, label) {
  const cmds = [];
  for (const m of mods) {
    const o = findObj(m.id);
    if (!o) continue;
    let before = m.before;
    if (!before) { before = {}; for (const key of Object.keys(m.after)) before[key] = clone(o[key]); }
    if (JSON.stringify(before) === JSON.stringify(m.after)) continue;
    cmds.push({ k: 'mod', oid: m.id, before: clone(before), after: clone(m.after) });
  }
  if (!cmds.length) return;
  if (cmds.length === 1) execute(cmds[0]);
  else execute({ k: 'batch', label: label || 'mod', cmds });
}

// 一次添加多个对象（一条撤回记录）；返回新 id 列表
function addObjects(objs, label) {
  if (!objs.length) return [];
  let index = state.doc.objects.length;
  const items = objs.map(o => { const obj = Object.assign(clone(o), { id: newId('o') }); return { obj, index: index++ }; });
  execute({ k: 'add', label, items });
  return items.map(it => it.obj.id);
}

function modifyCategory(id, after, before) {
  const c = findCat(id);
  if (!c) return;
  if (!before) {
    before = {};
    for (const key of Object.keys(after)) before[key] = c[key];
  }
  if (JSON.stringify(before) === JSON.stringify(after)) return;
  execute({ k: 'catMod', cid: id, before: clone(before), after: clone(after) });
}

function addCategory() {
  const doc = state.doc;
  const used = new Set(doc.categories.map(c => c.color));
  const color = PRESET_COLORS.slice(1).concat(PRESET_COLORS[0]).find(c => !used.has(c)) || PRESET_COLORS[doc.categories.length % 8];
  const shape = 'circle';
  let n = doc.categories.length + 1;
  const names = new Set(doc.categories.map(c => c.name));
  while (names.has(t('defaultCatName', { n }))) n++;
  const cat = { id: 'c' + (state.ws.nextCatId++), name: t('defaultCatName', { n }), color, shape, size: 10 };
  state.currentCat = cat.id; // 先设定，使刷新后的列表高亮新类别
  execute({ k: 'catAdd', cat, index: doc.categories.length });
  return cat.id;
}

function removeCategory(id) {
  const doc = state.doc;
  const index = doc.categories.findIndex(c => c.id === id);
  if (index < 0) return;
  const ms = [];
  doc.objects.forEach((o, i) => { if (o.type === 'marker' && o.cat === id) ms.push({ obj: clone(o), index: i }); });
  execute({ k: 'catRemove', cat: clone(doc.categories[index]), index, markers: ms });
}

// 对象位置属性（用于移动命令）
function positionOf(o) {
  if (o.type === 'arrow' || o.type === 'measure') return { x1: o.x1, y1: o.y1, x2: o.x2, y2: o.y2 };
  if (o.type === 'roi' && o.kind === 'poly') return { pts: clone(o.pts) };
  if (o.type === 'inset') return { x: o.x, y: o.y, sx: o.sx, sy: o.sy };
  return { x: o.x, y: o.y };
}
// part：局部放大插图只移动放大框（'box'）或源区域（'src'）；不指定时整体移动
function translated(o, dx, dy, part) {
  if (o.type === 'roi' && o.kind === 'poly') return { pts: o.pts.map(p => ({ x: p.x + dx, y: p.y + dy })) };
  if (o.type === 'arrow' || o.type === 'measure') return { x1: o.x1 + dx, y1: o.y1 + dy, x2: o.x2 + dx, y2: o.y2 + dy };
  if (o.type === 'inset') {
    if (part === 'src') return { x: o.x, y: o.y, sx: o.sx + dx, sy: o.sy + dy };
    if (part === 'box') return { x: o.x + dx, y: o.y + dy, sx: o.sx, sy: o.sy };
    return { x: o.x + dx, y: o.y + dy, sx: o.sx + dx, sy: o.sy + dy };
  }
  return { x: o.x + dx, y: o.y + dy };
}

const assetFileName = (a) => `assets/${a.id}.${MIME_EXT[a.mime] || 'img'}`;

// ---- 项目序列化（不含图片二进制数据；图片单独存入 zip） ------------------------
function serializeEntry(e) {
  const doc = Object.assign({}, e.doc);
  delete doc.categories;
  return {
    id: e.id, folderId: e.folderId, no: e.no, customName: e.customName || null, done: !!e.done,
    file: e.file, doc, history: e.history, view: e.view || null
  };
}

function serializeWorkspace() {
  const ws = state.ws;
  return {
    format: WS_FORMAT_ID,
    formatVersion: WS_FORMAT_VERSION,
    appVersion: APP_VERSION,
    savedAt: new Date().toISOString(),
    categories: ws.categories,
    nextCatId: ws.nextCatId,
    folders: ws.folders,
    nextFolderId: ws.nextFolderId,
    nextImageId: ws.nextImageId,
    activeFolderId: ws.activeFolderId,
    activeId: state.activeId,
    nextAssetId: ws.nextAssetId || 1,
    stats: ws.stats || null,
    template: ws.template || null,    // 所用模板 {id, name, version}
    tplDefaults: ws.tplDefaults || null,   // 模板的网格 / 比例尺（新图片继承）          // 数据统计设置（自定义字段、对照组、浓度参数、导出选项）
    assets: Object.values(ws.assets || {}).map(a => ({ id: a.id, name: a.name, mime: a.mime, width: a.width, height: a.height, sha256: a.sha256, file: assetFileName(a) })),
    images: orderedEntries().map(serializeEntry)
  };
}

// ===== render.js =====
// ---------------------------------------------------------------------------
// render.js — 视图变换、绘制与命中检测
// ---------------------------------------------------------------------------
const FONT_FAMILY = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif';
const SELECT_COLOR = '#00e5ff';
const AI_COLOR = '#ffd400';

// 两层画布：底层只画图片（仅在缩放/平移/窗口变化时重画），上层画标注（编辑时只重画这一层）。
// 这样每次点击加点都不必重画整张大图。
const view = {
  canvas: null, ctx: null,       // 上层：标注（接收鼠标事件）
  base: null, bctx: null,        // 底层：图片
  dpr: 1, cssW: 0, cssH: 0, pending: false,
  rect: { left: 0, top: 0 },     // 画布位置缓存（避免每次指针移动都触发布局计算）
  baseKey: '',                   // 底层上次绘制时的视图参数
  imageVersion: 0,
  pyramid: null,                 // 预解码的多级缩小图（ImageBitmap），由大到小
  draft: null,                   // 正在绘制的临时对象
  selRect: null,                 // 正在拖出的选择框（多边形）
  lassoPts: null,                // 正在画的套索路径
  hoverId: null,                 // 悬停高亮的对象
  crop: null,                    // 裁剪模式中的裁剪框（图片坐标）
  insetPart: 'box',              // 选中局部放大插图时编辑的部分：'box' 放大框 / 'src' 源区域
  hiddenId: null                 // 正在编辑的文字对象（编辑时隐藏）
};
const measureCtx = document.createElement('canvas').getContext('2d');

function initRenderer(canvas, base) {
  view.canvas = canvas;
  view.ctx = canvas.getContext('2d');
  view.base = base;
  view.bctx = base.getContext('2d', { alpha: false });
  view.stageBg = getComputedStyle(canvas.parentElement).backgroundColor || '#3b3d41';
  new ResizeObserver(resizeCanvas).observe(canvas.parentElement);
  window.addEventListener('resize', updateRect);
  window.addEventListener('scroll', updateRect, true);
  resizeCanvas();
}

function updateRect() {
  const r = view.canvas.getBoundingClientRect();
  view.rect = { left: r.left, top: r.top };
}

function resizeCanvas() {
  const r = view.canvas.parentElement.getBoundingClientRect();
  view.dpr = window.devicePixelRatio || 1;
  view.cssW = r.width;
  view.cssH = r.height;
  for (const c of [view.canvas, view.base]) {
    c.width = Math.max(1, Math.round(r.width * view.dpr));
    c.height = Math.max(1, Math.round(r.height * view.dpr));
    c.style.width = r.width + 'px';
    c.style.height = r.height + 'px';
  }
  view.baseKey = '';
  updateRect();
  requestRender();
}

function requestRender() {
  if (view.pending) return;
  view.pending = true;
  requestAnimationFrame(() => { view.pending = false; renderNow(); });
}

// ---- 图片预解码与多级缩小图 ------------------------------------------------------
// 大图（如 6000×4000）每次绘制都可能被浏览器重新解码，造成明显卡顿。
// 打开时一次性解码为 ImageBitmap，并生成逐级减半的缩小图；缩小显示时使用合适的级别，
// 既快又减少锯齿。
function releasePyramid() {
  view.imageVersion++;
  if (view.pyramid) view.pyramid.forEach(l => { if (l !== state.img && l.close) l.close(); });
  view.pyramid = null;
  view.baseKey = '';
}

async function buildPyramid(img) {
  const version = ++view.imageVersion;
  view.pyramid = null;
  view.baseKey = '';
  if (typeof createImageBitmap !== 'function') return;
  try {
    const isBitmap = typeof ImageBitmap !== 'undefined' && img instanceof ImageBitmap;
    const levels = [isBitmap ? img : await createImageBitmap(img)];
    let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    while (Math.max(w, h) > 1024) {
      w = Math.max(1, Math.round(w / 2));
      h = Math.max(1, Math.round(h / 2));
      const prev = levels[levels.length - 1];
      let next;
      try {
        next = await createImageBitmap(prev, { resizeWidth: w, resizeHeight: h, resizeQuality: 'medium' });
      } catch (e) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.imageSmoothingQuality = 'medium';
        cx.drawImage(prev, 0, 0, w, h);
        next = await createImageBitmap(c);
      }
      levels.push(next);
    }
    if (version !== view.imageVersion) { levels.slice(1).forEach(l => l.close && l.close()); return; }
    view.pyramid = levels;
    view.baseKey = '';
    requestRender();
  } catch (e) {
    if (version === view.imageVersion) view.pyramid = null; // 退回直接绘制原图
  }
}

function pickImageLevel(scale) {
  const levels = view.pyramid;
  if (!levels) return state.img;
  const needed = state.doc.image.width * scale * view.dpr;
  for (let i = levels.length - 1; i >= 0; i--) if (levels[i].width >= needed) return levels[i];
  return levels[0];
}

// ---- 视图（缩放/平移） --------------------------------------------------------
function screenToImage(clientX, clientY) {
  const r = view.rect;
  const v = state.view;
  return { x: (clientX - r.left - v.tx) / v.scale, y: (clientY - r.top - v.ty) / v.scale };
}
function imageToClient(x, y) {
  const r = view.rect;
  const v = state.view;
  return { x: r.left + v.tx + x * v.scale, y: r.top + v.ty + y * v.scale };
}

function zoomAt(factor, sx, sy) {
  const v = state.view;
  if (sx === undefined) { sx = view.cssW / 2; sy = view.cssH / 2; }
  const ns = clamp(v.scale * factor, 0.01, 64);
  v.tx = sx - (sx - v.tx) * ns / v.scale;
  v.ty = sy - (sy - v.ty) * ns / v.scale;
  v.scale = ns;
  requestRender();
  updateZoomLabel();
}

function fitView() {
  if (!state.doc) return;
  if (!state.entry.view) state.entry.view = { scale: 1, tx: 0, ty: 0 };
  const { width, height } = state.doc.image;
  const v = state.view;
  v.scale = Math.min(view.cssW / width, view.cssH / height) * 0.96 || 1;
  v.tx = (view.cssW - width * v.scale) / 2;
  v.ty = (view.cssH - height * v.scale) / 2;
  requestRender();
  updateZoomLabel();
}

function actualSize() {
  zoomAt(1 / state.view.scale);
}

// ---- 尺寸换算 -----------------------------------------------------------------
// 返回绘制选项。forExport=true 时用于导出图片（比例 1:1 原图像素）。
function drawOptions() {
  const unit = unitOf(state.doc);
  const scale = state.view.scale;
  const fixed = state.settings.fixedSize;
  return {
    unit,
    markerD: (cat) => (fixed ? cat.size / scale : cat.size * unit),
    numbers: state.showNumbers,
    cull: null,
    img: null           // 局部放大插图取像的位图；null = 当前显示图（含图像调整）
  };
}

// 屏幕绘制时只画可见区域内的标记（图片坐标）
function visibleRect() {
  const v = state.view;
  return { x0: -v.tx / v.scale, y0: -v.ty / v.scale, x1: (view.cssW - v.tx) / v.scale, y1: (view.cssH - v.ty) / v.scale };
}

// ---- 主绘制 -------------------------------------------------------------------
function renderBase() {
  const { bctx, base, dpr } = view;
  const v = state.view;
  const key = state.doc && state.img ? [v.scale, v.tx, v.ty, base.width, base.height, view.imageVersion, !!view.pyramid, adjSig()].join(',') : 'empty';
  if (key === view.baseKey) return;
  view.baseKey = key;
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.fillStyle = view.stageBg;
  bctx.fillRect(0, 0, base.width, base.height);
  if (!state.doc || !state.img) return;
  const { width, height } = state.doc.image;
  bctx.setTransform(dpr * v.scale, 0, 0, dpr * v.scale, dpr * v.tx, dpr * v.ty);
  // 放大到 3 倍以上时显示真实像素（不插值），便于判断细节
  bctx.imageSmoothingEnabled = v.scale * dpr < 3;
  bctx.imageSmoothingQuality = 'medium';
  bctx.drawImage(displayLevel(v.scale), 0, 0, width, height);   // 已应用图像调整（只改显示）
}

function renderNow() {
  renderBase();
  const { ctx, canvas, dpr } = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!state.doc || !state.img) return;
  const v = state.view;
  ctx.setTransform(dpr * v.scale, 0, 0, dpr * v.scale, dpr * v.tx, dpr * v.ty);
  const opts = drawOptions();
  opts.cull = visibleRect();
  drawGrid(ctx, opts, false);
  drawPlate(ctx, opts, false);
  if (state.showAnnotations) {
    ctx.globalAlpha = state.opacity;
    drawAll(ctx, state.doc.objects, opts, view.hiddenId);
    ctx.globalAlpha = 1;
  }
  drawScaleBar(ctx, opts);
  if (view.draft) drawObject(ctx, view.draft, opts);
  const px = 1 / v.scale;   // 1 个屏幕像素对应的图片像素
  // AI 标出的点：外加虚线圈，便于核查
  if (state.showAnnotations && state.showAiMarks) {
    const ai = [];
    for (const o of state.doc.objects) if (o.type === 'marker' && o.src === 'ai') ai.push(o);
    if (ai.length) {
      ctx.save();
      ctx.strokeStyle = AI_COLOR;
      ctx.lineWidth = 1.2 * px;
      ctx.setLineDash([3 * px, 2.5 * px]);
      ctx.beginPath();
      for (const o of ai) {
        const cat = findCat(o.cat);
        const r = (cat ? opts.markerD(cat) / 2 : 4 * px) + 3 * px;
        ctx.moveTo(o.x + r, o.y);
        ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
      }
      ctx.stroke();
      ctx.restore();
    }
  }
  drawAiSuggestions(ctx, opts, px);
  drawGridOverlay(ctx, px);
  drawCellCounts(ctx, opts, false);
  drawCropOverlay(ctx, px);
  // 选区轮廓（框选 / 套索）
  const poly = view.selRect || view.lassoPts || (state.selection.length ? state.region : null);
  if (poly && poly.length > 1) {
    ctx.save();
    ctx.lineWidth = 1.5 * px;
    ctx.setLineDash([6 * px, 4 * px]);
    ctx.strokeStyle = SELECT_COLOR;
    ctx.fillStyle = 'rgba(0,229,255,0.06)';
    ctx.beginPath();
    poly.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    if (!view.lassoPts) ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  // 悬停高亮（选择工具或按住 Ctrl 时）
  if (view.hoverId && state.showAnnotations && !state.selection.includes(view.hoverId)) {
    const o = findObj(view.hoverId);
    if (o) {
      const b = objectBounds(o, opts);
      ctx.save();
      ctx.strokeStyle = 'rgba(0,229,255,0.75)';
      ctx.lineWidth = 2 * px;
      if (o.type === 'marker') { ctx.beginPath(); ctx.ellipse(o.x, o.y, b.w / 2 + 3 * px, b.h / 2 + 3 * px, 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (o.type === 'inset') {
        // 只高亮光标所在的部分
        const part = input.hoverPart === 'src' ? insetSrcRect(o) : insetBoxRect(o);
        ctx.strokeRect(part.x - 3 * px, part.y - 3 * px, part.w + 6 * px, part.h + 6 * px);
      } else ctx.strokeRect(b.x - 3 * px, b.y - 3 * px, b.w + 6 * px, b.h + 6 * px);
      ctx.restore();
    }
  }
  // 选中的对象：可编辑时画引导框与手柄；否则标记画青色圆圈、其它对象画虚线框
  if (state.selection.length && state.showAnnotations) {
    const objs = state.selection.map(findObj).filter(Boolean);
    const frame = currentFrame(opts);
    if (frame) {
      if (objs.length > 1) drawSelectionRings(ctx, objs, opts, px);
      drawFrame(ctx, frame.f, frame.handles, px, opts);
    } else {
      drawSelectionRings(ctx, objs, opts, px);
    }
  }
  drawLiveLabel();
  drawLoupe();
}

// 拖动手柄时在光标旁显示尺寸
function drawLiveLabel() {
  const L = view.liveLabel;
  if (!L) return;
  const { ctx, dpr } = view;
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `12px ${FONT_FAMILY}`;
  const w = ctx.measureText(L.text).width + 12;
  const x = clamp(L.x - view.rect.left + 16, 4, view.cssW - w - 4), y = clamp(L.y - view.rect.top + 18, 4, view.cssH - 24);
  ctx.fillStyle = 'rgba(17,17,17,0.82)';
  ctx.fillRect(x, y, w, 20);
  ctx.fillStyle = '#7fe9ff';
  ctx.textBaseline = 'middle';
  ctx.fillText(L.text, x + 6, y + 10);
  ctx.restore();
}

function drawSelectionRings(ctx, objs, opts, px) {
  ctx.save();
  ctx.strokeStyle = SELECT_COLOR;
  ctx.lineWidth = 2 * px;
  ctx.beginPath();
  const boxes = [];
  for (const o of objs) {
    if (o.type === 'marker') {
      const dm = markerDims(o, findCat(o.cat), opts);
      const rx = dm.w / 2 + 2.5 * px, ry = dm.h / 2 + 2.5 * px;
      ctx.moveTo(o.x + rx, o.y);
      ctx.ellipse(o.x, o.y, rx, ry, 0, 0, Math.PI * 2);
    } else boxes.push(objectBounds(o, opts));
  }
  ctx.stroke();
  ctx.lineWidth = 1.5 * px;
  ctx.setLineDash([5 * px, 4 * px]);
  const pad = 4 * px;
  boxes.forEach(b => ctx.strokeRect(b.x - pad, b.y - pad, b.w + 2 * pad, b.h + 2 * pad));
  ctx.restore();
}

// 当前可编辑的引导框（选择/套索工具或按住 Ctrl 时；锁定对象没有手柄）
function currentFrame(opts) {
  if (!state.doc || !state.selection.length) return null;
  if (!(state.tool === 'select' || state.tool === 'lasso' || input.ctrlHeld)) return null;
  const objs = state.selection.map(findObj).filter(Boolean);
  if (!objs.length || objs.some(o => o.locked)) return null;
  const f = frameOf(objs, opts || drawOptions());
  return { f, objs, handles: frameHandles(f, state.view.scale) };
}

// AI 核查建议：可能漏数（绿色虚线圈 +）、可能误标（橙色 ×）
function drawAiSuggestions(ctx, opts, px) {
  const sug = state.aiSuggest;
  if (!sug || sug.entryId !== state.activeId) return;
  const r = Math.max(6 * px, (sug.radius || 0));
  ctx.save();
  ctx.lineWidth = 2 * px;
  ctx.setLineDash([4 * px, 3 * px]);
  ctx.strokeStyle = '#39d353';
  ctx.beginPath();
  for (const q of sug.missed) { ctx.moveTo(q.x + r, q.y); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = '#ff9f1a';
  ctx.lineWidth = 2.5 * px;
  ctx.beginPath();
  for (const id of sug.falsePositive) {
    const o = findObj(id);
    if (!o) continue;
    const k = r * 0.9;
    ctx.moveTo(o.x - k, o.y - k); ctx.lineTo(o.x + k, o.y + k);
    ctx.moveTo(o.x + k, o.y - k); ctx.lineTo(o.x - k, o.y + k);
  }
  ctx.stroke();
  ctx.restore();
}

// 先按顺序画箭头/方框/文字，再按类别批量画标记点（批量绘制更快）；
// 插入的图片与局部放大框属于“图上覆盖物”，最后绘制，会遮住其下方的内容（与论文插图一致）
const isOverlay = (o) => o.type === 'image' || o.type === 'inset';
function drawAll(ctx, objects, opts, skipId) {
  const groups = new Map();
  const overlays = [];
  state.doc.categories.forEach(c => groups.set(c.id, []));
  const seq = {};
  const custom = [];   // 单独设置过大小的标记逐个绘制
  for (const o of objects) {
    if (o.type === 'marker') {
      seq[o.cat] = (seq[o.cat] || 0) + 1;
      if (o.mw != null || o.mh != null) { custom.push({ o, n: seq[o.cat] }); continue; }
      const g = groups.get(o.cat);
      if (g) g.push({ x: o.x, y: o.y, n: seq[o.cat] });
    } else if (o.id !== skipId) {
      if (isOverlay(o)) overlays.push(o); else drawObject(ctx, o, opts);
    }
  }
  for (const cat of state.doc.categories) {
    let pts = groups.get(cat.id);
    if (!pts.length) continue;
    const d = opts.markerD(cat);
    if (opts.cull) {
      const c = opts.cull, m = d * 2;
      pts = pts.filter(p => p.x >= c.x0 - m && p.x <= c.x1 + m && p.y >= c.y0 - m && p.y <= c.y1 + m);
    }
    drawMarkerBatch(ctx, pts, d, cat.shape, cat.color);
    // 屏幕上字号小于 5 像素时序号无法辨认，不绘制
    if (opts.numbers && (!opts.cull || d * state.view.scale >= 5)) drawNumberBatch(ctx, pts, d, cat.color);
  }
  for (const { o, n } of custom) {
    const cat = findCat(o.cat);
    if (!cat) continue;
    const dm = markerDims(o, cat, opts);
    drawMarkerScaled(ctx, o.x, o.y, dm.w, dm.h, cat.shape, cat.color);
    if (opts.numbers) drawNumberBatch(ctx, [{ x: o.x, y: o.y, n }], Math.max(dm.w, dm.h), cat.color);
  }
  for (const o of overlays) drawObject(ctx, o, opts);
}

function drawObject(ctx, o, opts) {
  switch (o.type) {
    case 'marker': {
      const cat = findCat(o.cat);
      if (cat) { const dm = markerDims(o, cat, opts); drawMarkerScaled(ctx, o.x, o.y, dm.w, dm.h, cat.shape, cat.color); }
      break;
    }
    case 'arrow': drawArrow(ctx, o, opts.unit); break;
    case 'shape': case 'rect': case 'ellipse': drawShape(ctx, o, opts.unit); break;
    case 'text': drawText(ctx, o, opts.unit); break;
    case 'image': drawImageObject(ctx, o, opts); break;
    case 'inset': drawInset(ctx, o, opts); break;
    case 'measure': drawMeasure(ctx, o, opts); break;
    case 'roi': drawRoi(ctx, o, opts); break;
  }
}

// ---- 标记点 ---------------------------------------------------------------------
const STROKED_SHAPES = new Set(['ring', 'cross', 'plus']);

// 向当前路径追加一个标记形状的子路径
function addShapePath(ctx, x, y, d, shape) {
  const r = d / 2;
  switch (shape) {
    case 'square': { const h = r * 0.88; ctx.rect(x - h, y - h, 2 * h, 2 * h); break; }
    case 'triangle':
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r * 0.866, y + r * 0.5);
      ctx.lineTo(x - r * 0.866, y + r * 0.5);
      ctx.closePath();
      break;
    case 'diamond':
      ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath();
      break;
    case 'star':
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 ? r * 0.45 : r;
        const px = x + rr * Math.cos(a), py = y + rr * Math.sin(a);
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      break;
    case 'ring': {
      const rr = r - d * 0.11;
      ctx.moveTo(x + rr, y);
      ctx.arc(x, y, rr, 0, Math.PI * 2);
      break;
    }
    case 'cross': {
      const k = r * 0.75;
      ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k);
      ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k);
      break;
    }
    case 'plus':
      ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
      ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
      break;
    default:
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
  }
}

// 同一类别的所有标记合并为一条路径绘制：每个标记带对比色描边，保证在深/浅背景上都可见
function drawMarkerBatch(ctx, pts, d, shape, color) {
  if (!pts.length) return;
  const outline = contrastColor(color);
  const ow = Math.max(d * 0.1, 0.0001);
  ctx.save();
  ctx.setLineDash([]);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const p of pts) addShapePath(ctx, p.x, p.y, d, shape);
  if (STROKED_SHAPES.has(shape)) {
    const lw = d * 0.22;
    ctx.lineCap = 'round';
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw + 2 * ow;
    ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.stroke();
  } else {
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = ow;
    ctx.stroke();
  }
  ctx.restore();
}

function drawMarker(ctx, x, y, d, shape, color) {
  drawMarkerBatch(ctx, [{ x, y }], d, shape, color);
}

function drawNumberBatch(ctx, pts, d, color) {
  const fs = Math.max(d * 0.95, 0.0001);
  ctx.save();
  ctx.font = `bold ${fs}px ${FONT_FAMILY}`;
  ctx.textBaseline = 'bottom';
  ctx.lineJoin = 'round';
  ctx.lineWidth = fs * 0.22;
  ctx.strokeStyle = contrastColor(color);
  ctx.fillStyle = color;
  const dx = d * 0.45, dy = -d * 0.3;
  for (const p of pts) ctx.strokeText(String(p.n), p.x + dx, p.y + dy);
  for (const p of pts) ctx.fillText(String(p.n), p.x + dx, p.y + dy);
  ctx.restore();
}

// ---- 线型 -----------------------------------------------------------------------
function applyDash(ctx, dash, lw) {
  if (dash === 'dashed') { ctx.setLineDash([lw * 4, lw * 2.5]); ctx.lineCap = 'butt'; }
  else if (dash === 'dotted') { ctx.setLineDash([0.001, lw * 2.2]); ctx.lineCap = 'round'; }
  else { ctx.setLineDash([]); ctx.lineCap = 'butt'; }
}

// ---- 箭头 -----------------------------------------------------------------------
function arrowGeometry(o, unit) {
  const lw = o.style.width * unit;
  const dx = o.x2 - o.x1, dy = o.y2 - o.y1;
  const len = Math.hypot(dx, dy);
  const headLen = Math.min(lw * 3.5 + 4 * unit, len * (o.style.head === 'double' ? 0.45 : 0.8));
  return { lw, len, ux: dx / (len || 1), uy: dy / (len || 1), headLen, headHalf: headLen * 0.55 };
}

function drawArrow(ctx, o, unit) {
  const s = o.style;
  const g = arrowGeometry(o, unit);
  if (g.len < 1e-6) return;
  const hasEnd = s.head !== 'none';
  const hasStart = s.head === 'double';
  const inset = s.head === 'open' ? g.headLen : g.headLen * 0.85;
  const sx = hasStart ? o.x1 + g.ux * inset : o.x1;
  const sy = hasStart ? o.y1 + g.uy * inset : o.y1;
  const ex = hasEnd ? o.x2 - g.ux * inset : o.x2;
  const ey = hasEnd ? o.y2 - g.uy * inset : o.y2;
  ctx.save();
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  ctx.lineWidth = g.lw;
  applyDash(ctx, s.dash, g.lw);
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineJoin = 'miter';
  const head = (tx, ty, ux, uy) => {
    const bx = tx - ux * g.headLen, by = ty - uy * g.headLen;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(bx - uy * g.headHalf, by + ux * g.headHalf);
    ctx.lineTo(bx + uy * g.headHalf, by - ux * g.headHalf);
    ctx.closePath();
    if (s.head === 'open') { ctx.lineWidth = Math.max(g.lw * 0.8, unit * 0.8); ctx.stroke(); }
    else ctx.fill();
  };
  if (hasEnd) head(o.x2, o.y2, g.ux, g.uy);
  if (hasStart) head(o.x1, o.y1, -g.ux, -g.uy);
  ctx.restore();
}

// ---- 文字 -----------------------------------------------------------------------
// 文字框 o = {type:'text', x, y, text, style, w?, h?}
//   w / h（图片像素）：固定框大小；没有 w 时按内容自动大小（不自动换行）。
//   有 w 时在框宽内自动换行（英文按单词、中日韩按字）；内容比 h 高时框自动加高。
// style：fontSize, color, background:'none'|'fill'|'frame'|'fillframe', bgColor, bgOpacity, borderColor, borderWidth,
//   fontFamily:'sans'|'serif'|'mono', bold, italic, underline, strike,
//   align:'left'|'center'|'right'|'justify', valign:'top'|'middle'|'bottom', lineHeight, autoFit（字号随框自动调整）
const TEXT_FAMILIES = {
  sans: FONT_FAMILY,
  serif: '"Times New Roman","Songti SC","SimSun","Noto Serif CJK SC",serif',
  mono: '"Consolas","Menlo","Courier New",monospace'
};
const textFont = (s, fs) => `${s.italic ? 'italic ' : ''}${s.bold ? 'bold ' : ''}${fs}px ${TEXT_FAMILIES[s.fontFamily] || FONT_FAMILY}`;
const textLineH = (s) => (+s.lineHeight > 0 ? +s.lineHeight : 1.25);

// 按最大宽度换行：返回 [{t, last}]（last = 段落最后一行，两端对齐时不拉伸）
function wrapText(text, maxW, font) {
  measureCtx.font = font;
  const out = [];
  for (const para of String(text).split('\n')) {
    if (!(maxW > 0)) { out.push({ t: para, last: true }); continue; }
    // 分词：连续的拉丁字母/数字为一词（含其后的空格），其它字符（中日韩、标点）各自成词
    const tokens = para.match(/[A-Za-z0-9À-ɏ'’\-.,;:!?%)\]]+\s*|\s+|./gu) || [''];
    let line = '';
    for (const tk of tokens) {
      const test = line + tk;
      if (line && measureCtx.measureText(test.replace(/\s+$/, '')).width > maxW) {
        out.push({ t: line.replace(/\s+$/, ''), last: false });
        line = tk.replace(/^\s+/, '');
        // 单个词比框还宽：按字符拆
        while (line && measureCtx.measureText(line).width > maxW && line.length > 1) {
          let k = line.length - 1;
          while (k > 1 && measureCtx.measureText(line.slice(0, k)).width > maxW) k--;
          out.push({ t: line.slice(0, k), last: false });
          line = line.slice(k);
        }
      } else line = test;
    }
    out.push({ t: line.replace(/\s+$/, ''), last: true });
  }
  return out;
}

function textLayoutAt(o, fs) {
  const s = o.style;
  const pad = fs * 0.25, lineH = fs * textLineH(s);
  const font = textFont(s, fs);
  const fixed = o.w > 0;
  const lines = wrapText(o.text, fixed ? o.w - 2 * pad : 0, font);
  measureCtx.font = font;
  const widths = lines.map(l => measureCtx.measureText(l.t).width);
  const contentW = Math.max(fs * 0.5, ...widths) + 2 * pad;
  const contentH = lines.length * lineH + 2 * pad;
  const w = fixed ? o.w : contentW;
  const h = fixed && o.h > 0 ? Math.max(o.h, contentH) : contentH;
  return { fs, font, lines, widths, lineH, pad, w, h, contentH, fixed };
}

function textLayout(o, unit) {
  const s = o.style;
  if (s.autoFit && o.w > 0 && o.h > 0) {
    // 字号随框自动调整：能放进框内的最大字号（二分查找）
    let lo = 1, hi = Math.max(2, Math.min(o.w, o.h * 2));
    for (let k = 0; k < 18; k++) {
      const mid = (lo + hi) / 2;
      const L = textLayoutAt(o, mid);
      const tooWide = L.lines.some((l, i) => L.widths[i] > o.w - 2 * L.pad + 0.5);
      if (L.contentH <= o.h && !tooWide) lo = mid; else hi = mid;
    }
    return textLayoutAt(o, lo);
  }
  return textLayoutAt(o, s.fontSize * unit);
}

function drawText(ctx, o, unit) {
  const L = textLayout(o, unit);
  const s = o.style;
  const bg = s.background || 'none';
  ctx.save();
  if (bg === 'fill' || bg === 'fillframe') {
    if (s.bgColor) { ctx.globalAlpha = s.bgOpacity === undefined ? 1 : s.bgOpacity; ctx.fillStyle = s.bgColor; }
    else ctx.fillStyle = luminance(s.color) > 0.35 ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.75)';
    ctx.fillRect(o.x, o.y, L.w, L.h);
    ctx.globalAlpha = 1;
  }
  if (bg === 'frame' || bg === 'fillframe') {
    ctx.strokeStyle = s.borderColor || s.color;
    ctx.lineWidth = s.borderWidth > 0 ? s.borderWidth * unit : Math.max(L.fs * 0.06, unit);
    ctx.setLineDash([]);
    ctx.strokeRect(o.x, o.y, L.w, L.h);
  }
  ctx.font = L.font;
  ctx.textBaseline = 'top';
  ctx.fillStyle = s.color;
  const align = s.align || 'left';
  const innerW = L.w - 2 * L.pad;
  const vk = s.valign === 'middle' ? 0.5 : s.valign === 'bottom' ? 1 : 0;
  const y0 = o.y + L.pad + (L.h - L.contentH) * vk;
  const halo = bg === 'none';
  if (halo) { ctx.lineJoin = 'round'; ctx.lineWidth = L.fs * 0.12; ctx.strokeStyle = contrastColor(s.color); }
  const deco = [];
  L.lines.forEach((ln, i) => {
    const y = y0 + i * L.lineH + L.fs * 0.1;
    const lw = L.widths[i];
    if (align === 'justify' && !ln.last && L.fixed && ln.t.length > 1) {
      // 两端对齐：有空格（西文）时把剩余宽度分到词间空格，否则（中日韩）分到字符之间
      const words = ln.t.split(/( +)/).filter(Boolean);
      const gaps = words.filter(w => /^ +$/.test(w)).length;
      const parts = gaps ? words : Array.from(ln.t);
      const extra = (innerW - lw) / (gaps || parts.length - 1);
      let x = o.x + L.pad;
      for (const part of parts) {
        const isGap = gaps && /^ +$/.test(part);
        if (!isGap) { if (halo) ctx.strokeText(part, x, y); ctx.fillText(part, x, y); }
        x += ctx.measureText(part).width + (gaps ? (isGap ? extra : 0) : extra);
      }
      deco.push([o.x + L.pad, innerW, y]);
      return;
    }
    const x = align === 'center' ? o.x + L.w / 2 - lw / 2 : align === 'right' ? o.x + L.w - L.pad - lw : o.x + L.pad;
    if (halo) ctx.strokeText(ln.t, x, y);
    ctx.fillText(ln.t, x, y);
    deco.push([x, lw, y]);
  });
  // 下划线、删除线
  if (s.underline || s.strike) {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = Math.max(L.fs * 0.06, 0.5 * unit);
    ctx.beginPath();
    for (const [x, w, y] of deco) {
      if (!w) continue;
      if (s.underline) { ctx.moveTo(x, y + L.fs * 0.98); ctx.lineTo(x + w, y + L.fs * 0.98); }
      if (s.strike) { ctx.moveTo(x, y + L.fs * 0.5); ctx.lineTo(x + w, y + L.fs * 0.5); }
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---- 包围盒与命中检测 ------------------------------------------------------------
function objectBounds(o, opts) {
  switch (o.type) {
    case 'marker': {
      const dm = markerDims(o, findCat(o.cat), opts);
      return { x: o.x - dm.w / 2, y: o.y - dm.h / 2, w: dm.w, h: dm.h };
    }
    case 'arrow': {
      const pad = arrowGeometry(o, opts.unit).headHalf;
      const x = Math.min(o.x1, o.x2) - pad, y = Math.min(o.y1, o.y2) - pad;
      return { x, y, w: Math.abs(o.x2 - o.x1) + 2 * pad, h: Math.abs(o.y2 - o.y1) + 2 * pad };
    }
    case 'text': {
      const L = textLayout(o, opts.unit);
      return { x: o.x, y: o.y, w: L.w, h: L.h };
    }
    case 'image': return imageObjBounds(o, opts);
    case 'inset': return insetBounds(o, opts);
    case 'measure': return measureBounds(o, opts);
    case 'roi': return roiBounds(o);
    default:
      return shapeBounds(o, opts);
  }
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  let tt = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  tt = clamp(tt, 0, 1);
  return Math.hypot(px - (x1 + tt * dx), py - (y1 + tt * dy));
}

function hitObject(o, x, y, tol, opts) {
  switch (o.type) {
    case 'marker': {
      const dm = markerDims(o, findCat(o.cat), opts);
      const rx = dm.w / 2 + tol, ry = dm.h / 2 + tol;
      return ((x - o.x) / rx) ** 2 + ((y - o.y) / ry) ** 2 <= 1;
    }
    case 'arrow': {
      const g = arrowGeometry(o, opts.unit);
      return distToSegment(x, y, o.x1, o.y1, o.x2, o.y2) <= Math.max(g.lw / 2, g.headHalf * 0.6) + tol;
    }
    case 'text': {
      const L = textLayout(o, opts.unit);
      return x >= o.x - tol && x <= o.x + L.w + tol && y >= o.y - tol && y <= o.y + L.h + tol;
    }
    case 'shape': case 'rect': case 'ellipse':
      return hitShape(o, x, y, tol, opts);
    case 'image': return hitImageObj(o, x, y, tol);
    case 'inset': return !!insetPartAt(o, x, y, tol);
    case 'measure': return hitMeasure(o, x, y, tol, opts);
    case 'roi': return hitRoi(o, x, y, tol, opts);
  }
  return false;
}

// 自上而下（后绘制者优先）查找命中的对象
function hitTest(x, y, filter) {
  const opts = drawOptions();
  const tol = 5 / state.view.scale;
  const objs = state.doc.objects;
  // 按绘制顺序自上而下：覆盖物（插入的图片、放大框）→ 标记点 → 其它
  const layer = (o) => (isOverlay(o) ? 0 : o.type === 'marker' ? 1 : 2);
  for (const pass of [0, 1, 2]) {
    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      if (layer(o) !== pass) continue;
      if (filter && !filter(o)) continue;
      if (hitObject(o, x, y, tol, opts)) return o;
    }
  }
  return null;
}

// ---- 导出图片 ---------------------------------------------------------------------
// bmp：该图片的解码位图（默认为当前图片）
// eopts.adjust：是否应用图像调整（导出前已询问用户）
function renderExportCanvas(bmp, eopts) {
  const doc = state.doc;
  const c = document.createElement('canvas');
  c.width = doc.image.width;
  c.height = doc.image.height;
  const ctx = c.getContext('2d');
  let src = bmp || state.img;
  if (eopts && eopts.adjust && adjActive(doc)) src = applyAdjustToCanvas(src, adjOf(doc));
  ctx.drawImage(src, 0, 0, doc.image.width, doc.image.height);
  const opts = drawOptions();
  opts.img = src;
  opts.forExport = true;
  if (gridOf(doc).export) drawGrid(ctx, opts, true);
  if (plateOn(doc) && plateOf(doc).export) drawPlate(ctx, opts, true);
  drawAll(ctx, doc.objects, opts, null);
  if (gridOf(doc).export) drawCellCounts(ctx, opts, true);
  drawScaleBar(ctx, opts);
  if (state.settings.legendOnExport && markers().length) drawLegend(ctx, opts);
  return c;
}

function drawLegend(ctx, opts) {
  const unit = opts.unit;
  const fs = Math.max(14 * unit, 10);
  const pad = fs * 0.6, rowH = fs * 1.5, sw = fs * 1.1;
  const counts = countsByCategory();
  const total = markers().length;
  const rows = state.doc.categories.filter(c => counts[c.id] > 0)
    .map(c => ({ cat: c, text: `${c.name}  ${counts[c.id]}  (${(counts[c.id] / total * 100).toFixed(1)}%)` }));
  rows.push({ cat: null, text: `${t('total')}: ${total}` });
  ctx.save();
  ctx.font = `${fs}px ${FONT_FAMILY}`;
  const textW = Math.max(...rows.map(r => ctx.measureText(r.text).width));
  const W = pad * 3 + sw + textW, H = pad * 2 + rows.length * rowH;
  const x0 = fs, y0 = fs;
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = Math.max(unit, 1);
  ctx.fillRect(x0, y0, W, H);
  ctx.strokeRect(x0, y0, W, H);
  ctx.textBaseline = 'middle';
  rows.forEach((r, i) => {
    const cy = y0 + pad + rowH * (i + 0.5);
    if (r.cat) drawMarker(ctx, x0 + pad + sw / 2, cy, sw * 0.85, r.cat.shape, r.cat.color);
    ctx.fillStyle = '#111';
    ctx.font = `${r.cat ? '' : 'bold '}${fs}px ${FONT_FAMILY}`;
    ctx.fillText(r.text, x0 + pad * 2 + sw, cy);
  });
  ctx.restore();
}

// ===== shapes.js =====
// ---------------------------------------------------------------------------
// shapes.js — 图形（矩形/椭圆/三角，尖角或圆角，可旋转）、单个标记的独立大小、
//             选中对象的引导框与手柄（缩放 / 拉伸 / 旋转 / 端点）
//
// 图形对象：{ type:'shape', kind:'rect'|'ellipse'|'triangle', x, y, w, h, rot,
//            style:{ color, width, dash, fillColor|null, fillOpacity, radius } }
//   x,y,w,h 为未旋转时的框（图片像素）；rot 为绕框中心的旋转角（弧度）。
//   v1.2 及以前的 { type:'rect'|'ellipse', style.fill:'none'|'semi'|'solid' } 照常读取与显示。
// 标记点可选 mw / mh（直径，单位同类别大小）；为 null 时跟随类别大小。
// ---------------------------------------------------------------------------
const HANDLE_PX = 9;          // 手柄边长（屏幕像素）
const HANDLE_HIT_PX = 8;      // 手柄可点击半径（屏幕像素）
const ROT_HANDLE_PX = 26;     // 旋转手柄离框上边的距离（屏幕像素）
const MIN_SIZE_PX = 4;        // 拖动缩放时的最小尺寸（屏幕像素）

const SHAPE_PRESETS = {
  circle: { kind: 'ellipse', lock: true, round: false },
  ellipse: { kind: 'ellipse', lock: false, round: false },
  square: { kind: 'rect', lock: true, round: false },
  rect: { kind: 'rect', lock: false, round: false },
  roundSquare: { kind: 'rect', lock: true, round: true },
  roundRect: { kind: 'rect', lock: false, round: true },
  triangle: { kind: 'triangle', lock: false, round: false },
  roundTriangle: { kind: 'triangle', lock: false, round: true }
};
const LINE_PRESETS = { arrow: 'filled', doubleArrow: 'double', line: 'none' };
const DEFAULT_RADIUS = 8;

const isShapeObj = (o) => o.type === 'shape' || o.type === 'rect' || o.type === 'ellipse';
const shapeKind = (o) => (o.type === 'shape' ? o.kind : o.type);

// 填充：新格式 fillColor / fillOpacity；旧格式 fill: none | semi | solid
function shapeFill(style) {
  if ('fillColor' in style) {
    return style.fillColor ? { color: style.fillColor, alpha: style.fillOpacity === undefined ? 1 : style.fillOpacity } : null;
  }
  if (style.fill === 'semi') return { color: style.color, alpha: 0.3 };
  if (style.fill === 'solid') return { color: style.color, alpha: 1 };
  return null;
}

// ---- 标记点尺寸 ------------------------------------------------------------------
// 返回标记在图片像素中的宽、高（直径）
function markerDims(o, cat, opts) {
  const base = cat ? opts.markerD(cat) : 1;
  if (o.mw == null && o.mh == null) return { w: base, h: base, custom: false };
  const toPx = (v) => (v == null ? base : (state.settings.fixedSize ? v / state.view.scale : v * opts.unit));
  return { w: toPx(o.mw), h: toPx(o.mh), custom: true };
}
function markerUnitsFromPx(px, opts) {
  return Math.round((state.settings.fixedSize ? px * state.view.scale : px / opts.unit) * 100) / 100;
}

// 画一个可拉伸的标记（宽 w、高 h）
function drawMarkerScaled(ctx, x, y, w, h, shape, color) {
  if (Math.abs(w - h) < 1e-6) { drawMarker(ctx, x, y, w, shape, color); return; }
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, h / w);
  drawMarker(ctx, 0, 0, w, shape, color);
  ctx.restore();
}

// ---- 图形路径 -------------------------------------------------------------------
// 以框中心为原点、未旋转的局部坐标中，向 ctx 追加图形路径
function shapeLocalPath(ctx, kind, w, h, r) {
  const a = w / 2, b = h / 2;
  ctx.beginPath();
  if (kind === 'ellipse') {
    ctx.ellipse(0, 0, Math.max(a, 0.01), Math.max(b, 0.01), 0, 0, Math.PI * 2);
    return;
  }
  const pts = kind === 'triangle' ? [[0, -b], [a, b], [-a, b]] : [[-a, -b], [a, -b], [a, b], [-a, b]];
  if (!(r > 0)) {
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    return;
  }
  // 圆角：每个顶点用 arcTo；半径不超过相邻边长的一半
  const n = pts.length;
  const len = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
  const m0 = [(pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2];
  ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) {
    const p = pts[i], prev = pts[(i + n - 1) % n], next = pts[(i + 1) % n];
    const rr = Math.min(r, len(prev, p) / 2, len(p, next) / 2);
    ctx.arcTo(p[0], p[1], next[0], next[1], rr);
  }
  ctx.closePath();
}

function drawShape(ctx, o, unit) {
  const s = o.style;
  const kind = shapeKind(o);
  const lw = s.width * unit;
  const r = (s.radius || 0) * unit;
  ctx.save();
  ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
  if (o.rot) ctx.rotate(o.rot);
  shapeLocalPath(ctx, kind, o.w, o.h, r);
  const fill = shapeFill(s);
  if (fill) { ctx.fillStyle = hexToRgba(fill.color, fill.alpha); ctx.fill(); }
  ctx.strokeStyle = s.color;
  ctx.lineWidth = lw;
  ctx.lineJoin = r > 0 ? 'round' : 'miter';
  applyDash(ctx, s.dash, lw);
  if (s.dash === 'dotted') ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();
}

// ---- 坐标变换 -------------------------------------------------------------------
const rotPt = (x, y, a) => ({ x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) });
function toLocal(o, x, y) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  return rotPt(x - cx, y - cy, -(o.rot || 0));
}

function shapeBounds(o, opts) {
  const pad = o.style.width * opts.unit / 2;
  const a = o.w / 2 + pad, b = o.h / 2 + pad;
  const rot = o.rot || 0;
  const ex = Math.abs(a * Math.cos(rot)) + Math.abs(b * Math.sin(rot));
  const ey = Math.abs(a * Math.sin(rot)) + Math.abs(b * Math.cos(rot));
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  return { x: cx - ex, y: cy - ey, w: 2 * ex, h: 2 * ey };
}

function pointInTri(p, a, b, c) {
  const s = (p1, p2, p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
  const d1 = s(p, a, b), d2 = s(p, b, c), d3 = s(p, c, a);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}

function hitShape(o, x, y, tol, opts) {
  const p = toLocal(o, x, y);
  const a = o.w / 2, b = o.h / 2;
  const m = o.style.width * opts.unit / 2 + tol;
  const filled = !!shapeFill(o.style);
  const kind = shapeKind(o);
  if (kind === 'ellipse') {
    const rx = Math.max(a, 0.01), ry = Math.max(b, 0.01);
    const r = Math.hypot(p.x / rx, p.y / ry);
    if (filled) return r <= 1 + tol / Math.min(rx, ry);
    return Math.abs(r - 1) * Math.min(rx, ry) <= m;
  }
  const pts = kind === 'triangle' ? [{ x: 0, y: -b }, { x: a, y: b }, { x: -a, y: b }]
    : [{ x: -a, y: -b }, { x: a, y: -b }, { x: a, y: b }, { x: -a, y: b }];
  const inside = kind === 'triangle' ? pointInTri(p, pts[0], pts[1], pts[2]) : (Math.abs(p.x) <= a && Math.abs(p.y) <= b);
  if (filled && inside) return true;
  for (let i = 0; i < pts.length; i++) {
    const q = pts[i], r2 = pts[(i + 1) % pts.length];
    if (distToSegment(p.x, p.y, q.x, q.y, r2.x, r2.y) <= m) return true;
  }
  return false;
}

// ---- 引导框（变换框） --------------------------------------------------------------
// 返回对象（或多选）的变换框：中心、宽高、旋转与可用手柄
function frameOf(objs, opts) {
  if (objs.length > 1) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    objs.forEach(o => { const b = objectBounds(o, opts); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
    return { kind: 'group', cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0, rot: 0, corners: true, edges: false, rotate: false };
  }
  const o = objs[0];
  if (o.type === 'arrow' || o.type === 'measure') return { kind: 'line', obj: o };
  if (o.type === 'inset') return insetFrame(o);
  if (o.type === 'roi' && o.kind === 'poly') return roiFrame(o);
  if (o.type === 'marker') {
    const d = markerDims(o, findCat(o.cat), opts);
    return { kind: 'marker', cx: o.x, cy: o.y, w: d.w, h: d.h, rot: 0, corners: true, edges: true, rotate: false };
  }
  if (o.type === 'text') {
    const L = textLayout(o, opts.unit);
    return { kind: 'text', cx: o.x + L.w / 2, cy: o.y + L.h / 2, w: L.w, h: L.h, rot: 0, corners: true, edges: true, rotate: false };
  }
  return { kind: 'box', cx: o.x + o.w / 2, cy: o.y + o.h / 2, w: o.w, h: o.h, rot: o.rot || 0, corners: true, edges: true, rotate: true };
}

// 手柄所在的框（比对象略大；很小的对象如标记点，框至少约 30 屏幕像素宽，手柄不会挤在一起）
function framePad(f, scale) {
  const px = 1 / scale;
  const minHalf = (f.kind === 'marker' ? 14 : 7) * px;
  return { a: Math.max(f.w / 2, minHalf) + 3 * px, b: Math.max(f.h / 2, minHalf) + 3 * px };
}

const HANDLE_CURSORS = ['ew-resize', 'nwse-resize', 'ns-resize', 'nesw-resize'];
function handleCursor(hx, hy, rot) {
  const ang = Math.atan2(hy, hx) + rot;                       // 手柄方向
  const k = ((Math.round(ang / (Math.PI / 4)) % 4) + 4) % 4;  // 每 45° 一档
  return HANDLE_CURSORS[k];
}

// 手柄列表：{id, x, y (图片坐标), hx, hy, cursor}
function frameHandles(f, scale) {
  if (f.kind === 'line') {
    return [
      { id: 'p1', x: f.obj.x1, y: f.obj.y1, cursor: 'move', round: true },
      { id: 'p2', x: f.obj.x2, y: f.obj.y2, cursor: 'move', round: true }
    ];
  }
  const px = 1 / scale;
  const { a, b } = framePad(f, scale);
  const hs = [];
  const add = (hx, hy) => {
    const p = rotPt(hx * a, hy * b, f.rot);
    hs.push({ id: `h${hx},${hy}`, hx, hy, x: f.cx + p.x, y: f.cy + p.y, cursor: handleCursor(hx, hy, f.rot) });
  };
  if (f.corners) [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([x, y]) => add(x, y));
  if (f.edges) [[0, -1], [1, 0], [0, 1], [-1, 0]].forEach(([x, y]) => add(x, y));
  if (f.rotate) {
    const p = rotPt(0, -b - ROT_HANDLE_PX * px, f.rot);
    const top = rotPt(0, -b, f.rot);
    hs.push({ id: 'rot', x: f.cx + p.x, y: f.cy + p.y, stemX: f.cx + top.x, stemY: f.cy + top.y, cursor: 'grab', round: true });
  }
  return hs;
}

function hitHandle(handles, x, y, scale) {
  const r = HANDLE_HIT_PX / scale;
  let best = null, bd = Infinity;
  for (const h of handles) {
    const d = Math.hypot(h.x - x, h.y - y);
    if (d <= r && d < bd) { bd = d; best = h; }
  }
  return best;
}

function drawFrame(ctx, f, handles, px, opts) {
  ctx.save();
  ctx.strokeStyle = SELECT_COLOR;
  ctx.lineWidth = 1.5 * px;
  if (f.kind !== 'line') {
    ctx.save();
    ctx.translate(f.cx, f.cy);
    if (f.rot) ctx.rotate(f.rot);
    const { a, b } = framePad(f, 1 / px);
    ctx.setLineDash([5 * px, 4 * px]);
    ctx.strokeRect(-a, -b, 2 * a, 2 * b);
    ctx.restore();
  } else {
    ctx.setLineDash([5 * px, 4 * px]);
    ctx.beginPath(); ctx.moveTo(f.obj.x1, f.obj.y1); ctx.lineTo(f.obj.x2, f.obj.y2); ctx.stroke();
  }
  ctx.setLineDash([]);
  const s = HANDLE_PX * px;
  for (const h of handles) {
    if (h.id === 'rot') {
      ctx.beginPath(); ctx.moveTo(h.stemX, h.stemY); ctx.lineTo(h.x, h.y); ctx.stroke();
    }
    ctx.beginPath();
    if (h.round) ctx.arc(h.x, h.y, s * 0.6, 0, Math.PI * 2);
    else ctx.rect(h.x - s / 2, h.y - s / 2, s, s);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#0095b3';
    ctx.stroke();
  }
  ctx.restore();
}

// ---- 手柄拖动：根据指针位置计算新的几何 ---------------------------------------------
// snap: 原始对象快照（数组）；f: 开始时的变换框；h: 手柄；p: 指针图片坐标；free: 是否自由比例（Shift）
function applyHandleDrag(objs, snaps, f, h, p, opts, mods) {
  const minPx = MIN_SIZE_PX / state.view.scale;
  if (f.kind === 'line') {
    const o = objs[0], s0 = snaps[0];
    let q = p;
    const other = h.id === 'p1' ? { x: s0.x2, y: s0.y2 } : { x: s0.x1, y: s0.y1 };
    if (mods.shift) q = snapAngle(other, p);
    if (h.id === 'p1') Object.assign(o, { x1: q.x, y1: q.y }); else Object.assign(o, { x2: q.x, y2: q.y });
    return;
  }
  if (h.id === 'rot') {
    const o = objs[0];
    let ang = Math.atan2(p.y - f.cy, p.x - f.cx) + Math.PI / 2;
    if (mods.shift) ang = Math.round(ang / (Math.PI / 12)) * (Math.PI / 12);
    ang = Math.atan2(Math.sin(ang), Math.cos(ang));
    o.rot = Math.abs(ang) < 1e-9 ? 0 : ang;
    return;
  }
  const { hx, hy } = h;
  const corner = hx !== 0 && hy !== 0;
  const w = Math.max(f.w, 1e-6), hgt = Math.max(f.h, 1e-6);
  // 指针在框的局部坐标（以中心为原点、未旋转），并扣除手柄与对象边缘之间的间距，
  // 使尺寸随“拖动了多少”变化，而不会在按下的一瞬间跳变
  const lp = rotPt(p.x - f.cx, p.y - f.cy, -f.rot);
  const pad = framePad(f, state.view.scale);
  lp.x -= hx * (pad.a - w / 2);
  lp.y -= hy * (pad.b - hgt / 2);

  if (f.kind === 'marker') {
    // 标记点：以中心为不动点缩放（计数位置不变）
    const o = objs[0];
    let nw = w, nh = hgt;
    if (corner && !mods.shift) {
      const d = { x: hx * w / 2, y: hy * hgt / 2 };
      const s = Math.max((lp.x * d.x + lp.y * d.y) / (d.x * d.x + d.y * d.y), minPx / Math.min(w, hgt));
      nw = w * s; nh = hgt * s;
    } else {
      if (hx) nw = Math.max(2 * Math.abs(lp.x), minPx);
      if (hy) nh = Math.max(2 * Math.abs(lp.y), minPx);
    }
    o.mw = markerUnitsFromPx(nw, opts);
    o.mh = markerUnitsFromPx(nh, opts);
    return;
  }

  // 其它：对边（对角）不动
  const ax = -hx * w / 2, ay = -hy * hgt / 2;
  let nw = w, nh = hgt;
  if (corner && !mods.shift) {
    const dx = hx * w, dy = hy * hgt;
    const s = Math.max(((lp.x - ax) * dx + (lp.y - ay) * dy) / (dx * dx + dy * dy), minPx / Math.min(w, hgt));
    nw = w * s; nh = hgt * s;
  } else {
    if (hx) nw = Math.max(hx * (lp.x - ax), minPx);
    if (hy) nh = Math.max(hy * (lp.y - ay), minPx);
  }
  const ncLocal = { x: hx ? ax + hx * nw / 2 : 0, y: hy ? ay + hy * nh / 2 : 0 };
  const nc = rotPt(ncLocal.x, ncLocal.y, f.rot);
  const ncx = f.cx + nc.x, ncy = f.cy + nc.y;

  if (f.kind === 'box') {
    Object.assign(objs[0], { x: ncx - nw / 2, y: ncy - nh / 2, w: nw, h: nh });
    return;
  }
  if (f.kind === 'inset') {
    applyInsetResize(objs[0], snaps[0], f.part, ncx, ncy, nw, nh);
    return;
  }
  if (f.kind === 'poly') {
    // 多边形计数区域：顶点按框的缩放比例变换
    const kx = nw / w, ky = nh / hgt;
    objs[0].pts = snaps[0].pts.map(q => ({ x: ncx + (q.x - f.cx) * kx, y: ncy + (q.y - f.cy) * ky }));
    return;
  }
  const s = nw / w;   // group 为等比缩放
  if (f.kind === 'text') {
    const o = objs[0], s0 = snaps[0];
    if (corner && !mods.shift) {
      // 角手柄：框与字号等比缩放
      o.style = Object.assign({}, o.style, { fontSize: Math.max(2, Math.round(s0.style.fontSize * s * 10) / 10) });
      if (s0.w > 0) { o.w = s0.w * s; if (s0.h > 0) o.h = s0.h * s; }
      const L = textLayout(o, opts.unit);
      o.x = ncx - L.w / 2; o.y = ncy - L.h / 2;
    } else {
      // 边手柄（或 Shift + 角）：只改框的宽 / 高，文字在框内重新换行；“字号随框调整”时字号随之变化
      o.w = Math.max(nw, minPx);
      o.h = hy ? Math.max(nh, minPx) : (s0.h > 0 ? s0.h : 0);
      if (!o.h) delete o.h;
      o.x = ncx - nw / 2;
      o.y = hy ? ncy - nh / 2 : s0.y;
    }
    return;
  }
  // 多选：所有对象相对锚点等比缩放（标记只移动位置，大小不变）
  const axw = f.cx + ax, ayw = f.cy + ay;   // group 无旋转
  const sc = (v, a0) => a0 + (v - a0) * s;
  objs.forEach((o, i) => {
    const s0 = snaps[i];
    if (o.type === 'marker') { o.x = sc(s0.x, axw); o.y = sc(s0.y, ayw); }
    else if (o.type === 'roi' && o.kind === 'poly') o.pts = s0.pts.map(q => ({ x: sc(q.x, axw), y: sc(q.y, ayw) }));
    else if (o.type === 'arrow' || o.type === 'measure') Object.assign(o, { x1: sc(s0.x1, axw), y1: sc(s0.y1, ayw), x2: sc(s0.x2, axw), y2: sc(s0.y2, ayw) });
    else if (o.type === 'text') {
      o.x = sc(s0.x, axw); o.y = sc(s0.y, ayw); o.style = Object.assign({}, o.style, { fontSize: Math.max(2, s0.style.fontSize * s) });
      if (s0.w > 0) { o.w = s0.w * s; if (s0.h > 0) o.h = s0.h * s; }
    }
    else if (o.type === 'inset') Object.assign(o, { x: sc(s0.x, axw), y: sc(s0.y, ayw), w: s0.w * s, h: s0.h * s, sx: sc(s0.sx, axw), sy: sc(s0.sy, ayw), sw: s0.sw * s, sh: s0.sh * s });
    else Object.assign(o, { x: sc(s0.x, axw), y: sc(s0.y, ayw), w: s0.w * s, h: s0.h * s });
  });
}

// 生成 修改前/修改后 的属性（缺少的属性以 null 表示，保证撤回时能清除）
function diffProps(before, after) {
  const keys = new Set([...Object.keys(before), ...Object.keys(after)]);
  keys.delete('id'); keys.delete('type');
  const b = {}, a = {};
  keys.forEach(k => { b[k] = before[k] === undefined ? null : before[k]; a[k] = after[k] === undefined ? null : after[k]; });
  return { before: b, after: a };
}

// ---- 图层顺序 --------------------------------------------------------------------
function reorderObjects(ids, toFront) {
  const objs = state.doc.objects;
  const before = objs.map(o => o.id);
  const set = new Set(ids);
  const moving = objs.filter(o => set.has(o.id)).map(o => o.id);
  const rest = objs.filter(o => !set.has(o.id)).map(o => o.id);
  const after = toFront ? rest.concat(moving) : moving.concat(rest);
  if (JSON.stringify(before) === JSON.stringify(after)) return;
  execute({ k: 'order', before, after });
}

function applyOrder(ids) {
  const map = new Map(state.doc.objects.map(o => [o.id, o]));
  const out = ids.map(id => map.get(id)).filter(Boolean);
  state.doc.objects.forEach(o => { if (!ids.includes(o.id)) out.push(o); });
  state.doc.objects = out;
}

// ===== imgedit.js =====
// ---------------------------------------------------------------------------
// imgedit.js — 图像编辑（v1.3.5）：裁剪、旋转 90°、翻转、插入图片、局部放大插图
//
// 原始图片文件始终不变（指纹 sha256 仍对应原图）。裁剪/旋转/翻转记录在
// doc.image.ops 中，显示与导出时由原图按顺序重新生成；标注坐标随之变换。
// 这些操作都是 90° 倍数与整数像素平移，像素一一对应，不重新采样，不损失画质。
// 每一步都是普通的撤回命令 {k:'img', op, before:{w,h}, after:{w,h}}。
//
// 插入的图片：{type:'image', asset, x, y, w, h, rot, style:{opacity, color, width}}
//   图片数据存放在工作区共享的 ws.assets 中（项目文件 assets/ 目录）。
// 局部放大插图：{type:'inset', sx, sy, sw, sh (源区域), x, y, w, h (放大框),
//   style:{color, width, dash, lines(连接线), label(显示倍数)}}；放大倍数 = w/sw = h/sh。
// ---------------------------------------------------------------------------
const INSET_DEFAULT_MAG = 3;
const INSET_MAG_PRESETS = [2, 3, 4, 6];
const IMG_BORDER_PRESETS = [['none', 0], ['thin', 1.5], ['mid', 3], ['thick', 6]];

// ---- 仿射变换（canvas setTransform 顺序 [a,b,c,d,e,f]：x' = a x + c y + e，y' = b x + d y + f） ----
const affApply = (m, x, y) => ({ x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] });
// A∘B：先 B 再 A
function affMul(A, B) {
  return [
    A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1],
    A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3],
    A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]
  ];
}

// 单步操作在当前尺寸 W×H 下的变换。swap：宽高互换；ang：内容旋转角；mirror：'h' | 'v'
function opTransform(op, W, H) {
  switch (op.op) {
    case 'rot':
      if (op.deg === 90) return { m: [0, 1, -1, 0, H, 0], w: H, h: W, swap: true, ang: Math.PI / 2 };
      if (op.deg === -90) return { m: [0, -1, 1, 0, 0, W], w: H, h: W, swap: true, ang: -Math.PI / 2 };
      return { m: [-1, 0, 0, -1, W, H], w: W, h: H, swap: false, ang: Math.PI };
    case 'flip':
      return op.axis === 'h' ? { m: [-1, 0, 0, 1, W, 0], w: W, h: H, mirror: 'h' } : { m: [1, 0, 0, -1, 0, H], w: W, h: H, mirror: 'v' };
    case 'crop':
      return { m: [1, 0, 0, 1, -op.x, -op.y], w: op.w, h: op.h };
  }
  throw new Error('unknown image op ' + op.op);
}

// 逆操作（作用在操作之后的图上）；before：操作前的尺寸
function inverseOp(op, before) {
  if (op.op === 'rot') return { op: 'rot', deg: op.deg === 180 ? 180 : -op.deg };
  if (op.op === 'flip') return op;
  return { op: 'crop', x: -op.x, y: -op.y, w: before.w, h: before.h };
}

const origDims = (img) => (img.orig ? { w: img.orig.width, h: img.orig.height } : { w: img.width, h: img.height });

// 由原图尺寸与操作列表得到总变换
function composeOps(img) {
  let { w, h } = origDims(img);
  let m = [1, 0, 0, 1, 0, 0];
  for (const op of img.ops || []) {
    const T = opTransform(op, w, h);
    m = affMul(T.m, m);
    w = T.w; h = T.h;
  }
  return { m, w, h };
}

// 生成显示用位图：没有操作时直接用原图；否则一次 drawImage 完成（整像素映射，不插值）
function composeImage(src, img) {
  if (!img.ops || !img.ops.length) return src;
  const { m, w, h } = composeOps(img);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
  ctx.drawImage(src, 0, 0);
  return c;
}

// 某张图片（可以不是当前图片）处理后的位图；用完后用 releaseEntryBitmap 释放
async function entryBitmap(e) {
  if (e.id === state.activeId && state.img) return { img: state.img, own: false };
  const bmp = await decodeBlob(e.blob);
  const out = composeImage(bmp, e.doc.image);
  if (out !== bmp) closeBitmap(bmp);
  return { img: out, own: true };
}
function releaseEntryBitmap(r) { if (r && r.own) closeBitmap(r.img); }

const normAngle = (a) => { const r = Math.atan2(Math.sin(a), Math.cos(a)); return Math.abs(r) < 1e-9 ? 0 : r; };

// 把一个对象按变换 T 原地变换
function transformObject(o, T, opts) {
  const P = (x, y) => affApply(T.m, x, y);
  switch (o.type) {
    case 'marker': {
      const q = P(o.x, o.y);
      o.x = q.x; o.y = q.y;
      if (T.swap && (o.mw != null || o.mh != null)) { const a = o.mw ?? null, b = o.mh ?? null; o.mw = b; o.mh = a; }
      return;
    }
    case 'roi':
      if (o.kind === 'poly') { o.pts = o.pts.map(q => P(q.x, q.y)); return; }
      break;
    case 'arrow': case 'measure': {
      const a = P(o.x1, o.y1), b = P(o.x2, o.y2);
      Object.assign(o, { x1: a.x, y1: a.y, x2: b.x, y2: b.y });
      return;
    }
    case 'text': {
      // 文字保持正向，只移动位置
      const L = textLayout(o, opts.unit);
      const c = P(o.x + L.w / 2, o.y + L.h / 2);
      o.x = c.x - L.w / 2; o.y = c.y - L.h / 2;
      return;
    }
    case 'image': {
      // 插入的图片保持正向，只移动位置
      const c = P(o.x + o.w / 2, o.y + o.h / 2);
      o.x = c.x - o.w / 2; o.y = c.y - o.h / 2;
      return;
    }
    case 'inset': {
      const a = P(o.sx, o.sy), b = P(o.sx + o.sw, o.sy + o.sh);
      Object.assign(o, { sx: Math.min(a.x, b.x), sy: Math.min(a.y, b.y), sw: Math.abs(b.x - a.x), sh: Math.abs(b.y - a.y) });
      const c = P(o.x + o.w / 2, o.y + o.h / 2);
      if (T.swap) { const w = o.w; o.w = o.h; o.h = w; }
      o.x = c.x - o.w / 2; o.y = c.y - o.h / 2;
      return;
    }
  }
  // 图形 / 计数区域跟随图片内容（标出的区域必须仍覆盖同一块内容）
  if (!isShapeObj(o) && o.type !== 'roi') return;
  const c = P(o.x + o.w / 2, o.y + o.h / 2);
  const sym = shapeKind(o) !== 'triangle';   // 矩形/椭圆关于两轴对称
  let rot = o.rot || 0;
  if (T.ang) {
    if (sym && T.swap) { const w = o.w; o.w = o.h; o.h = w; }
    else if (!sym) rot += T.ang;
  }
  if (T.mirror === 'h') rot = -rot;
  else if (T.mirror === 'v') rot = sym ? -rot : Math.PI - rot;
  rot = normAngle(rot);
  if (rot || o.rot !== undefined) o.rot = rot;
  o.x = c.x - o.w / 2; o.y = c.y - o.h / 2;
}

// 撤回命令 'img' 的执行（由 model.js 的 applyCommand 调用）
function applyImageCommand(cmd, forward) {
  const img = state.doc.image;
  if (!img.orig) img.orig = { width: img.width, height: img.height };
  const op = forward ? cmd.op : inverseOp(cmd.op, cmd.before);
  const T = opTransform(op, img.width, img.height);
  const opts = drawOptions();
  for (const o of state.doc.objects) transformObject(o, T, opts);
  img.ops = forward ? (img.ops || []).concat([clone(cmd.op)]) : (img.ops || []).slice(0, -1);
  const d = forward ? cmd.after : cmd.before;
  img.width = d.w; img.height = d.h;
  if (!img.ops.length) { delete img.ops; }
  refreshDisplayImage();
}

// 重新生成当前图片的显示位图（同步完成）
function refreshDisplayImage() {
  if (!state.origImg || !state.doc) return;
  releasePyramid();
  if (state.img && state.img !== state.origImg) closeBitmap(state.img);
  state.img = composeImage(state.origImg, state.doc.image);
  state.region = null;
  state.aiSuggest = null;
  view.crop = null;
  buildPyramid(state.img);
  fitView();
}

function imageOp(op) {
  if (!state.doc || !state.img) return;
  commitTextEditor();
  const img = state.doc.image;
  const T = opTransform(op, img.width, img.height);
  execute({ k: 'img', op, before: { w: img.width, h: img.height }, after: { w: T.w, h: T.h } });
}
const rotateImage = (deg) => imageOp({ op: 'rot', deg });
const flipImage = (axis) => imageOp({ op: 'flip', axis });

// 操作历史的简短说明（状态栏 / 菜单）
function opsSummary(img) {
  const ops = (img && img.ops) || [];
  if (!ops.length) return '';
  const o = origDims(img);
  const parts = ops.map(op => op.op === 'rot' ? t('opRot', { deg: op.deg > 0 ? '+' + op.deg : op.deg })
    : op.op === 'flip' ? t(op.axis === 'h' ? 'opFlipH' : 'opFlipV') : t('opCrop', { w: op.w, h: op.h }));
  return `${t('origSize')} ${o.w}×${o.h} → ${img.width}×${img.height}（${parts.join(' → ')}）`;
}

// ---- 裁剪模式 ---------------------------------------------------------------------
// view.crop = {x,y,w,h}：待裁剪的区域（图片坐标）。Enter 应用，Esc 取消。
let cropPrevTool = 'marker';

function startCrop() {
  if (state.doc && state.img) setTool('crop');
}

function initCropRect() {
  const { width, height } = state.doc.image;
  view.crop = { x: 0, y: 0, w: width, h: height };
  updateCropBar();
}

function cropFrame() {
  const c = view.crop;
  return { kind: 'crop', cx: c.x + c.w / 2, cy: c.y + c.h / 2, w: c.w, h: c.h, rot: 0, corners: true, edges: true, rotate: false };
}

// 取整并限制在图片范围内
function normalizedCrop() {
  const c = view.crop;
  if (!c) return null;
  const { width, height } = state.doc.image;
  const x0 = clamp(Math.round(Math.min(c.x, c.x + c.w)), 0, width), y0 = clamp(Math.round(Math.min(c.y, c.y + c.h)), 0, height);
  const x1 = clamp(Math.round(Math.max(c.x, c.x + c.w)), 0, width), y1 = clamp(Math.round(Math.max(c.y, c.y + c.h)), 0, height);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// 裁剪后会被删除的对象：中心在区域外的标记；与区域不相交的其它对象
function objectsOutsideCrop(r) {
  const opts = drawOptions();
  const inside = (x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  return state.doc.objects.filter(o => {
    if (o.type === 'marker') return !inside(o.x, o.y);
    if (o.type === 'inset') return !inside(o.sx + o.sw / 2, o.sy + o.sh / 2);
    const b = objectBounds(o, opts);
    return b.x > r.x + r.w || b.y > r.y + r.h || b.x + b.w < r.x || b.y + b.h < r.y;
  });
}

function applyCrop() {
  const r = normalizedCrop();
  if (!r || !state.doc) return;
  const { width, height } = state.doc.image;
  if (r.w < 2 || r.h < 2) { toast(t('cropTooSmall')); return; }
  if (r.x === 0 && r.y === 0 && r.w === width && r.h === height) { cancelCrop(); return; }
  const out = objectsOutsideCrop(r);
  const items = [];
  state.doc.objects.forEach((o, i) => { if (out.includes(o)) items.push({ obj: clone(o), index: i }); });
  const op = { op: 'crop', x: r.x, y: r.y, w: r.w, h: r.h };
  const cmds = [];
  if (items.length) cmds.push({ k: 'remove', items });
  cmds.push({ k: 'img', op, before: { w: width, h: height }, after: { w: r.w, h: r.h } });
  view.crop = null;
  clearSelection(true);
  execute(cmds.length === 1 ? cmds[0] : { k: 'batch', label: 'crop', cmds });
  const nm = items.filter(it => it.obj.type === 'marker').length;
  toast(t('croppedToast', { w: r.w, h: r.h, n: nm }), 4000);
  setTool(cropPrevTool === 'crop' ? 'marker' : cropPrevTool);
}

function cancelCrop() {
  view.crop = null;
  setTool(cropPrevTool === 'crop' ? 'marker' : cropPrevTool);
}

// 裁剪工具栏：尺寸、将删除的标记数、应用 / 取消
function updateCropBar() {
  const bar = $('#cropBar');
  if (!bar) return;
  const on = state.tool === 'crop' && !!view.crop && !!state.doc;
  bar.hidden = !on;
  if (!on) return;
  const r = normalizedCrop();
  const out = objectsOutsideCrop(r);
  const nm = out.filter(o => o.type === 'marker').length, no = out.length - nm;
  $('#cropInfo').innerHTML = `${escapeHtml(t('cropSize'))} <b>${r.w} × ${r.h}</b> px` +
    (nm ? ` · <span class="warn">${escapeHtml(t('cropWillRemove', { n: nm }))}</span>` : '') +
    (no ? ` · <span class="warn">${escapeHtml(t('cropWillRemoveObj', { n: no }))}</span>` : '');
}

// 裁剪栏的位置：放在裁剪框上方；没有空间时放在下方；仍没有时放在框内顶部（避开手柄）
function positionCropBar() {
  const bar = $('#cropBar');
  if (!bar || bar.hidden || !view.crop) return;
  const r = normalizedCrop(), v = state.view;
  const top = v.ty + r.y * v.scale, bottom = v.ty + (r.y + r.h) * v.scale;
  const cx = v.tx + (r.x + r.w / 2) * v.scale;
  const bw = bar.offsetWidth, bh = bar.offsetHeight, gap = 16;
  let y;
  if (top - gap - bh >= 4) y = top - gap - bh;
  else if (bottom + gap + bh <= view.cssH - 4) y = bottom + gap;
  else y = clamp(top + gap + 4, 4, view.cssH - bh - 4);
  bar.style.top = Math.round(y) + 'px';
  bar.style.left = Math.round(clamp(cx - bw / 2, 4, Math.max(4, view.cssW - bw - 4))) + 'px';
}

function drawCropOverlay(ctx, px) {
  const c = view.crop;
  if (!c || state.tool !== 'crop') return;
  positionCropBar();
  const { width, height } = state.doc.image;
  const r = normalizedCrop();
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.rect(-1e5, -1e5, 2e5 + width, 2e5 + height);
  ctx.rect(r.x + r.w, r.y, -r.w, r.h);   // 反向矩形 → 挖空
  ctx.fill('evenodd');
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5 * px;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  // 三等分线
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = px;
  ctx.beginPath();
  for (const k of [1, 2]) {
    ctx.moveTo(r.x + r.w * k / 3, r.y); ctx.lineTo(r.x + r.w * k / 3, r.y + r.h);
    ctx.moveTo(r.x, r.y + r.h * k / 3); ctx.lineTo(r.x + r.w, r.y + r.h * k / 3);
  }
  ctx.stroke();
  ctx.restore();
  // 将被删除的标记画红色 ×
  const out = objectsOutsideCrop(r).filter(o => o.type === 'marker');
  if (out.length) {
    ctx.save();
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = 2 * px;
    const k = 5 * px;
    ctx.beginPath();
    for (const o of out) { ctx.moveTo(o.x - k, o.y - k); ctx.lineTo(o.x + k, o.y + k); ctx.moveTo(o.x + k, o.y - k); ctx.lineTo(o.x - k, o.y + k); }
    ctx.stroke();
    ctx.restore();
  }
  const f = cropFrame();
  drawFrame(ctx, f, frameHandles(f, state.view.scale), px);
}

// 裁剪框手柄拖动：对边固定；按住 Shift 保持比例；限制在图片范围内
function dragCropHandle(g, p, shift) {
  const s = g.cropStart;
  const { width, height } = state.doc.image;
  const { hx, hy } = g.handle;
  const pad = framePad(g.frame, state.view.scale);
  let x0 = s.x, y0 = s.y, x1 = s.x + s.w, y1 = s.y + s.h;
  // 扣除手柄与边之间的间距，使边随拖动量移动
  const px = p.x - hx * (pad.a - s.w / 2), py = p.y - hy * (pad.b - s.h / 2);
  if (hx < 0) x0 = clamp(px, 0, x1 - 2); else if (hx > 0) x1 = clamp(px, x0 + 2, width);
  if (hy < 0) y0 = clamp(py, 0, y1 - 2); else if (hy > 0) y1 = clamp(py, y0 + 2, height);
  if (shift && hx && hy && s.w > 0 && s.h > 0) {
    const ar = s.w / s.h;
    let w = x1 - x0, h = y1 - y0;
    if (w / h > ar) w = h * ar; else h = w / ar;
    if (hx < 0) x0 = x1 - w; else x1 = x0 + w;
    if (hy < 0) y0 = y1 - h; else y1 = y0 + h;
  }
  view.crop = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// ---- 插入图片（资源） ---------------------------------------------------------------
const assetBitmaps = new Map();   // id → ImageBitmap | 'loading' | 'error'

function assetsOf(ws) { if (!ws.assets) ws.assets = {}; return ws.assets; }

function getAssetBitmap(id) {
  const v = assetBitmaps.get(id);
  if (v && typeof v === 'object') return v;
  if (v) return null;
  const a = state.ws && state.ws.assets && state.ws.assets[id];
  if (!a) return null;
  assetBitmaps.set(id, 'loading');
  decodeBlob(a.blob).then(b => { assetBitmaps.set(id, b); view.baseKey = ''; requestRender(); },
    () => assetBitmaps.set(id, 'error'));
  return null;
}

async function preloadAssets(objs) {
  for (const o of objs) {
    if (o.type !== 'image' || getAssetBitmap(o.asset)) continue;
    const a = state.ws.assets && state.ws.assets[o.asset];
    if (!a) continue;
    try { assetBitmaps.set(o.asset, await decodeBlob(a.blob)); } catch (e) { assetBitmaps.set(o.asset, 'error'); }
  }
}

function clearAssetCache() {
  for (const v of assetBitmaps.values()) if (v && typeof v === 'object') closeBitmap(v);
  assetBitmaps.clear();
}

async function addAsset(blob, image) {
  const ws = state.ws;
  const assets = assetsOf(ws);
  // 同一文件只存一份
  for (const a of Object.values(assets)) if (a.sha256 === image.sha256) return a.id;
  if (!ws.nextAssetId) ws.nextAssetId = 1;
  const id = 'a' + ws.nextAssetId++;
  assets[id] = { id, name: image.name, mime: image.mime, width: image.width, height: image.height, sha256: image.sha256, blob };
  markStructChanged();
  return id;
}

function insertImageDialog() {
  if (!state.doc) { toast(t('noImagesYet')); return; }
  $('#insertInput').click();
}

// 把图片文件作为对象插入当前图片（居中于当前视野，约占视野的 35%）
async function insertImageFiles(files) {
  if (!state.doc) return;
  const ids = [];
  for (const f of Array.from(files)) {
    let r;
    try { r = await readImageFile(f.name || 'image.png', await f.arrayBuffer()); }
    catch (err) { alert(t('openFailed', { msg: err && err.message ? err.message : String(err) })); continue; }
    const asset = await addAsset(r.blob, r.image);
    const vr = visibleRect();
    const { width, height } = state.doc.image;
    const vx0 = Math.max(vr.x0, 0), vy0 = Math.max(vr.y0, 0), vx1 = Math.min(vr.x1, width), vy1 = Math.min(vr.y1, height);
    const vw = Math.max(vx1 - vx0, width * 0.2), vh = Math.max(vy1 - vy0, height * 0.2);
    const s = Math.min(vw * 0.35 / r.image.width, vh * 0.35 / r.image.height);
    const w = r.image.width * s, h = r.image.height * s;
    const off = ids.length * 20 / state.view.scale;
    const cx = (vx0 + vx1) / 2 + off, cy = (vy0 + vy1) / 2 + off;
    ids.push(addObject({ type: 'image', asset, x: cx - w / 2, y: cy - h / 2, w, h, rot: 0, style: { opacity: 1, color: '#ffffff', width: 0 } }));
  }
  if (ids.length) {
    setTool('select');
    setSelection(ids, null);
    onWorkspaceChanged();
  }
}

function drawImageObject(ctx, o, opts) {
  const s = o.style || {};
  ctx.save();
  ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
  if (o.rot) ctx.rotate(o.rot);
  const bmp = getAssetBitmap(o.asset);
  ctx.globalAlpha *= s.opacity === undefined ? 1 : s.opacity;
  if (bmp) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, -o.w / 2, -o.h / 2, o.w, o.h);
  } else {
    ctx.fillStyle = 'rgba(128,128,128,0.35)';
    ctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
  }
  ctx.globalAlpha = 1;
  if (s.width > 0) {
    const lw = s.width * opts.unit;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = lw;
    ctx.setLineDash([]);
    ctx.strokeRect(-o.w / 2 - lw / 2, -o.h / 2 - lw / 2, o.w + lw, o.h + lw);
  }
  ctx.restore();
}

function imageObjBounds(o, opts) {
  const pad = (o.style && o.style.width > 0 ? o.style.width * opts.unit : 0);
  const a = o.w / 2 + pad, b = o.h / 2 + pad, rot = o.rot || 0;
  const ex = Math.abs(a * Math.cos(rot)) + Math.abs(b * Math.sin(rot));
  const ey = Math.abs(a * Math.sin(rot)) + Math.abs(b * Math.cos(rot));
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  return { x: cx - ex, y: cy - ey, w: 2 * ex, h: 2 * ey };
}

function hitImageObj(o, x, y, tol) {
  const p = toLocal(o, x, y);
  return Math.abs(p.x) <= o.w / 2 + tol && Math.abs(p.y) <= o.h / 2 + tol;
}

// 恢复插入图片的原始宽高比（保持宽度与中心）
function resetImageAspect() {
  const o = selectedObjs()[0];
  if (!o || o.type !== 'image') return;
  const a = state.ws.assets && state.ws.assets[o.asset];
  if (!a) return;
  const h = o.w * a.height / a.width;
  modifyObject(o.id, { y: o.y + o.h / 2 - h / 2, h });
}

// ---- 局部放大插图 -------------------------------------------------------------------
const insetMag = (o) => o.w / Math.max(o.sw, 1e-9);
const insetSrcRect = (o) => ({ x: o.sx, y: o.sy, w: o.sw, h: o.sh });
const insetBoxRect = (o) => ({ x: o.x, y: o.y, w: o.w, h: o.h });
const rectsOverlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

// 放大框的默认位置：优先放在源区域右侧 / 左侧 / 下方 / 上方且完全在图内；放不下时减小倍数
function placeInsetBox(src, W, H) {
  const gap = Math.max(W, H) * 0.02;
  for (let mag = INSET_DEFAULT_MAG; mag >= 1.5; mag -= 0.5) {
    const w = src.w * mag, h = src.h * mag;
    const cy = clamp(src.y + src.h / 2 - h / 2, 0, Math.max(0, H - h)), cx = clamp(src.x + src.w / 2 - w / 2, 0, Math.max(0, W - w));
    const cands = [
      { x: src.x + src.w + gap, y: cy }, { x: src.x - gap - w, y: cy },
      { x: cx, y: src.y + src.h + gap }, { x: cx, y: src.y - gap - h }
    ];
    for (const c of cands) {
      const r = { x: c.x, y: c.y, w, h };
      if (r.x >= 0 && r.y >= 0 && r.x + w <= W && r.y + h <= H && !rectsOverlap(r, src)) return r;
    }
  }
  // 实在放不下：按默认倍数放在右侧（可以超出图片，之后再拖动）
  const w = src.w * INSET_DEFAULT_MAG, h = src.h * INSET_DEFAULT_MAG;
  return { x: src.x + src.w + gap, y: src.y + src.h / 2 - h / 2, w, h };
}

function createInset(src) {
  const { width, height } = state.doc.image;
  const box = placeInsetBox(src, width, height);
  const st = state.toolStyles.inset;
  const id = addObject({ type: 'inset', sx: src.x, sy: src.y, sw: src.w, sh: src.h, x: box.x, y: box.y, w: box.w, h: box.h, style: clone(st) });
  view.insetPart = 'box';
  setTool('select');
  setSelection([id], null);
}

// 连接线：连接源区域与放大框相对一侧的两个角
function insetConnectors(o) {
  const s = insetSrcRect(o), b = insetBoxRect(o);
  const dx = (b.x + b.w / 2) - (s.x + s.w / 2), dy = (b.y + b.h / 2) - (s.y + s.h / 2);
  const C = (r, cx, cy) => ({ x: r.x + cx * r.w, y: r.y + cy * r.h });
  // 横向分离（或横向偏移更大）→ 左右连接；否则上下连接
  const horiz = (b.x >= s.x + s.w || b.x + b.w <= s.x) ? true : (b.y >= s.y + s.h || b.y + b.h <= s.y) ? false : Math.abs(dx) >= Math.abs(dy);
  if (horiz) {
    const sR = dx >= 0 ? 1 : 0, bL = dx >= 0 ? 0 : 1;
    return [[C(s, sR, 0), C(b, bL, 0)], [C(s, sR, 1), C(b, bL, 1)]];
  }
  const sB = dy >= 0 ? 1 : 0, bT = dy >= 0 ? 0 : 1;
  return [[C(s, 0, sB), C(b, 0, bT)], [C(s, 1, sB), C(b, 1, bT)]];
}

function drawInset(ctx, o, opts) {
  const s = o.style;
  const lw = s.width * opts.unit;
  const img = opts.img || displayFullImage();   // 屏幕上与当前显示一致（含图像调整）
  const mag = insetMag(o);
  ctx.save();
  ctx.strokeStyle = s.color;
  ctx.lineWidth = lw;
  ctx.lineJoin = 'miter';
  // 1. 连接线（细一些）
  if (s.lines !== false) {
    ctx.save();
    ctx.lineWidth = lw * 0.6;
    applyDash(ctx, s.dash === 'solid' ? 'dashed' : s.dash, lw * 0.6);
    ctx.beginPath();
    for (const [a, b] of insetConnectors(o)) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    ctx.stroke();
    ctx.restore();
  }
  // 2. 源区域框
  applyDash(ctx, s.dash, lw);
  ctx.strokeRect(o.sx, o.sy, o.sw, o.sh);
  ctx.setLineDash([]);
  // 3. 放大内容：图片 + 该区域内的标注（不含其它放大框）
  ctx.save();
  ctx.beginPath();
  ctx.rect(o.x, o.y, o.w, o.h);
  ctx.clip();
  ctx.fillStyle = '#000';
  ctx.fillRect(o.x, o.y, o.w, o.h);
  const screenMag = mag * (opts.forExport ? 1 : state.view.scale * view.dpr);
