<style>:root {
  --bg: #1d1f23;
  --panel: #25282d;
  --panel-2: #2d3036;
  --border: #3a3e45;
  --text: #e6e8eb;
  --muted: #9aa1ab;
  --accent: #3d8bfd;
  --accent-soft: rgba(61, 139, 253, 0.18);
  --danger: #e5534b;
  --stage: #3b3d41;          /* 中性灰背景，避免影响颜色判断 */
  --radius: 6px;
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 13px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body.busy, body.busy * { cursor: progress !important; }
[hidden] { display: none !important; }

button {
  font: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 9px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled) { border-color: #59606b; background: #343840; }
button:disabled { opacity: 0.4; cursor: default; }
button.active, button.toggle.active { background: var(--accent-soft); border-color: var(--accent); color: #fff; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: #ffb3ae; }
button.danger:hover:not(:disabled) { border-color: var(--danger); }
button.small { padding: 3px 8px; font-size: 12px; }
button.wide { width: 100%; justify-content: center; }
button.icon-only { padding: 5px 6px; }
.icon-btn { padding: 1px 5px; background: transparent; border-color: transparent; color: var(--muted); }
kbd {
  font: 11px ui-monospace, Consolas, monospace;
  background: #15171a;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 4px;
  color: var(--muted);
}
.muted { color: var(--muted); }

/* ---- 顶部工具栏 ---- */
#toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 8px;
  padding: 5px 8px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#toolbar .group { display: flex; align-items: center; gap: 3px; }
#toolbar button { padding: 5px 7px; }
#toolbar button.icon-only { padding: 5px 6px; }
#toolbar .spacer, #status .spacer { flex: 1; }
.zoom-label { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.slider-label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.slider-label input { width: 70px; }

/* ---- 主体 ---- */
main {
  display: grid;
  grid-template-columns: 76px 1fr 14px 270px;
  min-height: 0;
}
#tools {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 6px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
}
#tools button {
  flex-direction: column;
  gap: 2px;
  padding: 6px 2px;
  font-size: 12px;
  position: relative;
}
#tools button kbd { position: absolute; top: 2px; right: 3px; font-size: 9px; padding: 0 2px; border: none; background: transparent; }

#stage {
  position: relative;
  overflow: hidden;
  background: var(--stage);
  min-width: 0;
  touch-action: none;
}
#stage.dragging { outline: 3px dashed var(--accent); outline-offset: -8px; }
#canvas, #baseCanvas { position: absolute; inset: 0; display: block; touch-action: none; }
#baseCanvas { pointer-events: none; }
#dropHint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  white-space: pre-line;
  color: #c7ccd3;
  font-size: 16px;
  line-height: 1.8;
  pointer-events: none;
}
#textEditor {
  position: absolute;
  z-index: 5;
  margin: 0;
  border: 1px dashed #00e5ff;
  outline: none;
  resize: none;
  overflow: hidden;
  line-height: 1.25;
  white-space: pre;
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
  user-select: text;
  -webkit-user-select: text;
}

/* ---- 右侧面板 ---- */
#panel {
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 8px 10px 16px;
}
#panel section + section { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
#panel section.disabled { opacity: 0.5; pointer-events: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.panel-head h2 { font-size: 13px; margin: 0; font-weight: 600; }
#catList { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.cat-item {
  display: grid;
  grid-template-columns: 14px 22px 1fr auto auto;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
}
.cat-item:hover { background: var(--panel-2); }
.cat-item.active { border-color: var(--accent); background: var(--accent-soft); }
.cat-key { font-size: 10px; color: var(--muted); text-align: center; }
.cat-icon { width: 22px; height: 22px; }
.cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-name-input { font: inherit; width: 100%; padding: 2px 4px; background: #15171a; color: var(--text); border: 1px solid var(--accent); border-radius: 4px; }
.cat-count { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 2ch; text-align: right; }
.field { margin-bottom: 10px; }
.field .label { color: var(--muted); margin-bottom: 4px; font-size: 12px; }
.field input[type=range] { width: 100%; }
.field select { width: 100%; font: inherit; padding: 4px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); }
.swatches, .shapes { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch {
  width: 24px; height: 24px; padding: 0;
  border-radius: 50%;
  border: 2px solid #555b64;
  position: relative;
  display: inline-block;
  cursor: pointer;
}
.swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.swatch.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.shape-btn { width: 30px; height: 30px; padding: 2px; justify-content: center; }
.shape-btn canvas { width: 22px; height: 22px; }
.seg { display: flex; flex-wrap: wrap; gap: 3px; }
.seg button { flex: 1; justify-content: center; padding: 4px 4px; font-size: 12px; }

/* ---- 状态栏 ---- */
#status {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 10px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}
#stTotal b { font-size: 15px; color: #fff; }
.chip b { color: #fff; font-variant-numeric: tabular-nums; }
#stCats { display: flex; gap: 6px; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; background: var(--panel-2); border-radius: 10px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.4); }
#stCoords { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 110px; }
#stImage { color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
#stSaved { color: #8fd18f; }
#stSaved.dirty { color: #f0b860; }

/* ---- 计数弹窗 ---- */
#countPopup {
  position: fixed;
  z-index: 20;
  min-width: 230px;
  max-width: 360px;
  max-height: 70vh;
  overflow: auto;
  background: #fff;
  color: #1a1a1a;
  border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  padding: 12px 14px;
}
#countPopup .pop-title { font-weight: 600; color: #555; margin-bottom: 4px; }
#countPopup .pop-total { font-size: 15px; margin-bottom: 8px; }
#countPopup .pop-total b { font-size: 24px; color: #0b57d0; font-variant-numeric: tabular-nums; }
#countPopup table { border-collapse: collapse; width: 100%; }
#countPopup th { text-align: left; font-weight: 500; color: #777; font-size: 12px; border-bottom: 1px solid #ddd; padding: 2px 4px; }
#countPopup td { padding: 3px 4px; border-bottom: 1px solid #f0f0f0; }
#countPopup td.num { text-align: right; font-variant-numeric: tabular-nums; }
#countPopup .pop-icon { width: 18px; height: 18px; display: block; }
#countPopup .pop-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }

/* ---- 提示条 ---- */

}

/* ---- 对话框 ---- */

  #tools button span { font-size: 10px; }

/* ---- 浮动面板（文件夹 / 快捷键提示） ---- */

}

}

#hintBox { width: 270px; }

.inline-input { font: inherit; width: 100%; padding: 1px 4px; background: #15171a; color: var(--text); border: 1px solid var(--accent); border-radius: 4px; }

    helpTitle: '使用说明',
    helpHtml: `
<h3>基本操作</h3>
<ul>
<li><b>标记计数</b>：选“标记点”工具，在图片上<b>左键单击</b>（触控板单指轻点）即添加一个标记。</li>
<li><b>查看计数</b>：<b>右键单击</b>（触控板双指轻点；触摸屏长按）弹出计数结果，状态栏也实时显示总数。</li>
<li><b>空格加点</b>：把光标移到目标上按 <kbd>空格</kbd> 即加点（推荐触控板用户：一指移动光标、另一只手按空格，比点击更快）。</li>
<li><b>删除某个点</b>：按住 <kbd>Shift</kbd> 单击（或 <kbd>Shift</kbd>+<kbd>空格</kbd>），删除离光标最近的标记。</li>
<li><b>类别</b>：右侧可新建类别；双击名称改名；改颜色/形状/大小时，该类别所有已标记的点同步变化。数字键 <kbd>1</kbd>–<kbd>9</kbd> 切换类别。</li>
<li><b>箭头 / 方框 / 椭圆</b>：按住左键拖动绘制，按住 <kbd>Shift</kbd> 可对齐角度 / 画正方形、正圆。</li>
<li><b>文字</b>：单击图片输入文字，<kbd>Enter</kbd> 完成，<kbd>Shift</kbd>+<kbd>Enter</kbd> 换行。</li>
<li><b>选择</b>：单击选中对象，可拖动、按 <kbd>Delete</kbd> 删除、在右侧修改样式；双击文字可重新编辑。</li>
</ul>
<h3>选择与右键菜单</h3>
<ul>
<li>“选择”工具 (<kbd>V</kbd>) 下在空白处拖动可框选；“套索”工具 (<kbd>L</kbd>) 可画任意形状圈选；<kbd>Shift</kbd>+单击加选；<kbd>Ctrl</kbd>+<kbd>A</kbd> 全选。</li>
<li>在点或对象上右键（触控板双指轻点）弹出菜单：复制、删除、移动（之后单击放下）、改为某类别。选中多个时对全部生效，并显示选区内各类别数量。</li>
</ul>
<h3>AI 辅助计数（按 <kbd>I</kbd> 打开面板）</h3>
<ul>
<li>先选“计数对象”（如蚊子卵），需要时在“形态参数”中设定目标颜色、单个大小、是否拆分重叠。</li>
<li>“内置算法”在本机运行、不上传图片：识别深色（或亮色）斑点，并按面积把粘连/重叠的团块拆成多个。手动标几个单独的目标后点“校准”，结果更准。</li>
<li>也可连接 Claude、ChatGPT、Gemini、豆包（需自己的 API key），或“自定义接口”（以后接入自己训练的模型）。</li>
<li>点“AI 计数”后，结果作为普通标记加入（黄色虚线圈标出），可继续手动增删；<kbd>Ctrl</kbd>+<kbd>Z</kbd> 整批撤回。“核查已标记”会标出可能漏数（绿圈）和可疑标记（橙色 ×）。</li>
<li>AI 结果必须人工复核；每次运行的引擎与参数会记录在项目文件中，便于复现。</li>
</ul>
<h3>文件夹与多张图片</h3>
<ul>
<li>左下角“文件夹”面板（可拖动、折叠、按 <kbd>F</kbd> 隐藏）。点 ＋ 新建文件夹，双击名称改名，例如改成“A”。</li>
<li>拖入的图片放进当前文件夹，自动命名为 A-01、A-02…（编号不复用，原文件名会一并记录）。</li>
<li>点图片名切换图片，<kbd>PageUp</kbd> / <kbd>PageDown</kbd> 上一张 / 下一张；每张图片的撤回记录独立。✓ 标记已完成。</li>
<li>“汇总”显示每张图各类别数量及每个文件夹的均值 ± 标准差；“全部导出”打包所有带标记图片与表格。</li>
<li>类别全部图片共用，改名、改颜色对所有图片生效。</li>
</ul>
<h3>视图</h3>
<ul>
<li>滚轮 / 触控板双指滑动：平移；<kbd>Ctrl</kbd>+滚轮 / 触控板双指捏合：缩放。</li>
<li>用“平移”工具 (<kbd>P</kbd>) 或鼠标中键拖动：平移画面。“标记点”工具下按下即加点，按住时的移动不会平移，避免快速点击时丢点。</li>
</ul>
<h3>快捷键</h3>
<table>
<tr><td><kbd>Ctrl</kbd>+<kbd>O</kbd></td><td>打开</td><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>保存项目</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></td><td>另存为</td><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>导出图片</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>撤回</td><td><kbd>Ctrl</kbd>+<kbd>Y</kbd></td><td>重做</td></tr>
<tr><td><kbd>M</kbd></td><td>标记点</td><td><kbd>A</kbd></td><td>箭头</td></tr>
<tr><td><kbd>R</kbd></td><td>方框</td><td><kbd>E</kbd></td><td>椭圆</td></tr>
<tr><td><kbd>T</kbd></td><td>文字</td><td><kbd>V</kbd></td><td>选择</td></tr>
<tr><td><kbd>P</kbd></td><td>平移</td><td><kbd>H</kbd></td><td>显示/隐藏标注</td></tr>
<tr><td><kbd>L</kbd></td><td>套索选择</td><td><kbd>I</kbd></td><td>AI 辅助计数</td></tr>
<tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>切换类别</td><td><kbd>Ctrl</kbd>+<kbd>0</kbd></td><td>适应窗口</td></tr>
<tr><td><kbd>+</kbd> / <kbd>-</kbd></td><td>放大 / 缩小</td><td><kbd>Esc</kbd></td><td>取消 / 取消选择</td></tr>
<tr><td><kbd>空格</kbd></td><td>在光标处加点</td><td><kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>V</kbd></td><td>复制 / 粘贴</td></tr>
<tr><td><kbd>PageUp</kbd> / <kbd>PageDown</kbd></td><td>上一张 / 下一张</td><td><kbd>F</kbd> / <kbd>?</kbd></td><td>文件夹面板 / 提示框</td></tr>
</table>
<p class="muted">macOS 上 <kbd>Ctrl</kbd> 均可用 <kbd>⌘</kbd> 代替。若双指轻点不能右键，请在“系统设置 → 触控板”中开启“辅助点按”。</p>
<h3>保存说明</h3>
<ul>
<li><b>保存 (Ctrl+S)</b> 把整个项目（所有文件夹、图片、标注和每张图的操作历史）保存为一个 <code>.mark.zip</code> 文件；重新打开后仍可撤回。</li>
<li>保存不会清空撤回记录，保存后仍可继续撤回。</li>
<li>软件每 30 秒自动备份到本机浏览器，意外关闭后再次打开会提示恢复。</li>
</ul>`

    helpTitle: 'Help',
    helpHtml: `
<h3>Basics</h3>
<ul>
<li><b>Counting</b>: choose the Marker tool and <b>left-click</b> (one-finger tap on a touchpad) to add a marker.</li>
<li><b>See the count</b>: <b>right-click</b> (two-finger tap on a touchpad; long-press on a touch screen). The status bar also shows the live total.</li>
<li><b>Space to mark</b>: point at a target and press <kbd>Space</kbd> (recommended on touchpads: move the pointer with one finger and press Space with the other hand).</li>
<li><b>Delete one marker</b>: <kbd>Shift</kbd>+click (or <kbd>Shift</kbd>+<kbd>Space</kbd>) removes the marker nearest to the pointer.</li>
<li><b>Categories</b>: add categories on the right; double-click a name to rename; changing colour/shape/size updates every marker of that category. Keys <kbd>1</kbd>–<kbd>9</kbd> switch category.</li>
<li><b>Arrow / Box / Ellipse</b>: drag to draw; hold <kbd>Shift</kbd> to snap angles / draw squares and circles.</li>
<li><b>Text</b>: click on the image and type; <kbd>Enter</kbd> finishes, <kbd>Shift</kbd>+<kbd>Enter</kbd> adds a line.</li>
<li><b>Select</b>: click an object to drag it, press <kbd>Delete</kbd> to remove it, or edit its style on the right; double-click text to edit.</li>
</ul>
<h3>Selection and right-click menu</h3>
<ul>
<li>With the Select tool (<kbd>V</kbd>) drag on empty space to box-select; the Lasso tool (<kbd>L</kbd>) selects with any shape; <kbd>Shift</kbd>+click adds; <kbd>Ctrl</kbd>+<kbd>A</kbd> selects all.</li>
<li>Right-click (two-finger tap) a marker or object: copy, delete, move (then click to drop), change category. With several selected, actions apply to all and the menu shows per-category counts of the selection.</li>
</ul>
<h3>AI-assisted counting (press <kbd>I</kbd>)</h3>
<ul>
<li>Choose a target (e.g. mosquito eggs); adjust colour, single size and overlap splitting under “Morphology settings”.</li>
<li>The built-in algorithm runs locally without uploading: it finds dark (or bright) spots and splits touching/overlapping clumps by area. Mark a few separate objects by hand and press “Calibrate” for better results.</li>
<li>You can also connect Claude, ChatGPT, Gemini or Doubao (your own API key), or a custom endpoint (for your own trained model later).</li>
<li>“AI count” adds ordinary markers (outlined in yellow) that you can edit by hand; <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes the batch. “Check my markers” shows possible misses (green circles) and suspicious markers (orange ×).</li>
<li>Always review AI results; the engine and parameters of each run are stored in the project for reproducibility.</li>
</ul>
<h3>Folders and multiple images</h3>
<ul>
<li>The Folders panel (lower left; drag to move, collapse, or press <kbd>F</kbd> to hide). Click ＋ to add a folder; double-click a name to rename it, e.g. “A”.</li>
<li>Dropped images go into the current folder and are named A-01, A-02… (numbers are never reused; the original file name is recorded).</li>
<li>Click an image to switch, or use <kbd>PageUp</kbd> / <kbd>PageDown</kbd>. Each image has its own undo history. ✓ marks an image as done.</li>
<li>“Summary” shows counts per image and mean ± SD per folder; “Export all” packs all annotated images and tables into one zip.</li>
<li>Categories are shared by all images.</li>
</ul>
<h3>View</h3>
<ul>
<li>Wheel / two-finger swipe: pan. <kbd>Ctrl</kbd>+wheel / pinch: zoom.</li>
<li>Drag with the Pan tool (<kbd>P</kbd>) or the middle mouse button to pan. In the Marker tool a press places a marker immediately and movement while pressed is ignored, so fast clicks are never lost.</li>
</ul>
<h3>Shortcuts</h3>
<table>
<tr><td><kbd>Ctrl</kbd>+<kbd>O</kbd></td><td>Open</td><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>Save project</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></td><td>Save as</td><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>Export image</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>Undo</td><td><kbd>Ctrl</kbd>+<kbd>Y</kbd></td><td>Redo</td></tr>
<tr><td><kbd>M</kbd></td><td>Marker</td><td><kbd>A</kbd></td><td>Arrow</td></tr>
<tr><td><kbd>R</kbd></td><td>Box</td><td><kbd>E</kbd></td><td>Ellipse</td></tr>
<tr><td><kbd>T</kbd></td><td>Text</td><td><kbd>V</kbd></td><td>Select</td></tr>
<tr><td><kbd>P</kbd></td><td>Pan</td><td><kbd>H</kbd></td><td>Show/hide annotations</td></tr>
<tr><td><kbd>L</kbd></td><td>Lasso selection</td><td><kbd>I</kbd></td><td>AI counting</td></tr>
<tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>Switch category</td><td><kbd>Ctrl</kbd>+<kbd>0</kbd></td><td>Fit to window</td></tr>
<tr><td><kbd>+</kbd> / <kbd>-</kbd></td><td>Zoom in / out</td><td><kbd>Esc</kbd></td><td>Cancel / deselect</td></tr>
<tr><td><kbd>Space</kbd></td><td>Marker at pointer</td><td><kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>V</kbd></td><td>Copy / paste</td></tr>
<tr><td><kbd>PageUp</kbd> / <kbd>PageDown</kbd></td><td>Previous / next image</td><td><kbd>F</kbd> / <kbd>?</kbd></td><td>Folder panel / hints</td></tr>
</table>
<p class="muted">On macOS, <kbd>⌘</kbd> works wherever <kbd>Ctrl</kbd> is listed. If a two-finger tap does not right-click, enable “Secondary click” in System Settings → Trackpad.</p>
<h3>Saving</h3>
<ul>
<li><b>Save (Ctrl+S)</b> writes the whole project (folders, images, annotations and each image's edit history) into one <code>.mark.zip</code> file, so undo still works after reopening.</li>
<li>Saving never clears the undo history.</li>
<li>Work is backed up to this browser every 30 s; after an unexpected close you will be offered a restore.</li>
</ul>`

let LANG = 'zh';

function t(key, params) {
  let s = (I18N[LANG] && I18N[LANG][key]);
  if (s === undefined) s = I18N.en[key];   // 缺失的翻译先回退到英文，再回退到中文
  if (s === undefined) s = I18N.zh[key];
  if (s === undefined) return key;
  if (params && typeof s === 'string') {
    s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined ? params[k] : m));
  }
  return s;
}

function applyI18n(root) {
  root = root || document;
  root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  root.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  root.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.documentElement.lang = { zh: 'zh-CN', 'zh-Hant': 'zh-TW', en: 'en', es: 'es', pt: 'pt', ja: 'ja', ko: 'ko' }[LANG] || 'en';
  if (typeof updateCopyright === 'function') updateCopyright();   // 版权声明随语言更新
}

  helpTitle: 'Ayuda',
  helpHtml: `
<h3>Lo básico</h3>
<ul>
<li><b>Contar</b>: elija la herramienta Marca y pulse con el botón izquierdo (toque con un dedo en el panel táctil). La marca se coloca en el instante de pulsar.</li>
<li><b>Espacio</b>: con el puntero sobre el objetivo, pulse <kbd>Espacio</kbd> para marcar (recomendado con panel táctil: un dedo mueve el puntero y la otra mano pulsa Espacio).</li>
<li><b>Ver el conteo</b>: clic derecho en una zona vacía (toque con dos dedos). La barra de estado muestra el total en todo momento.</li>
<li><b>Eliminar una marca</b>: <kbd>Shift</kbd>+clic (o <kbd>Shift</kbd>+<kbd>Espacio</kbd>) elimina la más cercana.</li>
<li><b>Categorías</b>: a la derecha; doble clic para renombrar; cambiar color/forma/tamaño actualiza todas sus marcas. Teclas <kbd>1</kbd>–<kbd>9</kbd>.</li>
<li><b>Flecha / Rectángulo / Elipse / Texto</b>: arrastre para dibujar (Shift ajusta ángulos o hace cuadrados/círculos); clic para escribir texto.</li>
</ul>
<h3>Selección y menú contextual</h3>
<ul>
<li>Con Seleccionar (<kbd>V</kbd>) arrastre en vacío para un recuadro; el Lazo (<kbd>L</kbd>) selecciona con cualquier forma; <kbd>Shift</kbd>+clic añade; <kbd>Ctrl</kbd>+<kbd>A</kbd> todo.</li>
<li>Clic derecho sobre una marca u objeto: copiar, eliminar, mover (luego clic para soltar), cambiar de categoría. Con varios seleccionados se aplica a todos y se muestra el conteo de la selección.</li>
</ul>
<h3>Conteo asistido por IA (tecla <kbd>I</kbd>)</h3>
<ul>
<li>Elija el objetivo (p. ej. huevos de mosquito) y ajuste color, tamaño individual y separación de solapes en “Morfología”.</li>
<li>El algoritmo integrado funciona localmente sin subir nada: detecta manchas oscuras (o claras) y separa grupos por área. Marque a mano algunos objetos separados y pulse “Calibrar” para mejorar.</li>
<li>También puede conectar Claude, ChatGPT, Gemini o Doubao (con su propia clave API) o un servicio propio (para su futuro modelo entrenado).</li>
<li>Los resultados se añaden como marcas normales (resaltadas en amarillo) que puede corregir a mano; <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace el lote. “Revisar mis marcas” indica posibles omisiones (verde) y marcas dudosas (× naranja).</li>
<li>Revise siempre los resultados de la IA; cada ejecución queda registrada en el proyecto.</li>
</ul>
<h3>Carpetas y varias imágenes</h3>
<ul>
<li>Panel de carpetas abajo a la izquierda (se puede mover, contraer u ocultar con <kbd>F</kbd>). ＋ crea una carpeta; doble clic para renombrarla (p. ej. “A”).</li>
<li>Las imágenes se llaman A-01, A-02… (los números no se reutilizan; se guarda el nombre original). <kbd>RePág</kbd>/<kbd>AvPág</kbd> cambian de imagen; cada una tiene su propio historial de deshacer.</li>
<li>“Resumen” muestra conteos por imagen y media ± DE por carpeta; “Exportar todo” empaqueta imágenes marcadas y tablas en un zip.</li>
</ul>
<h3>Vista</h3>
<ul>
<li>Rueda / deslizar con dos dedos: mover la vista. <kbd>Ctrl</kbd>+rueda / pellizcar: zoom. También la herramienta Mover vista (<kbd>P</kbd>) o el botón central.</li>
</ul>
<h3>Guardar</h3>
<ul>
<li><b>Guardar (Ctrl+S)</b> crea un archivo <code>.mark.zip</code> con todas las carpetas, imágenes, marcas y el historial; tras reabrirlo se puede seguir deshaciendo.</li>
<li>Guardar no borra el historial de deshacer. Se hace una copia de seguridad cada 30 s en este navegador.</li>
</ul>
<p class="muted">En macOS, <kbd>⌘</kbd> sustituye a <kbd>Ctrl</kbd>. Si el toque con dos dedos no hace clic derecho, active “Clic secundario” en Ajustes del sistema → Trackpad.</p>`
};

<li><b>Seta / Retângulo / Elipse / Texto</b>: arraste para desenhar (Shift ajusta ângulos ou faz quadrados/círculos); clique para digitar texto.</li>
</ul>
<h3>Seleção e menu de contexto</h3>
<ul>
<li>Com Selecionar (<kbd>V</kbd>) arraste no vazio para um retângulo; o Laço (<kbd>L</kbd>) seleciona com qualquer forma; <kbd>Shift</kbd>+clique adiciona; <kbd>Ctrl</kbd>+<kbd>A</kbd> tudo.</li>
<li>Clique direito numa marcação ou objeto: copiar, excluir, mover (depois clique para soltar), mudar de categoria. Com vários selecionados, vale para todos e mostra a contagem da seleção.</li>
</ul>
<h3>Contagem assistida por IA (tecla <kbd>I</kbd>)</h3>
<ul>
<li>Escolha o alvo (ex.: ovos de mosquito) e ajuste cor, tamanho individual e separação de sobreposições em “Morfologia”.</li>
<li>O algoritmo embutido roda localmente sem enviar nada: encontra manchas escuras (ou claras) e separa aglomerados pela área. Marque à mão alguns objetos separados e clique em “Calibrar” para melhorar.</li>
<li>Também é possível conectar Claude, ChatGPT, Gemini ou Doubao (com sua própria chave de API) ou um serviço próprio (para seu futuro modelo treinado).</li>
<li>Os resultados entram como marcações normais (destacadas em amarelo) que você pode corrigir; <kbd>Ctrl</kbd>+<kbd>Z</kbd> desfaz o lote. “Verificar minhas marcações” mostra possíveis omissões (verde) e marcações suspeitas (× laranja).</li>
<li>Sempre revise os resultados da IA; cada execução fica registrada no projeto.</li>
</ul>
<h3>Pastas e várias imagens</h3>
<ul>
<li>Painel de pastas no canto inferior esquerdo (pode ser movido, recolhido ou ocultado com <kbd>F</kbd>). ＋ cria uma pasta; clique duas vezes para renomear (ex.: “A”).</li>
<li>As imagens recebem os nomes A-01, A-02… (números não são reutilizados; o nome original é registrado). <kbd>PageUp</kbd>/<kbd>PageDown</kbd> trocam de imagem; cada uma tem seu próprio histórico.</li>
<li>“Resumo” mostra contagens por imagem e média ± DP por pasta; “Exportar tudo” junta imagens marcadas e tabelas num zip.</li>
</ul>
<h3>Vista</h3>
<ul>
<li>Roda / deslizar com dois dedos: mover a vista. <kbd>Ctrl</kbd>+roda / pinça: zoom. Também a ferramenta Mover vista (<kbd>P</kbd>) ou o botão do meio.</li>
</ul>
<h3>Salvar</h3>
<ul>
<li><b>Salvar (Ctrl+S)</b> cria um arquivo <code>.mark.zip</code> com todas as pastas, imagens, marcações e o histórico; após reabrir ainda é possível desfazer.</li>
<li>Salvar não apaga o histórico. Há cópia de segurança a cada 30 s neste navegador.</li>
</ul>
<p class="muted">No macOS, <kbd>⌘</kbd> substitui <kbd>Ctrl</kbd>. Se o toque com dois dedos não fizer clique secundário, ative “Clique secundário” em Ajustes do Sistema → Trackpad.</p>`
};

<h3>選択と右クリックメニュー</h3>
<ul>
<li>選択ツール (<kbd>V</kbd>) で何もない所をドラッグすると範囲選択。なげなわ (<kbd>L</kbd>) で自由な形に選択。<kbd>Shift</kbd>+クリックで追加。<kbd>Ctrl</kbd>+<kbd>A</kbd> ですべて選択。</li>
<li>マークやオブジェクトを右クリック：コピー、削除、移動（その後クリックで配置）、カテゴリ変更。複数選択時はすべてに適用し、選択範囲のカテゴリ別個数も表示します。</li>
</ul>
<h3>AI カウント支援（<kbd>I</kbd> キー）</h3>
<ul>
<li>対象（例：蚊の卵）を選び、「形態の設定」で色・1 個の大きさ・重なりの分割を調整します。</li>
<li>内蔵アルゴリズムはローカルで動作し、何もアップロードしません。暗い（または明るい）斑点を見つけ、接触・重なった塊を面積で分割します。離れた対象をいくつか手でマークして「校正」を押すと精度が上がります。</li>
<li>Claude、ChatGPT、Gemini、Doubao（ご自身の API キーが必要）や、カスタム API（将来の独自学習モデル用）にも接続できます。</li>
<li>結果は通常のマークとして追加され（黄色の破線で表示）、手で修正できます。<kbd>Ctrl</kbd>+<kbd>Z</kbd> で一括取り消し。「マークをチェック」は見落とし（緑）と疑わしいマーク（オレンジの ×）を示します。</li>
<li>AI の結果は必ず人が確認してください。実行ごとのエンジンとパラメーターはプロジェクトに記録されます。</li>
</ul>
<h3>フォルダーと複数の画像</h3>
<ul>
<li>左下のフォルダーパネル（移動・折りたたみ可、<kbd>F</kbd> で非表示）。＋ でフォルダーを作成、ダブルクリックで名前変更（例：「A」）。</li>
<li>画像は A-01、A-02… と命名されます（番号は再利用されず、元のファイル名も記録）。<kbd>PageUp</kbd>/<kbd>PageDown</kbd> で切り替え。画像ごとに独立した取り消し履歴があります。</li>
<li>「集計」は画像ごとの数とフォルダーごとの平均 ± SD を表示。「すべて書き出し」はマーク付き画像と表を zip にまとめます。</li>
</ul>
<h3>表示</h3>
<ul>
<li>ホイール / 2 本指スワイプ：パン。<kbd>Ctrl</kbd>+ホイール / ピンチ：ズーム。パンツール (<kbd>P</kbd>) や中ボタンでも移動できます。</li>
</ul>
<h3>保存</h3>
<ul>
<li><b>保存 (Ctrl+S)</b> で、すべてのフォルダー・画像・マーク・操作履歴を 1 つの <code>.mark.zip</code> に保存します。開き直しても元に戻せます。</li>
<li>保存しても取り消し履歴は消えません。30 秒ごとにこのブラウザーへ自動バックアップします。</li>
</ul>
<p class="muted">macOS では <kbd>Ctrl</kbd> の代わりに <kbd>⌘</kbd> が使えます。2 本指タップで右クリックにならない場合は「システム設定 → トラックパッド」で「副ボタンのクリック」をオンにしてください。</p>`
};

 "helpTitle": "使用說明",
 "helpHtml": "\n<h3>基本操作</h3>\n<ul>\n<li><b>標記計數</b>：選「標記點」工具，在圖片上<b>左鍵按一下</b>（觸控板單指輕點）即新增一個標記。</li>\n<li><b>檢視計數</b>：<b>右鍵按一下</b>（觸控板雙指輕點；觸控式螢幕長按）彈出計數結果，狀態列也實時顯示總數。</li>\n<li><b>空白鍵加點</b>：把游標移到目標上按 <kbd>空白鍵</kbd> 即加點（推薦觸控板使用者：一指移動游標、另一隻手按空白鍵，比按一下更快）。</li>\n<li><b>刪除某個點</b>：按住 <kbd>Shift</kbd> 按一下（或 <kbd>Shift</kbd>+<kbd>空白鍵</kbd>），刪除離游標最近的標記。</li>\n<li><b>類別</b>：右側可新增類別；按兩下名稱改名；改顏色/形狀/大小時，該類別所有已標記的點同步變化。數字鍵 <kbd>1</kbd>–<kbd>9</kbd> 切換類別。</li>\n<li><b>箭頭 / 方框 / 橢圓</b>：按住左鍵拖動繪製，按住 <kbd>Shift</kbd> 可對齊角度 / 畫正方形、正圓。</li>\n<li><b>文字</b>：按一下圖片輸入文字，<kbd>Enter</kbd> 完成，<kbd>Shift</kbd>+<kbd>Enter</kbd> 換行。</li>\n<li><b>選擇</b>：按一下選中物件，可拖動、按 <kbd>Delete</kbd> 刪除、在右側修改樣式；按兩下文字可重新編輯。</li>\n</ul>\n<h3>選擇與右鍵選單</h3>\n<ul>\n<li>「選擇」工具 (<kbd>V</kbd>) 下在空白處拖動可框選；「套索」工具 (<kbd>L</kbd>) 可畫任意形狀圈選；<kbd>Shift</kbd>+按一下加選；<kbd>Ctrl</kbd>+<kbd>A</kbd> 全選。</li>\n<li>在點或物件上右鍵（觸控板雙指輕點）彈出選單：複製、刪除、移動（之後按一下放下）、改為某類別。選中多個時對全部生效，並顯示選區內各類別數量。</li>\n</ul>\n<h3>AI 輔助計數（按 <kbd>I</kbd> 開啟面板）</h3>\n<ul>\n<li>先選「計數物件」（如蚊子卵），需要時在「形態引數」中設定目標顏色、單個大小、是否拆分重疊。</li>\n<li>「內建演算法」在本機執行、不上傳圖片：識別深色（或亮色）斑點，並按面積把粘連/重疊的團塊拆成多個。手動標幾個單獨的目標後點「校準」，結果更準。</li>\n<li>也可連線 Claude、ChatGPT、Gemini、豆包（需自己的 API key），或「自定義介面」（以後接入自己訓練的模型）。</li>\n<li>點「AI 計數」後，結果作為普通標記加入（黃色虛線圈標出），可繼續手動增刪；<kbd>Ctrl</kbd>+<kbd>Z</kbd> 整批復原。「核查已標記」會標出可能漏數（綠圈）和可疑標記（橙色 ×）。</li>\n<li>AI 結果必須人工複核；每次執行的引擎與引數會記錄在專案檔案中，便於復現。</li>\n</ul>\n<h3>資料夾與多張圖片</h3>\n<ul>\n<li>左下角「資料夾」面板（可拖動、摺疊、按 <kbd>F</kbd> 隱藏）。點 ＋ 新增資料夾，按兩下名稱改名，例如改成「A」。</li>\n<li>拖入的圖片放進目前資料夾，自動命名為 A-01、A-02…（編號不復用，原檔名會一併記錄）。</li>\n<li>點圖片名切換圖片，<kbd>PageUp</kbd> / <kbd>PageDown</kbd> 上一張 / 下一張；每張圖片的復原記錄獨立。✓ 標記已完成。</li>\n<li>「彙總」顯示每張圖各類別數量及每個資料夾的均值 ± 標準差；「全部匯出」打包所有帶標記圖片與表格。</li>\n<li>類別全部圖片共用，改名、改顏色對所有圖片生效。</li>\n</ul>\n<h3>檢視</h3>\n<ul>\n<li>滾輪 / 觸控板雙指滑動：平移；<kbd>Ctrl</kbd>+滾輪 / 觸控板雙指捏合：縮放。</li>\n<li>用「平移」工具 (<kbd>P</kbd>) 或滑鼠中鍵拖動：平移畫面。「標記點」工具下按下即加點，按住時的移動不會平移，避免快速按一下時丟點。</li>\n</ul>\n<h3>快捷鍵</h3>\n<table>\n<tr><td><kbd>Ctrl</kbd>+<kbd>O</kbd></td><td>開啟</td><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>儲存專案</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></td><td>另存新檔</td><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>匯出圖片</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>復原</td><td><kbd>Ctrl</kbd>+<kbd>Y</kbd></td><td>重做</td></tr>\n<tr><td><kbd>M</kbd></td><td>標記點</td><td><kbd>A</kbd></td><td>箭頭</td></tr>\n<tr><td><kbd>R</kbd></td><td>方框</td><td><kbd>E</kbd></td><td>橢圓</td></tr>\n<tr><td><kbd>T</kbd></td><td>文字</td><td><kbd>V</kbd></td><td>選擇</td></tr>\n<tr><td><kbd>P</kbd></td><td>平移</td><td><kbd>H</kbd></td><td>顯示/隱藏標註</td></tr>\n<tr><td><kbd>L</kbd></td><td>套索選擇</td><td><kbd>I</kbd></td><td>AI 輔助計數</td></tr>\n<tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>切換類別</td><td><kbd>Ctrl</kbd>+<kbd>0</kbd></td><td>適應視窗</td></tr>\n<tr><td><kbd>+</kbd> / <kbd>-</kbd></td><td>放大 / 縮小</td><td><kbd>Esc</kbd></td><td>取消 / 取消選擇</td></tr>\n<tr><td><kbd>空白鍵</kbd></td><td>在游標處加點</td><td><kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>V</kbd></td><td>複製 / 貼上</td></tr>\n<tr><td><kbd>PageUp</kbd> / <kbd>PageDown</kbd></td><td>上一張 / 下一張</td><td><kbd>F</kbd> / <kbd>?</kbd></td><td>資料夾面板 / 提示框</td></tr>\n</table>\n<p class=\"muted\">macOS 上 <kbd>Ctrl</kbd> 均可用 <kbd>⌘</kbd> 代替。若雙指輕點不能右鍵，請在「系統設定 → 觸控板」中開啟「輔助點按」。</p>\n<h3>儲存說明</h3>\n<ul>\n<li><b>儲存 (Ctrl+S)</b> 把整個專案（所有資料夾、圖片、標註和每張圖的操作歷史）儲存為一個 <code>.mark.zip</code> 檔案；重新開啟後仍可復原。</li>\n<li>儲存不會清空復原記錄，儲存後仍可繼續復原。</li>\n<li>軟體每 30 秒自動備份到本機瀏覽器，意外關閉後再次開啟會提示恢復。</li>\n</ul>"
};

  helpHtml: `
<h3>기본 조작</h3>
<ul>
<li><b>계수</b>: “표시점” 도구에서 왼쪽 클릭(터치패드는 한 손가락 탭). 누르는 순간 표시가 찍힙니다.</li>
<li><b>스페이스바</b>: 포인터를 대상에 맞추고 <kbd>스페이스</kbd>를 누르면 표시(터치패드 사용 시 권장: 한 손가락으로 포인터를 움직이고 다른 손으로 스페이스).</li>
<li><b>계수 보기</b>: 빈 곳을 오른쪽 클릭(두 손가락 탭). 상태 표시줄에도 항상 합계가 표시됩니다.</li>
<li><b>표시 삭제</b>: <kbd>Shift</kbd>+클릭(또는 <kbd>Shift</kbd>+<kbd>스페이스</kbd>)으로 가장 가까운 표시 삭제.</li>
<li><b>범주</b>: 오른쪽에서 추가, 두 번 클릭으로 이름 변경. 색·모양·크기를 바꾸면 해당 범주의 모든 표시에 반영. <kbd>1</kbd>–<kbd>9</kbd>로 전환.</li>
<li><b>화살표 / 사각형 / 타원 / 텍스트</b>: 끌어서 그리기(Shift로 각도 고정·정사각형·정원). 텍스트는 클릭하여 입력.</li>
</ul>
<h3>선택과 오른쪽 클릭 메뉴</h3>
<ul>
<li>선택 도구(<kbd>V</kbd>)로 빈 곳을 끌면 영역 선택, 올가미(<kbd>L</kbd>)로 자유 모양 선택, <kbd>Shift</kbd>+클릭으로 추가, <kbd>Ctrl</kbd>+<kbd>A</kbd>로 모두 선택.</li>
<li>표시나 개체를 오른쪽 클릭: 복사, 삭제, 이동(그 후 클릭하여 놓기), 범주 변경. 여러 개를 선택하면 모두에 적용되며 선택 영역의 범주별 개수도 보여 줍니다.</li>
</ul>
<h3>AI 계수 보조(<kbd>I</kbd> 키)</h3>
<ul>
<li>대상(예: 모기 알)을 고르고 “형태 설정”에서 색, 1개 크기, 겹침 분리를 조정합니다.</li>
<li>내장 알고리즘은 로컬에서 실행되어 아무것도 업로드하지 않습니다. 어두운(또는 밝은) 반점을 찾고 맞닿거나 겹친 덩어리를 면적으로 나눕니다. 떨어져 있는 대상 몇 개를 직접 표시하고 “보정”을 누르면 더 정확해집니다.</li>
<li>Claude, ChatGPT, Gemini, Doubao(본인 API 키 필요) 또는 사용자 API(향후 자체 학습 모델용)에도 연결할 수 있습니다.</li>
<li>결과는 일반 표시로 추가되며(노란 점선) 직접 수정할 수 있습니다. <kbd>Ctrl</kbd>+<kbd>Z</kbd>로 한 번에 취소. “내 표시 검토”는 누락 가능 위치(초록)와 의심 표시(주황 ×)를 보여 줍니다.</li>
<li>AI 결과는 반드시 사람이 확인하세요. 실행마다 엔진과 매개변수가 프로젝트에 기록됩니다.</li>
</ul>
<h3>폴더와 여러 이미지</h3>
<ul>
<li>왼쪽 아래 폴더 패널(이동·접기 가능, <kbd>F</kbd>로 숨기기). ＋로 폴더를 만들고 두 번 클릭하여 이름 변경(예: “A”).</li>
<li>이미지는 A-01, A-02… 로 이름이 붙습니다(번호는 재사용되지 않고 원본 파일 이름도 기록). <kbd>PageUp</kbd>/<kbd>PageDown</kbd>으로 전환하며, 이미지마다 실행 취소 기록이 따로 있습니다.</li>
<li>“요약”은 이미지별 개수와 폴더별 평균 ± SD를 보여 주고, “모두 내보내기”는 표시된 이미지와 표를 zip으로 묶습니다.</li>
</ul>
<h3>보기</h3>
<ul>
<li>휠 / 두 손가락 밀기: 화면 이동. <kbd>Ctrl</kbd>+휠 / 핀치: 확대·축소. 이동 도구(<kbd>P</kbd>)나 가운데 버튼으로도 이동할 수 있습니다.</li>
</ul>
<h3>저장</h3>
<ul>
<li><b>저장(Ctrl+S)</b>은 모든 폴더·이미지·표시·작업 기록을 하나의 <code>.mark.zip</code> 파일로 저장합니다. 다시 열어도 실행 취소할 수 있습니다.</li>
<li>저장해도 실행 취소 기록은 지워지지 않습니다. 30초마다 이 브라우저에 자동 백업됩니다.</li>
</ul>
<p class="muted">macOS에서는 <kbd>Ctrl</kbd> 대신 <kbd>⌘</kbd>를 쓸 수 있습니다. 두 손가락 탭이 오른쪽 클릭이 되지 않으면 “시스템 설정 → 트랙패드”에서 “보조 클릭”을 켜세요.</p>`

  "tour_mark_m": "<p>选「标记点」工具后：</p><ul><li><b>单指点按</b>图片 = 加一个点</li><li>双指捏合 = 缩放，双指拖动 = 移动画面</li><li>长按点 = 改类别 / 删除；工具栏的撤回按钮可撤销</li></ul>",
  "tour_cats_t": "③ 类别",
  "tour_cats": "<p>每个类别（如活细胞 / 死细胞）有自己的颜色和形状，分别计数。</p><p>点类别切换当前类别，或按数字键 <kbd>1</kbd>–<kbd>9</kbd>；「＋ 新类别」添加。</p>",
  "tour_cats_m": "<p>点这个按钮打开类别面板：每个类别（如活细胞 / 死细胞）有自己的颜色和形状。</p><p>也可以直接点底部状态栏里的类别来切换。</p>",
  "tour_folders_t": "④ 文件夹与多张图片",
  "tour_folders": "<p>把图片按样品 / 组放进文件夹，自动命名 A-01、A-02…</p><p>点图片名切换（或 <kbd>PageUp</kbd>/<kbd>PageDown</kbd>），数完点 ✓ 标记已完成。</p>",
  "tour_grid_t": "⑤ 图像工具：调整、网格、比例尺",
  "tour_grid": "<ul><li><b>调整</b>：亮度、对比度、通道，看得更清楚（不改原图）</li><li><b>网格</b>：可移动、可设格数，对齐计数板；「开始逐格计数」后单击一格、按<b>空格</b>选定</li><li><b>比例尺</b>：标定后可测距离和面积</li></ul>",
  "tour_image_t": "⑥ 图像编辑",
  "tour_image": "<p>裁剪、旋转、翻转、插入图片、局部放大插图。标记会跟着图片一起变换。</p>",
  "tour_stats_t": "⑦ 数据统计与导出 Excel",
  "tour_stats": "<ul><li>数据概览：每张图各类别数量</li><li>组间比较 / 组内比较（t 检验等）</li><li>浓度换算（计数板，个/mL）</li><li>噬斑 PFU / 平板菌落 CFU</li><li><b>导出 Excel</b>：合计和结果都是公式，改数据自动更新</li></ul>",
  "tour_tpl_t": "⑧ 模板",
  "tour_tpl": "<p>把类别和统计设置存成模板（自动编号 v1、v2…），下次实验一键套用。</p>",
  "tour_help_t": "⑨ 更多说明都在这里",
  "tour_help": "<p>每个功能的详细用法和全部快捷键都在 <b>?</b> 使用说明里。</p><p>想再看一遍这个教程，也在那里点「▶ 重新播放教程」。</p>"
 },

  "tourReplay": "▶ Replay tour",
  "tour_welcome_t": "Welcome to Counting Helper!",
  "tour_welcome": "<p>About one minute to show you where the main features are.</p><p>You can press “Skip” at any time; to watch it again later, click <b>?</b> at the top right.</p>",
  "tour_open_t": "① Open images",
  "tour_open": "<p>Click here to open images (several at once is fine), or simply <b>drag them into the window</b>.</p><p>JPG, PNG, TIFF and more. Use “Save” to store marks and settings as a project and continue later.</p>",
  "tour_mark_t": "② Add marks to count",
  "tour_mark": "<p>With the Marker tool (<kbd>M</kbd>):</p><ul><li><b>Click</b> on the image = add a mark</li><li>Or point at the object and press <b>Space</b> = add a mark (handy on a trackpad); <kbd>Shift</kbd>+Space deletes the nearest mark</li><li>Right-click a mark = change category / delete; <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</li></ul><p>Counts update live in the status bar.</p>",
  "tour_mark_m": "<p>With the Marker tool:</p><ul><li><b>Tap</b> the image = add a mark</li><li>Pinch = zoom, two-finger drag = pan</li><li>Long-press a mark = change category / delete; use the Undo button to undo</li></ul>",
  "tour_cats_t": "③ Categories",
  "tour_cats": "<p>Each category (e.g. live / dead cells) has its own colour and shape and is counted separately.</p><p>Click a category to make it current, or press <kbd>1</kbd>–<kbd>9</kbd>; “+ New” adds one.</p>",
  "tour_cats_m": "<p>Tap this button to open the category panel: each category (e.g. live / dead) has its own colour and shape.</p><p>You can also tap a category in the status bar to switch.</p>",
  "tour_folders_t": "④ Folders and multiple images",
  "tour_folders": "<p>Put images into folders by sample / group; they are named A-01, A-02… automatically.</p><p>Click an image name to switch (or <kbd>PageUp</kbd>/<kbd>PageDown</kbd>) and tick ✓ when it's done.</p>",
  "tour_grid_t": "⑤ Image tools: adjust, grid, scale",
  "tour_grid": "<ul><li><b>Adjust</b>: brightness, contrast, channel — see better without changing the original</li><li><b>Grid</b>: movable, set the number of cells, align with a hemocytometer; in cell-by-cell counting click a cell and press <b>Space</b> to select it</li><li><b>Scale</b>: calibrate, then measure length and area</li></ul>",
  "tour_image_t": "⑥ Image editing",
  "tour_image": "<p>Crop, rotate, flip, insert pictures and zoomed insets. Marks move with the image.</p>",
  "tour_stats_t": "⑦ Statistics and Excel export",
  "tour_stats": "<ul><li>Overview: counts per image and category</li><li>Group / within-group comparison (t tests etc.)</li><li>Concentration (hemocytometer, cells/mL)</li><li>Plaque PFU / colony CFU</li><li><b>Export Excel</b>: totals and results are formulas that update when data change</li></ul>",
  "tour_tpl_t": "⑧ Templates",
  "tour_tpl": "<p>Save categories and statistics settings as a template (numbered v1, v2…) and apply it in one click next time.</p>",
  "tour_help_t": "⑨ More details are here",
  "tour_help": "<p>Full instructions for every feature and all shortcuts are under <b>?</b>.</p><p>You can also replay this tour there with “▶ Replay tour”.</p>"
 },

  "tour_cats_m": "<p>底部最左邊的按鈕顯示<b>當前類別</b>（顏色 + 名稱）。點一下就能選別的類別、新增新類別。</p><p>點在圖片上的點會記到當前類別裡。</p>",
  "tour_grid": "<ul><li><b>調整</b>：亮度、對比度、通道（不改原圖）</li><li><b>網格</b>：對齊計數板逐格計數（單擊一格、按<b>空格</b>選定）</li><li><b>平板分割槽</b>：把瓊脂平板按 1/2、1/4、1/8 米字、1/16 或自定份數等分，可拖動和旋轉；只數幾份就能推算全板</li><li><b>比例尺</b>：標定後測距離和麵積</li></ul>",
  "_help": "<h3>平板分割槽、批次新增圖片、手機類別按鈕（v1.4.9.1）</h3><ul><li><b>平板分割槽</b>（影象工具 →「平板分割槽」）：選 1/2 橫、1/2 豎、1/4 十字、1/8 米字、1/16 或輸入份數；「✥ 移動 / 調整」後拖圓心移動、拖圓邊改大小、拖橙色手柄旋轉；「☑ 點選扇區」後單擊扇區計入 / 取消（也可在面板列表中勾選）。只數部分扇區時，全板估計 = 已選扇區計數之和 ÷ 已選扇區面積佔比（比率估計；等分時即 ×份數/已選數）；面板中同時給出每份平均 ± SD 與泊松離散度。CFU/PFU 頁可直接用全板估計作為單板計數；Excel 有「平板分割槽」工作表，估計值為 SUMIFS 公式。</li><li><b>新增圖片</b>：工具欄「＋ 新增圖片」或空白畫面中央的大按鈕，開啟批次匯入視窗：可多次選擇、選整個資料夾（電腦）或拍照（手機），預覽、勾選、調整順序（預設按選擇順序），選擇匯入到哪個資料夾，再一次匯入。</li><li><b>手機</b>：底部工具行最左邊的「當前類別」按鈕，點一下選擇類別。</li></ul>"
 },

const clone = (o) => JSON.parse(JSON.stringify(o));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 相对亮度（WCAG 定义），用于选择对比描边颜色
function luminance(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return 0.5;
  const n = parseInt(m[1], 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
const contrastColor = (hex) => (luminance(hex) > 0.35 ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.9)');

function hexToRgba(hex, a) {
  const n = parseInt(hex.replace('#', ''), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// ---- SHA-256 ---------------------------------------------------------------
// 优先使用浏览器内置实现；不可用时（极少数环境）退回到纯 JS 实现。
async function sha256Hex(buffer) {
  try {
    if (window.crypto && crypto.subtle) {
      const d = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(d), b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* 使用下方纯 JS 实现 */ }
  return sha256Js(new Uint8Array(buffer));
}

function sha256Js(data) {
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const len = data.length;
  const total = Math.ceil((len + 9) / 64) * 64;
  const buf = new Uint8Array(total);
  buf.set(data);
  buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(len / 0x20000000));
  dv.setUint32(total - 4, (len * 8) >>> 0);
  const W = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3);
      const s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
  }
  return Array.from(H, x => x.toString(16).padStart(8, '0')).join('');
}

// ---- 文件类型识别（按文件头魔数，不依赖扩展名） -------------------------------
function sniffImageMime(u8) {
  if (u8[0] === 0x89 && u8[1] === 0x50 && u8[2] === 0x4e && u8[3] === 0x47) return 'image/png';
  if (u8[0] === 0xff && u8[1] === 0xd8 && u8[2] === 0xff) return 'image/jpeg';
  if (u8[0] === 0x47 && u8[1] === 0x49 && u8[2] === 0x46) return 'image/gif';
  if (u8[0] === 0x42 && u8[1] === 0x4d) return 'image/bmp';
  if (u8[0] === 0x52 && u8[1] === 0x49 && u8[2] === 0x46 && u8[3] === 0x46 &&
      u8[8] === 0x57 && u8[9] === 0x45 && u8[10] === 0x42 && u8[11] === 0x50) return 'image/webp';
  if ((u8[0] === 0x49 && u8[1] === 0x49 && u8[2] === 42 && u8[3] === 0) ||
      (u8[0] === 0x4d && u8[1] === 0x4d && u8[2] === 0 && u8[3] === 42)) return 'image/tiff';
  return null;
}

function bytesToBase64(u8) {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image decode failed'));
    img.src = src;
  });
}

function baseName(name) {
  return String(name || 'image').replace(/\.mark\.json$/i, '').replace(/\.[^.]+$/, '');
}

function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function formatTime(d) {
  d = d instanceof Date ? d : new Date(d);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ---- 保存文件 -----------------------------------------------------------------
// Chrome/Edge：使用“另存为”对话框（File System Access API）；其它浏览器：下载到“下载”文件夹。
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function writeToHandle(handle, blob) {
  const w = await handle.createWritable();
  await w.write(blob);
  await w.close();
}

// 返回 {name, handle}；用户取消时返回 null
async function saveBlobAs(blob, suggestedName, type) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName, types: type ? [type] : undefined });
      await writeToHandle(handle, blob);
      return { name: handle.name, handle };
    } catch (e) {
      if (e && e.name === 'AbortError') return null;
      // 其它错误（如安全限制）→ 退回到下载方式
    }
  }
  downloadBlob(blob, suggestedName);
  return { name: suggestedName, handle: null };
}

// ---- 本机持久化（偏好：localStorage；自动备份：IndexedDB） ---------------------
const prefs = {
  get(key, def) {
    try { const v = localStorage.getItem('ct.' + key); return v === null ? def : JSON.parse(v); } catch (e) { return def; }
  },
  set(key, val) {
    try { localStorage.setItem('ct.' + key, JSON.stringify(val)); } catch (e) { /* 忽略 */ }
  }
};

const idb = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open('counting-tool', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => { this._db = req.result; resolve(this._db); };
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
  },
  async get(key) {
    try {
      const db = await this.open();
      return await new Promise((resolve, reject) => {
        const r = db.transaction('kv').objectStore('kv').get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    } catch (e) { return undefined; }
  },
  async set(key, val) {
    try {
      const db = await this.open();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      return true;
    } catch (e) { return false; }
  },
  async del(key) {
    try {
      const db = await this.open();
      await new Promise((resolve) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = resolve;
        tx.onerror = resolve;
      });
    } catch (e) { /* 忽略 */ }
  }
};

// ===== tour.js =====
// ---------------------------------------------------------------------------
// tour.js — 首次打开时的引导教程（带箭头指向界面上的按钮）
//
// - 第一次打开自动开始；「跳过」= 本次关闭（下次仍会提示）；勾选「不再提示」或走完全程 = 以后不再自动出现
// - 随时可以在「?」使用说明窗口顶部的「▶ 重新播放教程」再看一遍
// - 每一步：target = 要指向的元素（按顺序找第一个可见的），没有可见目标时卡片居中显示
// ---------------------------------------------------------------------------
const TOUR_STEPS = [
  { key: 'welcome' },
  { key: 'open', target: ['#btnAddImages', '[data-cmd="open"]'] },
  { key: 'mark', target: ['[data-tool="marker"]'] },
  { key: 'cats', target: ['#mobCatBtn', '#catSection', '#btnSidePanel'] },
  { key: 'folders', target: ['[data-cmd="toggleFolders"]'] },
  { key: 'grid', target: ['[data-cmd="toggleTools"]'] },
  { key: 'guides', target: ['#btnGrid'] },
  { key: 'image', target: ['#btnImageMenu'] },
  { key: 'stats', target: ['#btnStats'] },
  { key: 'tpl', target: ['#btnTpl'] },
  { key: 'help', target: ['[data-cmd="help"]'] }
];

const tour = { i: -1, el: null, ring: null, card: null, target: null };

function tourVisible(el) {
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0 && r.right > 0 && r.bottom > 0 && r.left < innerWidth && r.top < innerHeight;
}
function tourTarget(step) {
  for (const sel of step.target || []) {
    const el = document.querySelector(sel);
    if (!el) continue;
    // 工具栏可横向滚动（手机）：先把目标滚进视野
    if (el.closest('#toolbar, #tools')) el.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (tourVisible(el)) return el;
  }
  return null;
}

function startTour() {
  if (tour.el) endTour();
  closeOpenDialogs();
  const el = document.createElement('div');
  el.id = 'tour';
  el.innerHTML = `<div class="tour-shade"></div><div class="tour-ring"></div>
    <div class="tour-card" role="dialog" aria-live="polite"><i class="tour-arrow"></i>
      <div class="tour-step muted small"></div><h3 class="tour-title"></h3><div class="tour-body"></div>
      <label class="check small tour-never"><input type="checkbox" id="tourNever"> <span></span></label>
      <div class="tour-btns"><button class="tour-skip"></button><span class="spacer"></span><button class="tour-back"></button><button class="tour-next primary"></button></div>
    </div>`;
  document.body.appendChild(el);
  tour.el = el;
  tour.ring = $('.tour-ring', el);
  tour.card = $('.tour-card', el);
  $('#tourNever', el).checked = !!prefs.get('tourNever', false);
  $('.tour-skip', el).addEventListener('click', () => endTour(false));
  $('.tour-back', el).addEventListener('click', () => showTourStep(tour.i - 1));
  $('.tour-next', el).addEventListener('click', () => { if (tour.i >= TOUR_STEPS.length - 1) endTour(true); else showTourStep(tour.i + 1); });
  $('#tourNever', el).addEventListener('change', (e) => prefs.set('tourNever', e.target.checked));
  $('.tour-shade', el).addEventListener('click', (e) => e.stopPropagation());
  el.addEventListener('keydown', (e) => e.stopPropagation());
  window.addEventListener('resize', placeTour);
  document.addEventListener('keydown', tourKey, true);
  showTourStep(0);
}

function closeOpenDialogs() { $$('dialog[open]').forEach(d => d.close()); }

function tourKey(e) {
  if (!tour.el) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endTour(false); }
  else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); $('.tour-next', tour.el).click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); if (tour.i > 0) showTourStep(tour.i - 1); }
  else if (!e.ctrlKey && !e.metaKey) e.stopPropagation();   // 教程打开时不触发软件的快捷键
}

function showTourStep(i) {
  if (!tour.el) return;
  tour.i = clamp(i, 0, TOUR_STEPS.length - 1);
  const step = TOUR_STEPS[tour.i];
  const last = tour.i === TOUR_STEPS.length - 1;
  $('.tour-step', tour.el).textContent = t('tourStepN', { n: tour.i + 1, m: TOUR_STEPS.length });
  $('.tour-title', tour.el).textContent = t('tour_' + step.key + '_t');
  $('.tour-body', tour.el).innerHTML = t('tour_' + step.key + (isMobile() && I18N.en['tour_' + step.key + '_m'] ? '_m' : ''));
  $('.tour-never span', tour.el).textContent = t('tourNever');
  $('.tour-skip', tour.el).textContent = t('tourSkip');
  $('.tour-back', tour.el).textContent = t('tourBack');
  $('.tour-back', tour.el).hidden = tour.i === 0;
  $('.tour-next', tour.el).textContent = last ? t('tourDone') : tour.i === 0 ? t('tourStart') : t('tourNext');
  tour.target = tourTarget(step);
  placeTour();
  $('.tour-next', tour.el).focus();
}

// 高亮框套住目标；卡片放在目标下方 / 上方 / 左侧 / 右侧中有足够空间的一侧，箭头指向目标
function placeTour() {
  if (!tour.el) return;
  const card = tour.card, ring = tour.ring, arrow = $('.tour-arrow', card);
  const M = 10, vw = innerWidth, vh = innerHeight;
  card.style.maxWidth = Math.min(380, vw - 2 * M) + 'px';
  const cw = card.offsetWidth, ch = card.offsetHeight;
  const tg = tour.target && tourVisible(tour.target) ? tour.target.getBoundingClientRect() : null;
  tour.el.classList.toggle('tour-center', !tg);
  if (!tg) {
    ring.hidden = true; arrow.hidden = true;
    card.style.left = Math.max(M, (vw - cw) / 2) + 'px';
    card.style.top = Math.max(M, (vh - ch) / 2) + 'px';
    return;
  }
  ring.hidden = false; arrow.hidden = false;
  const pad = 4;
  Object.assign(ring.style, { left: (tg.left - pad) + 'px', top: (tg.top - pad) + 'px', width: (tg.width + 2 * pad) + 'px', height: (tg.height + 2 * pad) + 'px' });
  const gap = 16, cx = tg.left + tg.width / 2, cy = tg.top + tg.height / 2;
  const fits = { below: vh - tg.bottom - gap >= ch + M, above: tg.top - gap >= ch + M, right: vw - tg.right - gap >= cw + M, left: tg.left - gap >= cw + M };
  const side = ['below', 'above', 'right', 'left'].find(s => fits[s]) || (vh - tg.bottom > tg.top ? 'below' : 'above');
  let x, y;
  if (side === 'below' || side === 'above') {
    x = clamp(cx - cw / 2, M, vw - cw - M);
    y = side === 'below' ? tg.bottom + gap : tg.top - gap - ch;
    y = clamp(y, M, vh - ch - M);
    arrow.className = 'tour-arrow ' + (side === 'below' ? 'up' : 'down');
    arrow.style.left = clamp(cx - x, 16, cw - 16) + 'px';
    arrow.style.top = '';
  } else {
    y = clamp(cy - ch / 2, M, vh - ch - M);
    x = side === 'right' ? tg.right + gap : tg.left - gap - cw;
    arrow.className = 'tour-arrow ' + (side === 'right' ? 'left' : 'right');
    arrow.style.top = clamp(cy - y, 16, ch - 16) + 'px';
    arrow.style.left = '';
  }
  card.style.left = x + 'px';
  card.style.top = y + 'px';
}

// done = 走完全程（以后不再自动显示）；跳过时只有勾选了「不再提示」才不再显示
function endTour(done) {
  if (!tour.el) return;
  if (done) prefs.set('tourNever', true);
  tour.el.remove();
  tour.el = null;
  tour.i = -1;
  window.removeEventListener('resize', placeTour);
  document.removeEventListener('keydown', tourKey, true);
}

// ===== importer.js =====
// ---------------------------------------------------------------------------
// importer.js — 批量导入图片窗口
//
// 入口：工具栏「＋ 添加图片」、空白画面中央的大按钮、文件夹面板的「添加图片」。
// - 选择多张图片 / 整个文件夹（电脑）/ 拍照（手机）/ 拖入窗口，可多次追加
// - 缩略图列表：勾选要导入的图片，显示张数与总大小
// - 顺序：默认按选择的先后（多次选择依次追加）；也可按文件名 / 修改时间排序，或用 ◀ ▶ 逐张调整。
//   导入时按列表顺序逐张处理并编号（A-01、A-02…），不会因为读取快慢而打乱。
// - 导入到：当前文件夹、已有文件夹或新建文件夹；整个文件夹导入时可按子文件夹分别建立
// 项目文件（.mark.zip / .json）仍用「打开」。
// ---------------------------------------------------------------------------
const importer = { items: [], seq: 0, order: 'pick' };
const IMG_EXT = /\.(png|jpe?g|bmp|gif|webp|tiff?|heic|heif)$/i;

function openImporter(files) {
  importerClear();
  renderImporter();
  const dlg = $('#importDialog');
  if (!dlg.open) dlg.showModal();
  if (files && files.length) importerAdd(files);
}

function importerClear() {
  importer.items.forEach(it => { if (it.url) URL.revokeObjectURL(it.url); });
  importer.items = [];
}

// 追加文件（重复的同名同大小文件跳过）；非图片文件忽略
function importerAdd(files) {
  let skipped = 0;
  for (const f of Array.from(files || [])) {
    const isImg = (f.type && f.type.startsWith('image/')) || IMG_EXT.test(f.name);
    if (!isImg) { skipped++; continue; }
    const rel = f.webkitRelativePath || '';
    if (importer.items.some(it => it.file.name === f.name && it.file.size === f.size && it.rel === rel)) continue;
    const parts = rel.split('/');
    importer.items.push({ id: ++importer.seq, file: f, rel, sub: parts.length > 2 ? parts.slice(1, -1).join('/') : (parts.length === 2 ? parts[0] : ''),
      url: /\.tiff?$/i.test(f.name) ? null : URL.createObjectURL(f), on: true });
  }
  applyImportOrder();
  if (skipped) toast(t('impSkipped', { n: skipped }), 3000);
  renderImporter();
}

// 排序：pick = 选择顺序（加入列表的先后，seq）；name = 文件名自然顺序；time = 文件修改时间
function applyImportOrder() {
  const k = importer.order;
  const byName = (a, b) => (a.rel || a.file.name).localeCompare(b.rel || b.file.name, undefined, { numeric: true, sensitivity: 'base' });
  if (k === 'name') importer.items.sort(byName);
  else if (k === 'time') importer.items.sort((a, b) => (a.file.lastModified || 0) - (b.file.lastModified || 0) || byName(a, b));
  else if (k === 'pick') importer.items.sort((a, b) => a.id - b.id);
}
function moveImportItem(id, d) {
  const L = importer.items, i = L.findIndex(x => x.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= L.length) return;
  [L[i], L[j]] = [L[j], L[i]];
  importer.order = 'manual';
  renderImporter();
}

const fmtSize = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');

function renderImporter() {

  const ws = state.ws, folders = ws ? ws.folders : [];

  const canDir = 'webkitdirectory' in document.createElement('input') && !isMobile();
  const prev = { target: $('#impTarget') ? $('#impTarget').value : null, name: $('#impNewName') ? $('#impNewName').value : null, bySub: $('#impBySub') ? $('#impBySub').checked : true };
  body.innerHTML = `
    <div class="imp-pick">
      <button id="impFiles" class="primary big">${ICON_IMG}<span>${escapeHtml(t('impPickFiles'))}</span></button>
      ${canDir ? `<button id="impDir" class="big">📁 <span>${escapeHtml(t('impPickDir'))}</span></button>` : ''}
      ${isMobile() ? `<button id="impCam" class="big">📷 <span>${escapeHtml(t('impCamera'))}</span></button>` : ''}
    </div>

      <span class="imp-mv"><button type="button" data-mv="-1" data-id="${it.id}"${idx === 0 ? ' disabled' : ''} title="${escapeHtml(t('impMoveUp'))}">◀</button><button type="button" data-mv="1" data-id="${it.id}"${idx === items.length - 1 ? ' disabled' : ''} title="${escapeHtml(t('impMoveDown'))}">▶</button></span>
      <span class="imp-thumb">${it.url ? `<img src="${it.url}" loading="lazy" alt="">` : '<span class="imp-tif">TIFF</span>'}</span>
      <span class="imp-name">${escapeHtml(it.file.name)}</span><span class="imp-size muted">${fmtSize(it.file.size)}${it.sub ? ' · ' + escapeHtml(it.sub) : ''}</span></label>`).join('')}</div>
    <div class="imp-target">

  $('#importGo').disabled = !sel.length;

  if (prev.target && $('#impTarget') && $(`#impTarget option[value="${prev.target}"]`)) $('#impTarget').value = prev.target;

  if ($('#impTarget')) { $('#impTarget').addEventListener('change', syncName); syncName(); }
  if ($('#impBySub')) $('#impBySub').addEventListener('change', syncName);
  $('#impFiles').addEventListener('click', () => $('#impInputFiles').click());
  if ($('#impDir')) $('#impDir').addEventListener('click', () => $('#impInputDir').click());
  if ($('#impCam')) $('#impCam').addEventListener('click', () => $('#impInputCam').click());
  if ($('#impOrder')) $('#impOrder').addEventListener('change', (e) => { importer.order = e.target.value; applyImportOrder(); renderImporter(); });
  $$('[data-mv]', body).forEach(b => b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); moveImportItem(+b.dataset.id, +b.dataset.mv); }));
  if ($('#impAll')) $('#impAll').addEventListener('click', () => { items.forEach(it => { it.on = true; }); renderImporter(); });
  if ($('#impNone')) $('#impNone').addEventListener('click', () => { items.forEach(it => { it.on = false; }); renderImporter(); });
  if ($('#impClear')) $('#impClear').addEventListener('click', () => { importerClear(); renderImporter(); });
  $$('[data-imp]', body).forEach(cb => cb.addEventListener('change', () => {
    const it = items.find(x => x.id === +cb.dataset.imp);
    if (it) it.on = cb.checked;
    renderImporter();   // 重新编号
  }));
}
const ICON_IMG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18v14H3z M3 16l5-5 4 4 3-3 6 6 M15.5 8.5h.01"/></svg>';

async function importerGo() {
  const sel = importer.items.filter(it => it.on);
  if (!sel.length) return;
  const target = $('#impTarget').value;
  const bySub = $('#impBySub') && $('#impBySub').checked;
  // 分组：按子文件夹 → 各自新建文件夹；否则全部放进目标文件夹
  const groups = new Map();
  for (const it of sel) {
    const key = bySub ? (it.sub || $('#impNewName').value.trim() || (state.ws ? nextFolderName() : letterName(0))) : '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it.file);
  }
  $('#importDialog').close();
  ensureWorkspace();
  let n = 0;
  for (const [key, files] of groups) {
    if (bySub) addFolder(key);
    else if (target === '__new') addFolder($('#impNewName').value.trim() || (state.ws ? nextFolderName() : letterName(0)));
    else state.ws.activeFolderId = target;
    await addImageFiles(files, { keepOrder: true });   // 按列表顺序逐张导入、编号
    n += files.length;
  }
  importerClear();
  toast(t('impDone', { n }), 3000);
}

function initImporter() {
  const dlg = $('#importDialog');
  const onPick = (e) => { const f = Array.from(e.target.files || []); e.target.value = ''; importerAdd(f); };
  ['#impInputFiles', '#impInputDir', '#impInputCam'].forEach(s => $(s).addEventListener('change', onPick));
  $('#importGo').addEventListener('click', importerGo);
  $('#importCancel').addEventListener('click', () => { importerClear(); dlg.close(); });
  dlg.addEventListener('close', () => { if (!$('#importDialog').open) setTimeout(() => { if (!dlg.open) importerClear(); }, 0); });
  dlg.addEventListener('keydown', (e) => { if (e.target.matches('input, select') && !(e.ctrlKey || e.metaKey)) e.stopPropagation(); });
  $$('[data-act="importImages"]').forEach(b => b.addEventListener('click', () => openImporter()));
}

// ===== zip.js =====
// ---------------------------------------------------------------------------
// zip.js — 极简 ZIP 读写（项目文件 .mark.zip、批量导出）
// 写入：不压缩（stored；图片本身已压缩），文件名 UTF-8。
// 读取：支持 stored 与 deflate（用户用其它软件重新压缩过也能打开）。
// ---------------------------------------------------------------------------
const CRC_TABLE = (() => {
  const tbl = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    tbl[n] = c >>> 0;
  }
  return tbl;
})();

function crc32(u8) {
  let c = 0xffffffff;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

const isZip = (u8) => u8[0] === 0x50 && u8[1] === 0x4b && u8[2] === 0x03 && u8[3] === 0x04;

// files: [{ name, data: Uint8Array }]
function makeZip(files) {
  const enc = new TextEncoder();
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);           // UTF-8 文件名
    lh.setUint16(8, 0, true);                // stored
    lh.setUint16(10, time, true);
    lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true);
    ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);
    ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, p) => s + p.byteLength, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true);
  eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true);
  eo.setUint32(16, offset, true);
  return new Blob([...parts, ...central, eo.buffer], { type: 'application/zip' });
}

// 返回 Map(文件名 → Uint8Array)
async function readZip(buffer) {
  const u8 = new Uint8Array(buffer);
  const dv = new DataView(buffer);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('invalid zip');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const utf8 = new TextDecoder('utf-8');
  const out = new Map();
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('corrupt zip directory');
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = utf8.decode(u8.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (name.endsWith('/')) continue;
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    const raw = u8.subarray(start, start + csize);
    if (method === 0) out.set(name, raw);
    else if (method === 8) out.set(name, await inflateRaw(raw));
    else throw new Error('unsupported zip compression ' + method);
  }
  return out;
}

async function inflateRaw(u8) {
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// ===== tiff.js =====
// ---------------------------------------------------------------------------
// tiff.js — 精简 TIFF 解码器（仅用于显示）
// 支持：小端/大端；条带(strip)与分块(tile)；平面配置 1/2；
//       压缩：无 / LZW / PackBits / Deflate；水平差分预测 (Predictor 2)；
//       位深 1/2/4/8/16/32（整数与浮点）；灰度、RGB(A)、调色板。
// 不支持：JPEG 压缩、CMYK、YCbCr、BigTIFF（会给出明确错误提示）。
// 多页 TIFF 仅解码第一页。
// ---------------------------------------------------------------------------
class TiffError extends Error {}

async function decodeTiff(buffer) {
  const u8 = new Uint8Array(buffer);
  const dv = new DataView(buffer);
  const le = u8[0] === 0x49;
  const magic = dv.getUint16(2, le);
  if (magic === 43) throw new TiffError('BigTIFF');
  if (magic !== 42) throw new TiffError('not a TIFF');

  const TYPE_SIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 6: 1, 7: 1, 8: 2, 9: 4, 10: 8, 11: 4, 12: 8 };
  function readValue(type, off) {
    switch (type) {
      case 1: case 2: case 7: return dv.getUint8(off);
      case 6: return dv.getInt8(off);
      case 3: return dv.getUint16(off, le);
      case 8: return dv.getInt16(off, le);
      case 4: return dv.getUint32(off, le);
      case 9: return dv.getInt32(off, le);
      case 5: return dv.getUint32(off, le) / (dv.getUint32(off + 4, le) || 1);
      case 10: return dv.getInt32(off, le) / (dv.getInt32(off + 4, le) || 1);
      case 11: return dv.getFloat32(off, le);
      case 12: return dv.getFloat64(off, le);
      default: return 0;
    }
  }
  function readIfd(offset) {
    const n = dv.getUint16(offset, le);
    const tags = {};
    for (let i = 0; i < n; i++) {
      const e = offset + 2 + i * 12;
      const tag = dv.getUint16(e, le);
      const type = dv.getUint16(e + 2, le);
      const count = dv.getUint32(e + 4, le);
      const size = TYPE_SIZE[type] || 1;
      const dataOff = size * count <= 4 ? e + 8 : dv.getUint32(e + 8, le);
      if (dataOff + size * count > u8.length) continue; // 损坏的条目：跳过
      const vals = new Array(count);
      for (let k = 0; k < count; k++) vals[k] = readValue(type, dataOff + k * size);
      tags[tag] = vals;
    }
    const next = dv.getUint32(offset + 2 + n * 12, le);
    return { tags, next };
  }

  const first = readIfd(dv.getUint32(4, le));
  let pages = 1;
  for (let next = first.next, guard = 0; next && next < u8.length && guard < 10000; guard++) {
    pages++;
    next = dv.getUint32(next + 2 + dv.getUint16(next, le) * 12, le);
  }

  const T = first.tags;
  const g = (tag, def) => (T[tag] ? T[tag][0] : def);
  const width = g(256), height = g(257);
  if (!width || !height) throw new TiffError('missing image size');
  const spp = g(277, 1);
  const bpsArr = T[258] || [1];
  const bits = bpsArr[0];
  if (bpsArr.some(b => b !== bits)) throw new TiffError('mixed bit depths');
  const compression = g(259, 1);
  const photometric = g(262, spp >= 3 ? 2 : 1);
  const planar = g(284, 1);
  const predictor = g(317, 1);
  const sampleFormat = g(339, 1); // 1 无符号整数, 2 有符号整数, 3 浮点

  if (![1, 5, 8, 32946, 32773].includes(compression)) {
    throw new TiffError(compression === 7 || compression === 6 ? 'JPEG compression' : 'compression ' + compression);
  }
  if (![0, 1, 2, 3].includes(photometric)) {
    throw new TiffError({ 5: 'CMYK', 6: 'YCbCr', 8: 'CIELab' }[photometric] || 'photometric ' + photometric);
  }
  if (![1, 2, 4, 8, 16, 32, 64].includes(bits)) throw new TiffError(bits + '-bit samples');
  if (predictor === 3) throw new TiffError('floating-point predictor');

  const tiled = !!T[322];
  const chunkW = tiled ? g(322) : width;
  const chunkH = tiled ? g(323) : Math.min(g(278, height), height);
  const offsets = tiled ? T[324] : T[273];
  const counts = tiled ? T[325] : T[279];
  if (!offsets) throw new TiffError('missing data offsets');

  const spc = planar === 2 ? 1 : spp; // 每个数据块中每像素的样本数
  const across = Math.ceil(width / chunkW);
  const down = Math.ceil(height / chunkH);
  const perPlane = across * down;

  // 目标样本数组（交错存储：像素 × spp）
  let Arr = Uint8Array;
  if (bits === 16) Arr = sampleFormat === 2 ? Int16Array : Uint16Array;
  else if (bits === 32) Arr = sampleFormat === 3 ? Float32Array : sampleFormat === 2 ? Int32Array : Uint32Array;
  else if (bits === 64) Arr = Float64Array;
  const out = new Arr(width * height * spp);

  for (let ci = 0; ci < offsets.length; ci++) {
    const plane = planar === 2 ? Math.floor(ci / perPlane) : 0;
    if (plane >= spp) break;
    const idx = ci % perPlane;
    const cx = (idx % across) * chunkW;
    const cy = Math.floor(idx / across) * chunkH;
    const rows = tiled ? chunkH : Math.min(chunkH, height - cy);
    const rowBytes = Math.ceil(chunkW * spc * bits / 8);
    const expected = rowBytes * rows;
    const off = offsets[ci];
    const cnt = counts ? counts[ci] : expected;
    const raw = u8.subarray(off, Math.min(off + cnt, u8.length));

    let bytes;
    if (compression === 1) bytes = raw;
    else if (compression === 5) bytes = lzwDecode(raw, expected);
    else if (compression === 32773) bytes = packBitsDecode(raw, expected);
    else bytes = await inflate(raw);

    const samples = bytesToSamples(bytes, bits, sampleFormat, le, chunkW * spc, rows, rowBytes);
    if (predictor === 2 && bits >= 8) {
      for (let r = 0; r < rows; r++) {
        const base = r * chunkW * spc;
        for (let i = spc; i < chunkW * spc; i++) samples[base + i] += samples[base + i - spc];
      }
    }
    // 拷贝到目标位置（裁去超出图像边界的部分）
    const w = Math.min(chunkW, width - cx);
    const h = Math.min(rows, height - cy);
    for (let r = 0; r < h; r++) {
      for (let x = 0; x < w; x++) {
        const src = (r * chunkW + x) * spc;
        const dst = ((cy + r) * width + cx + x) * spp;
        if (planar === 2) out[dst + plane] = samples[src];
        else for (let s = 0; s < spp; s++) out[dst + s] = samples[src + s];
      }
    }
  }

  // ---- 转换为 8 位 RGBA ----
  const rgba = new Uint8ClampedArray(width * height * 4);
  const n = width * height;
  let stretched = false;
  const colorSamples = photometric === 2 ? Math.min(3, spp) : 1;
  let lo = 0, hi = 255;
  if (photometric !== 3) {
    if (bits === 8 && sampleFormat !== 3) { lo = 0; hi = 255; }
    else if (bits < 8) { lo = 0; hi = (1 << bits) - 1; }
    else {
      // >8 位或浮点：线性拉伸到实际数值范围（仅用于显示）
      lo = Infinity; hi = -Infinity;
      for (let p = 0; p < n; p++) {
        for (let s = 0; s < colorSamples; s++) {
          const v = out[p * spp + s];
          if (v < lo) lo = v;
          if (v > hi) hi = v;
        }
      }
      if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
      if (hi === lo) hi = lo + 1;
      stretched = true;
    }
  }
  const scale = 255 / (hi - lo);
  const conv = (v) => (v - lo) * scale;

  if (photometric === 3) {
    const cm = T[320];
    if (!cm) throw new TiffError('missing colour map');
    const ncol = cm.length / 3;
    for (let p = 0; p < n; p++) {
      const v = Math.min(out[p * spp], ncol - 1);
      rgba[p * 4] = cm[v] >> 8;
      rgba[p * 4 + 1] = cm[ncol + v] >> 8;
      rgba[p * 4 + 2] = cm[2 * ncol + v] >> 8;
      rgba[p * 4 + 3] = 255;
    }
  } else if (photometric === 2 && spp >= 3) {
    for (let p = 0; p < n; p++) {
      rgba[p * 4] = conv(out[p * spp]);
      rgba[p * 4 + 1] = conv(out[p * spp + 1]);
      rgba[p * 4 + 2] = conv(out[p * spp + 2]);
      rgba[p * 4 + 3] = 255;
    }
  } else {
    const invert = photometric === 0;
    for (let p = 0; p < n; p++) {
      let v = conv(out[p * spp]);
      if (invert) v = 255 - v;
      rgba[p * 4] = rgba[p * 4 + 1] = rgba[p * 4 + 2] = v;
      rgba[p * 4 + 3] = 255;
    }
  }
  return { width, height, rgba, pages, bits, stretched };
}

function bytesToSamples(bytes, bits, fmt, le, perRow, rows, rowBytes) {
  const total = perRow * rows;
  if (bits === 8) {
    const a = fmt === 2 ? new Int8Array(total) : new Uint8Array(total);
    a.set(bytes.subarray(0, Math.min(total, bytes.length)));
    return a;
  }
  if (bits < 8) {
    const a = new Uint8Array(total);
    const mask = (1 << bits) - 1;
    for (let r = 0; r < rows; r++) {
      for (let i = 0; i < perRow; i++) {
        const bit = i * bits;
        const byte = bytes[r * rowBytes + (bit >> 3)] || 0;
        a[r * perRow + i] = (byte >> (8 - bits - (bit & 7))) & mask;
      }
    }
    return a;
  }
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const step = bits / 8;
  const avail = Math.min(total, Math.floor(bytes.byteLength / step));
  let a;
  if (bits === 16) {
    a = fmt === 2 ? new Int16Array(total) : new Uint16Array(total);
    for (let i = 0; i < avail; i++) a[i] = fmt === 2 ? dv.getInt16(i * 2, le) : dv.getUint16(i * 2, le);
  } else if (bits === 32) {
    a = fmt === 3 ? new Float32Array(total) : fmt === 2 ? new Int32Array(total) : new Uint32Array(total);
    for (let i = 0; i < avail; i++) a[i] = fmt === 3 ? dv.getFloat32(i * 4, le) : fmt === 2 ? dv.getInt32(i * 4, le) : dv.getUint32(i * 4, le);
  } else {
    a = new Float64Array(total);
    for (let i = 0; i < avail; i++) a[i] = dv.getFloat64(i * 8, le);
  }
  return a;
}

// TIFF 变体 LZW（MSB 优先，"early change"）
function lzwDecode(input, expected) {
  const out = new Uint8Array(expected);
  const prefix = new Int32Array(4096);
  const suffix = new Uint8Array(4096);
  const firstB = new Uint8Array(4096);
  const length = new Uint16Array(4096);
  for (let i = 0; i < 256; i++) { prefix[i] = -1; suffix[i] = i; firstB[i] = i; length[i] = 1; }
  let next = 258, codeLen = 9, bitPos = 0, op = 0, old = -1;
  const getCode = () => {
    const bp = bitPos >> 3;
    if (bp >= input.length) return 257;
    const v = (input[bp] << 16) | ((input[bp + 1] || 0) << 8) | (input[bp + 2] || 0);
    bitPos += codeLen;
    return (v >> (24 - ((bitPos - codeLen) & 7) - codeLen)) & ((1 << codeLen) - 1);
  };
  const write = (code) => {
    const len = length[code];
    let pos = op + len - 1;
    for (let c = code; c >= 0 && pos >= op; c = prefix[c], pos--) {
      if (pos < expected) out[pos] = suffix[c];
    }
    op += len;
  };
  const add = (p, b) => {
    if (next >= 4096) return;
    prefix[next] = p; suffix[next] = b; firstB[next] = firstB[p]; length[next] = length[p] + 1;
    next++;
    if (next === 511) codeLen = 10;
    else if (next === 1023) codeLen = 11;
    else if (next === 2047) codeLen = 12;
  };
  while (op < expected) {
    let code = getCode();
    if (code === 257) break;
    if (code === 256) {
      next = 258; codeLen = 9;
      code = getCode();
      if (code === 257) break;
      if (code > 255) break; // 损坏的数据
      write(code);
      old = code;
      continue;
    }
    if (code < next) {
      write(code);
      if (old >= 0) add(old, firstB[code]);
    } else if (old >= 0) {
      add(old, firstB[old]);
      write(code);
    } else break;
    old = code;
  }
  return out;
}

function packBitsDecode(input, expected) {
  const out = new Uint8Array(expected);
  let i = 0, op = 0;
  while (i < input.length && op < expected) {
    const n = (input[i++] << 24) >> 24;
    if (n >= 0) {
      for (let k = 0; k <= n && op < expected; k++) out[op++] = input[i++];
    } else if (n !== -128) {
      const b = input[i++];
      for (let k = 0; k < 1 - n && op < expected; k++) out[op++] = b;
    }
  }
  return out;
}

async function inflate(u8) {
  if (typeof DecompressionStream === 'undefined') throw new TiffError('Deflate (browser too old)');
  const ds = new DecompressionStream('deflate');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// ===== model.js =====
// ---------------------------------------------------------------------------
// model.js — 数据模型与撤回/重做（命令模式）
//
// 工作区 (workspace) = 若干文件夹，每个文件夹含若干图片；类别全工作区共享。
// 每张图片有自己的标注与撤回/重做历史（Ctrl+Z 只撤回当前图片）。
// 所有修改都通过 execute(命令) 进行。命令的 id 字段是历史序号；目标对象用 oid/cid 表示。
// 命令是纯数据（可序列化为 JSON），随项目文件一起保存，重新打开项目后仍可撤回。
// 坐标单位：图片原始像素。尺寸单位："u" = max(图宽, 图高)/1000 像素。
// ---------------------------------------------------------------------------
const APP_VERSION = '1.4.9.3';
const FORMAT_ID = 'counting-tool-project';          // v1.0：单张图片的 .mark.json
const WS_FORMAT_ID = 'counting-tool-workspace';     // v1.1 起：多图项目 .mark.zip
const WS_FORMAT_VERSION = 5;   // v1.3：图形对象 shape、标记单独大小 mw/mh、图层顺序、锁定
                               // v1.3.5：图片裁剪/旋转/翻转（doc.image.ops）、插入图片（assets）、局部放大插图
                               // v1.4：图像调整 doc.adjust、比例尺 doc.scale、网格 doc.grid、计数区域 roi、测距线 measure

const PRESET_COLORS = ['#ffffff', '#e53935', '#1e88e5', '#43a047', '#fdd835', '#fb8c00', '#000000', '#8e24aa'];
const SHAPES = ['circle', 'ring', 'square', 'triangle', 'diamond', 'star', 'cross', 'plus'];
const FALLBACK_VIEW = { scale: 1, tx: 0, ty: 0 };

const state = {
  ws: null,           // 工作区（见 newWorkspace）
  activeId: null,     // 当前图片 id
  img: null,          // 当前图片的显示位图（已应用裁剪/旋转/翻转）
  origImg: null,      // 当前图片的原始解码位图
  fileHandle: null,   // Chrome/Edge 中用于覆盖保存同一文件
  fileName: null,     // 项目文件名
  currentCat: null,   // 当前类别 id
  selection: [],      // 选中对象 id 列表（可多选）
  region: null,       // 最近一次框选/套索的区域（图片坐标多边形），AI 可只在此范围内计数
  tool: 'marker',
  shapePreset: 'rect',  // 图形工具当前的形状
  linePreset: 'arrow',  // 线条工具当前的样式
  roiPreset: 'rect',    // 计数区域工具：rect / ellipse / poly
  measurePreset: 'distance', // 测量工具：distance / calibrate
  loupe: { on: false, mag: 4 },  // 放大镜
  cellMode: null,
  plateMode: null,      // 平板分区：'move'（拖动圆 / 改半径 / 旋转）| 'pick'（点选扇区）| null       // 逐格计数：{cur: {c, r} | null}
  showAnnotations: true,
  opacity: 1,
  showNumbers: false,
  showAiMarks: true,  // 给 AI 标出的点加虚线圈
  aiSuggest: null,    // AI 核查建议 {entryId, missed:[{x,y}], falsePositive:[id], radius}
  settings: { operator: '', legendOnExport: true, fixedSize: false, lang: 'en' },
  toolStyles: {
    arrow: { color: '#fdd835', width: 3, dash: 'solid', head: 'filled' },
    rect: { color: '#fdd835', width: 3, dash: 'solid', fill: 'none' },
    ellipse: { color: '#fdd835', width: 3, dash: 'solid', fill: 'none' },
    shape: { color: '#fdd835', width: 3, dash: 'solid', fillColor: null, fillOpacity: 0.25, radius: 0 },
    text: { color: '#ffffff', fontSize: 28, background: 'fill' },
    inset: { color: '#ffffff', width: 2, dash: 'solid', lines: true, label: true },
    measure: { color: '#ffeb3b', width: 2 }
  },
  // 单选时的对象 id（多选或未选时为 null）
  get selectedId() { return this.selection.length === 1 ? this.selection[0] : null; },
  set selectedId(v) { this.selection = v ? [v] : []; },
  // 以下属性映射到当前图片
  get entry() { return this.ws && this.activeId ? this.ws.images[this.activeId] || null : null; },
  get doc() { const e = this.entry; return e ? e.doc : null; },
  get history() { const e = this.entry; return e ? e.history : { undo: [], redo: [], nextId: 1 }; },
  get savedStateId() { const e = this.entry; return e ? e.savedStateId : 0; },
  set savedStateId(v) { const e = this.entry; if (e) e.savedStateId = v; },
  get view() { const e = this.entry; return e ? (e.view || (e.view = { scale: 1, tx: 0, ty: 0 })) : FALLBACK_VIEW; }
};

function defaultCategories() {
  return [{ id: 'c1', name: t('defaultCatName', { n: 1 }), color: '#e53935', shape: 'circle', size: 10 }];
}

// 默认类别名（「类别 1」「Category 1」…）随界面语言翻译；用户自己改过的名字不动
function defaultCatIndex(name) {
  for (const L of Object.keys(I18N)) {
    const tpl = I18N[L] && I18N[L].defaultCatName;
    if (!tpl) continue;
    const re = new RegExp('^' + tpl.replace(/[.*+?^$()|[\]\\]/g, '\\$&').replace('{n}', '(\\d+)') + '$');
    const m = re.exec(String(name || '').trim());
    if (m) return +m[1];
  }
  return 0;
}
function localizeCatNames(cats) {
  let changed = false;
  for (const c of cats || []) {
    const n = defaultCatIndex(c.name), nm = n && t('defaultCatName', { n });
