// 坐标为处理后（裁剪/旋转/翻转后）图片中的像素坐标；image_transform 记录对原图做过的操作
const POINT_HEADER = ['folder', 'image', 'original_file', 'index', 'category', 'index_in_category', 'x', 'y', 'color', 'shape',
  'image_width', 'image_height', 'image_sha256', 'operator', 'exported_at', 'source', 'confidence', 'image_transform',
  'x_scaled', 'y_scaled', 'scale_unit', 'roi'];

function transformText(img) {
  return (img.ops || []).map(op => op.op === 'rot' ? `rotate(${op.deg})` : op.op === 'flip' ? `flip(${op.axis})`
    : `crop(${op.x},${op.y},${op.w},${op.h})`).join(' ');
}

function pointRows(e, now) {
  const catMap = {};
  state.ws.categories.forEach(c => { catMap[c.id] = c; });
  const f = folderById(e.folderId);
  const img = e.doc.image;
  const seq = {};
  const rows = [];
  const tr = transformText(img);
  const sc = scaleOf(e.doc);
  const sv = (v) => (sc ? +(v * sc.px).toPrecision(6) : '');
  let i = 0;
  for (const o of e.doc.objects) {
    if (o.type !== 'marker') continue;
    const c = catMap[o.cat] || { name: '?', color: '', shape: '' };
    seq[o.cat] = (seq[o.cat] || 0) + 1;
    rows.push([f ? f.name : '', entryName(e), img.name, ++i, c.name, seq[o.cat], o.x.toFixed(2), o.y.toFixed(2), c.color, c.shape,
      img.width, img.height, img.sha256, state.settings.operator || e.doc.meta.operator || '', now,
      o.src === 'ai' ? 'ai:' + (o.engine || '') : 'manual', o.conf !== undefined ? o.conf : '', tr,
      sv(o.x), sv(o.y), sc ? sc.unit : '', roiNamesAt(e.doc, o.x, o.y)]);
  }
  return rows;
}

// UTF-8 BOM：保证 Windows Excel 正确识别中文
const toCsv = (rows) => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';

function buildCsv(entries) {
  const now = new Date().toISOString();
  const list = entries || (state.entry ? [state.entry] : []);
  return toCsv([POINT_HEADER].concat(...list.map(e => pointRows(e, now))));
}

async function exportCsv() {
  if (!state.doc) return;
  commitTextEditor();
  const blob = new Blob([buildCsv()], { type: 'text/csv;charset=utf-8' });
  const name = safeFileName(entryName(state.entry)) + '_points.csv';
  const r = await saveBlobAs(blob, name, { description: 'CSV', accept: { 'text/csv': ['.csv'] } });
  if (r) toast(t('exportedToast', { name: r.name }));
}

const fmt = (v, d) => (Number.isFinite(v) ? v.toFixed(d) : '');

function summaryRows() {
  const S = computeSummary();
  const catNames = S.cats.map(c => c.name);
  const rows = [['folder', 'image', 'original_file', 'done', ...catNames, 'total']];
  S.rows.forEach(r => rows.push([r.folder ? r.folder.name : '', r.name, r.entry.doc.image.name, r.entry.done ? 'yes' : '',
    ...S.cats.map(c => r.counts[c.id]), r.total]));
  rows.push([]);
  rows.push(['group', 'statistic', 'n_images', '', ...catNames, 'total']);
  const add = (label, st) => {
    rows.push([label, 'mean', st.n, '', ...S.cats.map(c => fmt(st.mean[c.id], 2)), fmt(st.mean.total, 2)]);
    rows.push([label, 'sd (n-1)', st.n, '', ...S.cats.map(c => fmt(st.sd[c.id], 2)), fmt(st.sd.total, 2)]);
  };
  S.groups.forEach(g => add(g.folder.name, g.stats));
  add(t('allImages'), S.overall);
  // 比例尺（每张图的像素大小）
  const cal = orderedEntries().filter(e => scaleOf(e.doc));
  if (cal.length) {
    rows.push([]);
    rows.push(['folder', 'image', 'pixel_size', 'unit', 'image_width_scaled', 'image_height_scaled']);
    cal.forEach(e => { const s = scaleOf(e.doc), f = folderById(e.folderId); rows.push([f ? f.name : '', entryName(e), s.px, s.unit + '/px', +(e.doc.image.width * s.px).toPrecision(6), +(e.doc.image.height * s.px).toPrecision(6)]); });
  }
  // 计数区域
  const roi = roiSummaryRows();
  if (roi) { rows.push([]); roi.forEach(r => rows.push(r)); }
  return rows;
}

async function exportSummaryCsv() {
  if (!state.ws) return;

  const name = projectFileName().replace(/\.mark\.zip$/, '') + '_summary.csv';

// ---- 自动备份与恢复 ------------------------------------------------------------
// 图片（Blob）每张只备份一次；之后每 30 秒只备份标注与历史（很小），并在浏览器空闲时执行。
let backedUpBlobs = new Set();
let lastAutosaveSig = null;

function resetAutosaveTracking() {
  lastAutosaveSig = null;
}

function autosaveSignature() {
  return orderedEntries().map(e => e.id + ':' + entryStateId(e)).join(',') + '|' + state.ws.structVersion;
}

async function autosave() {
  if (!state.ws || !isDirty()) return;
  const sig = autosaveSignature();
  if (sig === lastAutosaveSig) return;
  const entries = orderedEntries();
  for (const e of entries) {
    if (backedUpBlobs.has(e.id)) continue;
    if (!(await idb.set('blob:' + e.id, e.blob))) return;
    backedUpBlobs.add(e.id);
  }
  for (const a of Object.values(state.ws.assets || {})) {
    const key = 'asset:' + a.id;
    if (backedUpBlobs.has(key)) continue;
    if (!(await idb.set(key, a.blob))) return;
    backedUpBlobs.add(key);
  }
  const meta = serializeWorkspace();
  meta.savedStates = {};
  entries.forEach(e => { meta.savedStates[e.id] = e.savedStateId; });
  const ok = await idb.set('ws', {
    time: Date.now(),
    fileName: state.fileName,
    title: projectFileName(),
    blobIds: Array.from(backedUpBlobs),
    meta
  });
  if (ok) lastAutosaveSig = sig;
}

function autosaveWhenIdle() {
  if (window.requestIdleCallback) requestIdleCallback(() => autosave(), { timeout: 5000 });
  else autosave();
}

async function clearBackup() {
  const rec = await idb.get('ws');
  const ids = new Set([...(rec && rec.blobIds ? rec.blobIds : []), ...backedUpBlobs]);
  for (const id of ids) await idb.del(id.startsWith('asset:') ? id : 'blob:' + id);
  await idb.del('ws');
  await idb.del('recovery');        // v1.0 的备份
  await idb.del('recoveryImage');
  backedUpBlobs = new Set();
  lastAutosaveSig = null;
}

async function checkRecovery() {
  const rec = await idb.get('ws');
  if (!rec || !rec.meta) {
    await idb.del('recovery');
    await idb.del('recoveryImage');
    return;
  }
  if (!confirm(t('recover', { time: formatTime(rec.time), name: rec.title || '' }))) {
    await clearBackup();
    return;
  }
  try {
    const blobs = {};
    for (const se of rec.meta.images) blobs[se.id] = await idb.get('blob:' + se.id);
    const assetBlobs = {};
    for (const am of rec.meta.assets || []) assetBlobs[am.id] = await idb.get('asset:' + am.id);
    const ws = buildWorkspace(rec.meta, se => blobs[se.id], am => assetBlobs[am.id]);
    Object.values(ws.images).forEach(e => {
      if (rec.meta.savedStates && rec.meta.savedStates[e.id] !== undefined) e.savedStateId = rec.meta.savedStates[e.id];
    });
    ws.structVersion = 1; // 恢复的工作视为未保存
    state.fileName = rec.fileName || null;
    await replaceWorkspace(ws, rec.meta.activeId);
    backedUpBlobs = new Set(rec.blobIds || []);
    toast(t('recovered'));
  } catch (e) {
    console.error(e);
    await clearBackup();
  }
}

function initAutosave() {
  setInterval(autosaveWhenIdle, AUTOSAVE_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autosave(); });
  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) { autosave(); e.preventDefault(); e.returnValue = ''; }
  });
}

// ===== statmath.js =====
// ---------------------------------------------------------------------------
// statmath.js — 统计计算：描述统计、Welch t 检验、Mann-Whitney U 检验
//
// Welch t 检验：两样本、方差不等，双侧 p（与 Excel TTEST(…,2,3)、R t.test 默认相同）。
// Mann-Whitney U（Wilcoxon 秩和）检验：双侧 p，方法与 R wilcox.test 默认相同——
//   无并列值且两组样本数都 < 50：精确分布；否则：正态近似（并列校正 + 连续性校正）。
// ---------------------------------------------------------------------------
function median(a) {
  if (!a.length) return NaN;
  const s = a.slice().sort((x, y) => x - y);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// ln Γ(x)（Lanczos 近似）
function lnGamma(x) {
  const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x;
  const tmp = x + 5.5 - (x + 0.5) * Math.log(x + 5.5);
  let ser = 1.000000000190015;
  for (const c of g) ser += c / ++y;
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}

// 正则化不完全 Beta 函数 I_x(a, b)（连分式）
function betaInc(x, a, b) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const bt = Math.exp(lnGamma(a + b) - lnGamma(a) - lnGamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  const cf = (x, a, b) => {
    const FPMIN = 1e-300;
    let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < FPMIN) d = FPMIN;
    d = 1 / d;
    let h = d;
    for (let m = 1; m <= 300; m++) {
      const m2 = 2 * m;
      let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d;
      const del = d * c;
      h *= del;
      if (Math.abs(del - 1) < 3e-16) break;
    }
    return h;
  };
  return x < (a + 1) / (a + b + 2) ? bt * cf(x, a, b) / a : 1 - bt * cf(1 - x, b, a) / b;
}

// 学生 t 分布双侧 p
const tTwoSidedP = (t, df) => betaInc(df / (df + t * t), df / 2, 0.5);

// Welch t 检验。返回 {t, df, p}；无法计算时 p = NaN
function welchTTest(x, y) {
  const n1 = x.length, n2 = y.length;
  if (n1 < 2 || n2 < 2) return { t: NaN, df: NaN, p: NaN };
  const m1 = mean(x), m2 = mean(y), v1 = sd(x) ** 2, v2 = sd(y) ** 2;
  const se2 = v1 / n1 + v2 / n2;
  if (!(se2 > 0)) return { t: NaN, df: NaN, p: NaN };
  const t = (m1 - m2) / Math.sqrt(se2);
  const df = se2 * se2 / ((v1 / n1) ** 2 / (n1 - 1) + (v2 / n2) ** 2 / (n2 - 1));
  return { t, df, p: Math.min(1, tTwoSidedP(t, df)) };
}

// 标准正态分布函数（erfc 的 Numerical Recipes 近似，相对误差 < 1.2e-7）
function normCdf(z) {
  const x = Math.abs(z) / Math.SQRT2;
  const t = 1 / (1 + 0.5 * x);
  const y = t * Math.exp(-x * x - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 +
    t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return z >= 0 ? 1 - y / 2 : y / 2;
}

// Mann-Whitney U 检验（双侧）。返回 {U, p, method}
function mannWhitneyU(x, y) {
  const n1 = x.length, n2 = y.length;
  if (!n1 || !n2) return { U: NaN, p: NaN, method: '' };
  const all = x.map(v => ({ v, g: 0 })).concat(y.map(v => ({ v, g: 1 }))).sort((a, b) => a.v - b.v);
  // 平均秩
  const N = all.length;
  let ties = false, tieTerm = 0;
  for (let i = 0; i < N;) {
    let j = i;
    while (j + 1 < N && all[j + 1].v === all[i].v) j++;
    const r = (i + j + 2) / 2;
    for (let k = i; k <= j; k++) all[k].r = r;
    const tcount = j - i + 1;
    if (tcount > 1) { ties = true; tieTerm += tcount ** 3 - tcount; }
    i = j + 1;
  }
  const R1 = all.filter(a => a.g === 0).reduce((s, a) => s + a.r, 0);
  const U = R1 - n1 * (n1 + 1) / 2;
  if (!ties && n1 < 50 && n2 < 50) {
    // 精确分布：U 的频数 = 高斯二项式系数的系数（递推 c(m,n,u) = c(m-1,n,u-n) + c(m,n-1,u)）
    const dist = mwExactDist(n1, n2);
    const total = dist.reduce((s, v) => s + v, 0);
    const u = Math.round(U);
    let le = 0, ge = 0;
    for (let k = 0; k < dist.length; k++) { if (k <= u) le += dist[k]; if (k >= u) ge += dist[k]; }
    return { U, p: Math.min(1, 2 * Math.min(le, ge) / total), method: 'exact' };
  }
  const mu = n1 * n2 / 2;
  const sigma = Math.sqrt(n1 * n2 / 12 * ((N + 1) - tieTerm / (N * (N - 1))));
  if (!(sigma > 0)) return { U, p: NaN, method: 'normal' };
  const z = (Math.abs(U - mu) - 0.5) / sigma;   // 连续性校正
  return { U, p: Math.min(1, 2 * (1 - normCdf(Math.max(z, 0)))), method: 'normal' };
}

function mwExactDist(m, n) {
  // f[i][j] 为长度 i*j+1 的数组；只保留上一行
  let prev = [];
  for (let j = 0; j <= n; j++) prev[j] = [1];          // i = 0
  for (let i = 1; i <= m; i++) {
    const cur = [[1]];                                 // j = 0
    for (let j = 1; j <= n; j++) {
      const a = prev[j], b = cur[j - 1];               // c(i-1, j, u-j) 与 c(i, j-1, u)
      const len = i * j + 1;
      const out = new Array(len).fill(0);
      for (let u = 0; u < len; u++) {
        if (u - j >= 0 && u - j < a.length) out[u] += a[u - j];
        if (u < b.length) out[u] += b[u];
      }
      cur[j] = out;
    }
    prev = cur;
  }
  return prev[n];
}

const pStars = (p) => (!Number.isFinite(p) ? '' : p < 0.001 ? '***' : p < 0.01 ? '**' : p < 0.05 ? '*' : 'ns');

// ---- v1.4.7.1：配对比较（组内不同类别）与泊松离散度检验 ------------------------------------
// 配对 t 检验（双侧，与 Excel TTEST(…,2,1)、R t.test(paired=TRUE) 相同）。返回 {t, df, p, meanDiff}
function pairedTTest(x, y) {
  const d = x.map((v, i) => v - y[i]);
  const n = d.length;
  if (n < 2) return { t: NaN, df: NaN, p: NaN, meanDiff: n ? d[0] : NaN };
  const m = mean(d), s = sd(d);
  if (!(s > 0)) return { t: NaN, df: n - 1, p: NaN, meanDiff: m };
  const t = m / (s / Math.sqrt(n));
  return { t, df: n - 1, p: Math.min(1, tTwoSidedP(t, n - 1)), meanDiff: m };
}

// Wilcoxon 符号秩检验（双侧），方法与 R wilcox.test(paired=TRUE) 默认相同：
//   去掉差值为 0 的对；无并列且 n < 50：精确分布；否则正态近似（并列校正 + 连续性校正）。
function wilcoxonSignedRank(x, y) {
  const d = x.map((v, i) => v - y[i]).filter(v => v !== 0);
  const n = d.length;
  if (!n) return { V: NaN, p: NaN, method: '' };
  const a = d.map(v => ({ v, abs: Math.abs(v) })).sort((p, q) => p.abs - q.abs);
  let ties = false, tieTerm = 0;
  for (let i = 0; i < n;) {
    let j = i;
    while (j + 1 < n && a[j + 1].abs === a[i].abs) j++;
    const r = (i + j + 2) / 2;
    for (let k = i; k <= j; k++) a[k].r = r;
    const tc = j - i + 1;
    if (tc > 1) { ties = true; tieTerm += tc ** 3 - tc; }
    i = j + 1;
  }
  const V = a.filter(e => e.v > 0).reduce((s, e) => s + e.r, 0);
  const zeros = x.length - n;
  if (!ties && !zeros && n < 50) {
    // 精确分布：秩和 V 的频数 = ∏(1 + q^k) 的系数
    const max = n * (n + 1) / 2;
    let f = new Array(max + 1).fill(0); f[0] = 1;
    for (let k = 1; k <= n; k++) for (let s = max; s >= k; s--) f[s] += f[s - k];
    const total = 2 ** n, v = Math.round(V);
    let le = 0, ge = 0;
    for (let s = 0; s <= max; s++) { if (s <= v) le += f[s]; if (s >= v) ge += f[s]; }
    return { V, p: Math.min(1, 2 * Math.min(le, ge) / total), method: 'exact' };
  }
  const mu = n * (n + 1) / 4;
  const sigma = Math.sqrt(n * (n + 1) * (2 * n + 1) / 24 - tieTerm / 48);
  if (!(sigma > 0)) return { V, p: NaN, method: 'normal' };
  const z = (Math.abs(V - mu) - 0.5) / sigma;
  return { V, p: Math.min(1, 2 * (1 - normCdf(Math.max(z, 0)))), method: 'normal' };
}

// 正则化下不完全 Gamma 函数 P(a, x)（Numerical Recipes：级数 / 连分式）
function gammaP(a, x) {
  if (x <= 0) return 0;
  const gln = lnGamma(a);
  if (x < a + 1) {
    let ap = a, sum = 1 / a, del = sum;
    for (let n = 0; n < 500; n++) { ap++; del *= x / ap; sum += del; if (Math.abs(del) < Math.abs(sum) * 1e-15) break; }
    return sum * Math.exp(-x + a * Math.log(x) - gln);
  }
  let b = x + 1 - a, c = 1 / 1e-300, d = 1 / b, h = d;
  for (let i = 1; i < 500; i++) {
    const an = -i * (i - a);
    b += 2;
    d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300;
    c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 1e-15) break;
  }
  return 1 - Math.exp(-x + a * Math.log(x) - gln) * h;
}
const chiSqCdf = (x, df) => gammaP(df / 2, x / 2);

// 泊松离散度检验：各格计数是否符合随机（泊松）分布。
// 离散指数 D = s² / x̄；χ² = Σ(xᵢ − x̄)² / x̄ = (n − 1)·D，自由度 n − 1；双侧 p。
// D ≈ 1：分布均匀随机（计数板加样合格）；D > 1：聚集（未混匀、成团）；D < 1：过于规则。
function poissonDispersion(v) {
  const n = v.length, m = mean(v);
  if (n < 2 || !(m > 0)) return { D: NaN, chi2: NaN, df: n - 1, p: NaN };
  const ss = v.reduce((s, x) => s + (x - m) ** 2, 0);
  const chi2 = ss / m, df = n - 1, cdf = chiSqCdf(chi2, df);
  return { D: chi2 / df, chi2, df, p: Math.min(1, 2 * Math.min(cdf, 1 - cdf)) };
}

// ---------------------------------------------------------------------------
// xlsx.js — 不依赖任何库的 Excel (.xlsx) 写出，以及“数据统计”工作簿
//
// .xlsx = zip 包内的若干 XML（Office Open XML / SpreadsheetML）。这里用到：
// 内联字符串、数字、公式（同时写入当前值，并设置打开时重新计算）、单元格样式、
// 冻结窗格、列宽、条件格式（异常值标黄）、柱状图（带误差线）。
// 可被 Excel、WPS、LibreOffice、Numbers 打开。

const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const XS = { normal: 0, header: 1, dec: 2, bold: 3, boldDec: 4, sci: 5, boldSci: 6, note: 7 };

const xmlEsc = (s) => String(s)
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function xlsxColName(i) {
  let s = '';
  for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}

// 工作表名：最长 31 字符，不能含 []:*?/\
const sheetName = (s, used) => {
  let n = String(s).replace(/[[\]:*?/\\]/g, '_').slice(0, 31) || 'Sheet';
  let k = 2;
  while (used.has(n)) n = String(s).slice(0, 28) + ' ' + k++;
  used.add(n);
  return n;
};

// 显示宽度（中日韩字符按 2 计）
const textWidth = (s) => { let w = 0; for (const ch of String(s)) w += ch.charCodeAt(0) > 0x2e80 ? 2 : 1; return w; };

// 单元格地址（c, r 从 0 开始）
const cellRef = (c, r) => `${xlsxColName(c)}${r + 1}`;
const absRef = (c, r) => `$${xlsxColName(c)}$${r + 1}`;
const colRange = (c, r0, r1) => `${absRef(c, r0)}:${absRef(c, r1)}`;
const sheetRef = (name) => `'${String(name).replace(/'/g, "''")}'!`;
const cleanSheetName = (s) => String(s).replace(/[[\]:*?/\\]/g, '_').slice(0, 31) || 'Sheet';

// sheet: { name, rows: [[value | {v, s, f}]], freeze: {rows, cols}, header, condFormats: [{sqref, formula}], chart }
// value: 数字 → 数值；字符串 → 文本；null / '' / undefined / NaN → 空。f：公式（不含 “=”），v 为其当前值
function sheetXml(sheet, first, drawingRid) {
  const widths = [];
  const rowsXml = sheet.rows.map((row, ri) => {
    const cells = (row || []).map((cell, ci) => {
      const isObj = cell !== null && typeof cell === 'object';
      const v = isObj ? cell.v : cell;
      const f = isObj ? cell.f : null;
      const st = isObj && cell.s !== undefined ? cell.s : (ri === 0 && sheet.header !== false ? XS.header : XS.normal);
      const ref = cellRef(ci, ri);
      const sAttr = st ? ` s="${st}"` : '';
      const empty = v === null || v === undefined || v === '' || (typeof v === 'number' && !Number.isFinite(v));
      if (!empty) widths[ci] = Math.max(widths[ci] || 0, textWidth(typeof v === 'number' ? (st === XS.dec || st === XS.boldDec ? v.toFixed(2) : st === XS.sci || st === XS.boldSci ? v.toExponential(2) : String(+v.toPrecision(10))) : v));
      if (f) {
        if (typeof v === 'number' && Number.isFinite(v)) return `<c r="${ref}"${sAttr}><f>${xmlEsc(f)}</f><v>${v}</v></c>`;
        return `<c r="${ref}"${sAttr} t="str"><f>${xmlEsc(f)}</f><v>${empty ? '' : xmlEsc(v)}</v></c>`;
      }
      if (empty) return st ? `<c r="${ref}"${sAttr}/>` : '';
      if (typeof v === 'number') return `<c r="${ref}"${sAttr}><v>${v}</v></c>`;
      return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join('');
  const fr = sheet.freeze || { rows: 1, cols: 0 };
  let pane = '';
  if (fr.rows || fr.cols) {
    const tl = `${xlsxColName(fr.cols || 0)}${(fr.rows || 0) + 1}`;
    const active = fr.rows && fr.cols ? 'bottomRight' : fr.rows ? 'bottomLeft' : 'topRight';
    pane = `<pane${fr.cols ? ` xSplit="${fr.cols}"` : ''}${fr.rows ? ` ySplit="${fr.rows}"` : ''} topLeftCell="${tl}" activePane="${active}" state="frozen"/>`;
  }
  const cols = widths.length ? `<cols>${Array.from(widths, (w, i) => `<col min="${i + 1}" max="${i + 1}" width="${Math.min(60, Math.max(8, (w || 0) * 1.1 + 2)).toFixed(1)}" customWidth="1"/>`).join('')}</cols>` : '';
  const cf = (sheet.condFormats || []).map((c, i) =>
    `<conditionalFormatting sqref="${c.sqref}"><cfRule type="expression" dxfId="0" priority="${i + 1}"><formula>${xmlEsc(c.formula)}</formula></cfRule></conditionalFormatting>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
    `<sheetViews><sheetView workbookViewId="0"${first ? ' tabSelected="1"' : ''}>${pane}</sheetView></sheetViews>` +
    `<sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${rowsXml}</sheetData>${cf}${drawingRid ? `<drawing r:id="${drawingRid}"/>` : ''}</worksheet>`;
}

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart">` +
    `<xdr:twoCellAnchor><xdr:from>${pt(a.c0, a.r0)}</xdr:from><xdr:to>${pt(a.c1, a.r1)}</xdr:to>` +
    `<xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="2" name="Chart 1"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr>` +
    `<xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart r:id="rId1"/></a:graphicData></a:graphic></xdr:graphicFrame>` +
    `<xdr:clientData/></xdr:twoCellAnchor></xdr:wsDr>`;
}

function makeXlsx(sheets) {
  const enc = new TextEncoder();
  const used = new Set();
  const names = sheets.map(s => sheetName(s.name, used));
  const files = [];
  const add = (name, text) => files.push({ name, data: enc.encode(text) });
  const R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const charts = [];
  sheets.forEach((s, i) => { if (s.chart) charts.push(i); });
  add('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}${charts.map((_, k) => `<Override PartName="/xl/drawings/drawing${k + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/><Override PartName="/xl/charts/chart${k + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`).join('')}</Types>`);
  add('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  // fullCalcOnLoad：打开时重新计算全部公式（改了原始数据也会同步）
  add('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${names.map((n, i) => `<sheet name="${xmlEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`);
  add('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${R}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`);
  add('xl/styles.xml', XLSX_STYLES);
  sheets.forEach((s, i) => {
    const k = charts.indexOf(i);
    add(`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s, i === 0, k >= 0 ? 'rId1' : null));
    if (k >= 0) {
      add(`xl/worksheets/_rels/sheet${i + 1}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/drawing" Target="../drawings/drawing${k + 1}.xml"/></Relationships>`);
      add(`xl/drawings/drawing${k + 1}.xml`, drawingXml(s.chart.anchor));
      add(`xl/drawings/_rels/drawing${k + 1}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/chart" Target="../charts/chart${k + 1}.xml"/></Relationships>`);
      add(`xl/charts/chart${k + 1}.xml`, chartXml(s.chart));
    }
  });
  return new Blob([makeZip(files)], { type: XLSX_MIME });
}

// ---- “数据统计”工作簿（合计、统计量、检验、浓度都用公式，修改原始数据后自动更新） ------------
const numOrStr = (v) => (typeof v === 'string' && /^-?\d+(\.\d+)?(e[-+]?\d+)?$/i.test(v) ? +v : v);
const STAT_KEYS = ['statN', 'statMean', 'statSd', 'statSem', 'statCv', 'statMedian', 'statMin', 'statMax', 'statSum'];

// 统计量的公式与当前值（r 为范围，vals 为数值）
function statFormula(key, r, vals) {
  const n = vals.length, m = mean(vals), s = sd(vals);
  switch (key) {
    case 'statN': return { f: `COUNT(${r})`, v: n };
    case 'statMean': return { f: `IF(COUNT(${r})=0,"",AVERAGE(${r}))`, v: n ? m : '', s: XS.dec };
    case 'statSd': return { f: `IF(COUNT(${r})<2,"",STDEV(${r}))`, v: n > 1 ? s : '', s: XS.dec };
    case 'statSem': return { f: `IF(COUNT(${r})<2,"",STDEV(${r})/SQRT(COUNT(${r})))`, v: n > 1 ? s / Math.sqrt(n) : '', s: XS.dec };
    case 'statCv': return { f: `IF(COUNT(${r})<2,"",IF(AVERAGE(${r})=0,"",STDEV(${r})/AVERAGE(${r})*100))`, v: n > 1 && m ? s / m * 100 : '', s: XS.dec };
    case 'statMedian': return { f: `IF(COUNT(${r})=0,"",MEDIAN(${r}))`, v: n ? median(vals) : '', s: XS.dec };
    case 'statMin': return { f: `MIN(${r})`, v: n ? Math.min(...vals) : 0 };
    case 'statMax': return { f: `MAX(${r})`, v: n ? Math.max(...vals) : 0 };
    default: return { f: `SUM(${r})`, v: vals.reduce((a, b) => a + b, 0), s: XS.bold };
  }
}

function statsWorkbookSheets() {
  const A = analysisData();
  const cfg = statsCfg();
  const cats = A.cats;
  const keys = cats.map(c => c.id).concat(['total']);
  const nameOf = { counts: cleanSheetName(t('xlsxCounts')), stats: cleanSheetName(t('xlsxStats')), cells: cleanSheetName(t('xlsxCells')) };
  const CNT = sheetRef(nameOf.counts), CEL = sheetRef(nameOf.cells);
  const sheets = [];

  // 1. 计数（原始数据）：行 = 图片（按组排列），列 = 实验信息 + 各类别 + 合计（=SUM）
  const F = cfg.fields;
  const c0 = 5 + F.length;                 // 第一个类别所在列
  const cTot = c0 + cats.length;           // 合计列
  const colOf = (id) => (id === 'total' ? cTot : c0 + cats.findIndex(c => c.id === id));
  const counts = [[t('folder'), t('image'), t('originalFile'), t('groupLbl'), ...F.map(f => f.name), t('done'), ...cats.map(c => c.name), totalLabel()]];
  const rowOf = new Map();                 // entry id → 行号（0 起）
  A.rows.forEach((r, i) => {
    const ri = i + 1;
    rowOf.set(r.entry.id, ri);
    const info = infoOf(r.entry);
    counts.push([r.folder ? r.folder.name : '', r.name, r.entry.doc.image.name, r.group, ...F.map(f => numOrStr(info[f.id] || '')),
      r.entry.done ? '✓' : '', ...cats.map(c => r.counts[c.id]),
      { f: `SUM(${cellRef(c0, ri)}:${cellRef(cTot - 1, ri)})`, v: r.total, s: XS.bold }]);
  });
  const last = A.rows.length;              // 最后一个数据行（0 起）
  const sumRowCells = keys.map(id => ({ f: `SUM(${cellRef(colOf(id), 1)}:${cellRef(colOf(id), last)})`, v: valuesOf(A.rows, id).reduce((a, b) => a + b, 0), s: XS.bold }));
  counts.push([{ v: t('sumRow'), s: XS.bold }, '', '', '', ...F.map(() => ''), '', ...sumRowCells]);
  // 每组在“计数”表中的行范围（同组行相邻）
  const span = (rows) => { const ix = rows.map(r => rowOf.get(r.entry.id)); return [Math.min(...ix), Math.max(...ix)]; };
  const groupSpans = A.groups.map(g => ({ g, span: span(g.rows) }));
  const countsSheet = { name: nameOf.counts, rows: counts, freeze: { rows: 1, cols: 2 } };
  if (cfg.outliers) {
    // 异常值：与本组均值相差超过 2 个标准差（本组至少 3 张图）
    countsSheet.condFormats = [];
    for (const { span: [a, b] } of groupSpans) {
      if (b - a < 2) continue;
      for (const id of keys) {
        const c = colOf(id), rr = colRange(c, a, b);
        countsSheet.condFormats.push({ sqref: `${cellRef(c, a)}:${cellRef(c, b)}`, formula: `AND(COUNT(${rr})>2,ABS(${cellRef(c, a)}-AVERAGE(${rr}))>2*STDEV(${rr}))` });
      }
    }
  }
  sheets.push(countsSheet);

  // 2. 统计（公式引用“计数”表）
  if (cfg.statsSheet || cfg.chart) {
    const st = [[t('groupLbl'), t('statistic'), ...cats.map(c => c.name), totalLabel()]];
    const blocks = (A.groups.length > 1 ? groupSpans : []).map(x => ({ name: x.g.name, rows: x.g.rows, span: x.span }))
      .concat([{ name: t('allImages'), rows: A.rows, span: [1, last], all: true }]);
    const meanRow = {}, sdRow = {};
    blocks.forEach((b, bi) => {
      if (bi) st.push([]);
      for (const k of STAT_KEYS) {
        const ri = st.length;
        if (k === 'statMean') meanRow[b.name] = ri;
        if (k === 'statSd') sdRow[b.name] = ri;
        st.push([b.name, t(k), ...keys.map(id => statFormula(k, CNT + colRange(colOf(id), b.span[0], b.span[1]), valuesOf(b.rows, id)))]);
      }
    });
    const statsSheet = { name: nameOf.stats, rows: st, freeze: { rows: 1, cols: 2 } };
    if (cfg.chart) {
      // 柱状图：横轴 = 类别，系列 = 各组，柱高 = 均值，误差线 = ±SD
      const S = sheetRef(nameOf.stats);
      const nc = Math.max(cats.length, 1);
      const series = (A.groups.length > 1 ? A.groups.map(g => g.name) : [t('allImages')]).map(name => ({
        nameRef: S + absRef(0, meanRow[name]),
        valRef: S + `${absRef(2, meanRow[name])}:${absRef(1 + nc, meanRow[name])}`,
        errRef: S + `${absRef(2, sdRow[name])}:${absRef(1 + nc, sdRow[name])}`
      }));
      statsSheet.chart = { title: t('chartTitle'), yTitle: t('chartY'), catRef: S + `${absRef(2, 0)}:${absRef(1 + nc, 0)}`, series,
        anchor: { c0: 0, r0: st.length + 2, c1: Math.max(8, nc + 4), r1: st.length + 22 } };
    }
    sheets.push(statsSheet);
  }

  // 3. 组间比较（Welch t 检验为公式；Mann-Whitney 为程序计算值）
  if (cfg.compare && A.groups.length > 1) {
    const ctl = controlGroup(A.groups);
    const cs = groupSpans.find(x => x.g === ctl).span;
    const rows = [[t('controlGroup'), t('groupLbl'), t('category'), 'n ' + t('controlShort'), 'n', t('statMean') + ' ' + t('controlShort'), t('statMean'),
      t('diffLbl'), t('ratioLbl'), 'Welch t p', t('sigLbl'), 'Mann-Whitney p', t('sigLbl') + ' (MW)']];
    for (const { g, span: gs } of groupSpans) {
      if (g === ctl) continue;
      for (const id of keys) {
        const ri = rows.length;
        const rc = CNT + colRange(colOf(id), cs[0], cs[1]), rt = CNT + colRange(colOf(id), gs[0], gs[1]);
        const cv = valuesOf(ctl.rows, id), tv = valuesOf(g.rows, id);
        const mc = mean(cv), mt = mean(tv);
        const tt = welchTTest(cv, tv), mw = mannWhitneyU(cv, tv);
        const C = (c) => cellRef(c, ri);
        rows.push([ctl.name, g.name, id === 'total' ? totalLabel() : cats.find(c => c.id === id).name,
          { f: `COUNT(${rc})`, v: cv.length }, { f: `COUNT(${rt})`, v: tv.length },
          { f: `IF(COUNT(${rc})=0,"",AVERAGE(${rc}))`, v: cv.length ? mc : '', s: XS.dec },
          { f: `IF(COUNT(${rt})=0,"",AVERAGE(${rt}))`, v: tv.length ? mt : '', s: XS.dec },
          { f: `IF(OR(${C(5)}="",${C(6)}=""),"",${C(6)}-${C(5)})`, v: Number.isFinite(mt - mc) ? mt - mc : '', s: XS.dec },
          { f: `IF(OR(${C(5)}="",${C(6)}=""),"",IF(${C(5)}=0,"",${C(6)}/${C(5)}))`, v: mc ? mt / mc : '', s: XS.dec },
          { f: `IF(OR(${C(3)}<2,${C(4)}<2),"",IFERROR(TTEST(${rc},${rt},2,3),""))`, v: Number.isFinite(tt.p) ? tt.p : '' },
          { f: `IF(${C(9)}="","",IF(${C(9)}<0.001,"***",IF(${C(9)}<0.01,"**",IF(${C(9)}<0.05,"*","ns"))))`, v: pStars(tt.p) },
          Number.isFinite(mw.p) ? mw.p : '',
          { f: `IF(${C(11)}="","",IF(${C(11)}<0.001,"***",IF(${C(11)}<0.01,"**",IF(${C(11)}<0.05,"*","ns"))))`, v: pStars(mw.p) }]);
      }
    }
    rows.push([]);
    rows.push([{ v: t('compareNoteTt'), s: XS.note }]);
    rows.push([{ v: t('compareNoteMw'), s: XS.note }]);
    sheets.push({ name: t('xlsxCompare'), rows, freeze: { rows: 1, cols: 3 } });
  }

  // 3b. 组内比较（同一组内两个类别；同一批图片 → 配对 t 检验为公式，Wilcoxon 符号秩为程序计算值）
  if (cfg.within && cats.length > 1) {
    const rows = [[t('groupLbl'), 'A', 'B', 'n', t('statMean') + ' A', t('statSd') + ' A', t('statMean') + ' B', t('statSd') + ' B',
      t('diffLbl') + ' (A−B)', t('ratioLbl') + ' (A/B)', 'ΣA', 'ΣB', t('withinPropXl'), t('pairedT') + ' p', t('sigLbl'), 'Wilcoxon p', t('sigLbl') + ' (W)']];
    const blocks = (A.groups.length > 1 ? groupSpans : []).map(x => ({ name: x.g.name, rows: x.g.rows, span: x.span }))
      .concat([{ name: t('allImages'), rows: A.rows, span: [1, last] }]);
    for (const [ca, cb] of withinPairs(cats)) {
      for (const bk of blocks) {
        const ri = rows.length, C = (c) => cellRef(c, ri);
        const ra = CNT + colRange(colOf(ca.id), bk.span[0], bk.span[1]), rb = CNT + colRange(colOf(cb.id), bk.span[0], bk.span[1]);
        const S = withinStats(bk.rows, ca, cb);
        const num = (v) => (Number.isFinite(v) ? v : '');
        rows.push([bk.name, ca.name, cb.name, { f: `COUNT(${ra})`, v: S.n },
          { f: `IF(COUNT(${ra})=0,"",AVERAGE(${ra}))`, v: num(S.ma), s: XS.dec }, { f: `IF(COUNT(${ra})<2,"",STDEV(${ra}))`, v: S.n > 1 ? num(S.sda) : '', s: XS.dec },
          { f: `IF(COUNT(${rb})=0,"",AVERAGE(${rb}))`, v: num(S.mb), s: XS.dec }, { f: `IF(COUNT(${rb})<2,"",STDEV(${rb}))`, v: S.n > 1 ? num(S.sdb) : '', s: XS.dec },
          { f: `IF(OR(${C(4)}="",${C(6)}=""),"",${C(4)}-${C(6)})`, v: num(S.ma - S.mb), s: XS.dec },
          { f: `IF(OR(${C(4)}="",${C(6)}=""),"",IF(${C(6)}=0,"",${C(4)}/${C(6)}))`, v: S.mb ? num(S.ma / S.mb) : '', s: XS.dec },
          { f: `SUM(${ra})`, v: S.sa }, { f: `SUM(${rb})`, v: S.sb },
          { f: `IF(${C(10)}+${C(11)}=0,"",${C(10)}/(${C(10)}+${C(11)})*100)`, v: Number.isFinite(S.prop) ? S.prop * 100 : '', s: XS.dec },
          { f: `IF(${C(3)}<2,"",IFERROR(TTEST(${ra},${rb},2,1),""))`, v: num(S.tt.p) },
          { f: `IF(${C(13)}="","",IF(${C(13)}<0.001,"***",IF(${C(13)}<0.01,"**",IF(${C(13)}<0.05,"*","ns"))))`, v: pStars(S.tt.p) },
          num(S.wx.p),
          { f: `IF(${C(15)}="","",IF(${C(15)}<0.001,"***",IF(${C(15)}<0.01,"**",IF(${C(15)}<0.05,"*","ns"))))`, v: pStars(S.wx.p) }]);
      }
    }
    rows.push([]);
    rows.push([{ v: t('withinNoteXl'), s: XS.note }]);
    sheets.push({ name: t('xlsxWithin'), rows, freeze: { rows: 1, cols: 3 } });
  }

  // 4. 网格每格（计入 = 1 的格用于浓度换算）
  const gridEntries = A.rows.filter(r => gridOn(r.entry.doc));
  const cellsSheet = gridEntries.length ? (() => {
    const rows = [[t('folder'), t('image'), t('cellLbl'), t('rowLbl'), t('colLbl'), t('includedLbl'), ...cats.map(c => c.name), totalLabel()]];
    for (const r of gridEntries) {
      const e = r.entry, cc = cellCounts(e.doc);
      for (let gr = 0; gr < cc.rows; gr++) for (let gc = 0; gc < cc.cols; gc++) {
        const ri = rows.length;
        rows.push([r.folder ? r.folder.name : '', r.name, cellName(gc, gr), gr + 1, letterName(gc), cellIncluded(e.doc, gc, gr) ? 1 : 0,
          ...cats.map(cat => (cc.byCat[cat.id] ? cc.byCat[cat.id][gr][gc] : 0)),
          { f: `SUM(${cellRef(6, ri)}:${cellRef(5 + cats.length, ri)})`, v: cc.total[gr][gc], s: XS.bold }]);
      }
    }
    return { name: nameOf.cells, rows, freeze: { rows: 1, cols: 3 } };
  })() : null;

  // 5. 浓度换算（计数板）：参数在上方，公式引用参数
  if (cfg.conc) {
    const cc = cfg.concCfg;
    const byGrid = cc.preset === 'grid';
    const direct = cc.volMode === 'direct';
    const fa = AREA_UNITS[cc.areaUnit] || 1, fd = LEN_UNITS[cc.depthUnit] || 1, fv = VOL_UNITS[cc.volUnit] || 1, fo = PER_UNITS[cc.outUnit] || 1;
    const areaMm2 = +cc.area * fa, depthMm = +cc.depth * fd;
    // 参数区：B 列可改（数值），D 列为换算到 mm² / mm / µL 后的值（公式）
    const rows = [
      [t('paramsLbl'), t('valueLbl'), t('unitLbl'), t('convertedLbl')].map(v => ({ v, s: XS.header })),
      [t('chamber'), t('chamber_' + cc.preset)],
      [t('areaLbl'), byGrid ? t('areaPerImage') : +cc.area, byGrid ? '' : cc.areaUnit, byGrid ? '' : { f: `B3*${fa}`, v: areaMm2 }, byGrid ? '' : 'mm²'],
      [t('depthLbl'), +cc.depth, cc.depthUnit, { f: `B4*${fd}`, v: depthMm }, 'mm'],
      direct ? [t('volLbl'), +cc.vol, cc.volUnit, { f: `B5*${fv}`, v: +cc.vol * fv }, 'µL', t('volDirect')]
        : [t('volLbl'), byGrid ? t('areaPerImage') : { f: 'D3*D4', v: areaMm2 * depthMm }, byGrid ? '' : 'µL', byGrid ? '' : { f: 'B5', v: areaMm2 * depthMm }, byGrid ? '' : 'µL', t('volCalc')],
      [t('outUnitLbl'), t('cellsPer', { u: cc.outUnit }), '', fo, t('perMlFactor')],
      [{ v: t('concFormula'), s: XS.note }],
      []
    ];
    const h0 = rows.length;
    rows.push([t('image'), t('groupLbl'), t('dilution'), t('squaresLbl'), t('areaMm2'), t('volUl'),
      ...cats.map(c => `${t('perSquare')}: ${c.name}`), `${t('perSquare')}: ${totalLabel()}`,
      ...cats.map(c => `${t('cellsPer', { u: cc.outUnit })}: ${c.name}`), `${t('cellsPer', { u: cc.outUnit })}: ${totalLabel()}`].map(v => ({ v, s: XS.header })));
    const p0 = 6, k0 = 6 + cats.length + 1;   // “平均每格”与“浓度”的第一列
    const incCol = '$F:$F';
    A.rows.forEach(r => {
      const ri = rows.length, e = r.entry, cRow = rowOf.get(e.id);
      const co = concOf(r, cats);
      const C = (c) => cellRef(c, ri);
      const nameCell = `$A${ri + 1}`;
      const grid = co.grid;
      const per = cats.map((cat, j) => (grid
        ? { f: `IFERROR(SUMIFS(${CEL}$${xlsxColName(6 + j)}:$${xlsxColName(6 + j)},${CEL}$B:$B,${nameCell},${CEL}${incCol},1)/$D${ri + 1},"")`, v: co.per[cat.id], s: XS.dec }
        : { f: `${CNT}${cellRef(c0 + j, cRow)}`, v: co.per[cat.id], s: XS.dec }));
      rows.push([r.name, r.group, co.dil,
        grid ? { f: `COUNTIFS(${CEL}$B:$B,${nameCell},${CEL}${incCol},1)`, v: co.squares } : 1,
        byGrid ? (Number.isFinite(co.area) ? co.area : '') : { f: '$D$3', v: co.area },
        direct ? { f: '$D$5', v: co.vol } : { f: `IF(${C(4)}="","",${C(4)}*$D$4)`, v: Number.isFinite(co.vol) ? co.vol : '' },
        ...per, { f: `SUM(${C(p0)}:${C(p0 + cats.length - 1)})`, v: co.per.total, s: XS.boldDec },
        ...keys.map((id, j) => ({ f: `IF(OR(${C(5)}="",${C(5)}=0,${C(p0 + j)}=""),"",${C(p0 + j)}/(${C(5)}/1000)*${C(2)}*$D$6)`,
          v: Number.isFinite(co.conc[id]) ? co.conc[id] : '', s: id === 'total' ? XS.boldSci : XS.sci }))]);
    });
    // 各组浓度（合计）的均值 ± SD
    const first = h0 + 1;
    rows.push([]);
    rows.push([t('concByGroup'), 'n', t('statMean'), t('statSd')].map(v => ({ v, s: XS.bold })));
    const totC = k0 + cats.length;
    A.groups.forEach(g => {
      const ix = g.rows.map(r => first + A.rows.indexOf(r));
      const rr = colRange(totC, Math.min(...ix), Math.max(...ix));
      const vals = g.rows.map(r => concOf(r, cats).conc.total).filter(Number.isFinite);
      rows.push([g.name, { f: `COUNT(${rr})`, v: vals.length }, { f: `IF(COUNT(${rr})=0,"",AVERAGE(${rr}))`, v: vals.length ? mean(vals) : '', s: XS.sci },
        { f: `IF(COUNT(${rr})<2,"",STDEV(${rr}))`, v: vals.length > 1 ? sd(vals) : '', s: XS.sci }]);
    });
    sheets.push({ name: t('xlsxConc'), rows, header: false, freeze: { rows: h0 + 1, cols: 1 } });
  }

  // 5a. 平板分区：每张图每个扇区一行（面积占比、是否计入、各类别计数）；全板估计 = SUMIFS 计入扇区计数 ÷ SUMIFS 计入面积占比
  const plateEntries = A.rows.filter(r => plateOn(r.entry.doc));
  let SEC = null;
  if (plateEntries.length) {
    const secName = cleanSheetName(t('xlsxSectors'));
    const rows = [[t('image'), t('plateSector'), t('plateFrac'), t('includedLbl'), ...cats.map(c => c.name), totalLabel()]];
    const est = [];
    for (const r of plateEntries) {
      const S = plateStats(r.entry.doc);
      for (let i = 0; i < S.n; i++) {
        const ri = rows.length;
        rows.push([r.name, i + 1, { f: `1/${S.n}`, v: S.frac, s: XS.dec }, S.incl(i) ? 1 : 0,
          ...cats.map(c => (S.byCat[c.id] ? S.byCat[c.id][i] : 0)),
          { f: `SUM(${cellRef(4, ri)}:${cellRef(3 + cats.length, ri)})`, v: S.total[i], s: XS.bold }]);
      }
      est.push([r.name, S]);
    }
    const lastData = rows.length - 1;   // 只引用扇区数据行（不含下方的估计汇总）
    const SR = sheetRef(secName), colL = (c) => SR + colRange(c, 1, lastData);
    const estF = (nameCell, c) => `IFERROR(SUMIFS(${colL(c)},${colL(0)},${nameCell},${colL(3)},1)/SUMIFS(${colL(2)},${colL(0)},${nameCell},${colL(3)},1),"")`;
    // 每张图的全板估计（公式）
    rows.push([]);
    rows.push([t('image'), t('plateUsedK'), ...cats.map(c => `${t('plateEstimate')}: ${c.name}`), `${t('plateEstimate')}: ${totalLabel()}`].map(v => ({ v, s: XS.bold })));
    for (const [name, S] of est) {
      const ri = rows.length, nc = `$A${ri + 1}`;
      rows.push([name, `${S.used.length}/${S.n}`, ...cats.map((c, j) => ({ f: estF(nc, 4 + j), v: S.estByCat[c.id] || 0, s: XS.dec })),
        { f: estF(nc, 4 + cats.length), v: S.estimate, s: XS.boldDec }]);
    }
    rows.push([]);
    rows.push([{ v: t('plateSectorNoteXl'), s: XS.note }]);
    sheets.push({ name: secName, rows, freeze: { rows: 1, cols: 2 } });
    SEC = { estF, catCol: (id) => (id === 'total' ? 4 + cats.length : 4 + cats.findIndex(c => c.id === id)) };
  }

  // 5b. 平板计数（PFU / CFU）
  for (const kind of PLATE_KINDS) if (cfg[kind]) sheets.push(plateSheet(kind, { CNT, rowOf, colOf, SEC }));

  // 6. 坐标
  if (cfg.points) {
    const now = new Date().toISOString();
    const pts = [POINT_HEADER.slice()];
    A.rows.forEach(r => pointRows(r.entry, now).forEach(row => pts.push(row.map(numOrStr))));
    sheets.push({ name: t('xlsxPoints'), rows: pts, freeze: { rows: 1, cols: 0 } });
  }
  // 7. 计数区域
  const roi = roiSummaryRows();
  if (roi) {
    const tIx = roi[0].indexOf('total'), firstCat = 4;
    sheets.push({ name: t('xlsxRoi'), freeze: { rows: 1, cols: 3 }, rows: roi.map((r, i) => (i ? r.map((v, j) => (j === tIx
      ? { f: `SUM(${cellRef(firstCat, i)}:${cellRef(tIx - 1, i)})`, v, s: XS.bold } : numOrStr(v))) : r)) });
  }
  if (cellsSheet) sheets.push(cellsSheet);

  // 8. 信息（可追溯）
  const info = [[t('infoItem'), t('infoValue')],
    [t('appName'), 'v' + APP_VERSION], [t('copyrightLbl'), copyrightText()], [t('exportedAt'), formatTime(new Date())], [t('operator'), state.settings.operator || ''],
    [t('projectLbl'), state.fileName || projectFileName()], [{ v: t('formulaNote'), s: XS.note }], [],
    [{ v: t('category'), s: XS.bold }, { v: t('colorLbl'), s: XS.bold }, { v: t('shapeLbl'), s: XS.bold }]];
  cats.forEach(c => info.push([c.name, c.color, (t('shapeNames') || {})[c.shape] || c.shape]));
  info.push([]);
  info.push(['image', 'group', 'original_file', 'width', 'height', 'sha256', 'pixel_size', 'unit', 'image_transform', 'adjusted'].map(v => ({ v, s: XS.bold })));
  A.rows.forEach(r => {
    const e = r.entry, s = scaleOf(e.doc);
    info.push([r.name, r.group, e.doc.image.name, e.doc.image.width, e.doc.image.height, e.doc.image.sha256 || '',
      s ? s.px : '', s ? s.unit + '/px' : '', transformText(e.doc.image), adjActive(e.doc) ? 'display only' : '']);
  });
  sheets.push({ name: t('xlsxInfo'), rows: info, freeze: { rows: 0, cols: 0 } });
  return sheets;
}

// 平板计数工作表：参数在上方（可改），每块板一行，每个样品的合并估计与平均值都是公式
function plateSheet(kind, { CNT, rowOf, colOf, SEC }) {
  const P = plateData(kind);
  const cfg = P.cfg;
  const k = PLATE_OUT[cfg.outUnit] || 1;
  const catName = cfg.cat === 'total' ? totalLabel() : P.A.cats.find(c => c.id === cfg.cat).name;
  const rows = [
    [t('paramsLbl'), t('valueLbl'), t('noteLbl')].map(v => ({ v, s: XS.header })),
    [t('plateCat'), catName],
    [t('plateRangeLo'), +cfg.lo],
    [t('plateRangeHi'), +cfg.hi],
    [t('plateMethod'), cfg.method, { v: t('plateMethodXl'), s: XS.note }],
    [t('outUnitLbl'), plateUnitLabel(kind), { v: t('perMlFactor'), s: XS.note }, k],
    [{ v: t('plateFormulaXl'), s: XS.note }],
    []
  ];
  // 体积单位换算（文字 → mL），在 Excel 里改单位也会生效
  const volMl = (vc, uc) => `${vc}*IF(${uc}="mL",1,IF(${uc}="nL",0.000001,0.001))`;
  const h0 = rows.length;
  rows.push([t('image'), t('sampleLbl'), t('plateDil'), t('plateVol'), t('unitLbl'), t('plateVolMl'), t('plateCount'), t('plateFlag'),
    t('plateInRange'), `${t('plateTiter')} (${plateUnitLabel(kind)})`, 'log₁₀', t('plateTiterNum')].map(v => ({ v, s: XS.header })));
  const r0 = rows.length;
  P.plates.forEach((p, i) => {
    const ri = r0 + i, R = ri + 1;
    const cnt = cfg.cat === 'total' ? colOf('total') : colOf(cfg.cat);
    rows.push([p.row.name, p.row.group, { v: p.d, s: XS.sci }, +p.vol.toPrecision(10), p.volUnit,
      { f: volMl(`D${R}`, `E${R}`), v: p.ml },
      p.sector && SEC ? { f: SEC.estF(`$A${R}`, SEC.catCol(cfg.cat)), v: p.count, s: XS.boldDec }   // 平板分区：全板估计
        : { f: `${CNT}${cellRef(cnt, rowOf.get(p.entry.id))}`, v: p.count, s: XS.bold },
      p.flag === 'tntc' ? 'TNTC' : p.flag === 'excl' ? 'excl' : '',
      { f: `IF(H${R}<>"",0,IF(AND(G${R}>=$B$3,G${R}<=$B$4),1,0))`, v: p.inRange ? 1 : 0 },
      { f: `IF(H${R}="TNTC","",IFERROR(G${R}/(C${R}*F${R})*$D$6,""))`, v: Number.isFinite(p.titer) ? p.titer : '', s: XS.sci },
      { f: `IF(N(J${R})>0,LOG10(J${R}),"")`, v: p.titer > 0 ? Math.log10(p.titer) : '', s: XS.dec },
      { f: `IFERROR(G${R}/(C${R}*F${R})*$D$6,0)`, v: Number.isFinite(p.titer) && p.flag !== 'tntc' ? p.titer : (p.dv > 0 ? p.count / p.dv * k : 0), s: XS.sci }]);
  });
  const r1 = r0 + Math.max(P.plates.length, 1) - 1;
  const col = (c) => colRange(c, r0, r1);
  rows.push([]);
  rows.push([t('sampleLbl'), t('plateNUsed'), 'ΣC', 'Σ(d·V) mL', t('plateMethod_pooled'), t('statMean'), t('statSd'), t('plateResult'), 'log₁₀', t('noteLbl')].map(v => ({ v, s: XS.header })));
  P.samples.forEach(s => {
    const ri = rows.length, R = ri + 1;
    const nm = `$A${R}`, inG = `(${col(1)}=${nm})*(${col(8)}=1)`;
    const est = s.n ? '' : s.est === 'tntc' ? t('plateTntcAll') : s.est ? `${t('plateEst_' + s.est)} — ${s.est === 'lt' ? '< ' : '≈ '}${fmtSci(s.result)} ${plateUnitLabel(kind)}` : '';
    rows.push([s.name,
      { f: `COUNTIFS(${col(1)},${nm},${col(8)},1)`, v: s.n },
      { f: `SUMIFS(${col(6)},${col(1)},${nm},${col(8)},1)`, v: s.sumC && s.n ? s.sumC : 0 },
      { f: `SUMPRODUCT(${inG}*${col(2)}*${col(5)})`, v: s.n ? s.sumDV : 0, s: XS.sci },
      { f: `IF(B${R}=0,"",C${R}/D${R}*$D$6)`, v: s.n ? s.pooled : '', s: XS.sci },
      { f: `IF(B${R}=0,"",SUMPRODUCT(${inG}*${col(11)})/B${R})`, v: s.n ? s.mean : '', s: XS.sci },
      { f: `IF(B${R}<2,"",SQRT(SUMPRODUCT(${inG}*(${col(11)}-F${R})^2)/(B${R}-1)))`, v: s.n > 1 ? s.sd : '', s: XS.sci },
      { f: `IF(B${R}=0,"",IF($B$5="mean",F${R},E${R}))`, v: s.n ? s.result : '', s: XS.boldSci },
      { f: `IF(N(H${R})>0,LOG10(H${R}),"")`, v: s.n && s.result > 0 ? s.log : '', s: XS.dec },
      est ? { v: est, s: XS.note } : '']);
  });
  return { name: t('xlsx' + (kind === 'pfu' ? 'Pfu' : 'Cfu')), rows, header: false, freeze: { rows: h0 + 1, cols: 1 } };
}

// ===== analysis.js =====
// ---------------------------------------------------------------------------
// analysis.js — 数据统计：概览 / 组间比较 / 浓度换算（计数板）/ 平板计数（plates.js）/ 导出设置
//
// 项目级设置 ws.stats（随项目保存）：
//   fields: [{id, name}]   自定义实验信息字段（默认没有）
//   compare / conc / chart / outliers / points / statsSheet：Excel 中包含哪些内容
//   control: 对照组名称
//   concCfg: {preset, area, areaUnit, depth, depthUnit, volMode:'calc'|'direct', vol, volUnit, outUnit}
//     预设只用来填入数值；面积、深度、每格体积、结果单位都可以自行修改
// 每张图的实验信息 doc.info = {group, dilution, <字段 id>: 值}；
//   组默认 = 文件夹名，稀释倍数默认 = 1。只在用户改动时写入。
// ---------------------------------------------------------------------------
const CONC_PRESETS = {
  nbLarge: { area: 1, depth: 0.1 },        // 改良 Neubauer 大方格 1 mm × 1 mm × 0.1 mm = 0.1 µL
  nbMedium: { area: 0.0625, depth: 0.1 },  // 中方格 0.25 mm × 0.25 mm
  nbSmall: { area: 0.0025, depth: 0.1 },   // 小方格 0.05 mm × 0.05 mm
  grid: null,                               // 按网格实际大小（需标定比例尺）
  custom: null
};
const STATS_TABS = ['overview', 'compare', 'within', 'conc', 'pfu', 'cfu', 'export'];
// 单位换算：面积 → mm²，长度 → mm，体积 → µL，结果“每 X” → 相对“每 mL”的倍数
const AREA_UNITS = { 'mm²': 1, 'µm²': 1e-6, 'cm²': 100 };
const LEN_UNITS = { mm: 1, 'µm': 1e-3, cm: 10 };
const VOL_UNITS = { 'µL': 1, nL: 1e-3, pL: 1e-6, mL: 1000, 'mm³': 1 };
const PER_UNITS = { mL: 1, 'µL': 1e-3, L: 1000 };
const CONC0 = { preset: 'nbLarge', area: 1, areaUnit: 'mm²', depth: 0.1, depthUnit: 'mm', volMode: 'calc', vol: 0.1, volUnit: 'µL', outUnit: 'mL' };

function statsCfg() {
  const ws = state.ws;
  const d = { fields: [], control: null, compare: false, conc: false, chart: false, outliers: true, points: true, statsSheet: true,
    concCfg: clone(CONC0), pfuCfg: plateCfg0('pfu'), cfuCfg: plateCfg0('cfu'), pfu: false, cfu: false,
    within: false, withinCfg: { a: null, b: null, all: false }, alias: { cat: {}, img: {}, total: '' } };
  if (!ws) return d;
  if (!ws.stats) ws.stats = d;
  for (const k of Object.keys(d)) if (ws.stats[k] === undefined) ws.stats[k] = clone(d[k]);
  const c = ws.stats.concCfg;
  // v1.4.6 的旧格式 {depthMm, areaMm2}
  if (c.depthMm !== undefined && c.depth === undefined) { c.depth = c.depthMm; c.depthUnit = 'mm'; }
  if (c.areaMm2 !== undefined && c.area === undefined) { c.area = c.areaMm2; c.areaUnit = 'mm²'; }
  delete c.depthMm; delete c.areaMm2;
  ws.stats.concCfg = Object.assign({}, CONC0, c);
  ws.stats.pfuCfg = Object.assign(plateCfg0('pfu'), ws.stats.pfuCfg);
  ws.stats.cfuCfg = Object.assign(plateCfg0('cfu'), ws.stats.cfuCfg);
  ws.stats.alias = Object.assign({ cat: {}, img: {}, total: '' }, ws.stats.alias);
  return ws.stats;
}
function setStatsCfg(patch) {
  Object.assign(statsCfg(), patch);
  markStructChanged();
  updateStatus();
  renderStats();
}

// ---- 实验信息 ---------------------------------------------------------------------
const infoOf = (e) => e.doc.info || {};
function groupOf(e) {
  const g = String(infoOf(e).group || '').trim();
  if (g) return g;
  const f = folderById(e.folderId);
  return f ? f.name : '';
}
const dilutionOf = (e) => { const v = +infoOf(e).dilution; return v > 0 ? v : 1; };

function setInfo(e, key, value) {
  const info = Object.assign({}, infoOf(e));
  if (value === '' || value == null) delete info[key]; else info[key] = value;
  if (Object.keys(info).length) e.doc.info = info; else delete e.doc.info;
  markStructChanged();
  updateStatus();
}

function addInfoField() {
  const name = (prompt(t('fieldNamePrompt')) || '').trim();
  if (!name) return;
  const cfg = statsCfg();
  let n = 1;
  while (cfg.fields.some(f => f.id === 'f' + n)) n++;
  setStatsCfg({ fields: cfg.fields.concat([{ id: 'f' + n, name }]) });
}
function removeInfoField(id) {
  const cfg = statsCfg();
  const f = cfg.fields.find(x => x.id === id);
  if (!f || !confirm(t('fieldRemoveConfirm', { name: f.name }))) return;
  orderedEntries().forEach(e => { if (e.doc.info && e.doc.info[id] !== undefined) setInfo(e, id, ''); });
  setStatsCfg({ fields: cfg.fields.filter(x => x.id !== id) });
}

// ---- 分组数据 -----------------------------------------------------------------------
// rows 按组排列（组的顺序 = 第一次出现的顺序），组内保持原顺序
// 数据统计与 Excel 中的名称可以单独修改（ws.stats.alias），不影响计数界面中的类别名与图片名
function analysisData() {
  const S = computeSummary();
  const al = statsCfg().alias;
  const names = [];
  S.rows.forEach(r => {
    r.group = groupOf(r.entry);
    r.origName = r.name;
    if (al.img[r.entry.id]) r.name = al.img[r.entry.id];
    if (!names.includes(r.group)) names.push(r.group);
  });
  const groups = names.map(name => ({ name, rows: S.rows.filter(r => r.group === name) }));
  const cats = S.cats.map(c => (al.cat[c.id] ? Object.assign({}, c, { name: al.cat[c.id], origName: c.name }) : c));
  return { cats, rows: groups.flatMap(g => g.rows), groups };
}
const totalLabel = () => statsCfg().alias.total || t('totalShort');
const valuesOf = (rows, id) => rows.map(r => (id === 'total' ? r.total : r.counts[id]));

function controlGroup(groups) {
  const c = statsCfg().control;
  return groups.find(g => g.name === c) || groups[0];
}

// ---- 浓度换算 -----------------------------------------------------------------------
// 每格面积（mm²）、深度（mm）、体积（µL）
function concVolume(e) {
  const cfg = statsCfg().concCfg;
  let area;
  if (cfg.preset === 'grid') {
    const s = scaleOf(e.doc);
    area = gridOn(e.doc) && s ? (gridDims(e.doc).size * s.px * UNIT_MM[s.unit]) ** 2 : NaN;
  } else area = +cfg.area * (AREA_UNITS[cfg.areaUnit] || 1);
  const depth = +cfg.depth * (LEN_UNITS[cfg.depthUnit] || 1);
  const vol = cfg.volMode === 'direct' ? +cfg.vol * (VOL_UNITS[cfg.volUnit] || 1) : area * depth;   // mm² × mm = mm³ = µL
  return { area, depth, vol };
}
const concOutFactor = () => PER_UNITS[statsCfg().concCfg.outUnit] || 1;

// 每张图：计数的方格数、平均每格数、浓度（个/mL）
function concOf(row, cats) {
  const e = row.entry;
  const per = {};
  let squares = 1;
  if (gridOn(e.doc)) {
    const cc = cellCounts(e.doc);
    const keys = [];
    for (let r = 0; r < cc.rows; r++) for (let c = 0; c < cc.cols; c++) if (cellIncluded(e.doc, c, r)) keys.push([r, c]);
    squares = keys.length;
    cats.forEach(cat => { per[cat.id] = keys.reduce((s, [r, c]) => s + (cc.byCat[cat.id] ? cc.byCat[cat.id][r][c] : 0), 0) / squares; });
    per.total = keys.reduce((s, [r, c]) => s + cc.total[r][c], 0) / squares;
  } else {
    cats.forEach(cat => { per[cat.id] = row.counts[cat.id]; });
    per.total = row.total;
  }
  const v = concVolume(e);
  const dil = dilutionOf(e);
  const conc = {};
  const k = concOutFactor();
  for (const key of Object.keys(per)) conc[key] = v.vol > 0 ? per[key] / (v.vol / 1000) * dil * k : NaN;
  return { squares, per, conc, dil, grid: gridOn(e.doc), ...v };
}

// 1.25 × 10⁶ 的写法
function fmtSci(v) {
  if (!Number.isFinite(v)) return '—';
  if (v === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -2 && e < 3) return String(+v.toPrecision(4));
  const sup = String(e).replace(/-/g, '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
  return `${(v / 10 ** e).toFixed(2)} × 10${sup}`;
}

// ---- 统计窗口 -----------------------------------------------------------------------
let statsTab = 'overview';

function openStats(tab) {
  if (!state.ws || !orderedEntries().length) { toast(t('noImagesYet')); return; }
  statsTab = STATS_TABS.includes(tab) ? tab : 'overview';
  renderStats();
  const dlg = $('#summaryDialog');
  if (!dlg.open) dlg.showModal();
}

function renderStats() {
  const dlg = $('#summaryDialog');
  if (!dlg || !state.ws) return;
  $$('#statsTabs [data-stab]').forEach(b => b.classList.toggle('active', b.dataset.stab === statsTab));
  $$('#summaryDialog .stats-page').forEach(p => { p.hidden = p.dataset.page !== statsTab; });
  if (statsTab === 'overview') renderSummary();
  else if (statsTab === 'compare') renderCompare();
  else if (statsTab === 'within') renderWithin();
  else if (statsTab === 'conc') renderConc();
  else if (statsTab === 'pfu' || statsTab === 'cfu') renderPlates(statsTab);
  else renderExportOpts();
}

function moduleToggle(key, label) {
  return `<label class="check module-toggle"><input type="checkbox" data-cfg="${key}"${statsCfg()[key] ? ' checked' : ''}> <span>${escapeHtml(label)}</span></label>`;
}

function renderCompare() {
  const A = analysisData();
  const cfg = statsCfg();
  const page = $('#statsComparePage');
  if (A.groups.length < 2) {
    page.innerHTML = moduleToggle('compare', t('inclCompare')) + `<p class="muted">${escapeHtml(t('compareNeedGroups'))}</p>`;
    return;
  }
  const ctl = controlGroup(A.groups);
  const f2 = (v) => (Number.isFinite(v) ? v.toFixed(2) : '—');
  const fp = (p) => (Number.isFinite(p) ? (p < 0.0001 ? '<0.0001' : p.toFixed(4)) : '—');
  const keys = A.cats.map(c => ({ id: c.id, name: c.name, color: c.color })).concat([{ id: 'total', name: totalLabel() }]);
  const blocks = keys.map(k => {
    const cv = valuesOf(ctl.rows, k.id);
    const rows = A.groups.map(g => {
      const v = valuesOf(g.rows, k.id);
      const isCtl = g === ctl;
      const tt = isCtl ? null : welchTTest(cv, v), mw = isCtl ? null : mannWhitneyU(cv, v);
      const m = mean(v), mc = mean(cv);
      return `<tr${isCtl ? ' class="ctl"' : ''}><td>${escapeHtml(g.name)}${isCtl ? ` <span class="muted small">(${escapeHtml(t('controlShort'))})</span>` : ''}</td>
        <td class="num">${v.length}</td><td class="num">${f2(m)} ± ${f2(sd(v))}</td>
        <td class="num">${isCtl ? '' : f2(m - mc)}</td><td class="num">${isCtl || !mc ? '' : f2(m / mc)}</td>
        <td class="num">${isCtl ? '' : fp(tt.p)} <b>${isCtl ? '' : pStars(tt.p)}</b></td>
        <td class="num">${isCtl ? '' : fp(mw.p)} <b>${isCtl ? '' : pStars(mw.p)}</b></td></tr>`;
    }).join('');

// ---- 组内比较：同一组内两个类别（同一批图片 → 配对检验） -----------------------------------
function withinPairs(cats) {
  const w = statsCfg().withinCfg;
  if (cats.length < 2) return [];
  if (w.all) { const out = []; for (let i = 0; i < cats.length; i++) for (let j = i + 1; j < cats.length; j++) out.push([cats[i], cats[j]]); return out; }
  const a = cats.find(c => c.id === w.a) || cats[0];
  const b = cats.find(c => c.id === w.b && c.id !== a.id) || cats.find(c => c !== a);
  return [[a, b]];
}
function withinStats(rows, a, b) {
  const x = valuesOf(rows, a.id), y = valuesOf(rows, b.id);
  const sa = x.reduce((s, v) => s + v, 0), sb = y.reduce((s, v) => s + v, 0);
  return { n: x.length, x, y, ma: mean(x), mb: mean(y), sda: sd(x), sdb: sd(y), sa, sb,
    prop: sa + sb ? sa / (sa + sb) : NaN, tt: pairedTTest(x, y), wx: wilcoxonSignedRank(x, y) };
}

  if (A.cats.length < 2) { page.innerHTML = moduleToggle('within', t('inclWithin')) + `<p class="muted">${escapeHtml(t('withinNeedCats'))}</p>`; return; }
  const pairs = withinPairs(A.cats);
  const f2 = (v) => (Number.isFinite(v) ? v.toFixed(2) : '—');
  const fp = (p) => (Number.isFinite(p) ? (p < 0.0001 ? '<0.0001' : p.toFixed(4)) : '—');
  const opts = (cur) => A.cats.map(c => `<option value="${c.id}"${c.id === cur ? ' selected' : ''}>${escapeHtml(c.name)}</option>`).join('');

    const rows = groups.map(g => {

        <td class="num">${f2(S.ma - S.mb)}</td><td class="num">${S.mb ? f2(S.ma / S.mb) : '—'}</td><td class="num">${Number.isFinite(S.prop) ? (S.prop * 100).toFixed(1) + '%' : '—'}</td>
        <td class="num">${fp(S.tt.p)} <b>${pStars(S.tt.p)}</b></td><td class="num">${fp(S.wx.p)} <b>${pStars(S.wx.p)}</b></td></tr>`;
    }).join('');
    return `<h3 class="sum-sub"><i class="sw" style="background:${a.color}"></i>${escapeHtml(a.name)} vs <i class="sw" style="background:${b.color}"></i>${escapeHtml(b.name)}</h3>

  }).join('');
  const pa = pairs[0];
  page.innerHTML = moduleToggle('within', t('inclWithin')) + `
    <div class="conc-cfg">
      <label>${escapeHtml(t('withinA'))}<select id="wiA"${w.all ? ' disabled' : ''}>${opts(pa[0].id)}</select></label>
      <label>${escapeHtml(t('withinB'))}<select id="wiB"${w.all ? ' disabled' : ''}>${opts(pa[1].id)}</select></label>

    </div>
    <div class="muted small">${escapeHtml(t('withinNote'))}</div>${blocks}`;
  const setW = (patch) => setStatsCfg({ withinCfg: Object.assign({}, w, patch) });

    menu.innerHTML = STATS_TABS.map(k => `<button data-st="${k}">${escapeHtml(t('stab_' + k))}</button>`).join('');

    menu.hidden = false;

  };
  const hide = () => { clearTimeout(timer); timer = setTimeout(() => { menu.hidden = true; }, 220); };
  // 鼠标：悬停展开；触屏：单击展开 / 收起（不直接打开窗口）
  const mouseOnly = (fn) => (e) => { if (e.pointerType === 'mouse') fn(); };
  btn.addEventListener('pointerenter', mouseOnly(show));
  btn.addEventListener('pointerleave', mouseOnly(hide));
  menu.addEventListener('pointerenter', mouseOnly(show));
  menu.addEventListener('pointerleave', mouseOnly(hide));
  let lastPointer = 'mouse';
  btn.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType; });
  btn.addEventListener('click', (e) => {
    if (lastPointer === 'mouse') return;
    e.stopImmediatePropagation();
    if (menu.hidden) show(); else menu.hidden = true;
  }, true);
  document.addEventListener('pointerdown', (e) => { if (!menu.hidden && !e.target.closest('#statsMenu, #btnStats')) menu.hidden = true; });
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-st]');
    if (!b) return;
    menu.hidden = true;
    openStats(b.dataset.st);
  });
}

// ===== plates.js =====
// ---------------------------------------------------------------------------
// plates.js — 平板计数：噬斑测定（PFU）与微生物平板菌落计数（CFU）
//
// 一张图片 = 一块平板；样品 = 组（默认文件夹名）。每块板的信息存在 doc.info：
//   plateDil: 稀释度 d（分数，10⁻⁶ 记为 1e-6；未填 = 1，即原液）
//   plateVol / plateVolUnit: 接种体积（未填时用设置中的默认值）
//   plateFlag: '' | 'tntc'（多不可计）| 'excl'（不计入）
// 设置 ws.stats.pfuCfg / cfuCfg = {cat, lo, hi, method:'pooled'|'mean', outUnit, defaultVol, volUnit}
//
// 单板滴度 = C / (d × V[mL])，换算到所选单位。
// 每个样品的结果（只用计数在 [lo, hi] 内且未排除的板）：
//   pooled（加权平均，ISO 4833-1 / ISO 7218 / FDA BAM）：N = ΣC / Σ(d·V)
//     两个相邻稀释度时即 ΣC / (V·(n₁ + 0.1·n₂)·d)
//   mean：各板滴度的算术平均 ± SD
// 没有在范围内的板时，取平均计数最接近范围的稀释度估计（标记“估计”）；
// 全部为 0 时报告 < 1/Σ(d·V)（检出限）。
// ---------------------------------------------------------------------------
const PLATE_OUT = { mL: 1, 'µL': 1e-3, L: 1000, g: 1 };
const PLATE_VOL_UNITS = { 'µL': 1e-3, mL: 1, nL: 1e-6 };   // → mL
const PLATE_KINDS = ['pfu', 'cfu'];

function plateCfg0(kind) {
  return { cat: 'total', lo: 30, hi: 300, method: 'pooled', outUnit: 'mL', defaultVol: 100, volUnit: 'µL', label: kind === 'pfu' ? 'PFU' : 'CFU', useSector: true };
}
const plateCfg = (kind) => statsCfg()[kind + 'Cfg'];
const plateUnitLabel = (kind) => `${plateCfg(kind).label}/${plateCfg(kind).outUnit}`;

// 稀释度：-6、10^-6、10-6、1e-6、1:1000000、1/1e6、1/100、0.001、1000000（倍数）
function parseDilution(s) {
  s = String(s == null ? '' : s).trim().replace(/\s+/g, '').replace(/−/g, '-').replace(/^1[×x*](?=10)/i, '');
  if (!s) return NaN;
  s = s.replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]/g, ch => '-0123456789'['⁻⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch)]);
  let m;
  if ((m = /^10(?:\^|\*\*)?(-\d+(?:\.\d+)?)$/.exec(s))) return 10 ** +m[1];
  if ((m = /^-\d+(?:\.\d+)?$/.exec(s))) return 10 ** +s;
  if ((m = /^1?[:/](.+)$/.exec(s))) { const f = +m[1]; return f > 0 ? 1 / f : NaN; }
  const v = +s;
  if (!(v > 0)) return NaN;
  return v > 1 ? 1 / v : v;
}
// 10⁻⁶、1:200
function fmtDil(d) {
  if (!(d > 0)) return '—';
  const e = Math.log10(d);
  if (Math.abs(e - Math.round(e)) < 1e-9) {
    const n = Math.round(e);
    return n === 0 ? '1' : '10' + String(n).replace(/-/g, '⁻').replace(/\d/g, x => '⁰¹²³⁴⁵⁶⁷⁸⁹'[x]);
  }
  return '1:' + +(1 / d).toPrecision(6);
}

const plateDilOf = (e) => { const v = +infoOf(e).plateDil; return v > 0 ? v : 1; };
function plateVolOf(e, cfg) {
  const i = infoOf(e);
  const vol = +i.plateVol > 0 ? +i.plateVol : +cfg.defaultVol;
  const unit = i.plateVol > 0 && i.plateVolUnit ? i.plateVolUnit : cfg.volUnit;
  return { vol, unit, ml: vol * (PLATE_VOL_UNITS[unit] || 1e-3) };
}
const plateFlagOf = (e) => infoOf(e).plateFlag || '';

// 每块板与每个样品的计算结果
function plateData(kind) {
  const A = analysisData();
  const cfg = plateCfg(kind);
  const lo = +cfg.lo, hi = +cfg.hi, k = PLATE_OUT[cfg.outUnit] || 1;
  if (cfg.cat !== 'total' && !A.cats.some(c => c.id === cfg.cat)) cfg.cat = 'total';
  const plateRowOf = (r) => {
    const e = r.entry;
    // 用了平板分区且只数了部分扇区：计数 = 全板估计（比率估计，见 platediv.js）
    let count = cfg.cat === 'total' ? r.total : (r.counts[cfg.cat] || 0), sector = null;
    if (cfg.useSector !== false && plateOn(e.doc)) {
      const S = plateStats(e.doc);
      count = cfg.cat === 'total' ? S.estimate : (S.estByCat[cfg.cat] || 0);
      count = Math.round(count * 100) / 100;
      sector = { k: S.used.length, n: S.n };
    }
    const d = plateDilOf(e), v = plateVolOf(e, cfg), flag = plateFlagOf(e);
    const dv = d * v.ml;
    const status = flag === 'excl' ? 'excl' : flag === 'tntc' || count > hi ? 'tntc' : count < lo ? 'low' : 'ok';
    return { row: r, entry: e, count, sector, d, vol: v.vol, volUnit: v.unit, ml: v.ml, dv, flag, status,
      inRange: status === 'ok', titer: dv > 0 && flag !== 'tntc' ? count / dv * k : NaN };
  };
  const plates = A.rows.map(plateRowOf);
  const samples = A.groups.map(g => {
    const ps = plates.filter(p => p.row.group === g.name);
    const used = ps.filter(p => p.inRange && p.dv > 0);
    const s = { name: g.name, plates: ps, used, n: used.length, sumC: 0, sumDV: 0, pooled: NaN, mean: NaN, sd: NaN, result: NaN, est: '' };
    if (used.length) {
      s.sumC = used.reduce((a, p) => a + p.count, 0);
      s.sumDV = used.reduce((a, p) => a + p.dv, 0);
      s.pooled = s.sumC / s.sumDV * k;
      const tv = used.map(p => p.titer);
      s.mean = mean(tv);
      s.sd = tv.length > 1 ? sd(tv) : NaN;
      s.result = cfg.method === 'mean' ? s.mean : s.pooled;
    } else {
      // 无在范围内的板：按稀释度分层，取平均计数最接近范围的一层
      const cand = ps.filter(p => p.status !== 'excl' && p.flag !== 'tntc' && p.dv > 0);
      if (cand.length) {
        const levels = new Map();
        cand.forEach(p => { const key = p.d.toPrecision(6); if (!levels.has(key)) levels.set(key, []); levels.get(key).push(p); });
        const lv = Array.from(levels.values());
        if (cand.every(p => p.count === 0)) {
          const best = lv.reduce((a, b) => (b[0].d > a[0].d ? b : a));
          s.sumDV = best.reduce((a, p) => a + p.dv, 0);
          s.result = 1 / s.sumDV * k;
          s.est = 'lt';
        } else {
          const dist = (L) => { const m = mean(L.map(p => p.count)); return m <= 0 ? Infinity : m < lo ? Math.log(lo / m) : Math.log(m / hi); };
          const best = lv.reduce((a, b) => (dist(b) < dist(a) ? b : a));
          s.sumC = best.reduce((a, p) => a + p.count, 0);
          s.sumDV = best.reduce((a, p) => a + p.dv, 0);
          s.result = s.sumC / s.sumDV * k;
          s.est = mean(best.map(p => p.count)) < lo ? 'low' : 'high';
          s.estPlates = best;
        }
      } else if (ps.some(p => p.flag === 'tntc' || p.status === 'tntc')) s.est = 'tntc';
    }
    s.log = s.result > 0 ? Math.log10(s.result) : NaN;
    return s;
  });
  return { A, cfg, plates, samples };
}

function fmtTiter(s) {
  if (s.est === 'tntc') return t('plateTntcAll');
  if (!Number.isFinite(s.result)) return '—';
  return (s.est === 'lt' ? '< ' : '') + fmtSci(s.result);
}

// 一个样品内按顺序批量填写系列稀释度：起始指数、步长、每个稀释度的平行板数
function fillSerialDilutions(start, step, reps) {
  const A = analysisData();
  reps = Math.max(1, Math.round(reps) || 1);
  A.groups.forEach(g => g.rows.forEach((r, i) => setInfo(r.entry, 'plateDil', 10 ** (start + step * Math.floor(i / reps)))));
}

// ===== templates.js =====
// ---------------------------------------------------------------------------
// templates.js — 设置模板（多组记忆，带版本号）
//
// 模板保存在本机浏览器（prefs 'templates'），也可导出 / 导入 JSON 文件（U 盘、云盘共享）。
//   { id, name, version, savedAt, note, data: { categories, stats, grid?, scale?, plate? } }
// 同名再次保存 = 新版本（v1, v2, …），旧版本保留，可随时选用任意版本。
// 选用模板：
//   类别按位置覆盖名称/颜色/形状/大小，模板更多的类别追加（一步撤回）；已有标记不受影响。
//   统计设置（实验信息字段、浓度、PFU/CFU 参数、导出选项）整体替换，对照组保留。
//   网格 / 比例尺（如模板含有）应用到项目中所有图片，并作为之后新加入图片的默认值。
// 项目文件记录所用模板 ws.template = {id, name, version}，状态栏显示。
// ---------------------------------------------------------------------------
const TPL_FILE_FORMAT = 'counting-tool-templates';

const tplList = () => { const v = prefs.get('templates', []); return Array.isArray(v) ? v : []; };
const tplSaveList = (list) => prefs.set('templates', list);
const tplNextVersion = (name, list) => 1 + Math.max(0, ...(list || tplList()).filter(x => x.name === name).map(x => x.version || 0));
const tplLabel = (tp) => `${tp.name} v${tp.version}`;

function currentTemplateData(opts) {
  const ws = state.ws;
  const cats = ws ? ws.categories : (prefs.get('lastCategories', null) || defaultCategories());
  const data = { categories: cats.map(c => ({ name: c.name, color: c.color, shape: c.shape, size: c.size })) };
  if (ws) {
    const st = clone(statsCfg());
    delete st.control;           // 对照组与具体项目的组名有关，不放入模板
    data.stats = st;
  }
  const doc = state.doc;
  if (opts.grid && doc && doc.grid) { const g = clone(doc.grid); delete g.done; data.grid = g; }
  if (opts.scale && doc && scaleOf(doc)) data.scale = clone(doc.scale);
  if (opts.plate && doc && plateOn(doc)) { const p = clone(doc.plate); p.done = []; data.plate = p; }
  return data;
}

function saveTemplate(name, note, opts) {
  name = String(name || '').trim();
  if (!name) return null;
  const list = tplList();
  const tp = { id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, version: tplNextVersion(name, list),
    savedAt: new Date().toISOString(), note: String(note || '').trim(), data: currentTemplateData(opts || {}) };
  list.push(tp);
  tplSaveList(list);
  if (state.ws) { state.ws.template = { id: tp.id, name: tp.name, version: tp.version }; markStructChanged(); updateStatus(); }
  return tp;
}

function deleteTemplate(id) {
  tplSaveList(tplList().filter(x => x.id !== id));
}

// 新图片继承模板的网格 / 比例尺
function applyTplDefaults(doc) {
  const d = state.ws && state.ws.tplDefaults;
  if (!d) return;
  if (d.grid && !doc.grid) doc.grid = clone(d.grid);
  if (d.scale && !doc.scale) doc.scale = clone(d.scale);
  if (d.plate && !doc.plate) doc.plate = clone(d.plate);
}

function applyTemplate(id) {
  const tp = tplList().find(x => x.id === id);
  if (!tp) return false;
  ensureWorkspace();
  const ws = state.ws;
  const D = tp.data || {};
  // 1. 类别
  if (Array.isArray(D.categories) && D.categories.length) {
    const cats = ws.categories;
    const pick = (c) => ({ name: c.name, color: c.color, shape: c.shape, size: c.size });
    if (state.doc) {
      const cmds = [];
      D.categories.forEach((c, i) => {
        if (cats[i]) {
          const before = pick(cats[i]), after = pick(c);
          if (JSON.stringify(before) !== JSON.stringify(after)) cmds.push({ k: 'catMod', cid: cats[i].id, before, after });
        } else cmds.push({ k: 'catAdd', cat: Object.assign({ id: 'c' + ws.nextCatId++ }, pick(c)), index: i });
      });
      if (cmds.length) execute({ k: 'batch', cmds });
    } else {
      D.categories.forEach((c, i) => { if (cats[i]) Object.assign(cats[i], pick(c)); else cats.push(Object.assign({ id: 'c' + ws.nextCatId++ }, pick(c))); });
    }
  }
  // 2. 统计设置
  if (D.stats) {
    const control = ws.stats ? ws.stats.control : null;
    ws.stats = Object.assign(clone(D.stats), { control });
    statsCfg();
  }
  // 3. 网格 / 比例尺：所有图片 + 之后新加入的图片
  const defaults = {};
  for (const key of ['grid', 'scale', 'plate']) {
    if (!D[key]) continue;
    defaults[key] = clone(D[key]);
    for (const e of orderedEntries()) {
      const before = e.doc[key] === undefined ? null : clone(e.doc[key]);
      const after = clone(D[key]);
      if (key === 'grid' && before && before.done && before.size === after.size) after.done = before.done.slice();
      if (JSON.stringify(before) === JSON.stringify(after)) continue;
      executeOnEntry(e, { k: 'docset', key, before, after });
    }
  }
  if (Object.keys(defaults).length) ws.tplDefaults = defaults; else delete ws.tplDefaults;
  ws.template = { id: tp.id, name: tp.name, version: tp.version };
  markStructChanged();
  onDocChanged();
  onWorkspaceChanged();
  if (typeof updateToolsPanel === 'function') updateToolsPanel();
  requestRender();
  toast(t('tplApplied', { name: tplLabel(tp) }), 3000);
  return true;
}

// ---- 导出 / 导入 ---------------------------------------------------------------------
async function exportTemplates(list, fileBase) {
  const blob = new Blob([JSON.stringify({ format: TPL_FILE_FORMAT, version: 1, templates: list }, null, 2)], { type: 'application/json' });
  const r = await saveBlobAs(blob, (fileBase || 'templates').replace(/[\\/:*?"<>|]/g, '_') + '.template.json', { description: 'JSON', accept: { 'application/json': ['.json'] } });
  if (r) toast(t('exportedToast', { name: r.name }));
}

// 导入：同名同版本且内容相同 → 跳过；同名不同内容 → 作为新版本加入
function importTemplates(json) {
  const data = typeof json === 'string' ? JSON.parse(json) : json;
  const incoming = data && data.format === TPL_FILE_FORMAT && Array.isArray(data.templates) ? data.templates : null;
  if (!incoming) throw new Error(t('tplBadFile'));
  const list = tplList();
  let n = 0;
  incoming.slice().sort((a, b) => (a.version || 0) - (b.version || 0)).forEach(tp => {
    if (!tp || !tp.name || !tp.data) return;
    const same = list.find(x => x.name === tp.name && JSON.stringify(x.data) === JSON.stringify(tp.data));
    if (same) return;
    const clash = list.some(x => x.name === tp.name && x.version === tp.version) || list.some(x => x.id === tp.id);
    list.push(Object.assign({}, tp, {
      id: clash || !tp.id ? 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) : tp.id,
      version: clash || !tp.version ? tplNextVersion(tp.name, list) : tp.version
    }));
    n++;
  });
  tplSaveList(list);
  return n;
}

// ---- 界面 --------------------------------------------------------------------------
function tplIncludes(tp) {
  const D = tp.data || {};
  const parts = [t('tplIncCats', { n: (D.categories || []).length })];
  if (D.stats) parts.push(t('tplIncStats'));
  if (D.grid) parts.push(t('tplIncGrid'));
  if (D.scale) parts.push(t('tplIncScale', { v: fmtNum(D.scale.px), unit: D.scale.unit }));
  if (D.plate) parts.push(t('tplIncPlate', { n: D.plate.n }));
  return parts.join(' · ');
}

  $('#tplExportAll').addEventListener('click', () => exportTemplates(tplList(), 'templates'));
